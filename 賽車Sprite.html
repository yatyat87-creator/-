<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超級明星賽車</title>
    <style>
        /* 基礎樣式 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f39c12; color: #fff; text-align: center; margin: 0; padding: 20px; }
        #game-container { max-width: 900px; margin: 0 auto; background: #2c3e50; color: #ecf0f1; padding: 20px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 4px solid #e74c3c; position: relative; }
        
        /* 頂部資訊列 (金幣與音效) */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 10px; }
        .gold-display { font-size: 20px; font-weight: bold; color: #f1c40f; text-shadow: 1px 1px 2px #000; }
        .audio-btn { background: #34495e; color: white; border: 2px solid #7f8c8d; padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .audio-btn:hover { background: #7f8c8d; }

        /* 大廳與表單樣式 */
        #setup-screen { display: block; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: bold; color: #f1c40f; display: block; margin-bottom: 10px; font-size: 18px; }
        select, input { width: 100%; background: #34495e; color: #fff; padding: 10px; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        .btn-start { width: 100%; background-color: #e74c3c; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 22px; transition: 0.3s; padding: 15px; text-transform: uppercase; border-radius: 10px; box-shadow: 0 4px 0 #c0392b; }
        .btn-start:hover { background-color: #ff5e4d; transform: translateY(-2px); box-shadow: 0 6px 0 #c0392b; }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }

        /* 🏎️ 角色選擇網格 (CSS Grid) */
        .char-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .char-card { background: #34495e; border: 3px solid #7f8c8d; border-radius: 12px; padding: 15px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; display: flex; flex-direction: column; align-items: center; }
        .char-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.5); border-color: #bdc3c7; }
        .char-card.selected { border-color: #2ecc71; box-shadow: 0 0 20px rgba(46, 204, 113, 0.6); transform: scale(1.05); background: #27ae60; }
        .char-card.locked { filter: grayscale(100%); opacity: 0.8; cursor: pointer; border-color: #555; }
        .char-card.locked:hover { filter: grayscale(80%); }
        
        .char-card .avatar { font-size: 45px; margin-bottom: 10px; height: 60px; display: flex; justify-content: center; align-items: center; }
        .char-card .img-avatar { width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 10px; }
        .char-card .name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .char-card .skill { font-size: 12px; color: #bdc3c7; text-align: center; height: 35px; }
        .char-card.selected .skill { color: #fff; }
        
        /* 鎖頭與價格疊加層 */
        .lock-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); border-radius: 9px; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }
        .lock-icon { font-size: 30px; margin-bottom: 5px; }
        .lock-price { font-weight: bold; color: #f1c40f; font-size: 16px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 15px; }

        /* 遊戲畫面樣式 */
        #play-screen { display: none; }
		
		/* 讓遊戲容器垂直排列 */
		#game-board {
		    display: flex;
		    flex-direction: column;
		    width: 100%;
		    /* 這裡不需要設定背景圖了，背景圖會交給上下兩個 div */
		}
		
		/* 頂部和底部的共用設定 */
		#bg-top, #bg-bottom {
		    width: 100%;
		    /* 讓圖片寬度填滿，高度自動依比例縮放 */
		    background-size: 100% auto; 
		    background-repeat: no-repeat;
		}
		
		/* 頂部風景：從圖片最上面往下裁 */
		#bg-top {
		    width: 100%;
		    background-repeat: no-repeat !important; 
		    background-size: 250% auto !important; /* 👈 強制放大 2.5 倍，製造 Zoom In 效果 */
		    background-position: 0% bottom;        /* 👈 初始鏡頭在最左側 (0%)，並貼齊賽道 */
		    transition: background-position 0.4s ease-out; /* 👈 讓平移跟著車子一樣滑順 */
		}		
		/* 底部前景：從圖片最下面往上裁 */
		#bg-bottom {
		    width: 100%;
		    background-repeat: no-repeat !important; 
		    background-size: 250% auto !important; /* 👈 與頂部維持相同放大比例 */
		    background-position: 0% top;           /* 👈 初始鏡頭在最左側 (0%) */
		    position: relative;
		    z-index: 10; 
		    margin-top: -40px; 
		    pointer-events: none; 
		    transition: background-position 0.4s ease-out;
		}		
		/* 中間賽道 (系統生成的馬路) */
		.track-container {
		    width: 100%;
		    background-color: #2c3e50; 
		    position: relative;
		    z-index: 1; /* 👈 設定為較低的層級，讓它乖乖待在後面 */
		    padding-bottom: 20px; /* 稍微增加底部空間，預留給前景遮擋 */
		}
		
		/* 車道設定 */
		.lane {
		    position: relative;
		    height: 55px; /* 可根據你的需求微調車道高度 */
		    display: flex;
		    align-items: center;
		    /* 這裡可以拿掉背景顏色，因為外層 .track-container 已經是深灰色了 */
		    border-bottom: 3px dashed #f1c40f; /* 黃色虛線 */
		}
		
        .lane:last-child { border-bottom: none; }
        .lane-name { position: absolute; left: 10px; top: 25px; color: #fff; font-weight: bold; opacity: 0.6; z-index: 1; font-size: 14px; text-shadow: 1px 1px 0 #000; }
        .boss-lane { color: #ff4757 !important; opacity: 1 !important; text-shadow: 0 0 5px red; }
        .finish-line { position: absolute; right: 15px; top: 0; bottom: 0; width: 20px; background: repeating-linear-gradient(0deg, #fff, #fff 15px, #000 15px, #000 30px); z-index: 0; box-shadow: -5px 0 10px rgba(0,0,0,0.5); }

        .character { position: absolute; left: 0; top: -5px; width: 80px; height: 80px; font-size: 40px; line-height: 80px; transition: left 0.4s ease-out; z-index: 2; background-size: contain; background-repeat: no-repeat; background-position: center; }
        .driving { animation: driveEngine 0.2s infinite alternate; }
        @keyframes driveEngine { from { transform: translateY(0px) rotate(-2deg); } to { transform: translateY(-3px) rotate(2deg); } }
        .boss-driving { animation: bossDriveEngine 0.15s infinite alternate; filter: drop-shadow(0 0 8px red); }
        @keyframes bossDriveEngine { from { transform: translateY(0px) scale(1.1); } to { transform: translateY(-4px) scale(1.1); } }
        .stopped { animation: none !important; filter: grayscale(80%) drop-shadow(0 0 5px red); transform: scale(0.9); }
		
		/* =========================================
		   精靈圖 (Sprite Sheet) 專用動畫設定 
		   ========================================= */
		.character.sprite-mode {
		    background-size: 320px 320px !important; /* 4x4 網格，每格 80px */
		    background-position-x: 0px;
		    border-radius: 0;
		    box-shadow: none !important;
		    filter: none !important; /* 移除預設的濾鏡效果 */
		}
		
		/* 第 1 列：停止 (Idle) - 只有 1 幀 */
		.character.sprite-mode.idle, 
		.character.sprite-mode:not(.driving):not(.boss-driving):not(.stopped):not(.finished) {
		    background-position-y: -240px !important;
		    animation: none !important;
		}
		
		/* 第 2 列：行駛 (Driving) - 4 幀動畫 */
		.character.sprite-mode.driving,
		.character.sprite-mode.boss-driving {
		    background-position-y: 0px !important;
		    animation: sprite-play 0.5s steps(4) infinite !important;
		}
		
		/* 第 3 列：拋錨 (Stalled) - 4 幀動畫 */
		.character.sprite-mode.stopped {
		    background-position-y: -80px !important;
		    animation: sprite-play 0.8s steps(4) infinite !important;
		    transform: scale(1) !important; /* 取消預設的縮小效果 */
		}
		
		/* 第 4 列：勝利衝線 (Finished) - 4 幀動畫 */
		.character.sprite-mode.finished {
		    background-position-y: -160px !important;
		    animation: sprite-play 0.6s steps(4) infinite !important;
		}
		
		/* 精靈圖 X 軸橫移核心動畫 */
		@keyframes sprite-play {
		    from { background-position-x: 0px; }
		    to { background-position-x: -320px; } /* 移動 4 格的寬度 */
		}
		
        .speech-bubble { position: absolute; top: -25px; left: 10px; background-color: white; color: black; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 8px; white-space: nowrap; display: none; z-index: 10; border: 2px solid #3498db; box-shadow: 0px 2px 5px rgba(0,0,0,0.3); line-height: 1.2; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -5px; left: 10px; border-width: 5px 5px 0; border-style: solid; border-color: white transparent transparent transparent; }
        
        #question-area { font-size: 34px; font-weight: bold; margin: 15px 0; color: #f1c40f; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background-color: #2980b9; font-size: 30px; padding: 15px; border-radius: 8px; color: white; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
        .option-btn:hover { background-color: #3498db; transform: scale(1.02); }
        
        #message { font-size: 20px; font-weight: bold; height: 35px; margin-top: 15px; }
        #event-message { font-size: 18px; font-weight: bold; color: #e67e22; height: 25px; margin-bottom: 5px;}
        #leaderboard { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 16px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; flex-wrap: wrap; gap: 10px; }

		/* 📱 移動端專屬響應式 (覆蓋原本的這一段) */
		@media (max-width: 768px) {
		    /* ▼ 關鍵修復：壓縮手機版的天空與前景高度，避免賽道被擠出畫面 ▼ */
		    #bg-top { height: 180px !important; }
		    #bg-bottom { height: 60px !important; margin-top: -20px !important; }
		    
		    .track-container { padding: 20px 0 10px 0; }
		    .finish-line { right: auto; left: 120%; transition: left 0.4s ease-out; }
		    .character.offscreen-ahead, .character.offscreen-behind { background-image: none !important; box-shadow: none !important; filter: none !important; }
		    .character.offscreen-ahead .char-emoji, .character.offscreen-behind .char-emoji { display: none !important; }
		    .character.offscreen-ahead .speech-bubble { display: block !important; top: 25px; left: -40px; background-color: #e74c3c; color: white; border-color: #c0392b; z-index: 100; }
		    .character.offscreen-behind .speech-bubble { display: block !important; top: 25px; left: 30px; background-color: #95a5a6; color: white; border-color: #7f8c8d; z-index: 100; }
		    .character.offscreen-ahead .speech-bubble::after, .character.offscreen-behind .speech-bubble::after { display: none; }
		}
		/* 📱 手機橫向螢幕 (Landscape) 專屬佈局：左邊賽道，右邊題目 */
        @media (max-height: 500px) and (orientation: landscape) {
            body { padding: 5px; }
            #game-container { padding: 10px; }
            
            /* 將遊戲畫面切換為左右雙欄 (Grid) */
            /* 注意：使用 !important 是為了覆蓋 JavaScript 寫入的 display: block */
            #play-screen[style*="block"] {
                display: grid !important;
                grid-template-columns: 55% 42%;
                column-gap: 3%;
                align-items: center;
            }
            
            /* 頂部資訊欄跨越兩欄 */
            #leaderboard { grid-column: 1 / 3; padding: 5px; margin-bottom: 5px; font-size: 14px; }
            #event-message { grid-column: 1 / 3; font-size: 14px; height: 20px; margin: 0; }
            
            /* 賽道縮在左側 */
            .track-container { 
                grid-column: 1 / 2; 
                grid-row: 3 / 6; 
                margin-bottom: 0; 
                padding: 15px 0 5px 0;
                zoom: 0.65; /* 利用瀏覽器特性將賽道等比例縮小，騰出空間 */
            }
            
            /* 題目、選項與提示訊息放在右側 */
            #question-area { grid-column: 2 / 3; grid-row: 3; font-size: 22px; margin: 0 0 10px 0; }
            .options-grid { grid-column: 2 / 3; grid-row: 4; gap: 8px; }
            .option-btn { font-size: 20px; padding: 10px; }
            #message { grid-column: 2 / 3; grid-row: 5; margin-top: 5px; font-size: 16px; height: 25px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 頂部資訊列：金幣與音效開關 -->
    <div class="top-bar">
        <div class="gold-display">💰 金幣: <span id="gold-count">0</span></div>
        <button id="audio-toggle" class="audio-btn" onclick="AudioManager.toggleMute()">🔊 音效: 開</button>
    </div>

    <div id="setup-screen">
        <h2>🏎️ 活塞盃：數學大賽 </h2>
        <p>進行 3 個回合的積分排名賽！第 3 回合將有強大的 Boss 登場！</p>

		<div class="form-group">
            <label>選擇賽季 / 章節：</label>
            <select id="chapter-select" onclick="AudioManager.playSound('click')">
                <option value="chapter1" selected>🛣️ 第 1 章：州際公路</option>
                <option value="chapter2">🌙 第 2 章：黑夜山道</option>
                <option value="chapter3">🏟️ 第 3 章：活塞盃競技場</option>
            </select>
        </div>
		
        <div class="form-group">
            <label>選擇你的賽車手：</label>
            <div id="character-grid" class="char-grid"></div>
        </div>
        
		<div class="form-group">
		    <label>選擇難度：</label>
		    <select id="difficulty" onclick="AudioManager.playSound('click')">
		        <option value="super_easy" selected>🟢 超簡單 </option> <!-- 新增這行 -->
		        <option value="easy">🟢 簡單</option>
		        <option value="normal">🟡 普通</option>
		        <option value="hard">🔴 困難</option>
		    </select>
		</div>
		
        <div class="form-group">
            <label>選擇運算模式：</label>
            <select id="operation-mode" onclick="AudioManager.playSound('click')">
                <option value="add" selected>➕ 加法</option>
                <option value="sub">➖ 減法</option>
                <option value="mul">✖️ 乘法</option>
                <option value="div">➗ 除法</option>
            </select>
        </div>

        <div class="form-group">
            <label>選擇基準數字：</label>
            <select id="multiplier" onclick="AudioManager.playSound('click')">
                <option value="random" selected>🎲 隨機 (2~12)</option>
                <option value="2">數字 2</option>
                <option value="3">數字 3</option>
                <option value="4">數字 4</option>
                <option value="5">數字 5</option>
                <option value="6">數字 6</option>
                <option value="7">數字 7</option>
                <option value="8">數字 8</option>
                <option value="9">數字 9</option>
                <option value="10">數字 10</option>
            </select>
        </div>

        <button class="btn-start" onclick="initGame()">🏁 發動引擎！</button>
    </div>

    <div id="play-screen">
        <div id="leaderboard">
            <span id="diff-display" style="color:#3498db">難度：普通</span>
            <span id="level-display" style="color:#2ecc71">回合：1 / 3</span>
            <span id="score-display" style="color:#f1c40f">目前總分: 0</span>
            <span id="streak-display" style="color:#e67e22">🔥 連勝: 0</span>
        </div>
        <div id="event-message"></div>
        
<!-- ▼▼▼ 修改這裡：新增場景包裝器與前後景區塊 ▼▼▼ -->
       <!-- 遊戲畫面主要容器 -->
		<div id="game-board">
		    <!-- 頂部風景 (Top Background) -->
		    <div id="bg-top"></div>
            
            <div class="track-container">
                <div class="finish-line"></div>
                <div class="lane"><div class="lane-name" id="player-name">YOU</div><div id="player" class="character stopped"><span class="char-emoji">🏎️</span><div class="speech-bubble" id="bubble-player"></div></div></div>
                <div class="lane"><div class="lane-name" id="ai1-name">對手 1</div><div id="ai1" class="character driving"><span class="char-emoji"></span><div class="speech-bubble" id="bubble-ai1"></div></div></div>
                <div class="lane"><div class="lane-name" id="ai2-name">對手 2</div><div id="ai2" class="character driving"><span class="char-emoji"></span><div class="speech-bubble" id="bubble-ai2"></div></div></div>
                <div class="lane"><div class="lane-name" id="ai3-name">對手 3</div><div id="ai3" class="character driving"><span class="char-emoji"></span><div class="speech-bubble" id="bubble-ai3"></div></div></div>
            </div>
		<!-- 底部前景 (Bottom Foreground) -->
		    <div id="bg-bottom"></div>
		</div>		
        <div id="question-area">準備中...</div>
        <div class="options-grid" id="options-container"></div>
        <div id="message"></div>
    </div>
</div>

<script>
// =====================================================================
    // 🎵 音效管理系統 (AudioManager) - 支援隨機 BGM 歌單
    // =====================================================================
    const AudioManager = {
        isMuted: false,
        
        // 🎼 1. 建立 BGM 歌單陣列 (你可以隨意新增更多音樂 URL)
        bgmTracks: [
            'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/BGM.mp3',
            'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/BGM3.mp3',
            'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/BGM5.mp3',
            'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/BGM4.mp3',
            'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/BGM2.mp3'
        ],

        sounds: {
            bgm: new Audio(), // 先建立一個空的 Audio 物件給 BGM
            click: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Click.mp3'),
            engine: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Enginee.mp3'),
            finish: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Finish.mp3'),
            allFinished: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/All Finish.mp3'),
            eventWind: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Wind.mp3'),
            eventSlip: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Slip.mp3'),
            eventStall: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Stall.mp3'),
            skillBoost: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Boost.mp3'),
            skillPull: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Wind.mp3'),
            skillStun: new Audio('https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Stall.mp3')
        },

        init: function() {
            this.sounds.bgm.volume = 0.2;
            for (let key in this.sounds) {
                if (key !== 'bgm') this.sounds[key].volume = 0.6;
            }

            // 🎼 2. 監聽 BGM 播放結束事件：一播完就自動換下一首隨機歌
            this.sounds.bgm.addEventListener('ended', () => {
                this.playRandomBGM();
            });

            // 遊戲載入時先隨機選一首歌準備好
            this.playRandomBGM(false); 
        },

        // 🎼 3. 隨機播放 BGM 的專屬功能
        playRandomBGM: function(autoPlay = true) {
            let randomIndex = Math.floor(Math.random() * this.bgmTracks.length);
            this.sounds.bgm.src = this.bgmTracks[randomIndex]; // 換上新選到的歌
            
            if (autoPlay && !this.isMuted) {
                this.sounds.bgm.play().catch(e => console.log('Audio playback prevented:', e));
            }
        },

        playSound: function(id) {
            if (this.isMuted) return;
            
            // 特別處理 BGM，因為現在 BGM 不用這個 function 播
            if (id === 'bgm') {
                this.sounds.bgm.play().catch(e => console.log('Audio playback prevented by browser:', e));
                return;
            }

            let sound = this.sounds[id];
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log('Audio playback prevented by browser:', e));
            }
        },

        toggleMute: function() {
            this.isMuted = !this.isMuted;
            const btn = document.getElementById('audio-toggle');
            if (this.isMuted) {
                this.sounds.bgm.pause();
                btn.innerText = "🔇 音效: 關";
                btn.style.background = "#e74c3c";
            } else {

                    avatarHtml = `<div class="img-avatar" style="background-image: url('${charData.img}')"></div>`;
                }
            } else {
                avatarHtml = `<div class="avatar">${charData.emoji}</div>`;
            }			
            card.innerHTML = `
                ${avatarHtml}
                <div class="name">${charData.name}</div>
                <div class="skill">${charData.skillDesc}</div>
                ${!isUnlocked ? `<div class="lock-overlay"><div class="lock-icon">🔒</div><div class="lock-price">💰 ${charData.price}</div></div>` : ''}

            card.onclick = () => handleCharacterClick(key, charData, isUnlocked);
            grid.appendChild(card);
        }

        } else {
            if (charData.purchasable) {
                if (playerGold >= charData.price) {
                    let confirmBuy = confirm(`是否花費 ${charData.price} 金幣解鎖【${charData.name}】？`);
                    if (confirmBuy) {
                        playerGold -= charData.price;
                        unlockedChars.push(key);
                        selectedCharId = key;
                        localStorage.setItem('mathRacerUnlocked_v2', JSON.stringify(unlockedChars));
                        updateGoldDisplay();
                        renderCharacterGrid();
                        alert(`🎉 成功解鎖 ${charData.name}！`);
                    }
                } else {
                    alert(`❌ 金幣不足！\n需要 ${charData.price} 金幣，你目前只有 ${playerGold} 金幣。`);

            } else {
                alert(`🔒 此角色無法直接購買！\n\n解鎖條件：\n${charData.unlockCondition}`);

        document.getElementById('level-display').innerText = `回合：${currentLevel} / ${maxLevels}`;

        document.getElementById('streak-display').innerText = `🔥 連勝: 0`;

        // 取得玩家目前使用的角色資料

        // ▼▼▼ 1. 修改對手抽籤池：過濾掉和玩家相同的角色 ▼▼▼
        let availableOpponents = GAME_DATA.opponents.filter(opp => 
            opp.name !== pData.name && opp.img !== pData.img
        );
        // 防呆機制：如果過濾後對手少於 3 個（通常不會發生），就恢復原狀避免報錯
        if (availableOpponents.length < 3) {
            availableOpponents = [...GAME_DATA.opponents];
        }
        let shuffledOpponents = availableOpponents.sort(() => 0.5 - Math.random());
        // ▲▲▲ 修改結束 ▲▲▲
        
        // ▼▼▼ 正確的對手生成邏輯 ▼▼▼

            let oppData = shuffledOpponents[index % shuffledOpponents.length];
            racers[aiKey].name = oppData.name;
            
            // 1. 先重置基礎 Class，避免洗掉後面的 sprite-mode
            racers[aiKey].element.className = 'character driving';

                racers[aiKey].element.style.backgroundImage = `url('${oppData.img}')`;
                racers[aiKey].emoji.innerText = "";
                // 2. 判定是否為精靈圖並加入專屬 Class
                if (oppData.isSprite) {
                    racers[aiKey].element.classList.add('sprite-mode');
                }
            } else {
                racers[aiKey].element.style.backgroundImage = "none";
                racers[aiKey].emoji.innerText = oppData.emoji;
            }
            document.getElementById(`${aiKey}-name`).innerText = racers[aiKey].name;
            document.getElementById(`${aiKey}-name`).classList.remove('boss-lane');
        });

        // ▼▼▼ 2. 修改 Boss 生成邏輯：過濾掉和玩家相同的 Boss ▼▼▼
        if (currentLevel === maxLevels) {
            // 過濾掉和玩家同圖片或同名字的 Boss
            let availableBosses = GAME_DATA.bosses.filter(boss => 
                boss.name !== pData.name && boss.img !== pData.img
            );
            // 防呆機制：如果運氣太好，所有 Boss 都跟玩家一樣被濾光了，就退回使用全部 Boss
            if (availableBosses.length === 0) {
                availableBosses = [...GAME_DATA.bosses];
            }
            
            let bossData = availableBosses[Math.floor(Math.random() * availableBosses.length)];
            
            // 1. 先重置基礎 Class 設定為 Boss 狀態
            racers.ai3.element.className = 'character boss-driving';
            
            if (bossData.img !== "") {
                racers.ai3.element.style.backgroundImage = `url('${bossData.img}')`;
                racers.ai3.emoji.innerText = "";
                // 2. 判定是否為精靈圖並加入專屬 Class
                if (bossData.isSprite) {
                    racers.ai3.element.classList.add('sprite-mode');
                }
            } else {
                racers.ai3.element.style.backgroundImage = "none";
                racers.ai3.emoji.innerText = bossData.emoji;
            }
            racers.ai3.name = bossData.name;
            document.getElementById('ai3-name').innerText = `🔥 ${bossData.name} 🔥`;
            document.getElementById('ai3-name').classList.add('boss-lane');
        }

        // 下面的 for (let key in racers) 重置狀態邏輯保持不變...
        for (let key in racers) {
            racers[key].step = 0; racers[key].stalled = false; racers[key].finished = false;
            racers[key].element.classList.remove('finished'); 
  			// ▼ 加入移除 'idle'，確保不會卡在靜止畫格
            racers[key].element.classList.remove('finished', 'idle');
			
			if(key === 'player') {
                racers[key].element.classList.add('driving');
                racers[key].element.classList.remove('stopped');
            }
        }
        
        updatePositions(); gameActive = true; generateQuestion();
        
        scheduleAIMove('ai1'); scheduleAIMove('ai2'); scheduleAIMove('ai3');
        clearInterval(eventInterval); clearInterval(speechInterval);
        eventInterval = setInterval(triggerRandomEvent, 7000);
        speechInterval = setInterval(updateSpeechBubbles, 3500);
    }
	function scheduleAIMove(aiName) {
        if (!gameActive || racers[aiName].finished) return;
        
        let params = diffParams[difficultySetting];
        let delay = Math.floor(Math.random() * (params.aiSpeedMax - params.aiSpeedMin + 1)) + params.aiSpeedMin;
        
        // Boss 會有速度加成
        if (currentLevel === maxLevels && aiName === 'ai3') {
            delay = delay * GAME_DATA.bosses[0].speedMultiplier; 
        }
        
        clearTimeout(aiTimers[aiName]); 
        aiTimers[aiName] = setTimeout(() => {
            if (!gameActive || racers[aiName].finished) return;
            
            if (!racers[aiName].stalled) {
                let canMove = true; // 預設 AI 可以移動
                
				// ▼▼▼ 超簡單模式專屬的「動態控分」機制 ▼▼▼
                // 新增 !racers.player.finished 條件，玩家衝線後就解除封印
                if (difficultySetting === 'super_easy' && !racers.player.finished) {
                    let pStep = racers.player.step;
                    let targetStep = racers[aiName].step + 1; // AI 預計移動到的下一步
                    
                    if (targetStep > pStep) {
                        // 規則 1：絕對不可以超過玩家 (最多只能平排)
                        canMove = false;
                    } else if (targetStep === pStep) {
                        // 規則 2：最多只能有一台車跟玩家平排
                        let parallelCount = 0;
                        for (let k of ['ai1', 'ai2', 'ai3']) {
                            // 檢查其他對手，是不是已經有人跟玩家平排（或超過）了
                            if (k !== aiName && racers[k].step >= pStep) {
                                parallelCount++;
                            }
                        }
                        if (parallelCount >= 1) {
                            // 如果已經有 1 台(或以上)的車跟玩家平排，這台車就必須留在後面
                            canMove = false; 
                        }
                    }
                }
                // ▲▲▲ 機制結束 ▲▲▲
// 只有在允許移動的情況下，AI 才會真的前進
                if (canMove) {
                    racers[aiName].step++;
                    
                    // ▼▼▼ 步驟 2 新增：AI 技能觸發機制 ▼▼▼
                    let oppData;
                    if (currentLevel === maxLevels && aiName === 'ai3') {
                        oppData = GAME_DATA.bosses.find(b => b.name === racers.ai3.name) || GAME_DATA.bosses[0];
                    } else {
                        oppData = GAME_DATA.opponents.find(o => o.name === racers[aiName].name) || GAME_DATA.opponents[0];
                    }

                    // 檢查是否發動技能 (有機率且沒衝線)
                    if (oppData.skillType && Math.random() < oppData.skillChance && !racers.player.finished) {
                        let eventMsg = document.getElementById('event-message');
                        let isSuperEasyRestricted = (difficultySetting === 'super_easy');
                        
                        if (oppData.skillType === "boost") {
                            // 技能：瞬間推進 (如果超簡單模式下，推進後會超過玩家就不發動)
                            if (!(isSuperEasyRestricted && racers[aiName].step + 1 > racers.player.step)) {
                                racers[aiName].step++; // 額外前進一步
                                AudioManager.playSound('skillBoost');
                                eventMsg.innerText = `⚠️ 警告：${racers[aiName].name} 發動了【瞬間推進】！`;
                            }
							} else if (oppData.skillType === "stun_player") {
                            // 技能：干擾隨機對手停駛 (包含玩家或其他 AI)
                            // 1. 找出所有未衝線、且不是施放者自己的車手作為合法目標
                            let validTargets = ["player", "ai1", "ai2", "ai3"].filter(k => !racers[k].finished && k !== aiName);
                            
                            if (validTargets.length > 0) {
                                // 2. 隨機抽選一個倒楣鬼
                                let targetKey = validTargets[Math.floor(Math.random() * validTargets.length)];
                                let targetRacer = racers[targetKey];
                                
                                if (targetKey === 'player' && targetRacer.hasShield) {
                                    // 如果抽中玩家，且玩家有護盾
                                    targetRacer.hasShield = false; 
                                    AudioManager.playSound('skillBoost');
                                    eventMsg.innerText = `🛡️ ${racers[aiName].name} 試圖干擾你，但被【護盾】擋下了！`;
                                } else {
                                    // 抽中玩家沒護盾，或是抽中其他 AI
                                    AudioManager.playSound('eventStall');
                                    let targetNameDisplay = (targetKey === 'player') ? "你" : targetRacer.name;
                                    eventMsg.innerText = `⚠️ 警告：${racers[aiName].name} 發動了干擾，${targetNameDisplay} 被迫停駛 2 秒！`;
                                    
                                    targetRacer.stalled = true;
                                    targetRacer.element.classList.remove('driving', 'boss-driving');
                                    targetRacer.element.classList.add('stopped');
                                    
                                    setTimeout(() => {
                                        if (gameActive && !targetRacer.finished) {
                                            targetRacer.stalled = false;
                                            targetRacer.element.classList.remove('stopped');
                                            // 判斷恢復時要加回哪種引擎動畫 (Boss 或一般)
                                            let isTargetBoss = (currentLevel === maxLevels && targetKey === 'ai3');
                                            targetRacer.element.classList.add(isTargetBoss ? 'boss-driving' : 'driving');
                                        }
                                    }, 2000);
                                }
                            }
                        }
						// 2.5秒後清除提示訊息
                        setTimeout(() => { if(gameActive) eventMsg.innerText = ""; }, 2500);
                    }
                    // ▲▲▲ 步驟 2 新增結束 ▲▲▲

                    updatePositions();
                    checkWinCondition();
                }
			}
            // 無論這次有沒有前進，都繼續安排下一次動作，讓 AI 保持引擎運轉隨時準備追上
            if(gameActive && !racers[aiName].finished) scheduleAIMove(aiName);
        }, delay);
    }
    function triggerRandomEvent() {
        if (!gameActive) return;
        let eventMsg = document.getElementById('event-message');
        let rand = Math.random();
        
        let pData = GAME_DATA.characters[selectedCharId];
        let isImmune = (pData.skillType === "immune_backwards");

        if (rand < 0.10) {
            // 3) 發動隨機事件：強烈風沙音效
            AudioManager.playSound('eventWind');
            eventMsg.innerText = "🌪️ 突發事件：強烈風沙來襲，未衝線全員退後一格！";
            for (let key in racers) {
                if (!racers[key].finished) {
                    if (key === 'player' && isImmune) { eventMsg.innerText += " (免疫！)"; continue; }
                    racers[key].step = Math.max(0, racers[key].step - 1);
                }
            }
        } else if (rand < 0.2) {
            // 3) 發動隨機事件：路面濕滑音效
            AudioManager.playSound('eventSlip');
            eventMsg.innerText = "💨 突發事件：路面濕滑，兩部車打滑退後！";
            let activeKeys = ["player", "ai1", "ai2", "ai3"].filter(k => !racers[k].finished).sort(() => 0.5 - Math.random());
            if(activeKeys[0] && (activeKeys[0] !== 'player' || !isImmune)) racers[activeKeys[0]].step = Math.max(0, racers[activeKeys[0]].step - 1);
            if(activeKeys[1] && (activeKeys[1] !== 'player' || !isImmune)) racers[activeKeys[1]].step = Math.max(0, racers[activeKeys[1]].step - 1);
        } else if (rand < 0.5) {
            let activeAIs = ['ai1', 'ai2', 'ai3'].filter(k => !racers[k].finished && !(currentLevel === maxLevels && k === 'ai3')); 
            if (activeAIs.length > 0) {
                let aiTarget = activeAIs[Math.floor(Math.random() * activeAIs.length)];
                // 3) 發動隨機事件：車輛熄匙音效
                AudioManager.playSound('eventStall');
                eventMsg.innerText = `⚠️ 突發事件：${racers[aiTarget].name} 突然熄匙！`;
                racers[aiTarget].stalled = true;
                racers[aiTarget].element.classList.remove('driving');
                racers[aiTarget].element.classList.add('stopped');
                
                setTimeout(() => {
                    if(gameActive && !racers[aiTarget].finished) {
                        racers[aiTarget].stalled = false;
                        racers[aiTarget].element.classList.add('driving');
                        racers[aiTarget].element.classList.remove('stopped');
                        eventMsg.innerText = "";
                    }
                }, 2500);
                return;
            }
        } else {
            eventMsg.innerText = ""; return;
        }

        updatePositions();
        setTimeout(() => { if(gameActive) eventMsg.innerText = ""; }, 2500);
    }

    function updateSpeechBubbles() {
        if (!gameActive) return;
        let sorted = ["player", "ai1", "ai2", "ai3"].sort((a,b) => racers[b].step - racers[a].step);
        let isMobile = window.innerWidth <= 768;
        
        ["player", "ai1", "ai2", "ai3"].forEach(key => {
            if (racers[key].finished) return;
            let element = racers[key].element;
            if (isMobile && (element.classList.contains('offscreen-ahead') || element.classList.contains('offscreen-behind'))) return;

            let bubble = document.getElementById(`bubble-${key}`);
            bubble.style.display = "none";
            if (Math.random() < 0.3) return;

            let text = "";
            let dData = GAME_DATA.dialogues;
            
            if (currentLevel === maxLevels && key === 'ai3') {
                text = dData.boss[Math.floor(Math.random() * dData.boss.length)];
            } else if (key === sorted[0]) text = dData.lead[Math.floor(Math.random() * dData.lead.length)];
            else if (key === sorted[3]) text = dData.behind[Math.floor(Math.random() * dData.behind.length)];
            else text = dData.mid[Math.floor(Math.random() * dData.mid.length)];

            bubble.innerText = text; bubble.style.display = "block";
            setTimeout(() => { 
                if (!(isMobile && (element.classList.contains('offscreen-ahead') || element.classList.contains('offscreen-behind')))) {
                    bubble.style.display = "none"; 
                }
            }, 2000);
        });
    }

    function generateQuestion() {
        if (!gameActive || racers.player.finished) return;
        racers.player.element.classList.remove('stopped');
        racers.player.element.classList.add('driving');
        document.getElementById('message').innerText = "踩油門作答！";
        document.getElementById('message').style.color = "#ecf0f1";

        let activeMultiplier = currentMultiplierSetting === 'random' ? Math.floor(Math.random() * 11) + 2 : parseInt(currentMultiplierSetting);
        let params = diffParams[difficultySetting];
        let randomNum = Math.floor(Math.random() * params.maxNum) + 1;
        let questionText = "";

        if (currentOperation === 'add') { currentAnswer = activeMultiplier + randomNum; questionText = `${activeMultiplier} + ${randomNum} = ?`; } 
        else if (currentOperation === 'sub') { let total = activeMultiplier + randomNum; currentAnswer = randomNum; questionText = `${total} - ${activeMultiplier} = ?`; } 
        else if (currentOperation === 'mul') { currentAnswer = activeMultiplier * randomNum; questionText = `${activeMultiplier} × ${randomNum} = ?`; } 
        else if (currentOperation === 'div') { let product = activeMultiplier * randomNum; currentAnswer = randomNum; questionText = `${product} ÷ ${activeMultiplier} = ?`; }

        document.getElementById('question-area').innerText = questionText;

		// ▼▼▼ 步驟 3 新增：記錄題目與出題時間 ▼▼▼
        currentQuestionText = questionText;
        questionStartTime = Date.now();
        // ▲▲▲ 步驟 3 新增結束 ▲▲▲
		
        let options = [currentAnswer];
        while (options.length < 4) {
            let offset = Math.floor(Math.random() * 5) + 1;
            let fakeAnswer = Math.random() > 0.5 ? currentAnswer + offset : currentAnswer - offset;
            if (fakeAnswer > 0 && !options.includes(fakeAnswer)) options.push(fakeAnswer);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsHtml = '';
        for (let op of options) {
            optionsHtml += `<button class="option-btn" onclick="AudioManager.playSound('click'); checkAnswer(${op})">${op}</button>`;
        }
        document.getElementById('options-container').innerHTML = optionsHtml;
    }

    function checkAnswer(selected) {
        if (!gameActive || racers.player.finished) return;

		// ▼▼▼ 修正 Bug：新增檢查玩家是否中了技能 (停駛狀態) ▼▼▼
        if (racers.player.stalled) {
            let msgElement = document.getElementById('message');
            msgElement.style.color = "#ff4757";
            msgElement.innerText = "💥 車輛被干擾停駛中，暫時無法作答！";
            return; // 終止這段程式碼，不讓玩家前進，也不清除選項
        }
        // ▲▲▲ 修正 Bug 結束 ▲▲▲
		
		let msgElement = document.getElementById('message');
        document.getElementById('options-container').innerHTML = ""; 

		// ▼▼▼ 步驟 3 新增：計算作答時間與記錄數據 ▼▼▼
        let timeSpent = (Date.now() - questionStartTime) / 1000; // 計算毫秒差並轉為秒
        let isCorrect = (selected === currentAnswer);
        learningStats.push({
            question: currentQuestionText,
            userAnswer: selected,
            correctAnswer: currentAnswer,
            isCorrect: isCorrect,
            timeElapsed: timeSpent.toFixed(2) + "秒",
            timestamp: new Date().toLocaleString()
        });
        // ▲▲▲ 步驟 3 新增結束 ▲▲▲
		
        if (selected === currentAnswer) {
            playerStreak++;
            document.getElementById('streak-display').innerText = `🔥 連勝: ${playerStreak}`;
            msgElement.style.color = "#2ecc71";
            msgElement.innerText = `⚡ 加速衝刺！ (連續答對 ${playerStreak} 條)`;
            racers.player.step++;

			// ▼▼▼ 步驟 4 新增：戰鬥中經濟系統微調 ▼▼▼
            if (playerStreak > 0 && playerStreak % 3 === 0) {
                playerGold += 10;
                updateGoldDisplay(); // 呼叫既有函數即時更新畫面上方金幣
                
                let eventMsg = document.getElementById('event-message');
                eventMsg.innerText = `💰 表現出色！連對 ${playerStreak} 題，額外獲得 10 金幣！`;
                AudioManager.playSound('skillBoost'); // 播放一個音效當作獎勵提示
                
                // 2.5秒後清除提示，避免卡在畫面上
                setTimeout(() => { 
                    if (gameActive && eventMsg.innerText.includes('金幣')) {
                        eventMsg.innerText = ""; 
                    }
                }, 2500);
            }
            // ▲▲▲ 步驟 4 新增結束 ▲▲▲
			
            applyPlayerSkill();
            updatePositions(); checkWinCondition();
            if (gameActive && !racers.player.finished) setTimeout(generateQuestion, 500);
        } else {
            playerStreak = 0; 
            document.getElementById('streak-display').innerText = `🔥 連勝: 0`;
            msgElement.style.color = "#e74c3c";
            msgElement.innerText = "💥 拋錨了！重新發動！(連勝中斷)";
            racers.player.element.classList.remove('driving');
            racers.player.element.classList.add('stopped');
            if (!racers.player.finished) setTimeout(generateQuestion, 1200); 
        }
    }

    function applyPlayerSkill() {
        let pData = GAME_DATA.characters[selectedCharId];
        let eventMsg = document.getElementById('event-message');

        if (playerStreak > 0 && playerStreak % pData.streakReq === 0) {
            switch (pData.skillType) {
                case "boost":
                    // 4) 發動技能音效：加速推進
                    AudioManager.playSound('skillBoost');
                    racers.player.step += pData.skillValue;
                    eventMsg.innerText = `✨ 【技能發動】連對 ${pData.streakReq} 條，額外推進 ${pData.skillValue} 步！`;
                    break;
                case "pull_back_leader":
                    // 4) 發動技能音效：拉退領先者
                    AudioManager.playSound('skillPull');
                    let sorted = ["player", "ai1", "ai2", "ai3"].sort((a, b) => racers[b].step - racers[a].step);
                    let target = (sorted[0] !== "player") ? sorted[0] : sorted[1];
                    if (target && racers[target].step > 0 && !racers[target].finished) {
                        racers[target].step -= pData.skillValue;
                        eventMsg.innerText = `🛻 【技能發動】使對手 (${racers[target].name}) 退後 ${pData.skillValue} 步！`;
                    }
                    break;
                case "stun_all":
                    // 4) 發動技能音效：全體停駛
                    AudioManager.playSound('skillStun');
                    ["ai1", "ai2", "ai3"].forEach(ai => {
                        if (!racers[ai].finished) {
                            racers[ai].stalled = true;
                            racers[ai].element.classList.remove('driving', 'boss-driving');
                            racers[ai].element.classList.add('stopped');
                        }
                    });
                    eventMsg.innerText = `⚡ 【技能發動】對手全部停駛 ${pData.skillValue / 1000} 秒！`;
                    setTimeout(() => {
                        if (gameActive) {
                            ["ai1", "ai2", "ai3"].forEach(ai => {
                                if (!racers[ai].finished) {
                                    racers[ai].stalled = false;
                                    racers[ai].element.classList.remove('stopped');
                                    racers[ai].element.classList.add((currentLevel === maxLevels && ai === 'ai3') ? 'boss-driving' : 'driving');
                                }
                            });
                        }
                    }, pData.skillValue);
                    break;
				// ▼▼▼ 步驟 1 新增：擴充護盾與淘金技能邏輯 ▼▼▼
                case "shield":
                    AudioManager.playSound('skillBoost');
                    racers.player.hasShield = true; // 賦予玩家護盾狀態
                    eventMsg.innerText = `🛡️ 【技能發動】獲得護盾！免疫下一次答錯熄火或退後！`;
                    break;
                case "gold_rush":
                    AudioManager.playSound('skillBoost');
                    playerGold += pData.skillValue; // 直接增加金幣
                    updateGoldDisplay();            // 即時更新頂部 UI
                    eventMsg.innerText = `💰 【技能發動】淘金成功！立即獲得 ${pData.skillValue} 金幣！`;
                    break;
                // ▲▲▲ 步驟 1 新增結束 ▲▲▲
			}
        }
    }

	function updatePositions() {
	    let isMobile = window.innerWidth <= 768;
	    let pStep = racers.player.step;
	
	    // ▼▼▼ 新增：背景鏡頭跟隨玩家進度平移 (從左 0% 到右 100%) ▼▼▼
	    // 根據玩家目前的步數計算進度百分比 (0 到 100)
	    let bgPercent = Math.min(100, Math.max(0, (pStep / totalSteps) * 100));
	    
	    // 將計算出的百分比應用到背景的 X 軸，Y 軸保持原本的對齊方式
	    document.getElementById('bg-top').style.backgroundPosition = `${bgPercent}% bottom`;
	    document.getElementById('bg-bottom').style.backgroundPosition = `${bgPercent}% top`;
	    // ▲▲▲ 新增結束 ▲▲▲
	
	    if (!isMobile) {
	        // 電腦版保持原本的絕對位置邏輯
	        for (let key in racers) { 
	            let percentage = (racers[key].step / totalSteps) * 85; 
	            racers[key].element.style.left = percentage + "%"; 
	            racers[key].element.classList.remove('offscreen-ahead', 'offscreen-behind');
	        }
	        document.querySelector('.finish-line').style.left = 'auto';
	        document.querySelector('.finish-line').style.right = '15px';
	    } else {
            // ▼▼▼ 修改這裡：按比例平滑移動鏡頭基準位置 ▼▼▼
            // 公式解說：
            // 起點 (pStep = 0) -> 15 + 0 = 15% (靠左)
            // 中點 (pStep = 10) -> 15 + (10/20)*60 = 45% (置中)
            // 終點 (pStep = 20) -> 15 + 60 = 75% (靠右)
            let playerBasePos = 15 + (pStep / totalSteps) * 60;
            // ▲▲▲ 修改結束 ▲▲▲

            let stepWidth = 12;

            for (let key in racers) {
                let diff = racers[key].step - pStep;
                let targetPos = playerBasePos + (diff * stepWidth);
                let element = racers[key].element;
                let bubble = document.getElementById(`bubble-${key}`);
                
                element.classList.remove('offscreen-ahead', 'offscreen-behind');

                if (targetPos > 85) { 
                    element.style.left = "85%";
                    element.classList.add('offscreen-ahead');
                    bubble.innerText = `${racers[key].name} ⏩`;
                    bubble.style.display = "block";
                } else if (targetPos < 0) { 
                    element.style.left = "-5%";
                    element.classList.add('offscreen-behind');
                    bubble.innerText = `⏪ ${racers[key].name}`;
                    bubble.style.display = "block";
                } else {
                    element.style.left = targetPos + "%";
                    if (bubble.innerText.includes('⏩') || bubble.innerText.includes('⏪')) {
                        bubble.style.display = "none";
                    }
                }
            }

            let finishDiff = totalSteps - pStep;
            let finishPos = playerBasePos + (finishDiff * stepWidth);
            let finishLine = document.querySelector('.finish-line');
            
            if (finishPos > 90) {
                finishLine.style.left = '120%';
            } else {
                finishLine.style.left = finishPos + '%';
            }
        }
    }
	
function checkWinCondition() {
        if (!gameActive) return;

        for (let key in racers) {
            if (racers[key].step >= totalSteps && !racers[key].finished) {
                racers[key].finished = true;
                finishOrder.push(key);

                // ▼▼▼ 修改這裡：判斷名次來決定播放哪種精靈圖動畫 ▼▼▼
                racers[key].element.classList.remove('driving', 'boss-driving');
                
                if (finishOrder.length === 1) {
                    // 如果衝線名單長度是 1，代表他是第一名 -> 播放勝利衝線動畫
                    racers[key].element.classList.add('finished');
                } else {
                    // 其他名次 (2, 3, 4名) -> 套用 idle 待機動畫 (停止狀態)
                    racers[key].element.classList.add('idle');
                }
                // ▲▲▲ 修改結束 ▲▲▲
                
                // 1) 單獨車輛衝線音效
                AudioManager.playSound('finish');

                let ranks = ["🥇 第一名", "🥈 第二名", "🥉 第三名", "🏅 第四名"];
                let rankStr = ranks[finishOrder.length - 1];
                document.getElementById('event-message').innerText = `🏁 ${racers[key].name} 以 ${rankStr} 衝過終點線！`;

                if (key === 'player') {
                    document.getElementById('question-area').innerText = `🎉 你以 ${rankStr} 衝線完成比賽！`;
                    document.getElementById('options-container').innerHTML = "<p style='font-size:20px; color:#f1c40f;'>等待其他選手...</p>";
                } else {
                    clearTimeout(aiTimers[key]); 
                }
            }
        }
        
        // ... 下面的全體結算邏輯保持不變 ...
        if (finishOrder.length === 4) {
            gameActive = false; clearInterval(eventInterval); clearInterval(speechInterval);
            ["ai1", "ai2", "ai3"].forEach(k => clearTimeout(aiTimers[k]));
            ["player", "ai1", "ai2", "ai3"].forEach(k => document.getElementById(`bubble-${k}`).style.display = "none");

            // 2) 所有人衝線後的結算音效
            AudioManager.playSound('allFinished');

            scores[finishOrder[0]] += 4; scores[finishOrder[1]] += 3; scores[finishOrder[2]] += 2; scores[finishOrder[3]] += 1;
            let resultMsg = `🏁 第 ${currentLevel} 回合結算！\n🥇 第一名: ${racers[finishOrder[0]].name} (+4分)\n🥈 第二名: ${racers[finishOrder[1]].name} (+3分)\n🥉 第三名: ${racers[finishOrder[2]].name} (+2分)\n🏅 第四名: ${racers[finishOrder[3]].name} (+1分)`;
            document.getElementById('question-area').innerText = "本回合結束！"; document.getElementById('options-container').innerHTML = "";
            setTimeout(() => {
                alert(resultMsg);
                if (currentLevel < maxLevels) { currentLevel++; startRace(); } else { endTournament(); }
            }, 600);
        }
    }

    function endTournament() {
        let finalSorted = ["player", "ai1", "ai2", "ai3"].sort((a,b) => scores[b] - scores[a]);
        let playerRank = finalSorted.indexOf("player") + 1;
        
        let goldReward = 0;
        if (playerRank === 1) goldReward = 1000;
        else if (playerRank === 2) goldReward = 500;
        else if (playerRank === 3) goldReward = 200;
        else goldReward = 100;

        let finalMsg = "🏆 活塞盃總冠軍賽果 🏆\n\n";
        finalMsg += `🥇 冠軍：${racers[finalSorted[0]].name} (總分: ${scores[finalSorted[0]]})\n`;
        finalMsg += `🥈 亞軍：${racers[finalSorted[1]].name} (總分: ${scores[finalSorted[1]]})\n`;
        finalMsg += `🥉 季軍：${racers[finalSorted[2]].name} (總分: ${scores[finalSorted[2]]})\n\n`;
        
        if (playerRank === 1) {
            finalMsg += "太強了！你擊敗了所有人，贏得了總冠軍！ Kachow！\n";
            
            let newlyUnlockedChar = null;
            if (difficultySetting === 'normal' && currentMultiplierSetting === 'random') {
                if (currentOperation === 'add' && !unlockedChars.includes('mater')) newlyUnlockedChar = 'mater';
                if (currentOperation === 'sub' && !unlockedChars.includes('cruz')) newlyUnlockedChar = 'cruz';
                if (currentOperation === 'mul' && !unlockedChars.includes('black_mcqueen')) newlyUnlockedChar = 'black_mcqueen';
                if (currentOperation === 'div' && !unlockedChars.includes('storm')) newlyUnlockedChar = 'storm';
            }

	// ▼▼▼ 新增這一段困難難度解鎖邏輯 ▼▼▼
            if (difficultySetting === 'hard' && currentMultiplierSetting === 'random') {
                if (currentOperation === 'add' && !unlockedChars.includes('Doc Hudson')) newlyUnlockedChar = 'Doc Hudson';
                if (currentOperation === 'sub' && !unlockedChars.includes('Chick Hicks')) newlyUnlockedChar = 'Chick Hicks';
                if (currentOperation === 'mul' && !unlockedChars.includes('Francesco')) newlyUnlockedChar = 'Francesco';
			}
            // ▲▲▲ 新增這一段困難難度解鎖邏輯 ▲▲▲

	// ▼▼▼ 新增這一段簡單難度解鎖邏輯 ▼▼▼
            if (difficultySetting === 'easy' && currentMultiplierSetting === 'random') {
                if (currentOperation === 'add' && !unlockedChars.includes('Pompompurin')) newlyUnlockedChar = 'Pompompurin';
                if (currentOperation === 'sub' && !unlockedChars.includes('Cinnamoroll')) newlyUnlockedChar = 'Cinnamoroll';
                if (currentOperation === 'mul' && !unlockedChars.includes('Pikachu')) newlyUnlockedChar = 'Pikachu';
                if (currentOperation === 'div' && !unlockedChars.includes('Hello Kitty')) newlyUnlockedChar = 'Hello Kitty';
            }
            // ▲▲▲ 新增這一段簡單難度解鎖邏輯 ▲▲▲
			
            if (newlyUnlockedChar) {
                unlockedChars.push(newlyUnlockedChar);
                localStorage.setItem('mathRacerUnlocked_v2', JSON.stringify(unlockedChars));
                finalMsg += `\n\n🔓 【解鎖成就！】\n恭喜你達成了通關條件，獲得了新車手：${GAME_DATA.characters[newlyUnlockedChar].name}！下次遊戲時即可選擇！`;
            }

        } else {
            finalMsg += "可惜了，回去多練練，下次再來挑戰！\n";
        }
        
        finalMsg += `\n💰 獲得賽事獎金：+${goldReward} 金幣！`;
        
        playerGold += goldReward;
        localStorage.setItem('mathRacerGold', playerGold);

		// ▼▼▼ 步驟 3 新增：遊戲結束時儲存學習數據 ▼▼▼
        if (learningStats.length > 0) {
            // 讀取歷史數據，若無則為空陣列
            let pastStats = JSON.parse(localStorage.getItem('mathRacerLearningStats')) || [];
            // 將本次遊戲的數據與歷史數據合併
            pastStats = pastStats.concat(learningStats);
            // 存回瀏覽器
            localStorage.setItem('mathRacerLearningStats', JSON.stringify(pastStats));
            console.log("📊 本次學習數據已儲存至 LocalStorage:", learningStats);
        }
        // ▲▲▲ 步驟 3 新增結束 ▲▲▲
		
        document.getElementById('message').innerText = "比賽結束！"; 
        document.getElementById('question-area').innerText = "🏆 頒獎典禮 🏆";
        
        setTimeout(() => { 
            alert(finalMsg); 
            location.reload(); 
        }, 800);
    }

    window.addEventListener('resize', () => { if(gameActive) updatePositions(); });
</script>
