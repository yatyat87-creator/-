<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox BGM 播放器 (支援自訂中文歌名)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background-color: #fff;
            width: 450px; /* 稍微加寬一點以容納按鈕 */
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            font-size: 22px;
        }
        #playlist-selector {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f9f9f9;
            cursor: pointer;
            outline: none;
        }
        #playlist-selector:focus {
            border-color: #007bff;
        }
        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 6px;
        }
        .controls button {
            background-color: #f1f3f5;
            border: none;
            padding: 8px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #495057;
            transition: all 0.2s ease;
            flex: 1;
        }
        .controls button:hover {
            background-color: #e2e6ea;
        }
        .controls button.active-btn {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        #search-box {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        #search-box:focus {
            border-color: #007bff;
        }
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .playlist li {
            padding: 12px 15px;
            margin-bottom: 5px;
            background-color: #f9f9f9;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: space-between; /* 讓名稱跟按鈕左右排開 */
        }
        .playlist li:hover {
            background-color: #e9ecef;
        }
        .playlist li.active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .playlist li.active .track-info {
            color: white;
        }
        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 10px;
        }

        /* 🎵 新增的 UI 樣式 */
        .track-info {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            pointer-events: none; /* 避免點擊干擾 LI 的播放判定 */
        }
        .track-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 10px;
        }
        .cache-status {
            font-size: 16px;
            cursor: help;
        }
        .btn-delete-cache {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .btn-delete-cache:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h2>🎵 BGM 播放器</h2>

    <select id="playlist-selector"></select>
    
    <audio id="audio-player" controls></audio>

    <div class="controls">
        <button id="btn-prev" title="上一首">⏮</button>
        <button id="btn-shuffle" class="active-btn">🔀 隨機: 開</button>
        <button id="btn-loop" class="active-btn">🔁 列表循環</button>
        <button id="btn-next" title="下一首">⏭</button>
    </div>

    <input type="text" id="search-box" placeholder="🔍 搜尋歌名...">
    
    <ul class="playlist" id="playlist"></ul>
</div>

    const audioPlayer = document.getElementById('audio-player');
    const playlistElement = document.getElementById('playlist');
    const searchBox = document.getElementById('search-box');
    const playlistSelector = document.getElementById('playlist-selector');
    
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnLoop = document.getElementById('btn-loop'); 

    let currentTrackIndex = 0;
    let isShuffle = true;
    let loopMode = 'list'; 
    let tracksData = []; 

    for (const playlistName in playlistsData) {
        let option = document.createElement('option');
        option.value = playlistName;
        option.textContent = playlistName;
        playlistSelector.appendChild(option);
    }

    playlistSelector.addEventListener('change', function() {
    const selected = this.value;
    loadPlaylist(selected);
    // 存入 localStorage
    localStorage.setItem('lastSelectedPlaylist', selected);
});

    // 🗑️ 共用函數：刪除特定的快取
    async function deleteCache(url, statusSpan, delBtn) {
        if (!('caches' in window)) return;
        if (!confirm('確定要刪除這首歌的快取嗎？刪除後下次播放會重新耗費網路流量。')) return;
        
        try {
            const cacheNames = await caches.keys();
            for (let name of cacheNames) {
                const cache = await caches.open(name);
                await cache.delete(url); // 根據網址刪除快取
            }
            // 刪除後立即更新介面
            statusSpan.textContent = '☁️';
            statusSpan.title = '未快取 (需播放一次才會下載)';
            delBtn.style.display = 'none';
            console.log('🗑️ 快取已刪除:', url);
        } catch (e) {
            console.error('刪除快取失敗:', e);
            alert('刪除失敗，請稍後再試。');
        }
    }

    function loadPlaylist(playlistName) {
        playlistElement.innerHTML = ''; 
        tracksData = []; 
        searchBox.value = ''; 
        
        const currentLinks = playlistsData[playlistName];

        currentLinks.forEach((item, index) => {
            let rawUrl = typeof item === 'string' ? item : item.url;
            let customName = typeof item === 'object' ? item.name : null;

            let url = rawUrl.trim();
            if (url.includes('dl=0')) {
                url = url.replace('dl=0', 'raw=1');
            } else if (!url.includes('raw=1')) {
                url += (url.includes('?') ? '&raw=1' : '?raw=1');
            }
            
            let cleanName = customName;
            if (!cleanName) {
                let urlObj = new URL(url);
                let pathname = urlObj.pathname;
                let fileName = pathname.substring(pathname.lastIndexOf('/') + 1);
                cleanName = decodeURIComponent(fileName).replace(/\.mp3/i, '').replace(/-/g, ' ');
            }
            
            let li = document.createElement('li');
            
            // 📝 左側：歌曲名稱
            let infoSpan = document.createElement('span');
            infoSpan.className = 'track-info';
            infoSpan.textContent = (index + 1) + '. ' + cleanName;

            // ⚙️ 右側：狀態與操作區域
            let actionsDiv = document.createElement('div');
            actionsDiv.className = 'track-actions';

            let statusSpan = document.createElement('span');
            statusSpan.className = 'cache-status';
            statusSpan.textContent = '☁️';
            statusSpan.title = '未快取 (需播放一次才會下載)';

            let delBtn = document.createElement('button');
            delBtn.className = 'btn-delete-cache';
            delBtn.textContent = '刪除快取';
            delBtn.title = '釋放此歌曲佔用的手機空間';
            delBtn.style.display = 'none'; // 預設隱藏

            actionsDiv.appendChild(statusSpan);
            actionsDiv.appendChild(delBtn);

            li.appendChild(infoSpan);
            li.appendChild(actionsDiv);
            
            // 🎵 點擊 LI 播放音樂
            li.addEventListener('click', function(e) {
                // 如果點擊的是刪除按鈕，不要觸發播放！
                if(e.target === delBtn) return; 
                playTrack(index);
            });

            // 🗑️ 點擊刪除按鈕
            delBtn.addEventListener('click', function(e) {
                e.stopPropagation(); // 阻止事件冒泡（避免觸發上面的播放）
                deleteCache(url, statusSpan, delBtn);
            });

            // 🔍 專屬檢查快取狀態的函數
            const checkCache = async () => {
                if (!('caches' in window)) return;
                const response = await caches.match(url);
                if (response) {
                    // 若有找到快取
                    if (statusSpan.textContent !== '💾') {
                        statusSpan.textContent = '💾'; 
                        statusSpan.title = '已存入快取，可離線免流量播放';
                        delBtn.style.display = 'inline-block';
                    }
                } else {
                    // 若沒找到快取
                    if (statusSpan.textContent !== '☁️') {
                        statusSpan.textContent = '☁️'; 
                        statusSpan.title = '未快取 (需播放一次才會下載)';
                        delBtn.style.display = 'none';
                    }
                }
            };

            checkCache(); // 載入列表時立刻檢查一次

            playlistElement.appendChild(li);
            
            tracksData.push({
                url: url,
                name: cleanName.toLowerCase(),
                element: li,
                checkCache: checkCache // 存起來供輪詢呼叫
            });
        });

        if (tracksData.length > 0) {
            currentTrackIndex = 0;
            tracksData[0].element.classList.add('active');
            audioPlayer.src = tracksData[0].url;
        }
    }

    // ⏱️ 設定定時器：每 3 秒背景檢查一次快取狀態
    // 這樣你在播放新歌時，一旦下載完，不用重整畫面，雲朵就會自動變成磁片！
    setInterval(() => {
        tracksData.forEach(track => {
            if(track.checkCache) track.checkCache();
        });
    }, 3000);

    function playTrack(index) {
        tracksData.forEach(track => track.element.classList.remove('active'));
        tracksData[index].element.classList.add('active');
        
        audioPlayer.src = tracksData[index].url;
        audioPlayer.play();
        currentTrackIndex = index;
    }

    function playNext() {
        if (tracksData.length === 0) return;
        
        if (isShuffle && tracksData.length > 1) {
            let nextIndex = currentTrackIndex;
            while (nextIndex === currentTrackIndex) {
                nextIndex = Math.floor(Math.random() * tracksData.length);
            }
            playTrack(nextIndex);
        } else {
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= tracksData.length) nextIndex = 0; 
            playTrack(nextIndex);
        }
    }

    function playPrev() {
        if (tracksData.length === 0) return;
        let prevIndex = currentTrackIndex - 1;
        if (prevIndex < 0) prevIndex = tracksData.length - 1;
        playTrack(prevIndex);
    }

    btnNext.addEventListener('click', playNext);
    btnPrev.addEventListener('click', playPrev);
    
    btnShuffle.addEventListener('click', function() {
        isShuffle = !isShuffle;
        if (isShuffle) {
            btnShuffle.textContent = '🔀 隨機: 開';
            btnShuffle.classList.add('active-btn');
        } else {
            btnShuffle.textContent = '🔀 隨機: 關';
            btnShuffle.classList.remove('active-btn');
        }
    });

    btnLoop.addEventListener('click', function() {
        if (loopMode === 'list') {
            loopMode = 'single';
            btnLoop.textContent = '🔂 單曲循環';
            btnLoop.classList.add('active-btn');
        } else {
            loopMode = 'list';
            btnLoop.textContent = '🔁 列表循環';
            btnLoop.classList.remove('active-btn');
        }
    });

    audioPlayer.addEventListener('ended', function() {
        if (loopMode === 'single') {
            playTrack(currentTrackIndex);
        } else {
            playNext();
        }
    });

    searchBox.addEventListener('input', function() {
        const filterText = searchBox.value.toLowerCase();
        tracksData.forEach(track => {
            if (track.name.includes(filterText)) {
                track.element.style.display = 'flex';
            } else {
                track.element.style.display = 'none';
            }
        });
    });

    // 新的寫法：記憶上次的選擇
    const lastPlaylist = localStorage.getItem('lastSelectedPlaylist');
    const initialPlaylistName = (lastPlaylist && playlistsData[lastPlaylist]) 
                                ? lastPlaylist 
                                : playlistSelector.options[0].value;
    
    playlistSelector.value = initialPlaylistName; // 同步選單狀態
    loadPlaylist(initialPlaylistName);
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((registration) => {
                    console.log('✅ Service Worker 註冊成功');
                })
                .catch((error) => {
                    console.log('❌ Service Worker 註冊失敗：', error);
                });
        });
    }
</script>

</body>
</html>
