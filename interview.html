<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小一面試模擬器 (加強版)</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F5A623;
            --bg: #F0F4F8;
            --text: #333333;
        }
        body {
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .nav-btn {
            background-color: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:active, .nav-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .card {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow-y: auto;
        }
        .question-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
            letter-spacing: 2px;
        }
        .instruction-text {
            font-size: 22px;
            color: #666;
            margin-bottom: 25px;
            background-color: #FFF3E0;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px dashed var(--secondary);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: auto;
            width: 100%;
            justify-content: center;
        }
        .action-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
            max-width: 250px;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .answer-text {
            font-size: 24px;
            color: #E74C3C;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            text-align: left;
            width: 90%;
            background: #FDFEFE;
            padding: 15px;
            border-left: 5px solid #E74C3C;
            border-radius: 5px;
        }
        .counter {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 16px;
            color: #95A5A6;
        }
    </style>
</head>
<body>

    <h1>🌟 小一面試題庫 (加強版) 🌟</h1>

    <div class="nav-grid">
        <button class="nav-btn active" onclick="setCategory('chi')">📘 中文認讀</button>
        <button class="nav-btn" onclick="setCategory('eng')">📕 英文認讀</button>
        <button class="nav-btn" onclick="setCategory('grammar')">✏️ 英文文法</button>
        <button class="nav-btn" onclick="setCategory('math')">🧮 數學與邏輯</button>
        <button class="nav-btn" onclick="setCategory('personal')">🗣️ 個人與情境</button>
        <button class="nav-btn" onclick="setCategory('listen')">🎨 聆聽與畫圖</button>
    </div>

    <div class="card">
        <div class="counter" id="counter">題庫載入中...</div>
        <div class="instruction-text" id="instruction">請選擇面試項目</div>
        <div class="question-text" id="question">準備好開始了嗎？</div>
        <div class="answer-text" id="answer">解答區域</div>
        
        <div class="controls">
            <button class="action-btn" style="background-color: #95A5A6;" onclick="toggleAnswer()">👀 顯示提示/答案</button>
            <button class="action-btn" onclick="nextQuestion()">➡️ 隨機下一題</button>
        </div>
    </div>

    <script>

                { q: "熱身遊戲：動物找媽媽", i: "活動指令", a: "測試有否主動開口溝通：「請問你張卡係咪兔仔媽媽呀？」嚴禁直接將卡塞給對方（避免扣分）。" },
                { q: "熱身遊戲：紅綠燈", i: "活動指令", a: "家長叫『綠燈』小朋友原地跑，叫『紅燈』立刻企定不能動。測試身體協調與服從性。" },
                { q: "搭地鐵去學校好，定係搭巴士去學校好？點解？", i: "比較與批判思考", a: "測試有沒有自己的觀點。例如：地鐵好，因為唔會塞車 / 巴士好，因為有風景睇。" },
                { q: "如果今日落好大雨，但你要去公園玩，你會點做？", i: "應變能力", a: "答：我會改留喺屋企玩其他嘢，或者問媽媽可唔可以去室內遊樂場。" },
                { q: "你覺得自己有咩優點（最叻嘅地方）？", i: "自我認知", a: "例如：我畫畫好靚、我好有禮貌、我鍾意幫人。" }
            ],
            listen: [
                { q: "請用指定的三種顏色筆寫出你的名字。", i: "聆聽指令 (給予紙筆)", a: "家長隨機指定三種顏色 (如紅、藍、黃)。看小朋友是否聽從指令及揸筆姿勢。" },
                { q: "請畫出在陸地上居住的動物。", i: "聆聽指令畫圖", a: "只要是陸地動物即可 (如貓、狗、獅子)，不可畫魚或雀鳥。" },
                { q: "請畫出【不是】與聖誕節有關的物件。", i: "反向聆聽指令", a: "重點在聽懂【不是】。可以畫蘋果、車、書包等，不可畫聖誕樹、禮物。" },
                { q: "請畫出【沒有】出現在課室的東西。", i: "反向聆聽指令", a: "重點在聽懂【沒有】。可以畫床、微波爐、馬路等。" },
                { q: "請在紙的『中間』畫一個圓形，在圓形的『上面』畫一個三角形。", i: "空間與多步指令", a: "測試空間方位概念（中間、上面）及形狀認知。" },
                { q: "請畫一個識飛，但【唔係】雀鳥嘅物件/動物。", i: "條件限制畫圖", a: "答案可以是：飛機、直升機、蝴蝶、蜜蜂、超人等。" },
                { q: "請畫三個蘋果，把其中一個塗上紅色，另外兩個塗上綠色。", i: "數量與顏色多步指令", a: "精準執行指令，不可多畫或少畫，顏色必須準確。" },
                { q: "如果今日係晴天，請畫一個太陽；如果今日係雨天，請畫一把雨傘。", i: "邏輯條件指令", a: "家長不需提示天氣，小朋友需自行判斷當下天氣並畫出對應物件。" },
                { q: "請用藍色筆畫一個正方形，然後在正方形裡面寫一個『A』字。", i: "綜合指令", a: "包含顏色、形狀、空間（裡面）、英文字母四重指令。" },
                { q: "請畫出你最鍾意食嘅一餐飯，入面要有三樣食物。", i: "創意與數量限制", a: "觀察繪畫細節及能否控制在剛好三種食物內。" },
                { q: "補畫圖案：畫半邊雪糕 / 蝴蝶", i: "在一張紙上畫一半，要求小朋友畫餘下一半", a: "測試對稱概念及小肌肉控制，鼓勵畫得漂亮並加上裝飾。" },
                { q: "請聽住家長拍手的次數，在紙上畫出相同數量的圓圈。", i: "聽覺轉視覺指令", a: "家長拍手4下，小朋友畫4個圈。測試專注力。" },
                { q: "請畫出一個開心的蘋果，同一個傷心的香蕉。", i: "擬人化與情緒繪圖", a: "將情緒結合在物件上，測試創意與對情緒的理解。" },
                { q: "請畫出一架車，但這架車是【沒有】車輪的。", i: "矛盾指令/創意思維", a: "看小朋友如何解決問題（例如畫磁浮車、積木車、或者爛了的車），接受任何合理創意解釋。" },
                { q: "家長讀出一組數字：『3 - 8 - 5』，請小朋友在紙上寫出來。", i: "短期記憶測試", a: "讀完一次就要求寫出，測試專注力及記憶。" }
            ]
        };

        let currentCategory = 'chi';
        let currentIndex = -1;
        let askedQuestions = new Set(); // 記錄已問過的題目以避免短時間內重複

        function updateCounter() {
            const total = database[currentCategory].length;
            document.getElementById('counter').innerText = `目前題庫共 ${total} 題`;
        }

        function setCategory(cat) {
            currentCategory = cat;
            askedQuestions.clear(); // 換類別時重置紀錄
            
            // 更新按鈕樣式
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            updateCounter();
            nextQuestion();
        }

        function nextQuestion() {
            const arr = database[currentCategory];
            
            // 如果所有題目都問過了，清空紀錄重新開始
            if (askedQuestions.size >= arr.length) {
                askedQuestions.clear();
            }

            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * arr.length);
            } while (askedQuestions.has(newIndex) && arr.length > 1);

            currentIndex = newIndex;
            askedQuestions.add(currentIndex);
            
            const item = arr[currentIndex];
            document.getElementById('instruction').innerText = item.i;
            
            // 處理換行
            document.getElementById('question').innerHTML = item.q.replace(/\n/g, '<br>');
            document.getElementById('answer').innerHTML = item.a.replace(/\n/g, '<br>');
            document.getElementById('answer').style.display = 'none';
        }

        function toggleAnswer() {
            const ans = document.getElementById('answer');
            if (ans.style.display === 'none') {
                ans.style.display = 'block';
            } else {
                ans.style.display = 'none';
            }
        }

        // 初始化
        updateCounter();
        nextQuestion();
    </script>
</body>
</html>
