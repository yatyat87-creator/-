<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小一面試模擬器 (iPad專用) - 極大擴充版 + 重組句子</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F5A623;
            --bg: #F0F4F8;
            --text: #333333;
        }
        body {
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .header-actions {
            text-align: center;
            margin-bottom: 15px;
        }
        .reset-btn {
            background-color: #fff;
            color: #E74C3C;
            border: 1px solid #E74C3C;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .reset-btn:active {
            background-color: #FDEDEC;
        }
        .nav-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background-color: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 calc(25% - 10px); 
            min-width: 130px;
        }
        .nav-btn:active, .nav-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .card {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .question-text {
            font-size: 46px; 
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
            letter-spacing: 2px;
        }
        .instruction-text {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
            background-color: #FFF3E0;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px dashed var(--secondary);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .answer-text {
            font-size: 26px;
            color: #E74C3C;
            margin-top: 20px;
            display: none;
            font-weight: bold;
            text-align: left;
            width: 80%;
            background-color: #FDEDEC;
            padding: 20px;
            border-radius: 10px;
        }
        .progress-text {
            font-size: 16px;
            color: #7F8C8D;
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>

    <h1>🌟 小一入學面試模擬器 (擴充版) 🌟</h1>
    <div class="header-actions">
        <button class="reset-btn" onclick="resetProgress()">🔄 重置所有進度 (全部題目重頭嚟過)</button>
    </div>

    <div class="nav-grid">
        <button class="nav-btn active" onclick="setCategory('chi')">📘 中文認讀</button>
        <button class="nav-btn" onclick="setCategory('eng')">📕 英文認讀</button>
        <button class="nav-btn" onclick="setCategory('grammar')">✏️ 英文文法</button>
        <button class="nav-btn" onclick="setCategory('math')">🧮 數學與邏輯</button>
        <button class="nav-btn" onclick="setCategory('personal')">🗣️ 個人與情境</button>
        <button class="nav-btn" onclick="setCategory('listen')">🎨 聆聽與畫圖</button>
        <button class="nav-btn" onclick="setCategory('rearrange')">🧩 重組句子</button>
        <!-- 下面是新增的按鈕 -->
        <button class="nav-btn" style="background-color: #E8F8F5; border-color: #1ABC9C; color: #1ABC9C;" onclick="setCategory('story')">📖 故事選擇題 (新)</button>
    </div>

    <div class="card">
        <div class="progress-text" id="progress">剩餘: 0 題</div>
        <div class="instruction-text" id="instruction">請選擇面試項目</div>
        
        <!-- 新增：手動朗讀按鈕 (已更新點擊事件) -->
        <button id="read-btn" onclick="playCurrentAudio()" style="display: none; background-color: #3498DB; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 18px; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">🔊 重播語音</button>        
        <div class="question-text" id="question">準備好開始了嗎？</div>
        <div class="answer-text" id="answer">解答區域</div>
        
        <div class="controls">
            <button class="action-btn" style="background-color: #95A5A6;" onclick="toggleAnswer()">👀 顯示答案/提示</button>
            <button class="action-btn" style="background-color: #2ECC71;" id="btn-good" onclick="markGood()">✅ 答得好</button>
            <button class="action-btn" style="background-color: #E74C3C;" id="btn-bad" onclick="markBad()">❌ 答得唔好</button>
        </div>
    </div>

                { q: "你想幫手拿剪刀俾老師/家人，應該點樣拎？", i: "工具安全", a: "答：手要握住剪刀刀頭（尖端），把手朝向對方傳遞。" },
                { q: "去泳池或者沙灘玩，發現腳抽筋或者游唔到水，你會點做？", i: "水上安全", a: "答：保持冷靜舉手大聲呼救，請救生員幫手。" },
                { q: "喺屋企可唔可以喺窗台或者陽台上面爬高爬低？點解？", i: "居家安全", a: "答：唔可以，因為會跌落去，非常危險。" },
                { q: "手濕嘅時候，可唔可以去插電線或者按開關？點解？", i: "用電安全", a: "答：唔可以，因為濕手容易觸電受傷。" },
                { q: "喺屋企見到枱面有藥丸/藥水，可以自己拿嚟食嗎？", i: "用藥安全", a: "答：唔可以，一定要爸爸媽媽或者醫生俾先可以食。" },
                { q: "去廚房幫手時，有咩地方要特別小心？", i: "環境安全", a: "答：小心刀具、明火同滾水，唔好亂摸熱煲。" },
                { q: "坐私家車或者的士嘅時候，上車後第一時間要點做？", i: "乘車安全", a: "答：要立刻扣好安全帶。" },
                { q: "搭地鐵等車嘅時候，要站在哪裡？頭手可以伸出屏蔽門嗎？", i: "乘車安全", a: "答：要站在黃線後面排隊，頭同手唔可以伸出去。" },
                { q: "喺路上聽到救護車或者消防車嘅警報聲，交通工具會點做？", i: "社區常識", a: "答：所有車輛都會讓路俾救護車/消防車先過。" },
                { q: "喺郊外或者公園見到蜜蜂或者野豬，你會點做？", i: "動物安全", a: "答：保持冷靜慢慢離開，唔好大叫或者用手揮打。" },
                { q: "去遊樂場玩鞦韆，有人玩緊嘅時候你可唔可以走近？", i: "遊樂安全", a: "答：唔可以，要保持距離，否則會被踢倒受傷。" },
                { q: "被蚊蟲叮咬感到好癢，可以一直用手抓嗎？", i: "個人衛生", a: "答：唔可以抓破皮，要同大人講搽藥膏。" },
                { q: "夏天去戶外玩，要準備啲咩防止曬傷同蚊叮？", i: "生活經驗", a: "答：搽防曬霜、噴蚊貼/蚊怕水、帶帽子飲多啲水。" },
                { q: "下雨天行路，見到地面有水坑或者井蓋，要點做？", i: "步列安全", a: "答：要繞過行，唔好踩落去以免滑倒或者跌入去。" },
                { q: "如果在商場見到火警鐘，可以隨便去按嗎？", i: "規則意識", a: "答：唔可以，只有真的發生火警時先可以按。" },
                { q: "如果不小心撞到同學，但同學冇受傷，你第一句應該講咩？", i: "禮貌態度", a: "答：對唔住，你有冇事呀？" },
                { q: "當別人幫你開門或者借嘢俾你，你應該講咩？", i: "禮貌態度", a: "答：多謝你 / 唔該你。" },
                { q: "同同學玩遊戲輸咗，你會點做？會唔會發脾氣？", i: "挫折忍受", a: "答：唔會發脾氣，恭喜贏咗嘅同學，下次再努力玩。" },
                { q: "小息時，見到有同學一個人坐喺度哭，你會點做？", i: "關懷同理心", a: "答：我會上前問佢『你點呀？』，或者陪佢去搵老師。" },
                { q: "想玩同學手上嘅玩具，你會點樣問佢？", i: "社交表達", a: "答：請問我可唔可以同你一齊玩呀？" },
                { q: "排隊買小食或者玩滑梯時，有同學插隊排喺你前面，你會點做？", i: "衝突處理", a: "答：禮貌提醒佢『請你去後面排隊啦』，或者請老師處理。" },
                { q: "如果有同學給取笑你的名字，你覺得不高興，你會點做？", i: "情緒表達", a: "答：平靜同佢講『我不鍾意你咁樣講』，如果佢繼續就話俾老師聽。" },
                { q: "當你覺得好憤怒、好想發脾氣嘅時候，你會點樣冷靜下來？", i: "情緒管理", a: "答：我會深呼吸、數十聲，或者搵個安靜嘅地方坐下。" },
                { q: "借咗同學嘅圖書或者鉛筆，用完之後應該點做？", i: "責任感", a: "答：要妥善保管，用完記得及時歸還並講多謝。" },
                { q: "同學在台上表演得好好或者拿到獎，你會點做？", i: "分享快樂", a: "答：我會拍手讚賞佢，同佢講『你好棒！』" },
                { q: "回答問題答錯咗，全班同學睇住你，你會點做？", i: "抗壓能力", a: "答：唔會害怕，聽老師講解正確答案，下次再嘗試。" },
                { q: "同朋友玩遊戲，大家想玩嘅嘢唔同（一個想畫畫，一個想砌積木），點辦？", i: "協商能力", a: "答：可以輪流玩，先畫畫再砌積木，或者玩剪刀石頭布決定。" },
                { q: "班上有身體不方便或者特別慢嘅同學，我哋應該點對待佢哋？", i: "包容接納", a: "答：要互相包容，主動關心同幫忙，唔可以欺負佢哋。" },
                { q: "屋企有客人嚟拜訪，你會點樣招待客人？", i: "家庭禮儀", a: "答：主動叫人『叔叔阿姨好』，請客人坐同倒水。" },
                { q: "喺電影院睇電影或者喺圖書館，點解唔可以大聲說話？", i: "顧及他人", a: "答：因為會影響其他人睇戲同睇書，要尊重公共場所規矩。" },
                { q: "同屋企人食飯時，長輩未坐落嚟，我哋可以先食嗎？", i: "傳統禮儀", a: "答：唔可以，要等長輩坐好、叫『爸爸媽媽食飯』先開始食。" },
                { q: "食飯時，如果不小心將食物掉喺枱上面或者地上，可以點做？", i: "生活習慣", a: "答：地上的食物唔可以再食，要拾起丟進垃圾桶。" },
                { q: "同學做手工唔記得帶膠水，而你有帶，你會點做？", i: "樂於助人", a: "答：我會樂意共享，借膠水俾同學用。" },
                { q: "喺學校走廊見到校長或者清潔阿姨，你會點做？", i: "日常禮貌", a: "答：我會主動打招呼『校長早晨 / 阿姨好』。" },
                { q: "你不小心將弟弟/妹妹嘅玩具弄壞咗，你會點做？", i: "勇於承擔", a: "答：我會同佢講對唔住，並試下幫佢修理或者同爸爸媽媽講。" },
                { q: "一年有哪四個季節？現在是什麼季節？", i: "自然常識", a: "答：春、夏、秋、冬。（按當時面試月份回答，如秋天）。" },
                { q: "植物要生長得健健康康，需要邊三樣最重要的東西？", i: "科學常識", a: "答：陽光、水同空氣（土壤）。" },
                { q: "太陽每日從哪邊升起，哪邊落下？", i: "自然常識", a: "答：東邊升起，西邊落下。" },
                { q: "刷牙或者洗手嘅時候，點樣可以幫手節約用水？", i: "環保意識", a: "答：抹肥皂或者刷牙時要把水龍頭關掉。" },
                { q: "你知道貓咪/狗狗同野生動物（如獅子）有咩分別嗎？", i: "動物常識", a: "答：貓狗係寵物/家養動物比較溫和，獅子係野生動物有危險。" },
                { q: "天上面嘅雲堆積得越來越厚、越來越黑，代表即將會點樣？", i: "天氣觀察", a: "答：代表即將要落大雨。" },
                { q: "下雨天出門，我哋需要帶啲咩用品？", i: "生活常識", a: "答：雨傘、雨衣或者穿雨鞋。" },
                { q: "在大太陽底下行路，後面會出現黑黑嘅影，嗰個係咩嚟？", i: "科學常識", a: "答：係影子，因為光線被我哋身體擋住咗。" },
                { q: "把冰塊從雪櫃拎出嚟放在桌上，過一陣子會變成咩？點解？", i: "科學現象", a: "答：會融化變成水，因為外面溫度比較熱。" },
                { q: "為什麼有些鳥類喺冬天會飛去南方？", i: "自然常識", a: "答：因為南方比較溫暖，容易搵到食物（候鳥遷徙）。" },
                { q: "如果全世界上突然有一整天完全沒有電，生活會變成點？", i: "發散思考", a: "答：電視開唔到、雪櫃唔冷、冷氣無得開，要用手電筒或者蠟燭。" },
                { q: "如果動物會說話，你最想同哪一種動物聊天？你想問佢咩問題？", i: "想像力", a: "無標準答案，如：想同鳥仔傾天，問佢飛喺天上面見到啲咩。" },
                { q: "為什麼我哋喺學校同社會上要遵守規則？如果沒有規則會點？", i: "邏輯推理", a: "答：規則可以保護大家安全；如果無規則會變得好混亂同危險。" },
                { q: "你喜歡下雨天定係晴天？點解？", i: "批判思考", a: "答：晴天（可以去公園玩）/ 下雨天（可以聽雨聲踩水花），需講出合理原因。" },
                { q: "如果你可以設計一間屬於你嘅夢想學校，學校裡面會有咩特別設施？", i: "創意思維", a: "鼓勵發揮創意，如：有超大滑梯連接樓層、有糖果圖書館等。" },
                { q: "為什麼守時（按時到達）對我哋咁重要？", i: "價值觀", a: "答：守時係尊重人嘅表現，唔會浪費別人時間。" },
                { q: "爸爸媽媽平時用嚟買嘢嘅錢，係從哪裡來的？", i: "金錢觀念", a: "答：係爸爸媽媽辛苦工作賺返嚟嘅，所以唔可以亂花錢。" },
                { q: "為什麼我哋要把垃圾分類回收，唔好隨便亂扔？", i: "環保價值", a: "答：可以減少垃圾，回收再利用，保護地球環境。" },
                { q: "如果哆啦A夢（叮噹）借神奇口袋嘅一件道具俾你，你想拿咩？點解？", i: "想像力", a: "鼓勵展現興趣或願望，如：隨意門，可以立刻去旅行睇世界。" },
                { q: "你覺得我哋為什麼每天都要去上學學習？", i: "學習態度", a: "答：可以學到好多新知識、認識朋友同學習同人相處。" },
                { q: "小組討論時，如果大家同時爭著說話，場面好吵，你會點做？", i: "團隊合作", a: "答：我會請大家安靜，建議大家舉手，一個一個輪流講。" },
                { q: "上課上到一半，你突然好想去洗手間，你會點做？", i: "課堂常規", a: "答：我會舉手向老師報告『老師，我想去洗手間』，獲得允許先去。" },
                { q: "美術課用完剪刀、彩色筆同膠水，要點處理桌子？", i: "自理整理", a: "答：要把工具蓋好放回原位，將垃圾扔進垃圾桶，保持桌面乾淨。" },
                { q: "老師在台上稱讚另一位同學畫畫好美麗，但沒有稱讚你，你會點做？", i: "心理素質", a: "答：我會替同學高興，自己繼續努力，向佢學習。" },
                { q: "分組做手工時，同組有同學不肯幫手仲喺度搗亂，你會點做？", i: "同儕協調", a: "答：我會鼓勵佢『我哋一齊砌啦，好好玩架』，如果佢繼續搗亂就請老師幫手。" },
                { q: "為什麼在學校走廊同樓梯唔可以奔跑？", i: "安全規矩", a: "答：因為容易撞到同學跌倒受傷。" },
                { q: "在課室地上拾到一把鑰匙或者一個筆袋，你會點做？", i: "拾金不昧", a: "答：我會立刻交俾老師，請老師幫手搵失主。" },
                { q: "上體育課跑步時，你覺得好熱、好頭暈，你會點做？", i: "身體感知", a: "答：我會立刻停落嚟，向體育老師報告並去旁邊休息飲水。" },
                { q: "學校舉行禮堂集會時，台上有老師說話，台下的同學應該點做？", i: "專注與尊重", a: "答：要坐好、保持安靜、專心聽老師說話。" },
                { q: "放學時，你在校門口等咗很久都未見爸爸媽媽嚟接你，你會點做？", i: "危機解難", a: "答：我會返去校務處或者搵老師幫手打電話，絕對唔會自己一個人離開學校。" }
            ],
            listen: [
                { q: "請用指定的三種顏色筆寫出你的名字。", i: "聆聽指令 (給予紙筆)", a: "家長隨機指定三種顏色 (如紅、藍、黃)。看小朋友是否聽從指令及揸筆姿勢。" },
                { q: "請畫出在陸地上居住的動物。", i: "聆聽指令畫圖", a: "只要是陸地動物即可 (如貓、狗、獅子)，不可畫魚或雀鳥。" },
                { q: "請畫出【不是】與聖誕節有關的物件。", i: "反向聆聽指令", a: "重點在聽懂【不是】。可以畫蘋果、車、書包等，不可畫聖誕樹、禮物。" },
                { q: "請畫出【沒有】出現在課室的東西。", i: "反向聆聽指令", a: "重點在聽懂【沒有】。可以畫床、微波爐、馬路等。" },
                { q: "請在紙的『中間』畫一個圓形，在圓形的『上面』畫一個三角形。", i: "空間與多步指令", a: "測試空間方位概念（中間、上面）及形狀認知。" },
                { q: "請畫一個識飛，但【唔係】雀鳥嘅物件/動物。", i: "條件限制畫圖", a: "答案可以是：飛機、直升機、蝴蝶、蜜蜂、超人等。" },
                { q: "請畫三個蘋果，把其中一個塗上紅色，另外兩個塗上綠色。", i: "數量與顏色多步指令", a: "精準執行指令，不可多畫或少畫，顏色必須準確。" },
                { q: "如果今日係晴天，請畫一個太陽；如果今日係雨天，請畫一把雨傘。", i: "邏輯條件指令", a: "家長不需提示天氣，小朋友需自行判斷當下天氣並畫出對應物件。" },
                { q: "請用藍色筆畫一個正方形，然後在正方形裡面寫一個『A』字。", i: "綜合指令", a: "包含顏色、形狀、空間（裡面）、英文字母四重指令。" },
                { q: "請畫出你最鍾意食嘅一餐飯，入面要有三樣食物。", i: "創意與數量限制", a: "觀察繪畫細節及能否控制在剛好三種食物內。" },
                { q: "補畫圖案：畫半邊雪糕 / 蝴蝶", i: "在一張紙上畫一半，要求小朋友畫餘下一半", a: "測試對稱概念及小肌肉控制，鼓勵畫得漂亮並加上裝飾。" },
                { q: "請聽住家長拍手的次數，在紙上畫出相同數量的圓圈。", i: "聽覺轉視覺指令", a: "家長拍手4下，小朋友畫4個圈。測試專注力。" },
                { q: "請畫出一個開心的蘋果，同一個傷心的香蕉。", i: "擬人化與情緒繪圖", a: "將情緒結合在物件上，測試創意與對情緒的理解。" },
                { q: "請畫出一架車，但這架車是【沒有】車輪的。", i: "矛盾指令/創意思維", a: "看小朋友如何解決問題（例如畫磁浮車、積木車、或者爛了的車），接受任何合理創意解釋。" },
                { q: "家長讀出一組數字：『3 - 8 - 5』，請小朋友在紙上寫出來。", i: "短期記憶測試", a: "讀完一次就要求寫出，測試專注力及記憶。" },
                { q: "補畫圖案 (半邊雪糕)", i: "請在一張紙上畫半邊雪糕，要求小朋友畫餘下半邊", a: "測試對稱概念及小肌肉繪畫能力。" },
                { q: "請畫出【不是】紅色的水果。", i: "反向聆聽指令", a: "可以畫香蕉(黃)、提子(紫/綠)、橙，絕對不能畫蘋果或士多啤梨。" },

            database = JSON.parse(savedData);

            // 深拷貝一份預設題庫
            database = JSON.parse(JSON.stringify(defaultDatabase));

        let currentCategory = 'chi';
        let currentIndex = -1;

        let storyUserAnswers = [];         // 記錄小朋友的選擇

        // 保存進度到 localStorage
        function saveProgress() {
            localStorage.setItem('interviewProgress', JSON.stringify(database));
            updateProgressText();
        }

        // 重置進度功能
        function resetProgress() {
            if (confirm("確定要重置所有進度嗎？所有『答得好』的題目將會再次出現！")) {
                localStorage.removeItem('interviewProgress');
                database = JSON.parse(JSON.stringify(defaultDatabase));
                currentIndex = -1;
                nextQuestion();
                alert("進度已成功重置！");
            }
        }

        // 更新剩餘題數顯示
        function updateProgressText() {
            const count = database[currentCategory].length;
            document.getElementById('progress').innerText = `剩餘: ${count} 題`;
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            currentIndex = -1; 
            nextQuestion();
        }

        function markGood() {
            const arr = database[currentCategory];
            if (arr.length > 0 && currentIndex !== -1) {
                // 將題目從當前題庫刪除
                arr.splice(currentIndex, 1);
                // 儲存進度
                saveProgress();
            }
            
            currentIndex = -1;
            nextQuestion();
        }

function markBad() {
            nextQuestion();
        }

        // ================= 核心題庫與故事控制 =================
        function nextQuestion() {
            const arr = database[currentCategory];
            updateProgressText();
            
            const btnGood = document.getElementById('btn-good');
            const btnBad = document.getElementById('btn-bad');
            const readBtn = document.getElementById('read-btn');
            // 獲取「顯示答案」的按鈕 (它沒有 id，所以用 css selector)
            const btnShowAns = document.querySelector('.action-btn[onclick="toggleAnswer()"]');
            
            window.speechSynthesis.cancel(); // 切換題目時停止說話

            if (arr.length === 0) {
                document.getElementById('instruction').innerText = "完成！";
                document.getElementById('question').innerHTML = "🎉 恭喜！這個類別的題目已經全部答對！<br><span style='font-size: 20px; color: #7F8C8D;'>可以選擇其他類別，或按上方重置按鈕重做。</span>";
                document.getElementById('answer').style.display = 'none';
                
                btnGood.style.display = 'none';
                btnBad.style.display = 'none';
                btnShowAns.style.display = 'none';
                readBtn.style.display = 'none';
                currentIndex = -1;
                return;
            }

            // 如果是故事模式，進入專屬渲染邏輯
            if (currentCategory === 'story') {
                startStoryMode(arr);
                return;
            }

            // ================= 一般模式 (非故事) =================
            btnGood.style.display = 'inline-block';
            btnBad.style.display = 'inline-block';
            btnShowAns.style.display = 'inline-block';
            readBtn.style.display = 'none'; // 隱藏朗讀按鈕

            let newIndex = currentIndex;
            if (arr.length > 1) {
                while (newIndex === currentIndex) {
                    newIndex = Math.floor(Math.random() * arr.length);
                }
            } else {
                newIndex = 0;
            }
            currentIndex = newIndex;
            
            const item = arr[currentIndex];
            document.getElementById('instruction').innerText = item.i;
            document.getElementById('question').innerHTML = item.q.replace(/\n/g, '<br>');
            document.getElementById('answer').innerHTML = item.a.replace(/\n/g, '<br>');
            document.getElementById('answer').style.display = 'none';
        }

        // ================= 故事模式專屬邏輯 =================
        function startStoryMode(arr) {
            document.getElementById('instruction').innerText = "聆聽故事並作答 (只顯示問題與選項)";
            document.getElementById('answer').style.display = 'none';
            
            // 隱藏一般模式的按鈕
            document.getElementById('btn-good').style.display = 'none';
            document.getElementById('btn-bad').style.display = 'none';
            document.querySelector('.action-btn[onclick="toggleAnswer()"]').style.display = 'none';
            document.getElementById('read-btn').style.display = 'inline-block'; // 顯示朗讀按鈕

            // 隨機抽一條故事
            let newIndex = currentIndex;
            if (arr.length > 1) {
                while (newIndex === currentIndex) {
                    newIndex = Math.floor(Math.random() * arr.length);
                }
            } else {
                newIndex = 0;
            }
            currentIndex = newIndex;
            
            // 重置作答進度
            currentStoryQuestionIndex = 0;
            storyUserAnswers = [];
            
            renderStoryQuestion();
        }

        function renderStoryQuestion() {
            const storyData = database['story'][currentIndex];
            const qData = storyData.questions[currentStoryQuestionIndex];
            
            // 畫面只顯示當前題目及按鈕選項
            let html = `<div>問題 ${currentStoryQuestionIndex + 1}：${qData.q}</div>`;
            html += `<div style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px; align-items: center;">`;
            
            qData.options.forEach((opt, idx) => {
                html += `<button onclick="submitStoryAnswer(${idx})" style="padding: 15px 25px; font-size: 24px; border-radius: 12px; border: 2px solid var(--primary); background: white; color: var(--text); cursor: pointer; min-width: 300px; text-align: left; transition: 0.2s;">${opt}</button>`;
            });
            html += `</div>`;
            
            document.getElementById('question').innerHTML = html;
            
            // 準備朗讀內容：若是第一題則朗讀「故事+問題」，否則只讀「問題」(不讀選項)
            let textToRead = "";
            if (currentStoryQuestionIndex === 0) {
                textToRead = storyData.storyText + "。 問題一： " + qData.q;
            } else {
                textToRead = "問題二： " + qData.q;
            }
            
            speakText(textToRead);
        }

        function submitStoryAnswer(selectedIdx) {
            window.speechSynthesis.cancel(); // 按下選項立即停止語音
            storyUserAnswers.push(selectedIdx);
            
            const storyData = database['story'][currentIndex];
            currentStoryQuestionIndex++;
            
            if (currentStoryQuestionIndex < storyData.questions.length) {
                // 進入下一題
                renderStoryQuestion();
            } else {
                // 題目完結，顯示結果
                finishStory();
            }
        }

        function finishStory() {
            const storyData = database['story'][currentIndex];
            let allCorrect = true;
            let resultHtml = `<div style="font-size: 32px; color: var(--primary); margin-bottom: 20px;">答題結果</div>`;
            
            storyData.questions.forEach((q, idx) => {
                const userAns = storyUserAnswers[idx];
                const isCorrect = (userAns === q.correct);
                if (!isCorrect) allCorrect = false;
                
                resultHtml += `<div style="text-align: left; margin-bottom: 15px; font-size: 22px; background: #f9f9f9; padding: 15px; border-radius: 10px;">`;
                resultHtml += `<b>${idx + 1}. ${q.q}</b><br>`;
                resultHtml += `你的選擇：${q.options[userAns]} ${isCorrect ? '✅' : '❌'}<br>`;
                if (!isCorrect) {
                    resultHtml += `<span style="color: #E74C3C;">正確答案：${q.options[q.correct]}</span>`;
                }
                resultHtml += `</div>`;
            });
            
            // 判斷是否全部答對
            if (allCorrect) {
                resultHtml += `<div style="color: #2ECC71; font-size: 26px; font-weight: bold; margin-top: 20px;">🎉 全中！這篇故事已完成並剔除。</div>`;
                document.getElementById('question').innerHTML = resultHtml;
                
                // 停頓 4 秒讓小朋友看結果，然後自動刪除題目並抽下一題
                setTimeout(() => {
                    database['story'].splice(currentIndex, 1);
                    saveProgress();
                    currentIndex = -1;
                    nextQuestion();
                }, 4000);
            } else {
                resultHtml += `<div style="color: #E74C3C; font-size: 26px; font-weight: bold; margin-top: 20px;">繼續努力！這篇故事將會保留。</div>`;
                resultHtml += `<button onclick="nextQuestion()" class="action-btn" style="background-color: var(--primary); margin-top: 20px;">➡️ 下一篇故事</button>`;
                document.getElementById('question').innerHTML = resultHtml;
            }
            
            document.getElementById('read-btn').style.display = 'none'; // 顯示結果時隱藏朗讀按鈕
        }

        // ================= 語音朗讀模組 =================
        function playCurrentAudio() {
            if (currentCategory === 'story') {
                // 手動點擊時，重新朗讀當前題目的設定
                const storyData = database['story'][currentIndex];
                const qData = storyData.questions[currentStoryQuestionIndex];
                if (currentStoryQuestionIndex === 0) {
                    speakText(storyData.storyText + "。 問題一： " + qData.q);
                } else {
                    speakText("問題二： " + qData.q);
                }
            } else {
                speakText();
            }
        }

        function speakText(customText = null) {
            window.speechSynthesis.cancel();
            
            let textToRead = customText;
            if (!textToRead) {
                textToRead = document.getElementById('question').innerText;
            }
            
            const utterance = new SpeechSynthesisUtterance(textToRead);
            const engCount = (textToRead.match(/[a-zA-Z]/g) || []).length;
            const chiCount = (textToRead.match(/[\u4e00-\u9fa5]/g) || []).length;
            
            if (engCount > chiCount) {
                utterance.lang = 'en-US';
            } else {
                utterance.lang = 'zh-HK';
            }
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        function toggleAnswer() {
            const ans = document.getElementById('answer');
            ans.style.display = ans.style.display === 'none' ? 'block' : 'none';
        }

        // 系統啟動，載入第一題
        nextQuestion();
    </script>
</body>
</html>
