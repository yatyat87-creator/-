<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小一面試模擬器 (iPad專用) - 極大擴充版 + 重組句子</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F5A623;
            --bg: #F0F4F8;
            --text: #333333;
        }
        body {
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .header-actions {
            text-align: center;
            margin-bottom: 15px;
        }
        .reset-btn {
            background-color: #fff;
            color: #E74C3C;
            border: 1px solid #E74C3C;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .reset-btn:active {
            background-color: #FDEDEC;
        }
        .nav-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background-color: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 calc(25% - 10px); 
            min-width: 130px;
        }
        .nav-btn:active, .nav-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .card {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .question-text {
            font-size: 46px; 
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
            letter-spacing: 2px;
        }
        .instruction-text {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
            background-color: #FFF3E0;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px dashed var(--secondary);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .answer-text {
            font-size: 26px;
            color: #E74C3C;
            margin-top: 20px;
            display: none;
            font-weight: bold;
            text-align: left;
            width: 80%;
            background-color: #FDEDEC;
            padding: 20px;
            border-radius: 10px;
        }
        .progress-text {
            font-size: 16px;
            color: #7F8C8D;
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>

    <h1>🌟 小一入學面試模擬器 (擴充版) 🌟</h1>
    <div class="header-actions">
        <button class="reset-btn" onclick="resetProgress()">🔄 重置所有進度 (全部題目重頭嚟過)</button>
    </div>

<!-- 主選單 -->
    <div class="nav-grid" id="main-nav">
        <button class="nav-btn active" onclick="setCategory('chi')">📘 中文認讀</button>
        <button class="nav-btn" onclick="setCategory('eng')">📕 英文認讀</button>
        <button class="nav-btn" onclick="setCategory('grammar')">✏️ 英文文法</button>
        <button class="nav-btn" onclick="setCategory('math')">🧮 數學與邏輯</button>
        <button class="nav-btn" onclick="setCategory('personal')">🗣️ 個人與情境</button>
        <button class="nav-btn" onclick="setCategory('listen')">🎨 聆聽與畫圖</button>
        <button class="nav-btn" style="background-color: #FFF3E0; border-color: #F5A623; color: #F5A623;" onclick="setCategory('rearrange')">🧩 重組句子</button>
        <button class="nav-btn" style="background-color: #E8F8F5; border-color: #1ABC9C; color: #1ABC9C;" onclick="setCategory('story')">📖 故事選擇題</button>
        <!-- 修改：將原本的聖瑪加利按鈕換成以下兩個學校按鈕 -->
        <button class="nav-btn" style="background-color: #F4ECF7; border-color: #8E44AD; color: #8E44AD;" onclick="showSchoolNav(event, 'st_margaret')">🏫 聖瑪加利特訓</button>
        <button class="nav-btn" style="background-color: #FDEDEC; border-color: #E74C3C; color: #E74C3C;" onclick="showSchoolNav(event, 'pui_kiu')">🏫 培僑特訓</button>
        <!-- 新增：福附小按鈕 -->
        <button class="nav-btn" style="background-color: #E8F8F5; border-color: #16A085; color: #16A085;" onclick="showSchoolNav(event, 'fukien')">🏫 福附小特訓</button>
    </div>

    <!-- 聖瑪加利專屬子選單 (預設隱藏) -->
    <div class="nav-grid school-sub-nav" id="school-nav-st_margaret" style="display: none; background-color: #F4ECF7; padding: 15px; border-radius: 15px; border: 2px dashed #8E44AD;">
        <button class="nav-btn school-btn" onclick="setCategory('sm_etiquette', event)">🗣️ 禮貌與對答</button>
        <button class="nav-btn school-btn" onclick="setCategory('sm_video', event)">👁️ 影片觀察</button>
        <button class="nav-btn school-btn" onclick="setCategory('sm_chi', event)">📘 中文認讀與看圖</button>
        <button class="nav-btn school-btn" onclick="setCategory('sm_eng', event)">📕 英文認讀與填充</button>
        <button class="nav-btn school-btn" onclick="setCategory('sm_math', event)">🧮 生活數學</button>
    </div>

    <!-- 新增：培僑專屬子選單 (預設隱藏) -->
    <div class="nav-grid school-sub-nav" id="school-nav-pui_kiu" style="display: none; background-color: #FDEDEC; padding: 15px; border-radius: 15px; border: 2px dashed #E74C3C;">
        <button class="nav-btn school-btn" onclick="setCategory('pk_speech', event)">🗣️ 個人傾談與演講</button>
        <button class="nav-btn school-btn" onclick="setCategory('pk_draw', event)">🎨 畫畫與表達</button>
        <button class="nav-btn school-btn" onclick="setCategory('pk_eq', event)">🤝 情境與高EQ解難</button>
        <button class="nav-btn school-btn" onclick="setCategory('pk_academic', event)">📚 學術快問快答</button>
    </div>

    <!-- 新增：福附小專屬子選單 (預設隱藏) -->
    <div class="nav-grid school-sub-nav" id="school-nav-fukien" style="display: none; background-color: #E8F8F5; padding: 15px; border-radius: 15px; border: 2px dashed #16A085;">
        <button class="nav-btn school-btn" onclick="setCategory('fj_eng_read', event)">📕 英文短篇朗讀</button>
        <button class="nav-btn school-btn" onclick="setCategory('fj_chi_match', event)">🔗 中文詞語配對</button>
        <button class="nav-btn school-btn" onclick="setCategory('fj_common', event)">💡 日常事物與常識</button>
        <button class="nav-btn school-btn" onclick="setCategory('fj_math', event)">🧮 20以內數學與積木</button>
        <button class="nav-btn school-btn" onclick="setCategory('fj_write_pic', event)">✍️ 寫字與看圖說話</button>
        <button class="nav-btn school-btn" onclick="setCategory('fj_logic_draw', event)">🎨 邏輯與指令畫畫</button>
    </div>

    <div class="card">
        <div class="progress-text" id="progress">剩餘: 0 題</div>
        <div class="instruction-text" id="instruction">請選擇面試項目</div>
        
        <!-- 新增：手動朗讀按鈕 (已更新點擊事件) -->
        <button id="read-btn" onclick="playCurrentAudio()" style="display: none; background-color: #3498DB; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 18px; margin-bottom: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">🔊 重播語音</button>        
        <div class="question-text" id="question">準備好開始了嗎？</div>
        <!-- 新增：用來看圖說話的圖片顯示器 (預設隱藏) -->
        <img id="question-image" src="" alt="情境圖" style="display: none; max-width: 90%; max-height: 380px; border-radius: 15px; margin: 0 auto 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); object-fit: cover;">
        <div class="answer-text" id="answer">解答區域</div>
        
        <div class="controls">
            <button class="action-btn" style="background-color: #95A5A6;" onclick="toggleAnswer()">👀 顯示答案/提示</button>
            <button class="action-btn" style="background-color: #2ECC71;" id="btn-good" onclick="markGood()">✅ 答得好</button>
            <button class="action-btn" style="background-color: #E74C3C;" id="btn-bad" onclick="markBad()">❌ 答得唔好</button>
        </div>
    </div>

    <script>
        // 預設的完整題庫
        const defaultDatabase = {

                { q: "認真 / 家 / 我 / 知道", i: "指令：請順序 1>2>3>4 讀出", a: "重點：留意眼神接觸和發音清晰度。" },

                { q: "跑步 / 游泳 / 跳繩 / 運動", i: "指令：請順序讀出，並做一個跑步的動作", a: "結合聆聽與肢體動作。" },
                { q: "衣服 / 褲子 / 鞋子 / 襪子", i: "指令：請由【右至左】讀出", a: "答案：襪子>鞋子>褲子>衣服。" },

                { q: "鉛筆 / 擦膠 / 尺子 / 書包", i: "指令：請由【右至左】讀出", a: "答案：書包>尺子>擦膠>鉛筆。" },

                { q: "bus / train / car / ship", i: "指令：Read in order", a: "交通工具詞彙。" },

                { q: "圖字配對：Stationery", i: "指令：請找出屬於 Stationery (文具) 的物品", a: "家長可拿筆盒讓小朋友找。" },
                { q: "big / small / tall / short", i: "指令：Read in order", a: "形容詞測試。" },

                { q: "boy / girl / man / woman", i: "指令：Read in order", a: "注意 woman 的發音。" },
                { q: "sun / moon / star / sky", i: "指令：Read the words in order", a: "自然詞彙認讀。" }

            grammar: [

                { q: "每日放學返到屋企，你第一時間會做啲咩？", i: "常規習慣", a: "答：洗手、換衫、將書包擺好。" },
                { q: "食飯嘅時候，如果有自己唔鍾意食嘅蔬菜，你會點做？", i: "飲食習慣", a: "答：都會試吓食少少，因為均衡飲食身體先會健康。" },
                { q: "為什麼我哋晚上要早啲休息，唔好太晚睡覺？", i: "健康常識", a: "答：早睡早起身體好，聽日上學先有精神。" },
                { q: "上體育課前，點解要穿運動鞋而唔係穿皮鞋？", i: "生活常識", a: "答：運動鞋可以保護腳，跑跳嗰陣唔容易跌倒受傷。" },
                { q: "見到枱上面有一杯好熱嘅滾水，你會點做？", i: "安全自理", a: "答：唔會用手摸，會等佢涼少少先飲，或者請大人幫手。" },
                { q: "如果你唔小心流鼻血，你第一時間會點做？", i: "急救常識", a: "答：坐直身子輕捏鼻翼，叫大人幫手，唔好抬高頭。" },
                { q: "平時多做運動對我哋身體有咩好處？", i: "健康認知", a: "答：可以令身體更強壯，少啲生病。" },
                { q: "指甲長咗要點做？可以自己用剪刀剪嗎？", i: "自理與安全", a: "答：要請爸爸媽媽幫手剪，小朋友用剪刀危險。" },
                { q: "食飯唔小心整濕咗衣服，你會點做？", i: "自理能力", a: "答：用抹布/紙巾抹乾淨，或者請大人拿乾淨衣服換。" },
                { q: "睇電視或者玩iPad嘅時候，要留意啲咩？", i: "護眼常識", a: "答：要保持距離，唔可以睇太長時間，要讓眼睛休息。" },
                { q: "水果買返嚟之後，可以直接食嗎？點解？", i: "飲食衛生", a: "答：唔可以，要先用清水洗乾淨先食。" },
                { q: "喺屋企突然聽到火警鐘響，你會點做？", i: "應變能力", a: "答：保持冷靜，跟爸爸媽媽行樓梯離開，絕對唔搭升降機。" },
                { q: "屋企突然停電變得好暗，你會點做？", i: "情緒與應變", a: "答：唔好亂走，叫爸爸媽媽，可以用手電筒照明。" },
                { q: "如果搭升降機（電梯）時，升降機突然停咗唔郁，你會點做？", i: "危機處理", a: "答：按緊急警報按鈕求救，冷靜等候救援，唔好夾硬開門。" },
                { q: "喺街上面遇到陌生人俾糖果或者玩具你，你會點做？", i: "自我保護", a: "答：有禮貌拒絕，唔拿陌生人嘅嘢，並立刻話俾爸爸媽媽聽。" },
                { q: "屋企電話響，接聽時對方問『你爸爸媽媽喺唔喺度？』你會點答？", i: "居家安全", a: "答：唔會話自己一個喺屋企，會請爸爸媽媽聽或者請對方留低電話。" },
                { q: "你想幫手拿剪刀俾老師/家人，應該點樣拎？", i: "工具安全", a: "答：手要握住剪刀刀頭（尖端），把手朝向對方傳遞。" },
                { q: "去泳池或者沙灘玩，發現腳抽筋或者游唔到水，你會點做？", i: "水上安全", a: "答：保持冷靜舉手大聲呼救，請救生員幫手。" },
                { q: "喺屋企可唔可以喺窗台或者陽台上面爬高爬低？點解？", i: "居家安全", a: "答：唔可以，因為會跌落去，非常危險。" },
                { q: "手濕嘅時候，可唔可以去插電線或者按開關？點解？", i: "用電安全", a: "答：唔可以，因為濕手容易觸電受傷。" },
                { q: "喺屋企見到枱面有藥丸/藥水，可以自己拿嚟食嗎？", i: "用藥安全", a: "答：唔可以，一定要爸爸媽媽或者醫生俾先可以食。" },
                { q: "去廚房幫手時，有咩地方要特別小心？", i: "環境安全", a: "答：小心刀具、明火同滾水，唔好亂摸熱煲。" },
                { q: "坐私家車或者的士嘅時候，上車後第一時間要點做？", i: "乘車安全", a: "答：要立刻扣好安全帶。" },
                { q: "搭地鐵等車嘅時候，要站在哪裡？頭手可以伸出屏蔽門嗎？", i: "乘車安全", a: "答：要站在黃線後面排隊，頭同手唔可以伸出去。" },
                { q: "喺路上聽到救護車或者消防車嘅警報聲，交通工具會點做？", i: "社區常識", a: "答：所有車輛都會讓路俾救護車/消防車先過。" },
                { q: "喺郊外或者公園見到蜜蜂或者野豬，你會點做？", i: "動物安全", a: "答：保持冷靜慢慢離開，唔好大叫或者用手揮打。" },
                { q: "去遊樂場玩鞦韆，有人玩緊嘅時候你可唔可以走近？", i: "遊樂安全", a: "答：唔可以，要保持距離，否則會被踢倒受傷。" },
                { q: "被蚊蟲叮咬感到好癢，可以一直用手抓嗎？", i: "個人衛生", a: "答：唔可以抓破皮，要同大人講搽藥膏。" },
                { q: "夏天去戶外玩，要準備啲咩防止曬傷同蚊叮？", i: "生活經驗", a: "答：搽防曬霜、噴蚊貼/蚊怕水、帶帽子飲多啲水。" },
                { q: "下雨天行路，見到地面有水坑或者井蓋，要點做？", i: "步列安全", a: "答：要繞過行，唔好踩落去以免滑倒或者跌入去。" },
                { q: "如果在商場見到火警鐘，可以隨便去按嗎？", i: "規則意識", a: "答：唔可以，只有真的發生火警時先可以按。" },
                { q: "如果不小心撞到同學，但同學冇受傷，你第一句應該講咩？", i: "禮貌態度", a: "答：對唔住，你有冇事呀？" },
                { q: "當別人幫你開門或者借嘢俾你，你應該講咩？", i: "禮貌態度", a: "答：多謝你 / 唔該你。" },
                { q: "同同學玩遊戲輸咗，你會點做？會唔會發脾氣？", i: "挫折忍受", a: "答：唔會發脾氣，恭喜贏咗嘅同學，下次再努力玩。" },
                { q: "小息時，見到有同學一個人坐喺度哭，你會點做？", i: "關懷同理心", a: "答：我會上前問佢『你點呀？』，或者陪佢去搵老師。" },
                { q: "想玩同學手上嘅玩具，你會點樣問佢？", i: "社交表達", a: "答：請問我可唔可以同你一齊玩呀？" },
                { q: "排隊買小食或者玩滑梯時，有同學插隊排喺你前面，你會點做？", i: "衝突處理", a: "答：禮貌提醒佢『請你去後面排隊啦』，或者請老師處理。" },
                { q: "如果有同學給取笑你的名字，你覺得不高興，你會點做？", i: "情緒表達", a: "答：平靜同佢講『我不鍾意你咁樣講』，如果佢繼續就話俾老師聽。" },
                { q: "當你覺得好憤怒、好想發脾氣嘅時候，你會點樣冷靜下來？", i: "情緒管理", a: "答：我會深呼吸、數十聲，或者搵個安靜嘅地方坐下。" },
                { q: "借咗同學嘅圖書或者鉛筆，用完之後應該點做？", i: "責任感", a: "答：要妥善保管，用完記得及時歸還並講多謝。" },
                { q: "同學在台上表演得好好或者拿到獎，你會點做？", i: "分享快樂", a: "答：我會拍手讚賞佢，同佢講『你好棒！』" },
                { q: "回答問題答錯咗，全班同學睇住你，你會點做？", i: "抗壓能力", a: "答：唔會害怕，聽老師講解正確答案，下次再嘗試。" },
                { q: "同朋友玩遊戲，大家想玩嘅嘢唔同（一個想畫畫，一個想砌積木），點辦？", i: "協商能力", a: "答：可以輪流玩，先畫畫再砌積木，或者玩剪刀石頭布決定。" },
                { q: "班上有身體不方便或者特別慢嘅同學，我哋應該點對待佢哋？", i: "包容接納", a: "答：要互相包容，主動關心同幫忙，唔可以欺負佢哋。" },
                { q: "屋企有客人嚟拜訪，你會點樣招待客人？", i: "家庭禮儀", a: "答：主動叫人『叔叔阿姨好』，請客人坐同倒水。" },
                { q: "喺電影院睇電影或者喺圖書館，點解唔可以大聲說話？", i: "顧及他人", a: "答：因為會影響其他人睇戲同睇書，要尊重公共場所規矩。" },
                { q: "同屋企人食飯時，長輩未坐落嚟，我哋可以先食嗎？", i: "傳統禮儀", a: "答：唔可以，要等長輩坐好、叫『爸爸媽媽食飯』先開始食。" },
                { q: "食飯時，如果不小心將食物掉喺枱上面或者地上，可以點做？", i: "生活習慣", a: "答：地上的食物唔可以再食，要拾起丟進垃圾桶。" },
                { q: "同學做手工唔記得帶膠水，而你有帶，你會點做？", i: "樂於助人", a: "答：我會樂意共享，借膠水俾同學用。" },
                { q: "喺學校走廊見到校長或者清潔阿姨，你會點做？", i: "日常禮貌", a: "答：我會主動打招呼『校長早晨 / 阿姨好』。" },
                { q: "你不小心將弟弟/妹妹嘅玩具弄壞咗，你會點做？", i: "勇於承擔", a: "答：我會同佢講對唔住，並試下幫佢修理或者同爸爸媽媽講。" },
                { q: "一年有哪四個季節？現在是什麼季節？", i: "自然常識", a: "答：春、夏、秋、冬。（按當時面試月份回答，如秋天）。" },
                { q: "植物要生長得健健康康，需要邊三樣最重要的東西？", i: "科學常識", a: "答：陽光、水同空氣（土壤）。" },
                { q: "太陽每日從哪邊升起，哪邊落下？", i: "自然常識", a: "答：東邊升起，西邊落下。" },
                { q: "刷牙或者洗手嘅時候，點樣可以幫手節約用水？", i: "環保意識", a: "答：抹肥皂或者刷牙時要把水龍頭關掉。" },
                { q: "你知道貓咪/狗狗同野生動物（如獅子）有咩分別嗎？", i: "動物常識", a: "答：貓狗係寵物/家養動物比較溫和，獅子係野生動物有危險。" },
                { q: "天上面嘅雲堆積得越來越厚、越來越黑，代表即將會點樣？", i: "天氣觀察", a: "答：代表即將要落大雨。" },
                { q: "下雨天出門，我哋需要帶啲咩用品？", i: "生活常識", a: "答：雨傘、雨衣或者穿雨鞋。" },
                { q: "在大太陽底下行路，後面會出現黑黑嘅影，嗰個係咩嚟？", i: "科學常識", a: "答：係影子，因為光線被我哋身體擋住咗。" },
                { q: "把冰塊從雪櫃拎出嚟放在桌上，過一陣子會變成咩？點解？", i: "科學現象", a: "答：會融化變成水，因為外面溫度比較熱。" },
                { q: "為什麼有些鳥類喺冬天會飛去南方？", i: "自然常識", a: "答：因為南方比較溫暖，容易搵到食物（候鳥遷徙）。" },
                { q: "如果全世界上突然有一整天完全沒有電，生活會變成點？", i: "發散思考", a: "答：電視開唔到、雪櫃唔冷、冷氣無得開，要用手電筒或者蠟燭。" },
                { q: "如果動物會說話，你最想同哪一種動物聊天？你想問佢咩問題？", i: "想像力", a: "無標準答案，如：想同鳥仔傾天，問佢飛喺天上面見到啲咩。" },
                { q: "為什麼我哋喺學校同社會上要遵守規則？如果沒有規則會點？", i: "邏輯推理", a: "答：規則可以保護大家安全；如果無規則會變得好混亂同危險。" },
                { q: "你喜歡下雨天定係晴天？點解？", i: "批判思考", a: "答：晴天（可以去公園玩）/ 下雨天（可以聽雨聲踩水花），需講出合理原因。" },
                { q: "如果你可以設計一間屬於你嘅夢想學校，學校裡面會有咩特別設施？", i: "創意思維", a: "鼓勵發揮創意，如：有超大滑梯連接樓層、有糖果圖書館等。" },
                { q: "為什麼守時（按時到達）對我哋咁重要？", i: "價值觀", a: "答：守時係尊重人嘅表現，唔會浪費別人時間。" },
                { q: "爸爸媽媽平時用嚟買嘢嘅錢，係從哪裡來的？", i: "金錢觀念", a: "答：係爸爸媽媽辛苦工作賺返嚟嘅，所以唔可以亂花錢。" },
                { q: "為什麼我哋要把垃圾分類回收，唔好隨便亂扔？", i: "環保價值", a: "答：可以減少垃圾，回收再利用，保護地球環境。" },
                { q: "如果哆啦A夢（叮噹）借神奇口袋嘅一件道具俾你，你想拿咩？點解？", i: "想像力", a: "鼓勵展現興趣或願望，如：隨意門，可以立刻去旅行睇世界。" },
                { q: "你覺得我哋為什麼每天都要去上學學習？", i: "學習態度", a: "答：可以學到好多新知識、認識朋友同學習同人相處。" },
                { q: "小組討論時，如果大家同時爭著說話，場面好吵，你會點做？", i: "團隊合作", a: "答：我會請大家安靜，建議大家舉手，一個一個輪流講。" },
                { q: "上課上到一半，你突然好想去洗手間，你會點做？", i: "課堂常規", a: "答：我會舉手向老師報告『老師，我想去洗手間』，獲得允許先去。" },

                { q: "為什麼在學校走廊同樓梯唔可以奔跑？", i: "安全規矩", a: "答：因為容易撞到同學跌倒受傷。" },
                { q: "在課室地上拾到一把鑰匙或者一個筆袋，你會點做？", i: "拾金不昧", a: "答：我會立刻交俾老師，請老師幫手搵失主。" },
                { q: "上體育課跑步時，你覺得好熱、好頭暈，你會點做？", i: "身體感知", a: "答：我會立刻停落嚟，向體育老師報告並去旁邊休息飲水。" },
                { q: "學校舉行禮堂集會時，台上有老師說話，台下的同學應該點做？", i: "專注與尊重", a: "答：要坐好、保持安靜、專心聽老師說話。" },

            listen: [

            // === 新增：培僑特訓題庫 ===

                { q: "請講述一次你今年如何慶祝中秋節。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：必須包含時間、地點、人物及感受。例如：『今年中秋節，我同爸爸媽媽去咗維多利亞公園。我哋玩咗好靚嘅兔仔燈籠，仲食咗甜甜嘅雙黃蓮蓉月餅，我覺得好開心。』" },
                { q: "請講述一次你和朋友一起玩耍的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：交代清晰的經過。例如：『上個星期六，我同好朋友小明去咗公園玩。我哋一齊玩捉迷藏，佢跑得好快，但我最後都捉到佢。我哋玩到流晒汗，非常快樂。』" },
                { q: "請講述一次你買玩具的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：交代選擇過程。例如：『我生日嗰日，媽媽帶我去玩具店。我見到好多玩具，最後我揀咗一架藍色嘅遙控車，因為佢行得好快。我親手將錢交俾收銀員，好有滿足感。』" },
                { q: "請講述一次你做運動的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：描述動作與感受。例如：『我最鍾意嘅運動係游水。昨日我同爸爸去咗游泳池，我戴住藍色嘅泳鏡喺水入面踢水。雖然覺得有少少攰，但身體變得好強壯。』" },
                { q: "請講述一次你主動幫助別人的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：展現同理心。例如：『有一次小息，我見到同學跌倒流血。我即刻走過去扶起佢，仲陪佢去教員室搵老師搽藥膏。老師讚我係個好幫手。』" },
                { q: "If you could be any animal, what would you be? Why? Please talk about the animal.", i: "【個人演講 - 英文】家長請計時 1 分鐘", a: "重點：必須有 'Because' 作解釋。例如：'If I could be an animal, I would be a bird. Because I want to fly high in the blue sky and see the beautiful world.' " },
                { q: "If you could keep any animal as a pet, what would it be? Why?", i: "【個人演講 - 英文】家長請計時 1 分鐘", a: "例如：'I would keep a dog as a pet. Because dogs are very friendly and smart. I can play fetch with him in the park every day.' " },
                { q: "Who is your favourite person in the world? Why?", i: "【個人演講 - 英文】家長請計時 1 分鐘", a: "例如：'My favourite person is my mother. Because she cooks yummy food for me and tells me interesting bedtime stories every night.' " },

                { q: "If you could be anything in the world, what would it be and why?", i: "【個人演講 - 英文】家長請計時 1 分鐘", a: "例如：'If I could be anything, I want to be a doctor. Because I want to help sick people and make them healthy and happy.' " },
                // === 新增 50 條培僑特訓題 (個人演講 Show & Tell) ===

                // 中文演講 - 生活經歷篇 (25題)
                { q: "請講述一次你慶祝生日的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：包含人物、活動、感受。例如：『今年六歲生日，爸爸媽媽買咗個朱古力蛋糕俾我。我哋請咗好多好朋友嚟屋企玩，我仲收到一份積木禮物，覺得非常難忘同開心。』" },
                { q: "請講述一次你幫忙做家務的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：具體步驟與父母的反饋。例如：『上個星期日，我見到媽媽好辛苦，於是主動幫手摺衫。我將T恤同褲摺得好整齊，媽媽讚我係一個好幫手，我好有滿足感。』" },
                { q: "請講述一次你去超級市場買東西的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：買了什麼、分工合作。例如：『噚日我同媽媽去超級市場，我幫手推購物車。我哋買咗蘋果、蔬菜同鮮奶。最後我仲幫手將啲嘢放入環保袋入面。』" },
                { q: "請講述一次你去圖書館借書的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：圖書館禮儀與書本內容。例如：『週末我同爸爸去圖書館，入面好安靜。我揀咗一本關於恐龍嘅故事書，然後去櫃檯俾借書證姐姐嘟。返到屋企我即刻睇，覺得好有趣。』" },
                { q: "請講述一次你生病的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：症狀、解決方法、感恩。例如：『有一次我發高燒，覺得好頭暈。媽媽帶我去睇醫生，醫生叔叔讚我勇敢無喊。我食咗兩日苦苦地嘅藥就康復啦，多謝媽媽照顧我。』" },
                { q: "請講述一次你和家人去旅行的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：地點、交通、特色經歷。例如：『上年我哋一家人搭飛機去咗日本。我見到好多白色嘅雪，仲同哥哥一齊堆雪人。我哋食咗好味嘅壽司，真係好想再去。』" },
                { q: "請講述一次你學習新事物（例如踩單車或游水）的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：遇到困難、堅持、結果。例如：『我最近學識咗踩兩輪單車。一開始我成日跌倒，覺得好灰心。但爸爸叫我望住前面、努力踩，最後我終於成功，覺得自己好叻。』" },
                { q: "請講述一次你弄壞東西或做錯事的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：誠實認錯與反省。例如：『有次我喺屋企玩波，唔小心打爛咗個玻璃杯。我即刻同媽媽講對唔住。媽媽無鬧我，仲教我下次要喺公園先好玩波。』" },
                { q: "請講述一次你去公園玩得最開心的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：具體設施與同伴。例如：『放學後，我同同學去公園玩。我哋玩咗好高嘅滑梯，仲一齊玩捉迷藏。我匿埋喺大樹後面，無人搵到我，笑到肚都痛。』" },
                { q: "請講述一次你去探訪爺爺嫲嫲（或其他親戚）的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：親情互動與活動。例如：『新年嗰陣，我哋去咗嫲嫲屋企拜年。我有禮貌咁祝嫲嫲身體健康，嫲嫲俾咗一封大利是我。我哋仲一齊食咗好好味嘅蘿蔔糕。』" },
                { q: "請講述一次你收到一份特別禮物的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：送禮人、是什麼禮物、感受。例如：『我生日收到一份神秘禮物，拆開原來係一架識發光嘅機械人，係爸爸送俾我嘅。我即刻錫咗爸爸一啖，我會好好珍惜佢。』" },
                { q: "請講述一次你去餐廳食飯最開心的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：食物味道與禮儀。例如：『星期日我哋去咗飲茶。我食咗蝦餃同燒賣，好美味。食完之後，我乖乖地坐喺座位畫畫等爸爸俾錢，侍應姐姐讚我有禮貌。』" },
                { q: "請講述一次你遇到困難自己解決的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：問題是什麼、如何解決。例如：『有一次我做勞作，發現無帶膠水。我無喊，自己行過去問隔籬同學借。同學借咗俾我，我亦都有講多謝。』" },
                { q: "請講述一次你參觀博物館或科學館的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：展品描述與學習收穫。例如：『學校帶我哋去科學館。我見到一個好大嘅鏡子迷宮，仲玩咗好多有趣嘅科學遊戲，學到好多新知識，大開眼界。』" },
                { q: "請講述一次你參加同學生日會的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：遊戲、社交、食物。例如：『我去咗小華嘅生日會。我送咗一份圖書禮物俾佢。我哋一齊玩搶櫈仔遊戲，仲食咗士多啤梨蛋糕，大家都玩到唔捨得走。』" },
                { q: "請講述一次你忘記帶東西回學校的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：發生什麼事、怎樣補救。例如：『有日我發現唔記得帶顏色筆。我好驚，但最後鼓起勇氣同老師講。老師借咗顏色筆俾我，我應承以後每晚會自己執好書包。』" },
                { q: "請講述一次你去沙灘玩耍的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：環境描述與活動。例如：『夏天我哋去咗沙灘。沙子熱辣辣嘅，我用黃色小水桶堆咗一個大沙堡。爸爸仲帶我去海邊踢水，海水涼浸浸好舒服。』" },
                { q: "請講述一次你在學校最難忘的一天。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：具體事件與情緒。例如：『最難忘係學校嘅陸運會。我參加咗六十米跑步，雖然跑唔到第一，但全班同學都大聲為我加油，我覺得好感動。』" },
                { q: "請講述一次你覺得很害怕的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：害怕的原因與如何克服。例如：『有晚屋企突然停電，四周好黑我好驚。但爸爸拖住我隻手，用電筒變出小狗手影俾我睇，我就唔再驚啦。』" },
                { q: "請講述一次你和兄弟姊妹（或表親）吵架後和好的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：衝突原因與和好方式。例如：『有次我同哥哥爭玩具吵架。後來我哋都冷靜落嚟，我主動同哥哥講對唔住，然後我哋決定輪流玩，最後又變返好朋友。』" },
                { q: "請講述一次你照顧小動物或植物的經過。", i: "【個人演講 - 中文】家長請計時 1 分鐘", a: "重點：照顧過程與責任感。例如：『我屋企種咗一盆小番茄。我每日放學都會幫佢淋水，仲會搬佢去曬太陽。見到佢開出黃色嘅花，我覺得好有成就感。』" },

                { q: "如果你是一位太空人，請畫出你在太空看到的畫面。\n\n(畫完後追問)：你在太空會吃什麼？睡覺時是怎樣的？", i: "【畫畫與表達】", a: "例如：『我看到美麗的地球和星星。我會吃牙膏一樣的太空食物，睡覺時要綁在睡袋裡，不然會飄走。』" },
                { q: "如果你是一位醫生，請畫出你的診所。\n\n(畫完後追問)：你會怎樣安慰害怕打針的小朋友？", i: "【畫畫與表達】", a: "例如：『我會給他一張可愛的貼紙，然後輕輕跟他說：像螞蟻咬一下而已，很快就不痛了。』" },
                { q: "如果你有魔法，請畫出你想變出來的東西。\n\n(畫完後追問)：為什麼想變這個出來？", i: "【畫畫與表達】", a: "例如：『我想變出一間用朱古力做的屋。因為我想邀請所有好朋友一起來吃甜甜的屋子。』" },
                { q: "如果你是一位巴士司機，請畫出你的巴士。\n\n(畫完後追問)：你的巴士有什麼特別的功能？", i: "【畫畫與表達】", a: "例如：『我的巴士有三層高，而且不用入油，是用太陽能推動的，非常環保。』" },
                { q: "請畫出一位勇敢的警察叔叔或姐姐。\n\n(畫完後追問)：他們平時的工作有多危險？你會對他們說什麼？", i: "【畫畫與表達】", a: "例如：『他們要抓拿著武器的壞人，很危險。我想對他們說：謝謝你們保護香港。』" },
                { q: "如果你是一位畫家，請畫出你最滿意的一幅畫。\n\n(畫完後追問)：你會把這幅畫掛在哪裡？", i: "【畫畫與表達】", a: "例如：『這是一幅風景畫，畫了高山和流水。我會把它掛在客廳，讓爸爸媽媽每天都看得到。』" },
                { q: "如果你懂動物語言，請畫出你在和哪種動物聊天。\n\n(畫完後追問)：你們在聊什麼秘密？", i: "【畫畫與表達】", a: "例如：『我在和小狗聊天。小狗告訴我牠把骨頭藏在花園的哪一個角落了。』" },

                // 第五類：玩具與神奇發明 (10題)
                { q: "請畫出你最喜歡的玩具。\n\n(畫完後追問)：這件玩具是誰送給你的？你通常多久玩一次？", i: "【畫畫與表達】", a: "例如：『這架遙控車是爺爺送給我的生日禮物。我每個週末都會拿去公園玩。』" },
                { q: "請畫出一本你覺得最好看的故事書。\n\n(畫完後追問)：書裡的主角是誰？他發生了什麼事？", i: "【畫畫與表達】", a: "例如：『主角是三隻小豬。他們建了不同的房子來躲避大灰狼，最後用磚頭建的房子最堅固。』" },
                { q: "請畫出一件神奇的發明 (例如任意門/時光機)。\n\n(畫完後追問)：這個發明有什麼功用？可以怎樣改善生活？", i: "【畫畫與表達】", a: "例如：『這是一部自動做功課機。但我覺得不能用它，因為自己做功課才會學到知識。』(展現正確價值觀)" },
                { q: "請畫出你每天都用的書包。\n\n(畫完後追問)：書包裡面裝了什麼？你覺得它重不重？", i: "【畫畫與表達】", a: "例如：『裡面有畫冊、水樽和筆盒。有時候覺得有點重，但我會自己背，不會要媽媽幫忙。』" },
                { q: "請畫出一個會唱歌的時鐘。\n\n(畫完後追問)：它什麼時候會唱歌？它會唱什麼歌？", i: "【畫畫與表達】", a: "例如：『它每天早上七點會唱歌叫我起床。它會唱一首很精神的早晨歌。』" },
                { q: "請畫出一座屬於你的夢想小屋。\n\n(畫完後追問)：屋子是用什麼做的？裡面有什麼特別的房間？", i: "【畫畫與表達】", a: "例如：『屋子是用大樹做的。裡面有一間充滿波波池的房間，每天都可以跳進去玩。』" },
                { q: "請畫出收到的一份神秘禮物。\n\n(畫完後追問)：裡面裝了什麼？打開的一刻你有什麼感覺？", i: "【畫畫與表達】", a: "例如：『裡面是一套圖書。打開那一刻我非常驚喜，立刻抱住媽媽說謝謝。』" },
                { q: "請畫出一把特別的雨傘。\n\n(畫完後追問)：雨傘上有什麼圖案？除了擋雨還有什麼功用？", i: "【畫畫與表達】", a: "例如：『雨傘上有恐龍圖案。除了擋大雨，出太陽的時候還可以拿來遮擋猛烈的陽光。』" },
                { q: "請畫出一個會聊天的機器人。\n\n(畫完後追問)：你會和它聊什麼？它會成為你的好朋友嗎？", i: "【畫畫與表達】", a: "例如：『我會和它聊學校發生的趣事。它會成為我的好朋友，因為它會安靜地聽我說話。』" },
                { q: "請畫出你的百寶袋。\n\n(畫完後追問)：裡面裝了哪三樣最寶貴的東西？為什麼？", i: "【畫畫與表達】", a: "例如：『裡面有全家幅相片、我最愛的小熊公仔和一本書。因為這些都是陪伴我成長的最重要的東西。』" }
            ],
            pk_eq: [
                { q: "如果你有一件好想買嘅玩具，但爸爸媽媽話唔買俾你，你會點做？", i: "【高EQ情境題】", a: "【高分答案】：我會先諗下屋企有冇類似嘅玩具。如果真係好想要，我會同爸爸媽媽講吓點解我想要，如果佢哋都話唔買，我唔會發脾氣，會儲起零用錢遲啲先買。" },
                { q: "大家一齊玩「音樂椅搶櫈仔」，音樂停嘅時候，你同另一個同學同時坐落同一張櫈度，你會點做？", i: "【高EQ情境題】禮讓與風度", a: "【高分答案】：我會企起身讓俾佢坐，然後笑住同佢講：『我讓你坐呀！』，因為玩遊戲最重要係開心，唔係一定要贏。" },
                { q: "玩集體遊戲「狐狸先生幾多點」嗰陣，你不小心被同學撞跌咗，你會點做？", i: "【高EQ情境題】情緒控制", a: "【高分答案】：我會自己企起身，拍下衫上面嘅灰塵。如果同學同我講對唔住，我會話『唔緊要』；如果好痛，我先會舉手話俾老師聽。" },
                { q: "畫畫嘅時候，你不小心將水彩倒瀉落同學幅畫度，你會點做？", i: "【高EQ情境題】承擔責任", a: "【高分答案】：我會立刻同同學講『對唔住』，然後馬上拿紙巾幫佢抹乾淨，如果幅畫真係爛咗，我會幫佢一齊重新畫過一幅。" },
                { q: "有同學想搶你手上嘅玩具，你會點樣同佢講？", i: "【高EQ情境題】解決衝突", a: "【高分答案】：我會揸緊玩具，平靜咁同佢講：『這是我正在玩的，請你唔好搶。如果你想玩，可以問我借，我玩完可以借俾你。』" },
                // === 新增 50 條培僑特訓題 (高EQ情境解難) ===

                // 第一類：處理同儕衝突 (10題)
                { q: "你砌咗好耐、好靚嘅 Lego，突然被同學不小心撞跌散曬，你會點做？", i: "【高EQ情境題】處理衝突", a: "【高分答案】：我會忍住唔發脾氣，因為知道佢唔係特登嘅。我會同佢講『唔緊要』，然後邀請佢：『不如我哋一齊重新砌過啦！』" },
                { q: "上緊美術課，有同學笑你畫幅畫好肉酸（好難睇），你會點樣回應？", i: "【高EQ情境題】自信與應對嘲笑", a: "【高分答案】：我唔會喊，我會平靜咁同佢講：『每個人畫嘅嘢都唔同，我覺得我自己畫得好有心機，我好鍾意我幅畫。』" },
                { q: "排隊玩滑梯嘅時候，有同學突然『打尖』排喺你前面，你會點做？", i: "【高EQ情境題】維護規則與溝通", a: "【高分答案】：我會拍拍佢膊頭，有禮貌咁講：『同學，請你排隊，你要排喺我後面。』如果佢唔聽，我會舉手請老師幫手。" },
                { q: "圖書館入面得返一本恐龍書，你同好朋友同時跑過去想攞，你會點做？", i: "【高EQ情境題】分享與協商", a: "【高分答案】：我唔會同佢搶，我會提議：『不如我哋坐埋一齊睇啦！』或者『你睇先，你睇完轉頭借俾我睇。』" },
                { q: "你想加入幾個同學一齊玩捉迷藏，但佢哋話『唔俾你玩』，你會點做？", i: "【高EQ情境題】被排擠的處理", a: "【高分答案】：我唔會發脾氣，我會問佢哋『點解呀？我可以做負責捉人嗰個喎。』如果佢哋真係唔想，我就去搵其他好朋友玩另一樣遊戲。" },
                { q: "你好鍾意一件學校嘅玩具，但係有另一個同學霸住玩咗好耐都唔肯放手，你會點做？", i: "【高EQ情境題】耐心與溝通", a: "【高分答案】：我會行過去有禮貌咁問佢：『請問你仲要玩幾耐呀？可唔可以輪流玩？』如果佢唔肯，我會先去玩其他玩具，或者請老師幫手安排時間。" },
                { q: "同學做錯事，但係佢同老師講話係你做嘅（冤枉你），你會點做？", i: "【高EQ情境題】面對委屈", a: "【高分答案】：我唔會同同學打架，我會冷靜咁同老師講出真相：『老師，唔係我做嘅，我頭先一直喺度睇書。』我相信老師會查清楚。" },
                { q: "你同朋友玩比賽遊戲，你贏咗，但係好朋友輸咗喺度喊，你會點做？", i: "【高EQ情境題】勝不驕與同理心", a: "【高分答案】：我唔會笑佢，我會走過去拍拍佢背脊安慰佢：『唔好喊啦，你頭先都玩得好叻，不如我哋再玩過，下次可能到你贏呢！』" },
                { q: "同學同你改咗個你唔鍾意嘅花名（花名），一直叫你，你會點做？", i: "【高EQ情境題】設立界線", a: "【高分答案】：我會好認真、平靜咁望住佢講：『我唔鍾意你咁樣叫我，請你叫返我嘅真名。』如果佢繼續叫，我會話俾老師聽。" },
                { q: "你不小心整斷咗同學最鍾意嘅一枝鉛筆，你會點做？", i: "【高EQ情境題】承擔過失", a: "【高分答案】：我會立刻同佢講對唔住，解釋我唔係特登嘅。然後我會將我自己嘅鉛筆借俾佢用，或者應承聽日買返一枝新嘅賠俾佢。" },

                // 第二類：同理心與助人 (10題)
                { q: "小息嘅時候，你見到有一個新同學自己一個坐喺角落頭無人陪佢玩，你會點做？", i: "【高EQ情境題】主動關懷", a: "【高分答案】：我會主動行過去同佢打招呼：『你好，我叫 ___。不如你同我哋一齊去玩捉迷藏啦！』" },
                { q: "媽媽今日病咗，喺睡房休息緊，你會點樣做一個乖孩子？", i: "【高EQ情境題】家庭同理心", a: "【高分答案】：我會保持安靜唔好吵醒媽媽，自己乖乖地睇書或者玩玩具。我仲會幫媽媽倒一杯溫水放喺床頭。" },
                { q: "放學落大雨，你有帶雨傘，但見到好朋友無帶雨傘企喺操場，你會點做？", i: "【高EQ情境題】樂於助人", a: "【高分答案】：我會行過去同佢講：『我哋一齊遮把遮走到校門口啦！』我會將把傘遮埋佢，就算自己有少少濕都唔緊要。" },
                { q: "喺公園見到有一個細過你嘅BB行路跌倒喊緊，但佢媽媽行開咗幾步未發現，你會點做？", i: "【高EQ情境題】觀察與協助", a: "【高分答案】：我會行過去問BB『你有冇事呀？』，然後大聲叫佢媽媽過來，但我唔會隨便抱起個BB，驚整傷佢。" },
                { q: "午膳時間，坐你隔籬嘅同學發現自己唔記得帶飯盒，肚子餓得咕咕叫，你會點做？", i: "【高EQ情境題】分享精神", a: "【高分答案】：我會主動問佢：『我今日有好多餸，不如我分少少雞翼同飯俾你食啦？』，然後舉手話俾老師聽同學無帶飯。" },
                { q: "學校去旅行，有個同學話佢好驚黑，唔敢行入隧道，你會點做？", i: "【高EQ情境題】鼓勵與陪伴", a: "【高分答案】：我會拖住佢隻手，鼓勵佢：『唔洗驚，隧道入面無怪獸㗎，我陪住你一齊行，好快就出返嚟。』" },
                { q: "你行過學校走廊，見到地下有張抹完鼻涕嘅紙巾，但唔係你丟嘅，你會點做？", i: "【高EQ情境題】公民意識", a: "【高分答案】：為咗保持學校清潔同防止同學滑倒，我會去廁所拿張紙巾包住佢，執起掉落垃圾桶，然後去洗手。" },
                { q: "老師搬住好多疊高高嘅簿行入課室，睇唔到前面條路，你會點做？", i: "【高EQ情境題】尊師重道", a: "【高分答案】：我會即刻跑過去幫老師開門，然後問老師：『老師，簿好重呀，不如我幫你搬少少啦。』" },
                { q: "如果班上面有一個同學行路要撐拐杖，平時行得好慢，你會點樣對待佢？", i: "【高EQ情境題】包容差異", a: "【高分答案】：我會對佢好有耐性，唔會催佢。如果佢需要幫手拿書包或者開門，我會主動幫佢。" },
                { q: "你搭地鐵見到有個盲人叔叔想搵位坐，但車廂已經滿座，你會點做？", i: "【高EQ情境題】讓座與觀察", a: "【高分答案】：我會企起身，走過去輕輕同叔叔講：『叔叔，我呢度有個位，我扶你過來坐呀。』" },

                // 第三類：面對挫折與情緒控制 (10題)
                { q: "學校陸運會跑步比賽，你跑最後一名輸咗，覺得好傷心，你會點做？", i: "【高EQ情境題】逆境商數 (AQ)", a: "【高分答案】：我會同自己講『我已經盡咗力』。我唔會發脾氣，我會恭喜贏咗嘅同學，然後下次再努力練習跑快啲。" },
                { q: "你想學綁鞋帶，但試咗好多次都綁唔到一個蝴蝶結，覺得好忟憎，你會點做？", i: "【高EQ情境題】挫折忍受力", a: "【高分答案】：我會深呼吸令自己冷靜下來，唔會掉走對鞋。我會請爸爸媽媽慢慢再教我一次，我知道只要練習多啲就一定會識。" },
                { q: "老師選班長，你一直好想做，但最後老師選咗另一個同學，你會點做？", i: "【高EQ情境題】面對落選", a: "【高分答案】：雖然有啲失望，但我唔會喊。我會拍手恭喜嗰位同學，並繼續喺班上做個好學生，幫老師手。" },
                { q: "你買咗一杯好鍾意食嘅雪糕，但啱啱行出門口就不小心跌咗落地下，你會點做？", i: "【高EQ情境題】情緒控制與解難", a: "【高分答案】：跌落地嘅嘢唔可以再食，我會去問店員拿紙巾將地下抹乾淨扔落垃圾桶。雖然無得食，但我唔會大喊大叫。" },
                { q: "原本約好今日去主題樂園玩，但突然打十號風球去唔到，你覺得好失望，你會點做？", i: "【高EQ情境題】接受突發變故", a: "【高分答案】：我知道打風出街好危險，所以我會留喺屋企。為咗令自己開心啲，我會提議同爸爸媽媽喺屋企玩桌上遊戲或者睇電影。" },
                { q: "你覺得好嬲好嬲，好想發脾氣大叫嘅時候，有咩好方法可以令自己冷靜？", i: "【高EQ情境題】自我情緒管理", a: "【高分答案】：我會閉上眼睛深呼吸，喺心裡面由 1 數到 10；或者我會搵個安靜嘅地方坐低飲杯水，等自己無咁嬲先同人講嘢。" },
                { q: "你喺台上表演唱歌，突然唔記得咗歌詞，台下全部人望住你，你會點做？", i: "【高EQ情境題】臨場應變與抗壓", a: "【高分答案】：我會保持鎮定，保持微笑，跟住音樂嘅節奏拍手或者哼歌，等諗返起歌詞就繼續唱落去，唔會喺台上喊。" },
                { q: "老師誤會咗你，以為你傾偈所以罰你企，但其實你無講嘢，你會點做？", i: "【高EQ情境題】處理委屈", a: "【高分答案】：我會先聽老師話企起身，等老師講完之後，我有禮貌地舉手同老師解釋：『老師，對唔住，但我頭先其實無傾偈。』" },
                { q: "你用咗好多心機摺咗一架紙飛機，但被風吹咗落坑渠執唔返，你會點做？", i: "【高EQ情境題】釋懷與放下", a: "【高分答案】：我會覺得可惜，但我知道危險唔可以伸手入坑渠執。我會返屋企拿張新紙，憑記憶摺一架更靚、飛得更遠嘅紙飛機。" },
                { q: "測驗派卷，你發現自己唔合格，驚返屋企俾媽媽鬧，你會點做？", i: "【高EQ情境題】面對失敗與誠實", a: "【高分答案】：我會誠實俾卷媽媽睇，同佢講對唔住今次考得唔好。我會請媽媽教我做錯嘅題目，保證下次一定會俾心機溫習。" },

                // 第四類：誠實、責任與解難 (10題)
                { q: "你喺屋企玩波，不小心打爛咗媽媽最心愛嘅花瓶，當時無人睇到，你會點做？", i: "【高EQ情境題】誠實與承擔", a: "【高分答案】：我會企喺原地唔郁驚踩到玻璃，大聲叫媽媽入來。我會主動承認錯誤，講對唔住，並承諾以後唔會喺屋企扔波。" },
                { q: "返到學校準備交功課，先發現自己漏咗份功課喺屋企張書枱度，你會點做？", i: "【高EQ情境題】解決問題與責任", a: "【高分答案】：我會主動行出去同老師講：『老師對唔住，我做完功課但漏咗喺屋企。』我會應承老師聽日一定帶返嚟補交。" },
                { q: "你喺公園地下執到一張 50 蚊紙幣，你會點做？可以買糖食嗎？", i: "【高EQ情境題】拾金不昧", a: "【高分答案】：唔可以買糖，因為啲錢唔係我嘅。我會交俾附近嘅警察叔叔或者公園管理員，等佢哋幫手搵返跌錢嘅人。" },
                { q: "你應承咗爸爸食完飯會幫手收碗筷，但電視啱啱播緊你最鍾意嘅卡通片，你會點做？", i: "【高EQ情境題】責任感與承諾", a: "【高分答案】：我會遵守承諾，先去幫爸爸收好碗筷。因為答應咗人嘅事一定要做，卡通片可以請爸爸幫我錄影遲啲先睇。" },
                { q: "你喺圖書館借咗本故事書，但唔小心將其中一頁撕爛咗，你會點做？", i: "【高EQ情境題】勇於認錯", a: "【高分答案】：我唔會當無事發生還返去。我會同圖書館管理員叔叔講對唔住，承認自己唔小心撕爛咗，並問下需唔需要賠錢。" },
                { q: "你不小心倒瀉果汁落梳化度，你會即刻點做？", i: "【高EQ情境題】即時解難能力", a: "【高分答案】：我會立刻跑去廚房拿乾淨嘅抹布或者廚房紙，將梳化上面嘅果汁吸乾，然後同媽媽講對唔住，請佢幫手徹底清潔。" },
                { q: "玩有獎問答遊戲時，你唔小心見到隔籬同學嘅答案，你會唔會抄佢？點解？", i: "【高EQ情境題】誠信", a: "【高分答案】：我絕對唔會抄，我會用自己個腦去諗。因為作弊係唔誠實嘅行為，就算抄到贏咗都唔會覺得開心。" },
                { q: "好朋友打破咗學校塊玻璃，佢叫你幫佢保守秘密唔好同老師講，你會點做？", i: "【高EQ情境題】是非判斷", a: "【高分答案】：我會勸佢自己同老師自首認錯；如果佢唔肯，我都會話俾老師聽。因為打破玻璃好危險，隱瞞錯誤唔係真正嘅好朋友。" },
                { q: "媽媽俾咗一包糖你，叫你同細佬分享，但你太鍾意食，唔覺意自己食晒，你會點做？", i: "【高EQ情境題】誠實面對誘惑", a: "【高分答案】：我會誠實同媽媽講我忍唔住食晒，向細佬道歉。我會主動用自己嘅零用錢買返一包新嘅糖賠俾細佬。" },
                { q: "你經過教員室門口，見到地下跌咗一張好靚嘅貼紙，你可唔可以攞走？", i: "【高EQ情境題】不貪小便宜", a: "【高分答案】：唔可以，因為唔係我嘅物品。我會執起張貼紙交俾教員室裡面嘅老師，等物主可以搵得返。" },

                // 第五類：禮貌、禮儀與安全意識 (10題)
                { q: "你生日嗰陣，嫲嫲送咗一件你完全唔鍾意嘅冷衫俾你，你會點樣反應？", i: "【高EQ情境題】感恩與禮儀", a: "【高分答案】：我唔會表現出唔鍾意或者丟埋一邊。我會雙手接過禮物，微笑同嫲嫲講：『多謝嫲嫲送禮物俾我！』因為嫲嫲係一番心意。" },
                { q: "爸爸媽媽同客人傾緊偈，但你有一件好急嘅事想問媽媽，你會點做？", i: "【高EQ情境題】社交禮儀", a: "【高分答案】：我唔會大叫打斷大人講嘢。我會安靜咁行到媽媽身邊，輕輕拉下佢衫袖，等媽媽望住我嘅時候，我先細細聲同佢講。" },
                { q: "去超級市場買嘢，你掛住睇玩具，轉頭發現唔見咗爸爸媽媽，你會點做？", i: "【高EQ情境題】危機與安全", a: "【高分答案】：我會企喺原地唔亂走，絕對唔會自己跑出超級市場或者跟陌生人走。我會搵著制服嘅收銀員姐姐幫手廣播搵媽媽。" },
                { q: "喺公園玩嗰陣，有個唔認識嘅叔叔話帶你去買雪糕，叫你跟佢走，你會點做？", i: "【高EQ情境題】安全意識", a: "【高分答案】：我會大聲講『我唔要，我唔識你！』然後立刻跑返去爸爸媽媽身邊，將件事話俾佢哋聽。" },
                { q: "你自己一個喺屋企客廳睇電視，突然門鐘響，你會點做？", i: "【高EQ情境題】居家安全", a: "【高分答案】：我絕對唔會自己去開門！我會大聲叫喺房或者廁所嘅大人出去開門；如果真係得我一個喺屋企，我唔會出聲，當聽唔到。" },
                { q: "一家人去餐廳食飯，但啲食物等咗好耐都未嚟，你覺得好肚餓，你會點做？", i: "【高EQ情境題】耐心與公眾場合禮儀", a: "【高分答案】：我會耐心等待，唔會喺餐廳大吵大鬧或者敲打碗筷。我會問媽媽可唔可以請侍應哥哥幫手催一催廚房。" },
                { q: "食飯嘅時候，你已經食飽咗想離開飯枱去玩，你應該點樣做？", i: "【高EQ情境題】餐桌禮儀", a: "【高分答案】：我會將自己嘅碗筷收拾好，然後同枱面上嘅長輩講：『爸爸媽媽、爺爺嫲嫲我食飽啦，大家慢慢食。』得到同意先離開座位。" },
                { q: "推門入商場嘅時候，前面個叔叔幫你推住度好重嘅玻璃門等你過，你應該點做？", i: "【高EQ情境題】日常禮貌", a: "【高分答案】：我會加快腳步走過去，然後望住叔叔微笑，大聲同佢講：『唔該叔叔！』" },
                { q: "你不小心用屋企電話打錯咗俾一個唔認識嘅人，對方聽咗，你會點做？", i: "【高EQ情境題】應對錯誤", a: "【高分答案】：我唔會即刻收線咁冇禮貌。我會同對方講：『對唔住，我打錯電話啦，打擾晒。』然後先掛斷電話。" },
                { q: "朝早返到學校門口，你見到校長企喺度迎接同學，你應該點做？", i: "【高EQ情境題】尊敬師長", a: "【高分答案】：我會停低腳步，立正望住校長，大聲且有禮貌地講：『校長早晨！』然後先慢慢行入學校。" }

        // 嘗試從瀏覽器提取進度，如果沒有，就複製 defaultDatabase
        let database;
        const savedData = localStorage.getItem('interviewProgress');
        if (savedData) {
            database = JSON.parse(savedData);
            
            // 【防撞車機制】檢查舊紀錄是否有最新的題庫分類，如果沒有則自動重置
            let needReset = false;
            if (!database['sm_video'] || !database['pk_speech'] || !database['fj_eng_read']) needReset = true;
            if (database['story'] && database['story'].length > 0 && !database['story'][0].questions) needReset = true;
            
            if (needReset) {
                console.log("偵測到舊版題庫結構，系統自動重置更新...");
                database = JSON.parse(JSON.stringify(defaultDatabase));
                localStorage.setItem('interviewProgress', JSON.stringify(database));
            }
        } else {
            // 深拷貝一份預設題庫
            database = JSON.parse(JSON.stringify(defaultDatabase));
        }

        let currentCategory = 'chi';
        let currentIndex = -1;
        let currentStoryQuestionIndex = 0; // 記錄故事題答到第幾題
        let storyUserAnswers = [];         // 記錄小朋友的選擇

        // 保存進度到 localStorage
        function saveProgress() {
            localStorage.setItem('interviewProgress', JSON.stringify(database));
            updateProgressText();
        }

        // 重置進度功能
        function resetProgress() {
            if (confirm("確定要重置所有進度嗎？所有『答得好』的題目將會再次出現！")) {
                localStorage.removeItem('interviewProgress');
                database = JSON.parse(JSON.stringify(defaultDatabase));
                currentIndex = -1;
                nextQuestion();
                alert("進度已成功重置！");
            }
        }

        // 更新剩餘題數顯示
        function updateProgressText() {
            const count = database[currentCategory].length;
            document.getElementById('progress').innerText = `剩餘: ${count} 題`;
        }

        function showSchoolNav(event, schoolId) {
            // 取消主選單其他按鈕的反白，高亮當前按鈕
            document.querySelectorAll('#main-nav .nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 先隱藏所有學校子選單
            document.querySelectorAll('.school-sub-nav').forEach(nav => nav.style.display = 'none');
            
            // 顯示當前點擊的學校子選單
            const subNav = document.getElementById('school-nav-' + schoolId);
            if(subNav) {
                subNav.style.display = 'flex';
                // 自動點擊子選單的第一個按鈕進入題庫
                subNav.querySelector('.school-btn').click();
            }
        }

        function setCategory(cat, event) {
            currentCategory = cat;
            
            // 判斷是否為學校專屬分類 (sm_、pk_ 或 fj_)
            const isSchoolCat = cat.startsWith('sm_') || cat.startsWith('pk_') || cat.startsWith('fj_');
            
            if (!isSchoolCat) {
                // 點擊一般主選單：隱藏所有學校子選單
                document.querySelectorAll('.school-sub-nav').forEach(nav => nav.style.display = 'none');
                document.querySelectorAll('#main-nav .nav-btn').forEach(btn => btn.classList.remove('active'));
                if (event && event.target) {
                    event.target.classList.add('active');
                }
            } else {
                // 點擊子選單：只更新該子選單內的按鈕高亮狀態
                const currentSubNav = event.target.parentElement;
                currentSubNav.querySelectorAll('.school-btn').forEach(btn => btn.classList.remove('active'));
                if (event && event.target) {
                    event.target.classList.add('active');
                }
            }
            
            currentIndex = -1; 
            nextQuestion();
        }

        function markGood() {
            const arr = database[currentCategory];
            if (arr.length > 0 && currentIndex !== -1) {
                // 將題目從當前題庫刪除
                arr.splice(currentIndex, 1);
                // 儲存進度
                saveProgress();
            }
            
            currentIndex = -1;
            nextQuestion();
        }

function markBad() {
            nextQuestion();
        }

        // ================= 核心題庫與故事控制 =================
        function nextQuestion() {
            const arr = database[currentCategory];
            updateProgressText();
            
            const btnGood = document.getElementById('btn-good');
            const btnBad = document.getElementById('btn-bad');
            const readBtn = document.getElementById('read-btn');
            // 獲取「顯示答案」的按鈕 (它沒有 id，所以用 css selector)
            const btnShowAns = document.querySelector('.action-btn[onclick="toggleAnswer()"]');
            
            window.speechSynthesis.cancel(); // 切換題目時停止說話

            if (arr.length === 0) {
                document.getElementById('instruction').innerText = "完成！";
                document.getElementById('question').innerHTML = "🎉 恭喜！這個類別的題目已經全部答對！<br><span style='font-size: 20px; color: #7F8C8D;'>可以選擇其他類別，或按上方重置按鈕重做。</span>";
                document.getElementById('answer').style.display = 'none';
                
                btnGood.style.display = 'none';
                btnBad.style.display = 'none';
                btnShowAns.style.display = 'none';
                readBtn.style.display = 'none';
                currentIndex = -1;
                return;
            }

            // 如果是故事或影片觀察模式，進入專屬渲染邏輯
            if (currentCategory === 'story' || currentCategory === 'sm_video') {
                startStoryMode(arr);
                return;
            }

            // ================= 一般模式 (非故事) =================
            btnGood.style.display = 'inline-block';
            btnBad.style.display = 'inline-block';
            btnShowAns.style.display = 'inline-block';
            readBtn.style.display = 'none'; // 隱藏朗讀按鈕

            let newIndex = currentIndex;
            if (arr.length > 1) {
                while (newIndex === currentIndex) {
                    newIndex = Math.floor(Math.random() * arr.length);
                }
            } else {
                newIndex = 0;
            }
            currentIndex = newIndex;
            
            const item = arr[currentIndex];
            document.getElementById('instruction').innerText = item.i;
            document.getElementById('question').innerHTML = item.q.replace(/\n/g, '<br>');
            
            // 【新增】圖片顯示邏輯
            const imgEl = document.getElementById('question-image');
            if (item.img) {
                imgEl.src = item.img;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
                imgEl.src = '';
            }
            document.getElementById('answer').innerHTML = item.a.replace(/\n/g, '<br>');
            document.getElementById('answer').style.display = 'none';
        }

        // ================= 故事模式專屬邏輯 =================
        function startStoryMode(arr) {
            document.getElementById('instruction').innerText = "聆聽故事並作答 (只顯示問題與選項)";
            document.getElementById('answer').style.display = 'none';
            document.getElementById('question-image').style.display = 'none'; // 【新增】確保故事模式不會顯示上一題的圖片
            
            // 隱藏一般模式的按鈕
            document.getElementById('btn-good').style.display = 'none';
            document.getElementById('btn-bad').style.display = 'none';
            document.querySelector('.action-btn[onclick="toggleAnswer()"]').style.display = 'none';
            document.getElementById('read-btn').style.display = 'inline-block'; // 顯示朗讀按鈕

            // 隨機抽一條故事
            let newIndex = currentIndex;
            if (arr.length > 1) {
                while (newIndex === currentIndex) {
                    newIndex = Math.floor(Math.random() * arr.length);
                }
            } else {
                newIndex = 0;
            }
            currentIndex = newIndex;
            
            // 重置作答進度
            currentStoryQuestionIndex = 0;
            storyUserAnswers = [];
            
            renderStoryQuestion();
        }

        function renderStoryQuestion() {
            // 動態讀取當前類別的故事數據
            const storyData = database[currentCategory][currentIndex];
            const qData = storyData.questions[currentStoryQuestionIndex];
            
            // 畫面只顯示當前題目及按鈕選項
            let html = `<div>問題 ${currentStoryQuestionIndex + 1}：${qData.q}</div>`;
            html += `<div style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px; align-items: center;">`;
            
            qData.options.forEach((opt, idx) => {
                html += `<button onclick="submitStoryAnswer(${idx})" style="padding: 15px 25px; font-size: 24px; border-radius: 12px; border: 2px solid var(--primary); background: white; color: var(--text); cursor: pointer; min-width: 300px; text-align: left; transition: 0.2s;">${opt}</button>`;
            });
            html += `</div>`;
            
            document.getElementById('question').innerHTML = html;
            
            // 準備朗讀內容：若是第一題則朗讀「故事+問題」，否則只讀「問題」(不讀選項)
            let textToRead = "";
            if (currentStoryQuestionIndex === 0) {
                textToRead = storyData.storyText + "。 問題一： " + qData.q;
            } else {
                textToRead = "問題二： " + qData.q;
            }
            
            speakText(textToRead);
        }

        function submitStoryAnswer(selectedIdx) {
            window.speechSynthesis.cancel(); // 按下選項立即停止語音
            storyUserAnswers.push(selectedIdx);
            
            // 動態讀取當前類別的故事數據
            const storyData = database[currentCategory][currentIndex];
            currentStoryQuestionIndex++;
            
            if (currentStoryQuestionIndex < storyData.questions.length) {
                // 進入下一題
                renderStoryQuestion();
            } else {
                // 題目完結，顯示結果
                finishStory();
            }
        }

        function finishStory() {
            // 動態讀取當前類別的故事數據
            const storyData = database[currentCategory][currentIndex];
            let allCorrect = true;
            let resultHtml = `<div style="font-size: 32px; color: var(--primary); margin-bottom: 20px;">答題結果</div>`;
            
            storyData.questions.forEach((q, idx) => {
                const userAns = storyUserAnswers[idx];
                const isCorrect = (userAns === q.correct);
                if (!isCorrect) allCorrect = false;
                
                resultHtml += `<div style="text-align: left; margin-bottom: 15px; font-size: 22px; background: #f9f9f9; padding: 15px; border-radius: 10px;">`;
                resultHtml += `<b>${idx + 1}. ${q.q}</b><br>`;
                resultHtml += `你的選擇：${q.options[userAns]} ${isCorrect ? '✅' : '❌'}<br>`;
                if (!isCorrect) {
                    resultHtml += `<span style="color: #E74C3C;">正確答案：${q.options[q.correct]}</span>`;
                }
                resultHtml += `</div>`;
            });
            
            // 判斷是否全部答對
            if (allCorrect) {
                resultHtml += `<div style="color: #2ECC71; font-size: 26px; font-weight: bold; margin-top: 20px;">🎉 全中！這篇故事已完成並剔除。</div>`;
                document.getElementById('question').innerHTML = resultHtml;
                
                // 停頓 4 秒讓小朋友看結果，然後自動刪除題目並抽下一題
                setTimeout(() => {
                    // 動態刪除當前類別的題目
                    database[currentCategory].splice(currentIndex, 1);
                    saveProgress();
                    currentIndex = -1;
                    nextQuestion();
                }, 4000);
            } else {
                resultHtml += `<div style="color: #E74C3C; font-size: 26px; font-weight: bold; margin-top: 20px;">繼續努力！這篇故事將會保留。</div>`;
                resultHtml += `<button onclick="nextQuestion()" class="action-btn" style="background-color: var(--primary); margin-top: 20px;">➡️ 下一篇故事</button>`;
                document.getElementById('question').innerHTML = resultHtml;
            }
            
            document.getElementById('read-btn').style.display = 'none'; // 顯示結果時隱藏朗讀按鈕
        }

        // ================= 語音朗讀模組 =================
        function playCurrentAudio() {
            if (currentCategory === 'story' || currentCategory === 'sm_video') {
                // 手動點擊時，重新朗讀當前題目的設定
                const storyData = database[currentCategory][currentIndex];
                const qData = storyData.questions[currentStoryQuestionIndex];
                if (currentStoryQuestionIndex === 0) {
                    speakText(storyData.storyText + "。 問題一： " + qData.q);
                } else {
                    speakText("問題二： " + qData.q);
                }
            } else {
                speakText();
            }
        }

        function speakText(customText = null) {
            window.speechSynthesis.cancel();
            
            let textToRead = customText;
            if (!textToRead) {
                textToRead = document.getElementById('question').innerText;
            }
            
            const utterance = new SpeechSynthesisUtterance(textToRead);
            const engCount = (textToRead.match(/[a-zA-Z]/g) || []).length;
            const chiCount = (textToRead.match(/[\u4e00-\u9fa5]/g) || []).length;
            
            if (engCount > chiCount) {
                utterance.lang = 'en-US';
            } else {
                utterance.lang = 'zh-HK';
            }
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        function toggleAnswer() {
            const ans = document.getElementById('answer');
            ans.style.display = ans.style.display === 'none' ? 'block' : 'none';
        }

        // 系統啟動，載入第一題
        nextQuestion();
    </script>
</body>
</html>
