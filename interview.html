<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小一面試模擬器 (iPad專用) - 極大擴充版 + 重組句子</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #F5A623;
            --bg: #F0F4F8;
            --text: #333333;
        }
        body {
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* 改用 Flexbox 讓 7 個按鈕能自動排版置中 */
        .nav-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background-color: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 calc(25% - 10px); /* 桌面或大螢幕排4列 */
            min-width: 130px;
        }
        .nav-btn:active, .nav-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .card {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .question-text {
            font-size: 46px; /* 稍微縮小以容納長句子 */
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
            letter-spacing: 2px;
        }
        .instruction-text {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
            background-color: #FFF3E0;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px dashed var(--secondary);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: auto;
        }
        .action-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .action-btn:active {
            transform: scale(0.95);
        }
        .answer-text {
            font-size: 26px;
            color: #E74C3C;
            margin-top: 20px;
            display: none;
            font-weight: bold;
            text-align: left;
            width: 80%;
            background-color: #FDEDEC;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>🌟 小一入學面試模擬器 (擴充版 + 重組句子) 🌟</h1>

    <div class="nav-grid">
        <button class="nav-btn active" onclick="setCategory('chi')">📘 中文認讀</button>
        <button class="nav-btn" onclick="setCategory('eng')">📕 英文認讀</button>
        <button class="nav-btn" onclick="setCategory('grammar')">✏️ 英文文法</button>
        <button class="nav-btn" onclick="setCategory('math')">🧮 數學與邏輯</button>
        <button class="nav-btn" onclick="setCategory('personal')">🗣️ 個人與情境</button>
        <button class="nav-btn" onclick="setCategory('listen')">🎨 聆聽與畫圖</button>
        <button class="nav-btn" style="background-color: #FFF3E0; border-color: #F5A623; color: #F5A623;" onclick="setCategory('rearrange')">🧩 重組句子 (新)</button>
    </div>

        <div class="instruction-text" id="instruction">請選擇面試項目</div>

        <div class="answer-text" id="answer">解答區域</div>
        
        <div class="controls">
            <button class="action-btn" style="background-color: #95A5A6;" onclick="toggleAnswer()">👀 顯示答案/提示</button>
            <button class="action-btn" onclick="nextQuestion()">➡️ 隨機下一題</button>
        </div>

        let currentCategory = 'chi';

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 更換分類時立即隨機抽一題該分類的題目
            nextQuestion();
        }

        function nextQuestion() {
            const arr = database[currentCategory];
            let newIndex = currentIndex;
            if (arr.length > 1) {
                while (newIndex === currentIndex) {
                    newIndex = Math.floor(Math.random() * arr.length);
                }
            } else {
                newIndex = 0;
            }
            currentIndex = newIndex;
            
            const item = arr[currentIndex];
            document.getElementById('instruction').innerText = item.i;
            document.getElementById('question').innerHTML = item.q.replace(/\n/g, '<br>');
            document.getElementById('answer').innerHTML = item.a.replace(/\n/g, '<br>');
            document.getElementById('answer').style.display = 'none';
        }

        function toggleAnswer() {
            const ans = document.getElementById('answer');
            ans.style.display = ans.style.display === 'none' ? 'block' : 'none';
        }
