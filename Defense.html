                        else if (isDefender) {
                            let threat = enemies.find(e => !e.isDying && (
                                towers.some(t => { let s = BUILDINGS[t.id].size || 1; return Math.hypot(e.x - (t.x*TILE_SIZE+(TILE_SIZE*s)/2), e.y - (t.y*TILE_SIZE+(TILE_SIZE*s)/2)) < 180; }) ||
                                Math.hypot(e.x - (playerBase.x*TILE_SIZE+TILE_SIZE/2), e.y - (playerBase.y*TILE_SIZE+TILE_SIZE/2)) < 250
                            ));
                            if (threat) {
                                let thIdx = threat.pathIndex >= 0 ? threat.pathIndex : pathCoords.length - 1;
                                if (this.pathIndex > thIdx) this.pathIndex--; else if (this.pathIndex < thIdx) this.pathIndex++;
                            } else {
                                let tents = towers.filter(t => t.id === 'tent');
                                if (tents.length > 0) {
                                    let tentIdx = getNearestPathIndex(tents[0].x, tents[0].y);
                                    if (this.pathIndex > tentIdx) this.pathIndex--; else if (this.pathIndex < tentIdx) this.pathIndex++;
                                }
                            }
                        }
                    }
                } else { 
                    this.x += (dx / dist) * this.speed; 
                    this.y += (dy / dist) * this.speed; 
                }
            }
            return false;
        }
        
draw() {
            // 【核心修正】：如果是安全撤退，強制覆蓋為「行走狀態(0)」，不播「死亡狀態(3)」
            if (this.isRetreating) this.state = 0; 

            if (this.state === 0) this.frame = Math.floor(globalAnimTick / 10) % 5; 
            else if (this.state === 4) this.frame = Math.floor(globalAnimTick / 15) % 4; 
            else if (this.state === 1 || this.state === 2) { 
                let attackProgress = 1 - (this.cooldown / this.fireRate); 
                this.frame = Math.min(4, Math.floor(attackProgress * 5)); 
            } else if (this.state === 3) {
                let deathProgress = 1 - (this.deathTimer / 45); 
                this.frame = Math.min(4, Math.floor(deathProgress * 5));
            }

            let cx = this.x + this.drawOffsetX, cy = this.y + this.drawOffsetY;

            ctx.save();

            if (this.isDying) {
                let deathProgress = 1 - (this.deathTimer / 45);
                // 【核心修正】：只有真正的「戰死」才會閃爍和飄走
                if (!this.isRetreating) {
                    if (this.deathTimer % 6 < 3) ctx.globalAlpha = 0.3; 
                    else ctx.globalAlpha = 0.9;
                    cy -= deathProgress * 15; 
                }
            }

            if (this.currentImg && this.currentImg.complete && !this.currentImg.isFailed && this.currentImg.naturalWidth > 0) {
                let frameWidth = this.currentImg.naturalWidth / 5; let frameHeight = this.currentImg.naturalHeight / 5;
                let sx = this.frame * frameWidth; let sy = this.state * frameHeight; 
                
                let drawWidth = TILE_SIZE * this.currentScale;
                let aspectRatio = frameHeight / frameWidth;
                let drawHeight = drawWidth * aspectRatio;
                let yOffset = this.unitData.yOffset || 0; 
                
                ctx.translate(cx, cy - 5 + yOffset);
                if (this.facingLeft) { ctx.scale(-1, 1); }
                
                // ============================================
                // 【新增】：百頁簾由下至上消失特效 (安全撤退專用)
                // ============================================
                if (this.isDying && this.isRetreating) {
                    let deathProgress = 1 - (this.deathTimer / 45);
                    ctx.beginPath();
                    let numBlinds = 8; // 將角色橫向切成 8 條百頁簾
                    let blindH = drawHeight / numBlinds;
                    for (let i = 0; i < numBlinds; i++) {
                        // 讓底部的百頁簾優先開始消失 (delay 較小)
                        let delay = (numBlinds - 1 - i) * 0.08; 
                        let localProgress = Math.max(0, Math.min(1, (deathProgress - delay) * 2));
                        // 畫出正在縮小的矩形遮罩
                        ctx.rect(-drawWidth / 2, -drawHeight / 2 + i * blindH, drawWidth, blindH * (1 - localProgress));
                    }
                    ctx.clip(); // 啟動遮罩！範圍外的圖片會直接隱藏
                }

                if (this.isTransforming) {
                    let whiteIntensity = 0;
                    if (this.transformTimer > 45) {
                        whiteIntensity = 1 - ((this.transformTimer - 45) / 45);
                    } else {
                        whiteIntensity = this.transformTimer / 45;
                    }
                    ctx.filter = `brightness(${1 + whiteIntensity * 50})`;
                } else {
                    ctx.filter = 'none';
                }

                ctx.drawImage(this.currentImg, sx, sy, frameWidth, frameHeight, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight); 
                
                ctx.filter = 'none'; 
                
            } else {
                ctx.fillStyle = this.unitData.isGeneral ? '#fcf3cf' : 'white'; ctx.fillRect(cx - TILE_SIZE/2 + 2, cy - TILE_SIZE/2 + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                if(this.unitData.isGeneral) { ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.strokeRect(cx - TILE_SIZE/2 + 2, cy - TILE_SIZE/2 + 2, TILE_SIZE - 4, TILE_SIZE - 4); }
                ctx.fillStyle = this.unitData.color; ctx.font = '22px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.unitData.symbol, cx, cy);
            }
            
            ctx.restore();

            if (!this.isDying && !this.isTransforming) {
                let hpOffset = this.currentScale * 15; 
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.fillText('Lv'+this.level, cx, cy + TILE_SIZE/2);
                ctx.fillStyle = 'red'; ctx.fillRect(cx - 10, cy - hpOffset - 10, 20, 3);
                ctx.fillStyle = '#3498db'; ctx.fillRect(cx - 10, cy - hpOffset - 10, 20 * (this.hp / this.maxHp), 3);
            }
        }
    }

    // 【修改】：環境特效類別 (嚴格綁定地形)
    class AmbientEffect {
        constructor() {
            let keys = Object.keys(AMBIENT_TYPES);
            this.typeKey = keys[Math.floor(Math.random() * keys.length)];
            this.data = AMBIENT_TYPES[this.typeKey];
            
            this.alive = true;
            this.life = Math.random() * 500 + 300; 
            this.vx = 0; this.vy = 0;
            this.facingLeft = Math.random() < 0.5; 

            if (this.data.type === 'wind') {
                // 落葉 (Wind)：可以從畫面外任何地方吹進來，吹過所有地形
                this.x = Math.random() < 0.5 ? -20 : Math.random() * 800;
                this.y = this.x === -20 ? Math.random() * 800 : -20;
                this.vx = this.data.speed + Math.random();
                this.vy = this.data.speed * 0.8 + Math.random() * 0.5;
            } else {
                // 蝴蝶 (Wander) 與 小鳥 (Peck)：【強制只在草地上生成】
                let foundGrass = false;
                while (!foundGrass) {
                    let c = Math.floor(Math.random() * 20);
                    let r = Math.floor(Math.random() * 20);
                    
                    // 草地判定條件：不是道路 (isPath為false)，且不是山地 (r >= 6)
                    if (!isPath(c, r) && r >= 6) {
                        this.x = c * TILE_SIZE + Math.random() * TILE_SIZE;
                        this.y = r * TILE_SIZE + Math.random() * TILE_SIZE;
                        foundGrass = true;
                    }
                }

                if (this.data.type === 'wander') {
                    this.vx = (Math.random() - 0.5) * this.data.speed;
                    this.vy = (Math.random() - 0.5) * this.data.speed;
                }
            }
        }

        update() {
            this.life--;
            if (this.life <= 0 || this.x > 850 || this.y > 850) {
                this.alive = false; return;
            }

            if (this.data.type === 'wander' && globalAnimTick % 40 === 0) {
                this.vx = (Math.random() - 0.5) * this.data.speed * 3;
                this.vy = (Math.random() - 0.5) * this.data.speed * 3;
            }
            
            if (this.data.type === 'peck') {
                if (Math.random() < 0.02) { 
                    this.vx = (Math.random() - 0.5) * 3; 
                    this.vy = (Math.random() - 0.5) * 3; 
                } else if (globalAnimTick % 10 === 0) { 
                    this.vx = 0; this.vy = 0; 
                }
            }

            if (this.vx < -0.1) this.facingLeft = true;
            else if (this.vx > 0.1) this.facingLeft = false;

            this.x += this.vx; this.y += this.vy;
        }

        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            
            if (this.data.type === 'wander') ctx.translate(0, Math.sin(globalAnimTick / 10) * 4);
            else if (this.data.type === 'wind') { ctx.translate(0, Math.sin(globalAnimTick / 20) * 5); ctx.rotate(globalAnimTick / 30); }
            else if (this.data.type === 'peck') { if (globalAnimTick % 60 < 10) ctx.translate(0, 2); }

            if (this.facingLeft && this.data.type !== 'wind') { 
                ctx.scale(-1, 1); 
            }

            if (this.data.img && this.data.img.complete && !this.data.img.isFailed && this.data.img.naturalWidth > 0) {
                let fw = this.data.img.naturalWidth / 4; let fh = this.data.img.naturalHeight;
                let frame = Math.floor(globalAnimTick / 15) % 4;
                ctx.drawImage(this.data.img, frame * fw, 0, fw, fh, -this.data.size/2, -this.data.size/2, this.data.size, this.data.size);
            } else {
                ctx.font = `${this.data.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.data.symbol, 0, 0);
            }
            ctx.restore();
        }
    }

    // --- 遊戲主迴圈 (終極鎖幀與深度排序版) ---
    function gameLoop(timestamp) {
        // 【終極鎖幀魔法】：強制適應 120Hz/60Hz 螢幕，絕不加速！
        window.animFrameId = requestAnimationFrame(gameLoop);
        
        let now = performance.now();
        window.lastFrameTime = window.lastFrameTime || now;
        let elapsed = now - window.lastFrameTime;
        
        // 1000ms / 60fps ≈ 16.6ms。只要距離上次畫圖少過 16ms，就直接跳過，唔執行任何邏輯！
        if (elapsed < 16) return; 
        
        // 更新時間 (減去餘數，保持遊戲節奏平穩不卡頓)
        window.lastFrameTime = now - (elapsed % 16);

        // --- 以下保留原本的邏輯 ---
        ctx.clearRect(0, 0, 800, 800);
        globalAnimTick++;
        let isPlaying = !gameOver && !gameWon;

        // ============================================
        // 1. 戰鬥與資源大腦邏輯 (只有遊戲進行中執行)
        // ============================================
        if (isPlaying) {
            // 【武將自動大腦與出兵隊列】
            if (globalAnimTick % 30 === 0) {
                let tents = towers.filter(t => t.id === 'tent');
                
                selectedGenerals.forEach(gId => {
                    let g = GENERALS[gId];
                    if (!g) return; 
                    
                    g.deathCooldown = g.deathCooldown || 0; 
                    if (g.deathCooldown > 0) g.deathCooldown -= 30; 
                    
                    if (tents.length > 0 && !g.isDeployed && g.deathCooldown <= 0) {
                        let shouldDeploy = false;
                        
                        if (gId === 'g1') { // 關羽：精準保護所有大小建築物與主堡
                            shouldDeploy = enemies.some(e => {
                                let nearTower = towers.some(t => {
                                    let s = BUILDINGS[t.id].size || 1;
                                    let centerX = t.x * TILE_SIZE + (TILE_SIZE * s) / 2;
                                    let centerY = t.y * TILE_SIZE + (TILE_SIZE * s) / 2;
                                    return Math.hypot(e.x - centerX, e.y - centerY) < 180;
                                });
                                let nearBase = Math.hypot(e.x - (playerBase.x*TILE_SIZE+TILE_SIZE/2), e.y - (playerBase.y*TILE_SIZE+TILE_SIZE/2)) < 250;
                                return nearTower || nearBase;
                            });
                        } else if (gId === 'g2') { // 趙雲：4名騎兵(b6)在場
                            shouldDeploy = (playerUnits.filter(p => p.id === 'b6' && !p.isDying).length >= 4);
                        } else if (gId === 'g3') { // 如來：主堡低於 50% 血，【且】有敵軍靠近主堡 300 像素內
                            let enemiesNearBase = enemies.some(e => Math.hypot(e.x - (playerBase.x*TILE_SIZE+TILE_SIZE/2), e.y - (playerBase.y*TILE_SIZE+TILE_SIZE/2)) < 300);
                            shouldDeploy = (playerBase.hp < playerBase.maxHp * 0.5) && enemiesNearBase;
                        } else if (gId === 'g4') { // 呂布：場上出現屍王或天
                            shouldDeploy = enemies.some(e => (e.id === 'boss' || e.id === 'black_dragon') && !e.isDying);
                        }

                        if (shouldDeploy) {
                            g.isDeployed = true;
                            let spawnIdx = getNearestPathIndex(tents[0].x, tents[0].y); 
                            deployQueue.push({ id: gId, level: tents[0].level, spawnIndex: spawnIdx });
                            
                            let feedback = document.getElementById('feedback');
                            feedback.innerText = `🔥 條件達成！傳奇將領【${g.name}】出陣！`;
                            feedback.style.color = "#e74c3c";
                        }
                    }
                });

                // 一般部隊排隊出陣
                if (deployQueue.length > 0) {
                    let spawnCount = Math.min(2, deployQueue.length);
                    for(let i=0; i<spawnCount; i++) {
                        let u = deployQueue.shift();
                        let newU = new PlayerUnit(u.id, u.level); 
                        newU.pathIndex = u.spawnIndex;
                        newU.x = pathCoords[u.spawnIndex].x * TILE_SIZE + TILE_SIZE / 2; 
                        newU.y = pathCoords[u.spawnIndex].y * TILE_SIZE + TILE_SIZE / 2;
                        playerUnits.push(newU); 
                    }
                }
            }

            // 資源生產
            if (globalAnimTick % 60 === 0) {
                towers.forEach(t => {
                    let bData = BUILDINGS[t.id];
                    if (bData.type === 'resource') {
                        let amount = bData.resAmount * t.level;
                        let resSymbol = '';
                        let resColor = '#fff';

                        // 判斷資源類型，給予對應的符號與顏色
                        if (bData.resType === 'meat') { gameMeat += amount; resSymbol = '🍖'; resColor = '#e74c3c'; }
                        if (bData.resType === 'wood') { gameWood += amount; resSymbol = '🪵'; resColor = '#e67e22'; }
                        if (bData.resType === 'gold') { gameGold += amount; resSymbol = '💰'; resColor = '#f1c40f'; }
                        if (bData.resType === 'stone') { gameStone += amount; resSymbol = '🪨'; resColor = '#95a5a6'; }
                        
                        // 加入資源生產的對白氣泡 (緩緩向上飄出)
                        let sizeMult = bData.size || 1;
                        floatingTexts.push({ 
                            x: t.x * TILE_SIZE + (TILE_SIZE * sizeMult)/2 + (Math.random() * 10 - 5), 
                            y: t.y * TILE_SIZE - 5 + (Math.random() * 10 - 5), 
                            text: `${resSymbol}+${amount}`, 
                            color: resColor, 
                            timer: 40 + Math.random() * 20, 
                            vx: (Math.random() - 0.5) * 0.5, 
                            vy: -0.5 - Math.random() * 0.5,
                            font: 'bold 12px Arial'
                        });
                    }
                });
                updateResourcesUI();
            }

            // 難度與生怪 (包含 Level 8 黑天龍降臨)
            frameCount++;
            if (frameCount % 600 === 0 && difficultyLevel < 15) {
                difficultyLevel += 0.5;
                let newLevel = Math.floor(difficultyLevel);
                document.getElementById('wave-display').innerText = `強度: Lv.${newLevel}`;
                
                if (newLevel > enemyBase.level) {
                    enemyBase.level = newLevel;
                    enemyBase.maxHp = 2000 + (enemyBase.level - 1) * 1000;
                    enemyBase.hp = Math.min(enemyBase.maxHp, enemyBase.hp + 1000); 
                    enemyBase.damage = 20 + (enemyBase.level - 1) * 10;
                }

                if (difficultyLevel === 8.0) {
                    enemies.push(new Enemy(newLevel, 'black_dragon'));
                    let feedback = document.getElementById('feedback');
                    feedback.innerText = `⚠️ 警告：遠古神明【天】已降臨！無色界神力即將吞噬戰場！`;
                    feedback.style.color = "#9b59b6";
                }
            }

            spawnTimer--;
            if (spawnTimer <= 0) {
                let type = 'normal'; let rand = Math.random();
                if (difficultyLevel >= 2 && rand < 0.3) type = 'fast';
                if (difficultyLevel >= 3 && rand >= 0.3 && rand < 0.6) type = 'tank';
                if (difficultyLevel >= 4 && rand >= 0.8) type = 'boss';
                enemies.push(new Enemy(Math.floor(difficultyLevel), type));
                spawnTimer = Math.max(150, 360 - difficultyLevel * 15);
            }
            // 【新增】：黑天龍復活機制
            if (window.blackDragonRespawnTimer > 0) {
                window.blackDragonRespawnTimer--;
                if (window.blackDragonRespawnTimer === 0) {
                    // 根據目前難度生成復活的黑天龍
                    enemies.push(new Enemy(Math.floor(difficultyLevel), 'black_dragon'));
                    
                    let feedback = document.getElementById('feedback');
                    feedback.innerText = `⚠️ 警告：遠古神明【天】已復活！無色界神力再次籠罩戰場！`;
                    feedback.style.color = "#9b59b6";
                    
                    // 重置計時器，等佢下次死再觸發
                    window.blackDragonRespawnTimer = -1;
                }
            }

            // 主堡互射與回血
            [playerBase, enemyBase].forEach((base, idx) => {
                let isPlayer = idx === 0;
                if (globalAnimTick % 60 === 0 && base.hp < base.maxHp) {
                    base.hp = Math.min(base.maxHp, base.hp + base.healRate);
                }
                if (base.cooldown > 0) base.cooldown--;
                else {
                    let bx = base.x * TILE_SIZE + TILE_SIZE / 2; let by = base.y * TILE_SIZE + TILE_SIZE / 2;
                    let targetArr = isPlayer ? enemies : playerUnits;
                    let target = targetArr.find(u => Math.hypot((u.x + u.drawOffsetX) - bx, (u.y + u.drawOffsetY) - by) <= base.range);
                    if (target) {
                        target.hp -= base.damage; base.cooldown = base.fireRate;
                        // 畫主堡雷射
                        ctx.strokeStyle = isPlayer ? '#f1c40f' : '#e74c3c'; ctx.lineWidth = 4;
                        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(target.x + target.drawOffsetX, target.y + target.drawOffsetY); ctx.stroke();
                    }
                }
            });

            if (globalAnimTick % 30 === 0) updateGeneralsUI();
        }

        // ============================================
        // 2. 畫地形與環境裝飾 (永遠執行)
        // ============================================
        let terrainFrame = Math.floor(globalAnimTick / 15) % 4;
        const drawAnimatedTerrain = (img, dx, dy) => {
            let frameWidth = img.naturalWidth / 4; let frameHeight = img.naturalHeight;
            let sx = terrainFrame * frameWidth;
            ctx.drawImage(img, sx, 0, frameWidth, frameHeight, dx, dy, TILE_SIZE, TILE_SIZE);
        };

        for (let r = 0; r < 20; r++) {
            for (let c = 0; c < 20; c++) {
                let dx = c * TILE_SIZE, dy = r * TILE_SIZE;
                if (isPath(c, r)) { 
                    if (TERRAIN_IMGS.path && TERRAIN_IMGS.path.complete && !TERRAIN_IMGS.path.isFailed && TERRAIN_IMGS.path.naturalWidth > 0) { 
                        drawAnimatedTerrain(TERRAIN_IMGS.path, dx, dy); 
                    } else { ctx.fillStyle = '#c49f81'; ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE); }
                } else if (r < 6) {
                    let validMntImgs = TERRAIN_IMGS.mountain.filter(img => img && img.complete && !img.isFailed && img.naturalWidth > 0);
                    if (validMntImgs.length > 0) { 
                        let hash = Math.sin(r * 12.9898 + c * 78.233) * 43758.5453; let randVal = hash - Math.floor(hash); 
                        let tileIndex = 0; 
                        if (validMntImgs.length >= 4) {
                            if (randVal > 0.90) tileIndex = 1; else if (randVal > 0.80) tileIndex = 2; else if (randVal > 0.70) tileIndex = 3; 
                        } else { tileIndex = Math.floor(randVal * validMntImgs.length); }
                        drawAnimatedTerrain(validMntImgs[tileIndex], dx, dy); 
                    } else { 
                        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE); ctx.strokeStyle = '#95a5a6'; ctx.strokeRect(dx, dy, TILE_SIZE, TILE_SIZE); 
                    }
                } else { 
                    let validGrassImgs = TERRAIN_IMGS.grass.filter(img => img && img.complete && !img.isFailed && img.naturalWidth > 0);
                    if (validGrassImgs.length > 0) { 
                        let hash = Math.sin(r * 12.9898 + c * 78.233) * 43758.5453; let randVal = hash - Math.floor(hash); 
                        let tileIndex = 0; 
                        if (validGrassImgs.length >= 4) {
                            if (randVal > 0.90) tileIndex = 1; else if (randVal > 0.80) tileIndex = 2; else if (randVal > 0.70) tileIndex = 3; 
                        } else { tileIndex = Math.floor(randVal * validGrassImgs.length); }
                        drawAnimatedTerrain(validGrassImgs[tileIndex], dx, dy); 
                    } else {
                        ctx.fillStyle = '#8fbc8f'; ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE); ctx.strokeStyle = '#7da27d'; ctx.strokeRect(dx, dy, TILE_SIZE, TILE_SIZE); 
                    }
                }
            }
        }

        mapDecorations.forEach(dec => {
            let dData = DECORATION_TYPES[dec.type];
            if (dData.img && dData.img.complete && !dData.img.isFailed && dData.img.naturalWidth > 0) {
                let fw = dData.img.naturalWidth / 4; let fh = dData.img.naturalHeight;
                let frame = Math.floor((globalAnimTick + dec.animOffset) / 20) % 4; 
                ctx.drawImage(dData.img, frame * fw, 0, fw, fh, dec.x - dData.size/2, dec.y - dData.size/2, dData.size, dData.size);
            } else {
                ctx.font = `${dData.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillText(dData.symbol, dec.x, dec.y + 4); ctx.fillText(dData.symbol, dec.x, dec.y);
            }
        });

        if (Math.random() < 0.03 && ambientEffects.length < 20) ambientEffects.push(new AmbientEffect());
        for (let i = ambientEffects.length - 1; i >= 0; i--) {
            let effect = ambientEffects[i];
            effect.update(); 
            if (!effect.alive) ambientEffects.splice(i, 1); else effect.draw();
        }

        // ============================================
        // 【修改】：無縫藍色螢光興建範圍 (修正偏位並適配主堡大範圍)
        // ============================================
        if (selectedBuilding && !isDeleteMode) {
            ctx.save();
            ctx.fillStyle = 'rgba(52, 152, 219, 0.35)'; 
            ctx.shadowColor = '#00a8ff';
            ctx.shadowBlur = 20; 
            
            ctx.beginPath();
            for(let r=6; r<20; r++){
                for(let c=0; c<20; c++){
                    let inRange = false;
                    
                    // 1. 主堡 3 格範圍 (絕對置中於 17, 17)
                    if (Math.abs(playerBase.x - c) <= 3 && Math.abs(playerBase.y - r) <= 3) inRange = true;
                    
                    // 2. 普通建築 1 格範圍
                    if (!inRange) {
                        inRange = towers.some(t => {
                            let s = BUILDINGS[t.id].size || 1;
                            return c >= t.x - 1 && c <= t.x + s && r >= t.y - 1 && r <= t.y + s;
                        });
                    }
                    let isEmpty = !isPath(c, r) && !getTowerAt(c, r) && !(c===17 && r===17) && !(c===2 && r===2);
                    if (inRange && isEmpty) {
                        ctx.rect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
            ctx.fill(); 
            ctx.restore();
        }

        // ============================================
        // 3. 處理部隊與建築大腦 (不在此畫圖)
        // ============================================
        
        // 敵軍更新
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (e.hp <= 0 && !e.isDying) { 
                e.isDying = true; 
                e.state = 3; 
                e.deathTimer = 45; 
                
                // 【新增】：如果死嘅係黑天龍，啟動 40 秒復活倒數
                if (e.id === 'black_dragon') {
                    window.blackDragonRespawnTimer = 40 * 60; // 40 秒 x 60 幀
                    let feedback = document.getElementById('feedback');
                    feedback.innerText = `✨ 遠古神明【天】暫時敗退，將於 40 秒後再次降臨！`;
                    feedback.style.color = "#9b59b6";
                }
            }
            if (e.isDying) {
                e.deathTimer--;
                if (e.deathTimer <= 0) enemies.splice(i, 1);
            } else {
                if (isPlaying) {
                    let closestPlayer = playerUnits.find(p => !p.isDying && !p.isTransforming && Math.hypot((p.x + p.drawOffsetX) - (e.x + e.drawOffsetX), (p.y + p.drawOffsetY) - (e.y + e.drawOffsetY)) <= e.range);
                    e.update(closestPlayer);
                    if (playerBase.hp <= 0 && !gameOver) { 
                        gameOver = true;
                        document.getElementById('game-over-title').innerText = "💥 戰敗！";
                        document.getElementById('game-over-title').style.color = "#e74c3c";
                        document.getElementById('game-over-msg').innerText = "我方城池被敵軍攻破了...";
                        document.getElementById('game-over-modal').style.display = 'flex';
                    }
                } else { e.state = 0; e.cooldown = 0; }
            }
        }

        // 我軍更新 (包含關羽精準護駕撤退)
        for (let i = playerUnits.length - 1; i >= 0; i--) {
            let pUnit = playerUnits[i];
            if (pUnit.id === 'g1' && !pUnit.isDying) {
                let buildingInDanger = enemies.some(e => {
                    let nearTower = towers.some(t => {
                        let s = BUILDINGS[t.id].size || 1;
                        let centerX = t.x * TILE_SIZE + (TILE_SIZE * s) / 2;
                        let centerY = t.y * TILE_SIZE + (TILE_SIZE * s) / 2;
                        return Math.hypot(e.x - centerX, e.y - centerY) < 180;
                    });
                    let nearBase = Math.hypot(e.x - (playerBase.x*TILE_SIZE+TILE_SIZE/2), e.y - (playerBase.y*TILE_SIZE+TILE_SIZE/2)) < 250;
                    return nearTower || nearBase;
                });
                
                if (!buildingInDanger) {
                    pUnit.retreatTimer = (pUnit.retreatTimer || 0) + 1;
                    if (pUnit.retreatTimer > 180) { pUnit.isDying = true; pUnit.state = 3; pUnit.deathTimer = 45; pUnit.isRetreating = true; }
                } else { pUnit.retreatTimer = 0; }
            }
            if (pUnit.hp <= 0 && !pUnit.isDying) { pUnit.isDying = true; pUnit.state = 3; pUnit.deathTimer = 45; }
            if (pUnit.isDying) {
                pUnit.deathTimer--;
                if (pUnit.deathTimer <= 0) {
                    if (pUnit.unitData.isGeneral) {
                        GENERALS[pUnit.id].isDeployed = false;
                        if (!pUnit.isRetreating) { GENERALS[pUnit.id].deathCooldown = 600; document.getElementById('feedback').innerText = `☠️ 【${pUnit.unitData.name}】重傷敗退，需休整 10 秒！`; }
                        else { GENERALS[pUnit.id].deathCooldown = 0; }
                    }
                    playerUnits.splice(i, 1);
                }
            } else {
                if (isPlaying) {
                    let targetEnemy = enemies.find(e => !e.isDying && Math.hypot((e.x + e.drawOffsetX) - (pUnit.x + pUnit.drawOffsetX), (e.y + e.drawOffsetY) - (pUnit.y + pUnit.drawOffsetY)) <= pUnit.range);
                    pUnit.update(targetEnemy);
                    if (enemyBase.hp <= 0 && !gameWon) {
                        gameWon = true; playerGold += 200; localStorage.setItem('tdGameGold_v2', playerGold);
                        document.getElementById('game-over-title').innerText = "🎉 勝利！";
                        document.getElementById('game-over-title').style.color = "#f1c40f";
                        document.getElementById('game-over-msg').innerText = "成功推平敵軍主堡！獲得 200 金幣！";
                        document.getElementById('game-over-modal').style.display = 'flex';
                    }
                } else { pUnit.state = 0; pUnit.cooldown = 0; }
            }
        }

        // 防禦塔與城門更新
        towers.forEach(tower => {
            const cx = tower.x * TILE_SIZE, cy = tower.y * TILE_SIZE;
            let bData = BUILDINGS[tower.id];
            if (isPlaying && bData.type === 'attack') {
                const range = 60 + (bData.range * 30) + (tower.level * 10);
                const damage = 10 * bData.dmg * tower.level;
                const fireRate = Math.max(10, 60 / bData.spd - (tower.level * 2)); 
                if (tower.cooldown > 0) {
                    tower.cooldown--; tower.state = (tower.cooldown > fireRate - 15) ? 1 : 0; 
                } else {
                    const target = enemies.find(e => !e.isDying && Math.hypot(e.x - (cx + TILE_SIZE/2), e.y - (cy + TILE_SIZE/2)) < range);
                    if (target) {
                        target.hp -= damage; tower.cooldown = fireRate; tower.state = 1; tower.facingLeft = target.x < cx + TILE_SIZE / 2;
                        // 畫箭塔攻擊線條
                        ctx.strokeStyle = bData.color; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(cx + TILE_SIZE / 2, cy + TILE_SIZE / 2); ctx.lineTo(target.x, target.y); ctx.stroke();
                    } else { tower.state = 0; }
                }
            }
            if (tower.id === 'gate' && isPlaying) {
                let sizeMult = bData.size || 1;
                let centerX = cx + (TILE_SIZE * sizeMult)/2;
                let centerY = cy + (TILE_SIZE * sizeMult)/2;
                let allyNear = playerUnits.some(p => !p.isDying && Math.hypot(p.x - centerX, p.y - centerY) < 60);
                if (globalAnimTick % 5 === 0) { tower.frame = allyNear ? Math.min(3, tower.frame + 1) : Math.max(0, tower.frame - 1); }
            }
        });

        // ============================================
        // 4. 【核心 Z-Index】：所有物件深度排序並畫出
        // ============================================
        let renderList = [];
        
        enemies.forEach(e => renderList.push({ y: e.y + e.drawOffsetY, draw: () => e.draw() }));
        playerUnits.forEach(p => renderList.push({ y: p.y + p.drawOffsetY, draw: () => p.draw() }));
        
        const drawBase = (baseObj, imgArray, fallbackColor, symbol, isPlayer) => {
            let cx = baseObj.x * TILE_SIZE; let cy = baseObj.y * TILE_SIZE; let hpRatio = baseObj.hp / baseObj.maxHp;
            let stateIndex = hpRatio > 0.5 ? 0 : (hpRatio > 0 ? 1 : 2);
            let img = imgArray ? imgArray[stateIndex] : null; 
            let drawSize = TILE_SIZE * 2.8; 
            let drawX = cx + (TILE_SIZE / 2) - (drawSize / 2); let drawY = cy + (TILE_SIZE / 2) - (drawSize / 2) - 15; 
            if (img && img.complete && !img.isFailed && img.naturalWidth > 0) {
                let fw = img.naturalWidth / 4; let fh = img.naturalHeight; let frame = Math.floor(globalAnimTick / 15) % 4;
                ctx.drawImage(img, frame * fw, 0, fw, fh, drawX, drawY, drawSize, drawSize);
            } else {
                ctx.fillStyle = fallbackColor; ctx.fillRect(cx, cy, TILE_SIZE, TILE_SIZE);
                ctx.fillStyle = 'white'; ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(symbol, cx + TILE_SIZE/2, cy + TILE_SIZE/2 - 5);
            }
            if (stateIndex !== 2) {
                let barWidth = TILE_SIZE * 1.5; let barX = cx + (TILE_SIZE / 2) - (barWidth / 2); let barY = drawY - 8; 
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.fillText('Lv'+baseObj.level, cx + TILE_SIZE/2, barY - 8);
                ctx.fillStyle = 'red'; ctx.fillRect(barX, barY, barWidth, 4); ctx.fillStyle = '#2ecc71'; ctx.fillRect(barX, barY, barWidth * Math.max(0, Math.min(1, hpRatio)), 4);
            }
        };

        renderList.push({ y: (playerBase.y + 2) * TILE_SIZE, draw: () => drawBase(playerBase, typeof BASE_IMGS !== 'undefined' ? BASE_IMGS.player : null, '#2980b9', '👑', true) });
        renderList.push({ y: (enemyBase.y + 2) * TILE_SIZE, draw: () => drawBase(enemyBase, typeof BASE_IMGS !== 'undefined' ? BASE_IMGS.enemy : null, '#8e44ad', '👿', false) });

        towers.forEach(tower => {
            let bData = BUILDINGS[tower.id];
            let sizeMult = bData.size || 1;
            let drawY = (tower.y + sizeMult) * TILE_SIZE; 
            
            renderList.push({ y: drawY, draw: () => {
                const cx = tower.x * TILE_SIZE, cy = tower.y * TILE_SIZE;
                if (bData.img && bData.img.complete && !bData.img.isFailed && bData.img.naturalWidth > 0) {
                    let cols = 4, rows = 1, sx = 0, sy = 0;
                    if (tower.id === 'gate') { cols = 4; rows = 4; sx = tower.frame * (bData.img.naturalWidth / cols); sy = tower.dir * (bData.img.naturalHeight / rows); } 
                    else if (tower.id === 'tower') { cols = 4; rows = 2; sx = (Math.floor(globalAnimTick / 15) % cols) * (bData.img.naturalWidth / cols); sy = tower.state * (bData.img.naturalHeight / rows); } 
                    else { sx = (Math.floor(globalAnimTick / 15) % cols) * (bData.img.naturalWidth / cols); }

                    let fw = bData.img.naturalWidth / cols, fh = bData.img.naturalHeight / rows;
                    let drawScale = 1.3, drawWidth = TILE_SIZE * drawScale * sizeMult, aspectRatio = fh / fw, drawHeight = drawWidth * aspectRatio;
                    
                    ctx.save();
                    let centerX = cx + (TILE_SIZE * sizeMult) / 2, centerY = cy + TILE_SIZE * sizeMult - drawHeight / 2 - 5;
                    ctx.translate(centerX, centerY);
                    if (tower.id === 'tower' && tower.facingLeft) ctx.scale(-1, 1);
                    ctx.drawImage(bData.img, sx, sy, fw, fh, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                    ctx.restore();
                } else {
                    ctx.fillStyle = bData.color; ctx.fillRect(cx + 2, cy + 2, (TILE_SIZE * sizeMult) - 4, (TILE_SIZE * sizeMult) - 4);
                    ctx.fillStyle = 'white'; ctx.font = '22px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(bData.symbol, cx + (TILE_SIZE * sizeMult) / 2, cy + (TILE_SIZE * sizeMult) / 2);
                }
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.fillText('Lv'+tower.level, cx + (TILE_SIZE * sizeMult)/2, cy + (TILE_SIZE * sizeMult) - 5);
                if (tower.id === 'gate') {
                    ctx.fillStyle = 'red'; ctx.fillRect(cx, cy - 8, TILE_SIZE, 4); 
                    ctx.fillStyle = '#2ecc71'; ctx.fillRect(cx, cy - 8, TILE_SIZE * (tower.hp / tower.maxHp), 4);
                }
            }});
        });

        // 執行深度排序畫圖
        renderList.sort((a, b) => a.y - b.y).forEach(item => item.draw());
        
        // ============================================
        // 5. 畫戰鬥特效 (無色界神力 / AoE 爆炸)
        // ============================================
        for (let i = combatEffects.length - 1; i >= 0; i--) {
            let eff = combatEffects[i];
            eff.timer--;
            if (eff.timer <= 0) { combatEffects.splice(i, 1); continue; }
            
            // 黑天龍無色界神力 (移除白邊)
            if (eff.isBlackDragon) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                
                ctx.fillStyle = 'black';
                ctx.globalCompositeOperation = 'saturation';
                ctx.fill();
                
                ctx.globalCompositeOperation = 'source-over';
                let alpha = eff.timer > 60 ? 0.6 : (eff.timer / 60) * 0.6;
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.fill();
                
                ctx.restore();
                continue; 
            }
            
            // 一般 AoE 爆炸
            let img = eff.isTransformed ? EFFECT_IMGS.aoe_transformed : EFFECT_IMGS.aoe_normal;
            if (img && img.complete && !img.isFailed && img.naturalWidth > 0) {
                let fw = img.naturalWidth / 4; let fh = img.naturalHeight;
                let frame = Math.floor((20 - eff.timer) / 5); if (frame > 3) frame = 3;
                let drawSize = eff.radius * 2.5; 
                ctx.save();
                ctx.globalCompositeOperation = 'screen'; 
                ctx.drawImage(img, frame * fw, 0, fw, fh, eff.x - drawSize/2, eff.y - drawSize/2, drawSize, drawSize);
                ctx.restore();
            } else {
                ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.fillStyle = eff.isTransformed ? 'rgba(241, 196, 15, 0.3)' : 'rgba(231, 76, 60, 0.3)';
                ctx.fill();
            }
        }
        
        // ============================================
        // 6. 雲層覆蓋
        // ============================================
        if (TERRAIN_IMGS.clouds && TERRAIN_IMGS.clouds.complete && !TERRAIN_IMGS.clouds.isFailed && TERRAIN_IMGS.clouds.naturalWidth > 0) {
            let scaleSize = 1.2; let cw = TERRAIN_IMGS.clouds.naturalWidth || 100; let ch = TERRAIN_IMGS.clouds.naturalHeight || 100;
            cloudOffsetX = (cloudOffsetX - 0.8) % (cw * scaleSize); cloudOffsetY = (cloudOffsetY - 0.4) % (ch * scaleSize); 
            ctx.save(); 
            ctx.globalAlpha = 0.55; 
            ctx.globalCompositeOperation = 'multiply'; 
            let pattern = ctx.createPattern(TERRAIN_IMGS.clouds, 'repeat'); ctx.fillStyle = pattern;
            ctx.translate(cloudOffsetX, cloudOffsetY); ctx.scale(scaleSize, scaleSize); 
            let startX = -cloudOffsetX / scaleSize; let startY = -cloudOffsetY / scaleSize; let drawW = 800 / scaleSize; let drawH = 800 / scaleSize;
            ctx.fillRect(startX, startY, drawW, drawH); ctx.restore();
        }

        // ============================================
        // 8. 【修改】：畫出動態對白氣泡 (支援飄動與噴泉物理效果)
        // ============================================
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.timer--;
            
            // 加入 X 同 Y 軸的物理飄動
            ft.x += (ft.vx || 0);
            ft.y += (ft.vy || -0.5); 
            
            if (ft.timer <= 0) {
                floatingTexts.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.min(1, ft.timer / 15); // 最後 15 幀慢慢變透明
            ctx.fillStyle = ft.color || 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            // 允許市場使用更小更俐落的字體
            ctx.font = ft.font || 'bold 16px Microsoft JhengHei';
            ctx.textAlign = 'center';
            
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }

        // 7. 更新血量 UI (原有的代碼)
        document.getElementById('hp-display').innerText = Math.max(0, Math.floor(playerBase.hp));
        document.getElementById('enemy-hp-display').innerText = Math.max(0, Math.floor(enemyBase.hp));
    } // gameLoop 結束的括號

    updateLobbyUI();
</script>
</body>
