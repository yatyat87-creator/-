<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城池守衛戰 - 世紀帝國 RTS 版</title>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #2c3e50; color: #fff; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        /* 擴大外框以容納兩倍大的地圖 */
        #game-wrapper { max-width: 850px; width: 100%; background: #f4e8d3; border: 4px solid #d35400; border-radius: 15px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #333; }
        
        #setup-screen { display: block; }
        .title { text-align: center; color: #c0392b; text-shadow: 1px 1px 0px #fff; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
        .gold-display { font-size: 20px; font-weight: bold; color: #d35400; text-align: right; margin-bottom: 10px; }
        .section-title { font-size: 18px; font-weight: bold; color: #2980b9; margin: 10px 0 5px 0; border-bottom: 2px dashed #bdc3c7; padding-bottom: 5px; }
        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        
        .char-card { background: #fff; border: 3px solid #bdc3c7; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .char-card.basic { border-color: #7f8c8d; background: #ecf0f1; cursor: default; }
        .char-card.unlocked:hover { transform: translateY(-3px); border-color: #f39c12; }
        .char-card.selected { border-color: #e74c3c; background: #fadbd8; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
        .char-card.locked { filter: grayscale(100%); opacity: 0.6; }
        
        .char-symbol { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .char-price { font-size: 12px; color: #e74c3c; font-weight: bold; }
        .char-desc { font-size: 11px; color: #7f8c8d; margin-top: 5px; font-weight: bold; }
        
        .btn-start { width: 100%; background: #d35400; color: #fff; padding: 12px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .btn-start:disabled { background: #95a5a6; cursor: not-allowed; }

        #play-screen { display: none; }
        #header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        canvas { background-color: #dcb88e; border: 2px solid #333; cursor: pointer; width: 100%; max-width: 800px; border-radius: 5px; image-rendering: pixelated; margin: 0 auto; display: block; }
        
        /* 雙兵營介面樣式 */
        #camps-container { background: #ecf0f1; padding: 10px; border-radius: 8px; border: 2px dashed #bdc3c7; margin: 15px 0; width: 100%; box-sizing: border-box;}
        .camp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .camp-label { font-weight: bold; color: #2c3e50; width: 85px; font-size: 15px;}
        .camp-slots { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
        .slot { width: 45px; height: 45px; background-color: #fff; border: 2px solid #7f8c8d; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; position: relative; border-radius: 5px; overflow: hidden; }
        .slot.selected { border-color: #e74c3c; box-shadow: 0 0 8px red; background-color: #ffe6e6; }
        .slot.general { border-color: #f1c40f; background-color: #fcf3cf; }
        .slot-level { position: absolute; top: 2px; right: 2px; font-size: 10px; color: #000; font-weight:bold; text-shadow: 1px 1px 0 #fff; z-index: 10; }
        
        #btn-deploy { background: #c0392b; color: white; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; margin-left: 5px;}
        #btn-delete { background: #7f8c8d; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s;}
        #btn-delete.active { background: #e74c3c; box-shadow: 0 0 10px red;}

        #quiz-section { background: #34495e; padding: 15px; border-radius: 8px; text-align: center; color: #fff; }
        #question { font-size: 24px; font-weight: bold; margin: 0 0 15px 0; color: #f1c40f; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { background: #2980b9; color: white; border: none; padding: 12px; font-size: 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .option-btn:hover { background: #3498db; }
        #feedback { margin-top: 10px; font-weight: bold; height: 20px; }
    </style>
</head>
<body>
<!-- 【新增】：結算彈出視窗 UI -->
        <div id="game-over-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:transparent; z-index:100; flex-direction:column; align-items:center; justify-content:center; color:white;">
        <div style="background:#2c3e50; padding:30px; border-radius:10px; text-align:center; border:4px solid #f1c40f; box-shadow: 0 0 20px rgba(0,0,0,0.8); min-width: 300px;">
        <h1 id="game-over-title" style="margin-top:0; font-size: 32px;">結果</h1>
        <p id="game-over-msg" style="font-size:18px; font-weight: bold; margin-bottom: 20px;">訊息</p>
        <button onclick="returnToMenu()" style="background:#e74c3c; color:white; border:none; padding:12px 25px; font-size:18px; border-radius:5px; cursor:pointer; font-weight:bold; transition: 0.2s;">返回主選單</button>
    </div>
</div>
<div id="game-wrapper">
    <div id="setup-screen">
        <div class="title">城池守衛戰</div>
        <div class="gold-display">💰 金幣: <span id="gold-count">0</span></div>
        <div class="section-title">🛡️ 基本兵種 (預設出戰)</div>
        <div id="basic-grid" class="char-grid"></div>
        <div class="section-title">🔥 傳奇武將 (最多選擇 <span id="select-count">0</span>/3)</div>
        <div id="general-grid" class="char-grid"></div>
        <button id="btn-start-game" class="btn-start" onclick="startGame()">發兵出戰！</button>
    </div>

    <div id="play-screen">
        <div id="header">
            <span style="color: #8e44ad;">👿 敵軍: <span id="enemy-hp-display">1000</span></span>
            <span id="wave-display" style="color: #2980b9; margin: 0 10px;">強度: Lv.1</span>
            <span style="color: #e74c3c;">❤️ 我方: <span id="hp-display">1000</span></span>
        </div>
        
        <!-- 局內資源顯示 (加入石頭) -->
        <div style="display:flex; justify-content:space-around; background:#ecf0f1; padding:8px; border-radius:8px; border:2px dashed #bdc3c7; font-weight:bold; margin-bottom:5px;">
            <span style="color:#f39c12;">💰 <span id="game-gold">50</span></span>
            <span style="color:#e67e22;">🪵 <span id="game-wood">1000</span></span>
            <span style="color:#c0392b;">🍖 <span id="game-meat">1000</span></span>
            <span style="color:#7f8c8d;">🪨 <span id="game-stone">0</span></span>
        </div>

        <canvas id="gameCanvas" width="800" height="800"></canvas>
        
        <div id="camps-container">
            <div class="camp-row">
                <span class="camp-label">🏗️ 建築</span>
                <div id="build-menu" class="camp-slots">
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-farm" onclick="selectBuilding('farm')">🌾農田<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-lumber" onclick="selectBuilding('lumber')">🪓伐木<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-market" onclick="selectBuilding('market')">⚖️市場<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-quarry" onclick="selectBuilding('quarry')">⛏️石礦<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-barracks" onclick="selectBuilding('barracks')">⛺軍營<br>100木</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-tower" onclick="selectBuilding('tower')">🏹箭塔<br>100木</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-gate" onclick="selectBuilding('gate')">⛩️城門<br>100石</button>
                    <!-- 【新增】：大帳建築 -->
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-tent" onclick="selectBuilding('tent')">🎪大帳<br>200木</button>
                </div>
            </div>
            <div class="camp-row">
                <span class="camp-label">⚔️ 兵營</span>
                <button id="btn-buy-soldier" style="font-size:12px; background:#2ecc71; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;" onclick="buySoldier()">招募<br>50肉</button>
                <div id="offense-camp" class="camp-slots" style="margin-left:5px;">
                    <div class="slot" onclick="selectOffenseSlot(0)"></div><div class="slot" onclick="selectOffenseSlot(1)"></div>
                    <div class="slot" onclick="selectOffenseSlot(2)"></div><div class="slot" onclick="selectOffenseSlot(3)"></div>
                    <div class="slot" onclick="selectOffenseSlot(4)"></div><div class="slot" onclick="selectOffenseSlot(5)"></div>
                    <div class="slot" onclick="selectOffenseSlot(6)"></div><div class="slot" onclick="selectOffenseSlot(7)"></div>
                    <div class="slot" onclick="selectOffenseSlot(8)"></div><div class="slot" onclick="selectOffenseSlot(9)"></div>
                </div>
                <!-- 【修改】：改為出擊選定按鈕 -->
                <button id="btn-deploy" onclick="deployOffense()">出擊<br>選定</button>
            </div>
            
            <!-- 【新增】：將領獨立出戰區 -->
            <div class="camp-row" id="generals-deploy-container">
                <span class="camp-label">🔥 將領</span>
                <div id="generals-camp" class="camp-slots">
                    <!-- 將領按鈕將在此動態生成 -->
                </div>
            </div>

        <div id="quiz-section">
            <div id="question">題目加載中...</div>
            <div class="options-grid" id="options-container"></div>
            <div id="feedback">答對即可賺取金幣！</div>
        </div>
    </div>
</div>

<script>
    // --- 圖片載入器 ---
    function loadSprite(src) {
        if (!src) return null;
        let img = new Image();
        img.src = src;
        img.onerror = () => { img.isFailed = true; }; 
        return img;
    }

// --- 建築物與兵種資料庫 ---
    const BUILDINGS = {
        "farm": { id: "farm", name: "農田", symbol: "🌾", color: "#f1c40f", type: "resource", resType: "meat", resAmount: 10, costType: "gold", cost: 50 },
        "lumber": { id: "lumber", name: "伐木廠", symbol: "🪓", color: "#e67e22", type: "resource", resType: "wood", resAmount: 10, costType: "gold", cost: 50 },
        "market": { id: "market", name: "市場", symbol: "⚖️", color: "#f39c12", type: "buff", costType: "gold", cost: 50 },
        "quarry": { id: "quarry", name: "石礦場", symbol: "⛏️", color: "#7f8c8d", type: "resource", resType: "stone", resAmount: 10, costType: "gold", cost: 50 },
        "barracks": { id: "barracks", name: "軍營", symbol: "⛺", color: "#d35400", type: "military", costType: "wood", cost: 100 },
        "tower": { id: "tower", name: "箭塔", symbol: "🏹", color: "#bdc3c7", type: "attack", dmg: 1.5, range: 2.5, spd: 1.2, costType: "wood", cost: 100 },
        "gate": { id: "gate", name: "城門", symbol: "⛩️", color: "#2c3e50", type: "wall", costType: "stone", cost: 100, hp: 1000 },
        "tent": { id: "tent", name: "大帳", symbol: "🎪", color: "#8e44ad", type: "military", costType: "wood", cost: 200 } // 【新增】：大帳
    };

// 【修改】：敵方也全面採用我方的參數架構 (攻速、走速、射程、大小設定與精靈圖)
    const ENEMY_TYPES = {
        'normal': { id: 'normal', name: "喪屍", symbol: "屍", color: '#555', dmg: 1.0, range: 0.5, moveSpd: 0.8, atkSpd: 1.0, hpMult: 1, drawScale: 1.3, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/normal(Z)5x5.png" },
        'fast':   { id: 'fast', name: "快屍", symbol: "快", color: '#f39c12', dmg: 0.8, range: 0.5, moveSpd: 1.6, atkSpd: 1.5, hpMult: 0.5, drawScale: 1.3, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/fast(Z)5X5.png" },
        'tank':   { id: 'tank', name: "巨屍", symbol: "巨", color: '#2c3e50', dmg: 2.0, range: 0.5, moveSpd: 0.5, atkSpd: 0.6, hpMult: 2.5, drawScale: 1.8, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/tank(Z)5x5.png" },
        'boss':   { id: 'boss', name: "屍王", symbol: "王", color: '#c0392b', dmg: 4.0, range: 1.0, moveSpd: 0.7, atkSpd: 0.8, hpMult: 6.0, drawScale: 2.2, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/King(Z)5x5.png" }
    };

    // 【新增 drawScale】：1.5 是預設大小，將領與騎兵可以設大一點
    const BASIC_UNITS = {
        "b4": { id: "b4", name: "刀兵", symbol: "刀", color: "#c0392b", dmg: 1.2, range: 0.5, moveSpd: 0.8, atkSpd: 1.0, hpMult: 1, drawScale: 1.3, yOffset: 0, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/刀兵5x5.png" },
        "b5": { id: "b5", name: "盾兵", symbol: "盾", color: "#f39c12", dmg: 0.5, range: 0.5, moveSpd: 0.5, atkSpd: 0.8, hpMult: 3, drawScale: 1.3, yOffset: 0, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/盾兵5x5.png" },
        "b6": { id: "b6", name: "騎兵", symbol: "騎", color: "#d35400", dmg: 1.5, range: 0.5, moveSpd: 2.0, atkSpd: 1.2, hpMult: 1.2, drawScale: 1.8, yOffset: 0, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/騎兵5x5.png" },
        "b7": { id: "b7", name: "弓兵", symbol: "弓", color: "#27ae60", dmg: 0.8, range: 2.5, moveSpd: 0.8, atkSpd: 1.5, hpMult: 0.8, drawScale: 1.3, yOffset: 0, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/弓兵5x5.png" } 
    };

    const GENERALS = {
        "g1": { id: "g1", name: "關羽", symbol: "關", color: "#c0392b", price: 100, isGeneral: true, dmg: 3, range: 1, moveSpd: 1.2, atkSpd: 1.2, hpMult: 2, drawScale: 1.8, desc: "進攻：高額傷害", imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/關羽5x5.png" },
        "g2": { id: "g2", name: "趙雲", symbol: "趙", color: "#2980b9", price: 100, isGeneral: true, dmg: 1.5, range: 1, moveSpd: 2.5, atkSpd: 2.0, hpMult: 1.5, drawScale: 1.8, desc: "進攻：極快衝陣", imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/趙雲5x5.png" },
        "g4": { id: "g4", name: "呂布", symbol: "呂", color: "#000000", price: 200, isGeneral: true, dmg: 4, range: 1.2, moveSpd: 1.5, atkSpd: 1.0, hpMult: 2.5, drawScale: 1.8, desc: "進攻：戰神降臨", imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/呂布5x5.png" }
    };
    
    // 【新增】：讓敵軍也載入精靈圖
    for (let key in ENEMY_TYPES) ENEMY_TYPES[key].img = loadSprite(ENEMY_TYPES[key].imgSrc);
    
    for (let key in BASIC_UNITS) BASIC_UNITS[key].img = loadSprite(BASIC_UNITS[key].imgSrc);
    for (let key in GENERALS) GENERALS[key].img = loadSprite(GENERALS[key].imgSrc);

    // --- 地形圖片預載 (預備放 PNG 圖的地方) ---
    const TERRAIN_IMGS = {
        // 【新增】：雲影特效 (待填入無縫雲朵 PNG)
        clouds: loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Cloud.png"), 
        // 【修改】：將草地改成「陣列 (Array)」，可放入多張不同的變體圖片
        grass: [
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/grass.png"), // 0: 基礎草地
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Grass2.png"), // 1: 雜草地 (待填入)
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Grass(F).png"), // 2: 小花草地 (待填入)
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Grass(S).png")  // 3: 斑駁泥土草地 (待填入)
        ],
        // 【修改】：將山地改成「陣列 (Array)」，支援 4 款不同的變體圖片
        mountain: [
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/mountain.png"), // 0: 基礎山地
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Scattered Gravel.png"), // 1: 碎石山地 (待填入)
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Scorched Earth.png"), // 2: 裂縫山地 (待填入)
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Fissure.png")  // 3: 焦痕山地 (待填入)
        ],
        path: loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/path(S).png")       
    };

// 【新增】：雙方城鎮中心的三階段狀態圖片 (0: 健康, 1: 半血起火, 2: 毀滅廢墟)
    const BASE_IMGS = {
        player: [
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/City centre 100.png"), // 100% ~ 50% 狀態
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/City centre 50.png"), // 50% ~ 1% 狀態
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/City centre 0.png")  // 0% 狀態
        ],
        enemy: [
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3120.png"), // 100% ~ 50% 狀態
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3121.png"), // 50% ~ 1% 狀態
            loadSprite("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3119.png")  // 0% 狀態
        ]
    };

    // 【新增】：環境小動態設定 (未來可填入 imgSrc 替換為您的 AI 精靈圖)
    const AMBIENT_TYPES = {
        'butterfly': { symbol: '🦋', size: 18, speed: 0.5, type: 'wander', imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3089.png' }, // 隨機飛舞的蝴蝶
        'leaf':      { symbol: '🍂', size: 14, speed: 1.5, type: 'wind',   imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3097.png' }, // 被風吹過的落葉
        'bird':      { symbol: '🕊️', size: 20, speed: 1.0, type: 'peck',   imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3095.png' }  // 在地上啄食的鳥
    };
    for (let key in AMBIENT_TYPES) AMBIENT_TYPES[key].img = loadSprite(AMBIENT_TYPES[key].imgSrc);
    let ambientEffects = []; // 存放畫面上所有的環境物件

    // 【新增】：靜態環境裝飾物設定 (預留 imgSrc 供日後填入 PNG 網址)
    const DECORATION_TYPES = {
        'tree1':    { symbol: '🌳', size: 32, imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3100.png' },
        'tree2':    { symbol: '🌲', size: 32, imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3102.png' },
        'rock':     { symbol: '🪨', size: 20, imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3104.png' },
        'mushroom': { symbol: '🍄', size: 16, imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3107.png' },
        'bones':    { symbol: '🦴', size: 18, imgSrc: 'https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/IMG_3110.png' } // 適合放在敵軍山地的骸骨
    };
    for (let key in DECORATION_TYPES) DECORATION_TYPES[key].img = loadSprite(DECORATION_TYPES[key].imgSrc);
    let mapDecorations = []; // 存放畫面上所有靜態裝飾物的陣列


    // --- 全域變數狀態 ---

// 起始資源給予 1000 木材
    let gameGold = 50, gameWood = 1000, gameMeat = 1000, gameStone = 0;

    let isDeleteMode = false;
    let offenseCamp = new Array(10).fill(null);
    
    // 【新增】：將雙方城鎮中心實體化為物件 (含等級、攻防、回血屬性)
    let playerBase = { x: 17, y: 17, hp: 2000, maxHp: 2000, level: 1, damage: 20, range: 160, fireRate: 60, cooldown: 0, healRate: 5 };
    let enemyBase = { x: 2, y: 2, hp: 2000, maxHp: 2000, level: 1, damage: 20, range: 160, fireRate: 60, cooldown: 0, healRate: 5 };
    
    let difficultyLevel = 1, frameCount = 0, spawnTimer = 0;

    let cloudOffsetX = 0, cloudOffsetY = 0;

// 【新增】：用來記錄並取消遊戲主迴圈

// 【新增】：初始化地圖時，根據不同「地形 (Biome)」生成對應裝飾物
    function generateDecorations() {
        mapDecorations = [];
        
        for (let r = 0; r < 20; r++) {
            for (let c = 0; c < 20; c++) {
                
                // 1. 先判斷這格是什麼地形
                let terrain = 'grass';
                if (isPath(c, r)) terrain = 'path';
                else if (r < 6) terrain = 'mountain';

                // 2. 決定是否要長出裝飾物 (15% 機率)
                if (Math.random() < 0.15) {
                    let allowedTypes = [];
                    
                    // 【嚴格綁定】：不同地形給予不同的物件清單
                    if (terrain === 'grass') {
                        // 草地專屬：樹木、蘑菇、小石頭
                        allowedTypes = ['tree1', 'tree2', 'rock', 'mushroom'];
                    } else if (terrain === 'mountain') {
                        // 山地專屬：骸骨、石頭 (如果您不想放石頭，可以改成 ['bones'])
                        allowedTypes = ['bones', 'rock']; 
                    } else if (terrain === 'path') {
                        // 道路：保持淨空，不長任何東西
                        allowedTypes = [];
                    }

                    // 3. 如果這個地形有允許的物件，就隨機抽一個種下去
                    if (allowedTypes.length > 0) {
                        let type = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];
                        let offsetX = (Math.random() - 0.5) * 15;
                        let offsetY = (Math.random() - 0.5) * 15;
                        
                        mapDecorations.push({
                            type: type,
                            x: c * TILE_SIZE + TILE_SIZE / 2 + offsetX,
                            y: r * TILE_SIZE + TILE_SIZE / 2 + offsetY,
                            animOffset: Math.floor(Math.random() * 60) 
                        });
                    }
                }
            }
        }
    }


    // --- 大廳邏輯 ---
    function updateLobbyUI() {
        document.getElementById('gold-count').innerText = playerGold;
        const basicGrid = document.getElementById('basic-grid'); basicGrid.innerHTML = '';
        for (let key in BASIC_UNITS) { 
            let b = BASIC_UNITS[key]; 
            basicGrid.innerHTML += `<div class="char-card basic"><div class="char-symbol" style="color:${b.color}">${b.symbol}</div><div style="font-size:14px; font-weight:bold;">${b.name}</div></div>`; 
        }

        const genGrid = document.getElementById('general-grid'); genGrid.innerHTML = '';
        for (let key in GENERALS) {
            let g = GENERALS[key]; 
            let isUnlocked = unlockedGenerals.includes(key); 
            let isSelected = selectedGenerals.includes(key);
            let card = document.createElement('div'); 
            card.className = `char-card ${isUnlocked ? 'unlocked' : 'locked'} ${isSelected ? 'selected' : ''}`;
            card.innerHTML = `<div class="char-symbol" style="color:${g.color}">${g.symbol}</div><div style="font-size:14px; font-weight:bold;">${g.name}</div><div class="char-desc">${g.desc}</div>${isUnlocked ? '<div class="char-price" style="color:green">已解鎖</div>' : `<div class="char-price">💰 ${g.price}解鎖</div>`}`;
            card.onclick = () => handleGeneralClick(key, g, isUnlocked); 
            genGrid.appendChild(card);
        }
        document.getElementById('select-count').innerText = selectedGenerals.length; 
        document.getElementById('btn-start-game').disabled = selectedGenerals.length > 3;
    }

    function handleGeneralClick(key, g, isUnlocked) {
        if (!isUnlocked) {
            if (playerGold >= g.price && confirm(`花費 ${g.price} 金幣解鎖【${g.name}】？`)) {
                playerGold -= g.price; 
                unlockedGenerals.push(key); 
                localStorage.setItem('tdGameGold_v2', playerGold); 
                localStorage.setItem('tdGameUnlocked_v2', JSON.stringify(unlockedGenerals)); 
                updateLobbyUI();
            } else if (playerGold < g.price) alert("金幣不足！");
            return;
        }
        if (selectedGenerals.includes(key)) selectedGenerals = selectedGenerals.filter(c => c !== key);
        else if (selectedGenerals.length < 3) selectedGenerals.push(key);
        else alert("最多攜帶 3 名武將出戰！");
        updateLobbyUI();
    }

// 【修改】：極致穩定的返回大廳函式

    // --- 答題與資源邏輯 ---
    let currentAnswer = 0;
    function generateQuestion() {
        const isAdd = Math.random() > 0.5; 
        let a = Math.floor(Math.random() * 15) + 1, b = Math.floor(Math.random() * 15) + 1;
        let cAnswer = isAdd ? a + b : (a + b) - a; 
        let qText = isAdd ? `${a} + ${b} = ?` : `${a + b} - ${a} = ?`;
        let options = new Set([cAnswer]); 
        while (options.size < 4) { 
            let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1); 
            if (cAnswer + offset >= 0) options.add(cAnswer + offset); 
        }
        return { questionText: qText, correctAnswer: cAnswer, options: Array.from(options).sort(() => Math.random() - 0.5) };
    }

    function loadNextQuestion() {
        if (gameOver || gameWon) return; 
        const qData = generateQuestion(); 
        currentAnswer = qData.correctAnswer;
        document.getElementById('question').innerText = qData.questionText; 
        let optionsHtml = '';
        qData.options.forEach(opt => { optionsHtml += `<button class="option-btn" onclick="checkAnswer(${opt})">${opt}</button>`; });
        document.getElementById('options-container').innerHTML = optionsHtml;
    }

function checkAnswer(selected) {
        if (gameOver || gameWon) return; 
        const feedback = document.getElementById('feedback');
        if (selected === currentAnswer) {
            // 【新增】：計算市場加成 (每蓋一座或每升級一次多 50 金幣)
            let marketBonus = towers.filter(t => t.id === 'market').reduce((sum, t) => sum + (t.level * 50), 0);
            let earnedGold = 50 + marketBonus;
            
            gameGold += earnedGold; 
            updateResourcesUI(); 
            
            let bonusText = marketBonus > 0 ? ` (包含市場加成 +${marketBonus})` : "";
            feedback.innerText = `✔️ 答對了！獲得 ${earnedGold} 金幣！${bonusText}`; 
            feedback.style.color = "#2ecc71"; 
            loadNextQuestion();
        } else { 
            feedback.innerText = "❌ 答錯囉！請再試一次！"; feedback.style.color = "#e74c3c"; 
        }
    }

    function updateResourcesUI() {
        document.getElementById('game-gold').innerText = gameGold; 
        document.getElementById('game-wood').innerText = gameWood; 
        document.getElementById('game-meat').innerText = gameMeat;
        document.getElementById('game-stone').innerText = gameStone;
    }

    // --- 建造與兵營操作 ---

function buySoldier() {
        const feedback = document.getElementById('feedback');
        // 【新增】：必須先有軍營才能產兵
        if (!towers.some(t => t.id === 'barracks')) { 
            feedback.innerText = "⚠️ 必須先建造【軍營】才能生產士兵！"; 
            feedback.style.color = "#e74c3c";
            return; 
        }
        if (gameMeat < 50) { 
            feedback.innerText = "⚠️ 食物(肉)不足 50！請多建農田。"; 
            feedback.style.color = "#e74c3c";
            return; 
        }
        let emptyIndex = offenseCamp.findIndex(s => s === null);
        if (emptyIndex !== -1) {
            gameMeat -= 50; updateResourcesUI();
            // 【修改】：兵營只會招募基本兵種，將領不再混入
            let pool = Object.keys(BASIC_UNITS); 
            offenseCamp[emptyIndex] = { id: pool[Math.floor(Math.random() * pool.length)], level: 1 };
            feedback.innerText = `✔️ 花費 50 肉招募部隊！`;

            updateCampsUI();
        } else { 
            feedback.innerText = "⚠️ 兵營已滿！請先全軍出擊！"; 
            feedback.style.color = "#e74c3c";
        }

function updateCampsUI() {
        const offSlots = document.querySelectorAll('#offense-camp .slot');
        offSlots.forEach((s, i) => {
            s.innerHTML = ''; s.className = 'slot';
            if (offenseCamp[i]) {
                let u = BASIC_UNITS[offenseCamp[i].id] || GENERALS[offenseCamp[i].id];
                if (u) {
                    if(u.isGeneral) s.classList.add('general'); 
                    s.innerText = u.symbol; s.style.color = u.color;
                    // 如果部隊處於被選取狀態，加入紅色發光特效
                    if (offenseCamp[i].selected) s.classList.add('selected');
                }
            }
        });

    // 【新增】：將領獨立出陣的介面更新
    function updateGeneralsUI() {
        const genContainer = document.getElementById('generals-camp');
        if(!genContainer) return;
        genContainer.innerHTML = '';
        
        selectedGenerals.forEach(gId => {
            let g = GENERALS[gId];
            // 【唯一性判定】：檢查場上或出兵佇列中是否已經有這位將領
            let isDeployed = playerUnits.some(p => p.id === gId) || deployQueue.some(u => u.id === gId);
            
            let btn = document.createElement('button');
            btn.className = 'slot general';
            btn.style.cssText = `font-size:12px; width:55px; background:${isDeployed ? '#bdc3c7' : '#fcf3cf'}; border-color:${g.color};`;
            btn.innerHTML = `${g.name}<br>${isDeployed ? '戰鬥中' : '出戰'}`;
            btn.onclick = () => deployGeneral(gId);
            btn.disabled = isDeployed; // 在場上時按鈕變灰不可按
            genContainer.appendChild(btn);
        });
    }

    // 【新增】：獨立將領出戰邏輯
    window.deployGeneral = function(gId) {
        if (gameOver || gameWon || isDeleteMode) return;
        const feedback = document.getElementById('feedback');

        let tents = towers.filter(t => t.id === 'tent');
        if (tents.length === 0) {
            feedback.innerText = "⚠️ 必須先建造【大帳】才能派出將領！";
            feedback.style.color = "#e74c3c"; return;
        }

        let isDeployed = playerUnits.some(p => p.id === gId) || deployQueue.some(u => u.id === gId);
        if (isDeployed) return; // 雙重防呆

        let tentLvl = Math.max(...tents.map(t => t.level));
        
        // 從大帳位置出發
        let spawnIndex = pathCoords.length - 1; 
        let validIndices = [];
        tents.forEach(b => {
            pathCoords.forEach((p, idx) => { if (Math.abs(p.x - b.x) <= 1 && Math.abs(p.y - b.y) <= 1) validIndices.push(idx); });
        });
        if (validIndices.length > 0) spawnIndex = Math.max(...validIndices);

        deployQueue.push({ id: gId, level: tentLvl, spawnIndex: spawnIndex });
        feedback.innerText = `🔥 傳奇將領【${GENERALS[gId].name}】準備出陣！`;
        feedback.style.color = "#e74c3c";
        updateGeneralsUI();
    };

    window.selectOffenseSlot = function(index) {
        if (!offenseCamp[index]) return;
        const feedback = document.getElementById('feedback');
        
        if (isDeleteMode) {
            offenseCamp[index] = null; 
            feedback.innerText = "🗑️ 已解散該部隊。"; 
            feedback.style.color = "#e74c3c";
        } else {
            // 【修改】：一鍵全選/取消選取所有同類兵種
            let targetId = offenseCamp[index].id;
            let newState = !offenseCamp[index].selected; // 決定是要全選還是全取消
            let count = 0;
            
            // 掃描整個兵營，把同兵種的狀態全部同步
            for (let i = 0; i < offenseCamp.length; i++) {
                if (offenseCamp[i] && offenseCamp[i].id === targetId) {
                    offenseCamp[i].selected = newState;
                    count++;
                }
            }
            
            let unitData = BASIC_UNITS[targetId] || GENERALS[targetId];
            if (newState) {
                feedback.innerText = `✔️ 已一鍵選取 ${count} 支【${unitData.name}】！`;
                feedback.style.color = "#2ecc71";
            } else {
                feedback.innerText = `取消選取【${unitData.name}】。`;
                feedback.style.color = "#e74c3c";
            }
        }
        updateCampsUI();
    };

    window.deployOffense = function() {
        if (isDeleteMode || gameOver || gameWon) return; 
        const feedback = document.getElementById('feedback');

        let selectedIndices = offenseCamp.map((u, i) => (u && u.selected) ? i : -1).filter(i => i !== -1);
        if (selectedIndices.length === 0) {
            feedback.innerText = "⚠️ 請先在兵營中點擊部隊進行多選，再按出擊！";
            feedback.style.color = "#f39c12"; return;
        }

        let barracks = towers.filter(t => t.id === 'barracks');
        if (barracks.length === 0) {
            feedback.innerText = "⚠️ 必須先建造【軍營】才能派出士兵！";
            feedback.style.color = "#e74c3c"; return;
        }

        let barracksLvl = Math.max(...barracks.map(b => b.level));
        let readyUnits = [];

        selectedIndices.forEach(i => {
            let u = offenseCamp[i];
            u.level = barracksLvl; // 綁定軍營等級
            
            let spawnIndex = pathCoords.length - 1; 
            let validIndices = [];
            barracks.forEach(b => {
                pathCoords.forEach((p, idx) => { if (Math.abs(p.x - b.x) <= 1 && Math.abs(p.y - b.y) <= 1) validIndices.push(idx); });
            });
            if (validIndices.length > 0) spawnIndex = Math.max(...validIndices);
            
            u.spawnIndex = spawnIndex;
            readyUnits.push(u);
            offenseCamp[i] = null; 
        });
        
        if (readyUnits.length > 0) { 
            readyUnits.sort((a, b) => BASIC_UNITS[b.id].moveSpd - BASIC_UNITS[a.id].moveSpd);
            readyUnits.forEach(u => deployQueue.push(u)); 
            feedback.innerText = `⚔️ 已下令 ${readyUnits.length} 支部隊依序出擊！`; 
            feedback.style.color = "#e74c3c";
        }
        updateCampsUI(); 
    };

    // --- Canvas 與地圖建造邏輯 ---
    const canvas = document.getElementById('gameCanvas'); 
    const ctx = canvas.getContext('2d');
    // 【效能優化】：限制手機最高只用 1.5 倍渲染，畫質依然清晰，但能大幅減輕 GPU 負擔與發熱！
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5); 
    
    // 【擴大地圖兩倍】：邏輯大小改為 800x800
    canvas.width = 800 * dpr; canvas.height = 800 * dpr; 
    canvas.style.width = "100%"; canvas.style.maxWidth = "800px"; 
    ctx.scale(dpr, dpr); ctx.imageSmoothingEnabled = true; 
    const TILE_SIZE = 40;
    
    // 【修改】：設置主堡八格環狀陣地與連接道路
    const enemyRing = [], playerRing = [];
    for(let dx=-1; dx<=1; dx++) {
        for(let dy=-1; dy<=1; dy++) {
            if(dx===0 && dy===0) continue;
            enemyRing.push({x: 2+dx, y: 2+dy});
            playerRing.push({x: 17+dx, y: 17+dy});
        }
    }

    const pathCoords = [];
    for(let x=4; x<=16; x++) pathCoords.push({x:x, y:2});
    for(let y=3; y<=8; y++) pathCoords.push({x:16, y:y});
    for(let x=15; x>=4; x--) pathCoords.push({x:x, y:8});
    for(let y=9; y<=15; y++) pathCoords.push({x:4, y:y});
    for(let x=5; x<=16; x++) pathCoords.push({x:x, y:15});
    
    function isPath(gx, gy) { 
        return pathCoords.some(p => p.x === gx && p.y === gy) || 
               enemyRing.some(p => p.x === gx && p.y === gy) || 
               playerRing.some(p => p.x === gx && p.y === gy); 
    }
    function getTowerAt(gx, gy) { return towers.find(t => t.x === gx && t.y === gy); }

    // 【核心點擊建造邏輯】
    canvas.addEventListener('click', (e) => {
        if (gameOver || gameWon) return;
        const rect = canvas.getBoundingClientRect(); if (rect.width === 0) return; 
        const scaleX = 800 / rect.width, scaleY = 800 / rect.height; 
        const gx = Math.floor(((e.clientX - rect.left) * scaleX) / TILE_SIZE);
        const gy = Math.floor(((e.clientY - rect.top) * scaleY) / TILE_SIZE);
        if (gx < 0 || gx >= 20 || gy < 0 || gy >= 20) return; 

        const feedback = document.getElementById('feedback');

        // 【新增】：點擊主堡進行升級
        if (gx === 17 && gy === 17) {
            if (isDeleteMode) { feedback.innerText = "⚠️ 城鎮中心無法拆除！"; feedback.style.color = "#e74c3c"; } 
            else {
                let cost = 300 * playerBase.level;
                if (gameGold >= cost) {
                    gameGold -= cost; playerBase.level++;
                    playerBase.maxHp += 1000; playerBase.hp += 1000;
                    playerBase.damage += 10; playerBase.healRate += 2;
                    updateResourcesUI();
                    feedback.innerText = `✨ 城鎮中心升級為 Lv.${playerBase.level}！`; feedback.style.color = "#f1c40f";
                } else {
                    feedback.innerText = `⚠️ 升級城鎮中心需要 ${cost} 金幣！請答題賺錢。`; feedback.style.color = "#e74c3c";
                }
            }
            return;
        }
        if (gx === 2 && gy === 2) { feedback.innerText = "⚠️ 這是敵方城鎮中心！"; feedback.style.color = "#e74c3c"; return; }

        const existingTower = getTowerAt(gx, gy);

        // 1. 拆除模式
        if (isDeleteMode) {
            if (existingTower) { 
                towers = towers.filter(t => t !== existingTower); 
                feedback.innerText = "🗑️ 成功拆除建築物！"; 
                feedback.style.color = "#e74c3c";
            } 
            return;
        }

        // 2. 升級模式
        if (existingTower && !selectedBuilding) {
            let cost = 50 * existingTower.level;
            if (gameGold >= cost) { 
                gameGold -= cost; existingTower.level++; 
                if(existingTower.id === 'gate') { existingTower.maxHp += 500; existingTower.hp += 500; } // 城門升級加血
                updateResourcesUI(); 
                feedback.innerText = `✨ 建築升級為 Lv.${existingTower.level}！`; 
                feedback.style.color = "#f1c40f";
            } else {
                feedback.innerText = `⚠️ 升級需要 ${cost} 金幣！請答題賺錢。`; 
                feedback.style.color = "#e74c3c";
            }
            return;
        }

        // 3. 建造模式
        if (selectedBuilding) {
            let bData = BUILDINGS[selectedBuilding];

            // 【新增】：敵軍前線 6 行 (Y軸 0~5) 屬於危險交戰區，禁止任何建築
            if (gy < 6) {
                feedback.innerText = "⚠️ 敵軍前線山地 (前 6 行) 無法進行建築！"; 
                feedback.style.color = "#e74c3c"; return;
            }

            // 【城門建造限制】：最多 3 個，且不能在另一個城門 2 格範圍內
            if (bData.id === 'gate') {
                let existingGates = towers.filter(t => t.id === 'gate');
                if (existingGates.length >= 3) {
                    feedback.innerText = "⚠️ 整個地圖最多只能建造 3 座城門！"; 
                    feedback.style.color = "#e74c3c"; return;
                }
                let tooClose = existingGates.some(g => Math.abs(g.x - gx) <= 2 && Math.abs(g.y - gy) <= 2);
                if (tooClose) {
                    feedback.innerText = "⚠️ 城門不能蓋在另一座城門的 2 格範圍內！"; 
                    feedback.style.color = "#e74c3c"; return;
                }
            }
            
            // 【軍營數量限制】
            if (bData.id === 'barracks' && towers.some(t => t.id === 'barracks')) {
                feedback.innerText = "⚠️ 軍營只可以起一個！"; 
                feedback.style.color = "#e74c3c"; return;
            }

            // 道路與空地判定
            if (bData.id === 'gate') { 
                // 【新增】：禁止在主堡周圍的八格環狀陣地上蓋城門
                let inRing = enemyRing.some(p => p.x === gx && p.y === gy) || playerRing.some(p => p.x === gx && p.y === gy);
                if (inRing) {
                    feedback.innerText = "⚠️ 城門不能蓋在主堡周圍的陣地上，會阻礙大軍包抄！"; 
                    feedback.style.color = "#e74c3c"; return;
                }
                if (!isPath(gx, gy)) { feedback.innerText = "⚠️ 城門必須蓋在一般道路上！"; feedback.style.color = "#e74c3c"; return; } 
            } else { 
                if (isPath(gx, gy)) { feedback.innerText = "⚠️ 建築不能蓋在道路上！"; feedback.style.color = "#e74c3c"; return; } 
            }
            if (existingTower) { feedback.innerText = "⚠️ 這裡已經有建築了！"; feedback.style.color = "#e74c3c"; return; }
            
            // 領地範圍判定 (城鎮中心或現有建築 3 格內)
            let tc = pathCoords[pathCoords.length - 1]; 
            let inRange = (Math.abs(tc.x - gx) <= 3 && Math.abs(tc.y - gy) <= 3) || towers.some(t => Math.abs(t.x - gx) <= 3 && Math.abs(t.y - gy) <= 3);
            if (!inRange) { feedback.innerText = "⚠️ 只能在我方建築或城鎮中心方圓 3 格內領地建造！"; feedback.style.color = "#e74c3c"; return; }

            // 扣除資源
            if (bData.costType === 'gold' && gameGold >= bData.cost) {
                gameGold -= bData.cost;
            } else if (bData.costType === 'wood' && gameWood >= bData.cost) {
                gameWood -= bData.cost;
            } else if (bData.costType === 'stone' && gameStone >= bData.cost) {
                gameStone -= bData.cost;
            } else { 
                const resName = bData.costType === 'gold' ? '金幣' : (bData.costType === 'wood' ? '木材' : '石頭');
                feedback.innerText = `⚠️ 資源不足！建造 ${bData.name} 需要 ${bData.cost} ${resName}！`; 
                feedback.style.color = "#e74c3c"; return; 
            }
            
            updateResourcesUI(); 
            towers.push({ x: gx, y: gy, id: selectedBuilding, level: 1, cooldown: 0, hp: bData.hp||0, maxHp: bData.hp||0 });
            feedback.innerText = `🏗️ 成功建造 ${bData.name}！`; 
            feedback.style.color = "#2ecc71";
            selectBuilding(selectedBuilding); 
        }
    });

class Enemy {
        constructor(wave, eTypeKey) {
            this.unitData = ENEMY_TYPES[eTypeKey];
            this.id = eTypeKey; this.level = wave;
            this.pathIndex = 0;
            this.x = pathCoords[0].x * TILE_SIZE + TILE_SIZE / 2; 
            this.y = pathCoords[0].y * TILE_SIZE + TILE_SIZE / 2;
            
            this.maxHp = (25 + wave * 15) * this.unitData.hpMult; this.hp = this.maxHp;
            this.speed = this.unitData.moveSpd * 1.5 + (wave * 0.05); 
            this.range = 30 + (this.unitData.range * 20);
            this.damage = 10 * this.unitData.dmg * (1 + wave * 0.2); 
            this.fireRate = Math.max(10, 60 / this.unitData.atkSpd - wave);
            
            this.cooldown = 0; this.state = 0; this.frame = 0; this.facingLeft = true; 
            this.lane = Math.floor(Math.random() * 3) - 1;
            this.laneOffset = this.lane * 12; this.drawOffsetX = 0; this.drawOffsetY = 0;
            
            // 【修改】：隨機鎖定玩家主堡的八格環狀陣地之一，並加入微小偏移防止士兵完全重疊
            let ringBase = playerRing[Math.floor(Math.random() * playerRing.length)];
            this.ringTarget = { x: ringBase.x + (Math.random() * 0.5 - 0.25), y: ringBase.y + (Math.random() * 0.5 - 0.25) };
        }

        update(targetPlayer) {
            if (this.cooldown > 0) this.cooldown--;

            let targetNode = this.pathIndex < pathCoords.length ? pathCoords[this.pathIndex] : this.ringTarget;
            if (targetNode) {
                const tx = targetNode.x * TILE_SIZE + TILE_SIZE / 2, ty = targetNode.y * TILE_SIZE + TILE_SIZE / 2;
                
                // 【修改】：進入包圍網後，取消排隊車道的偏移，確保準確走到包圍點
                if (this.pathIndex >= pathCoords.length) {
                    this.drawOffsetX = 0; this.drawOffsetY = 0;
                } else if (Math.abs(tx - this.x) > Math.abs(ty - this.y)) { 
                    this.drawOffsetX = 0; this.drawOffsetY = this.laneOffset; 
                } else { 
                    this.drawOffsetX = this.laneOffset; this.drawOffsetY = 0; 
                }
                
                if (tx < this.x - 1) this.facingLeft = true;
                else if (tx > this.x + 1) this.facingLeft = false;
            }

            let gate = towers.find(t => t.id === 'gate' && t.x === (targetNode ? Math.floor(targetNode.x) : -1) && t.y === (targetNode ? Math.floor(targetNode.y) : -1));
            if (gate) {
                this.state = 1;
                if (this.cooldown <= 0) { gate.hp -= this.damage; this.cooldown = this.fireRate; this.frame = 0; }
                if (gate.hp <= 0) towers = towers.filter(t => t !== gate);
                return false;
            }
            
            // 【核心修改】：強制部隊走到自己分配的「包圍圈點位」後，才准停下來攻擊主堡
            let ringDist = Math.hypot((this.ringTarget.x * TILE_SIZE + TILE_SIZE/2) - this.x, (this.ringTarget.y * TILE_SIZE + TILE_SIZE/2) - this.y);
            let baseDist = Math.hypot((playerBase.x * TILE_SIZE + TILE_SIZE/2) - this.x, (playerBase.y * TILE_SIZE + TILE_SIZE/2) - this.y);

            // 如果走到包圍點 (ringDist <= 10)，或是遠程兵已經進入射程範圍，才發動攻擊
            if (ringDist <= 10 || (this.range > 50 && baseDist <= this.range + TILE_SIZE/2)) {
                this.state = 1;
                this.facingLeft = (playerBase.x * TILE_SIZE + TILE_SIZE/2) < this.x;
                if (this.cooldown <= 0) {
                    playerBase.hp -= this.damage; this.cooldown = this.fireRate; this.frame = 0;
                    ctx.strokeStyle = this.unitData.color; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(this.x + this.drawOffsetX, this.y + this.drawOffsetY); 
                    ctx.lineTo(playerBase.x * TILE_SIZE + TILE_SIZE/2, playerBase.y * TILE_SIZE + TILE_SIZE/2); ctx.stroke();
                }
                return false;
            }

            if (targetPlayer && Math.hypot((targetPlayer.x + targetPlayer.drawOffsetX) - (this.x + this.drawOffsetX), (targetPlayer.y + targetPlayer.drawOffsetY) - (this.y + this.drawOffsetY)) <= this.range) {
                this.state = 1; this.facingLeft = targetPlayer.x < this.x;
                if (this.cooldown <= 0) {
                    targetPlayer.hp -= this.damage; this.cooldown = this.fireRate; this.frame = 0;
                    ctx.strokeStyle = this.unitData.color; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(this.x + this.drawOffsetX, this.y + this.drawOffsetY); ctx.lineTo(targetPlayer.x + targetPlayer.drawOffsetX, targetPlayer.y + targetPlayer.drawOffsetY); ctx.stroke();
                }
            } else {
                if (!targetNode) return true;
                const tx = targetNode.x * TILE_SIZE + TILE_SIZE / 2, ty = targetNode.y * TILE_SIZE + TILE_SIZE / 2;
                const dx = tx - this.x, dy = ty - this.y;

                const isLaneBlocked = (testLane) => {
                    return enemies.some(e => {
                        if (e === this || e.lane !== testLane) return false;
                        // 【核心修改】：一旦離開主道路準備包圍主堡，取消互相碰撞防堵，讓大軍能順利散開包抄
                        if (this.pathIndex >= pathCoords.length && e.pathIndex >= pathCoords.length) return false;

                        if (Math.hypot(e.x - this.x, e.y - this.y) < 24) { 
                            if (e.pathIndex > this.pathIndex) return true;
                            if (e.pathIndex === this.pathIndex) {
                                let myDist = Math.hypot(tx - this.x, ty - this.y);
                                let eDist = Math.hypot(tx - e.x, ty - e.y);
                                if (eDist < myDist - 0.1) return true; 
                                if (Math.abs(eDist - myDist) <= 0.1) return enemies.indexOf(e) < enemies.indexOf(this); 
                            }
                        }
                        return false;
                    });
                };

                if (isLaneBlocked(this.lane)) {
                    let possibleLanes = this.lane === 0 ? [-1, 1] : [0];
                    possibleLanes.sort(() => Math.random() - 0.5);
                    let switched = false;
                    for (let l of possibleLanes) {
                        if (!isLaneBlocked(l)) { this.lane = l; this.laneOffset = this.lane * 12; switched = true; break; }
                    }
                    if (!switched) { this.state = 4; return false; }
                }

                this.state = 0; const dist = Math.hypot(dx, dy);
                if (dist < this.speed) { this.x = tx; this.y = ty; if(this.pathIndex < pathCoords.length) this.pathIndex++; } 
                else { this.x += (dx / dist) * this.speed; this.y += (dy / dist) * this.speed; }
            }
            return false;
        }
        
        draw() {
            if (this.state === 0) this.frame = Math.floor(globalAnimTick / 10) % 5; 
            else if (this.state === 4) this.frame = Math.floor(globalAnimTick / 15) % 4; 
            else if (this.state === 1) { let attackProgress = 1 - (this.cooldown / this.fireRate); this.frame = Math.min(4, Math.floor(attackProgress * 5)); }

            let cx = this.x + this.drawOffsetX, cy = this.y + this.drawOffsetY;

            if (this.unitData.img && this.unitData.img.complete && !this.unitData.img.isFailed && this.unitData.img.naturalWidth > 0) {
                let frameWidth = this.unitData.img.naturalWidth / 5; let frameHeight = this.unitData.img.naturalHeight / 5;
                let sx = this.frame * frameWidth; let sy = this.state * frameHeight; 
                
                // 【新增】：計算真實的長寬比，自動調整高度，避免長方形圖片被擠壓變形
                let drawWidth = TILE_SIZE * (this.unitData.drawScale || 1.5);
                let aspectRatio = frameHeight / frameWidth;
                let drawHeight = drawWidth * aspectRatio;
                
                // 【新增】：讀取垂直偏移量，預設為 0
                let yOffset = this.unitData.yOffset || 0; 
                
                // 【修改】：將 yOffset 加進 translate 中，並使用新的 drawWidth 和 drawHeight
                ctx.save(); ctx.translate(cx, cy - 5 + yOffset);
                if (this.facingLeft) { ctx.scale(-1, 1); }
                ctx.drawImage(this.unitData.img, sx, sy, frameWidth, frameHeight, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight); 
                ctx.restore();
            } else {
                ctx.fillStyle = this.unitData.color; ctx.beginPath(); ctx.arc(cx, cy, 10 * (this.unitData.drawScale || 1), 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'white'; ctx.font = '12px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.unitData.symbol, cx, cy);
            }
            ctx.fillStyle = 'red'; ctx.fillRect(cx - 10, cy - TILE_SIZE/2 - 10, 20, 3);
            ctx.fillStyle = '#3498db'; ctx.fillRect(cx - 10, cy - TILE_SIZE/2 - 10, 20 * (this.hp / this.maxHp), 3);
        }
    }

    class PlayerUnit {
        constructor(id, level) {
            this.unitData = BASIC_UNITS[id] || GENERALS[id];
            this.id = id; this.level = level;
            this.pathIndex = pathCoords.length - 1; 
            this.x = pathCoords[this.pathIndex].x * TILE_SIZE + TILE_SIZE / 2;
            this.y = pathCoords[this.pathIndex].y * TILE_SIZE + TILE_SIZE / 2;
            this.maxHp = 50 * level * (this.unitData.hpMult || 1); this.hp = this.maxHp;
            this.speed = this.unitData.moveSpd * 1.5; 
            this.range = 30 + (this.unitData.range * 20); 
            this.damage = 10 * this.unitData.dmg * level; 
            this.fireRate = Math.max(10, 60 / this.unitData.atkSpd - (level * 2));
            this.cooldown = 0; this.state = 0; this.frame = 0; this.facingLeft = true; 
            this.lane = Math.floor(Math.random() * 3) - 1;
            this.laneOffset = this.lane * 12; this.drawOffsetX = 0; this.drawOffsetY = 0;
            
            // 【修改】：隨機鎖定敵方主堡的八格環狀陣地之一，並加入微小偏移
            let ringBase = enemyRing[Math.floor(Math.random() * enemyRing.length)];
            this.ringTarget = { x: ringBase.x + (Math.random() * 0.5 - 0.25), y: ringBase.y + (Math.random() * 0.5 - 0.25) };
        }

        update(targetEnemy) {
            if (this.cooldown > 0) this.cooldown--;

            let targetNode = this.pathIndex >= 0 ? pathCoords[this.pathIndex] : this.ringTarget;
            if (targetNode) {
                const tx = targetNode.x * TILE_SIZE + TILE_SIZE / 2, ty = targetNode.y * TILE_SIZE + TILE_SIZE / 2;
                
                // 【修改】：進入敵方包圍網後取消偏移
                if (this.pathIndex < 0) {
                    this.drawOffsetX = 0; this.drawOffsetY = 0;
                } else if (Math.abs(tx - this.x) > Math.abs(ty - this.y)) { 
                    this.drawOffsetX = 0; this.drawOffsetY = this.laneOffset; 
                } else { 
                    this.drawOffsetX = this.laneOffset; this.drawOffsetY = 0; 
                }
                
                if (tx < this.x - 1) this.facingLeft = true;
                else if (tx > this.x + 1) this.facingLeft = false;
            }

            // 【核心修改】：強制走到分配的包圍陣地後才開始攻擊
            let ringDist = Math.hypot((this.ringTarget.x * TILE_SIZE + TILE_SIZE/2) - this.x, (this.ringTarget.y * TILE_SIZE + TILE_SIZE/2) - this.y);
            let baseDist = Math.hypot((enemyBase.x * TILE_SIZE + TILE_SIZE/2) - this.x, (enemyBase.y * TILE_SIZE + TILE_SIZE/2) - this.y);

            if (ringDist <= 10 || (this.range > 50 && baseDist <= this.range + TILE_SIZE/2)) {
                this.state = 1;
                this.facingLeft = (enemyBase.x * TILE_SIZE + TILE_SIZE/2) < this.x;
                if (this.cooldown <= 0) {
                    enemyBase.hp -= this.damage; this.cooldown = this.fireRate; this.frame = 0;
                    ctx.strokeStyle = this.unitData.color; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(this.x + this.drawOffsetX, this.y + this.drawOffsetY); 
                    ctx.lineTo(enemyBase.x * TILE_SIZE + TILE_SIZE/2, enemyBase.y * TILE_SIZE + TILE_SIZE/2); ctx.stroke();
                }
                return false;
            }

            if (targetEnemy && Math.hypot((targetEnemy.x + targetEnemy.drawOffsetX) - (this.x + this.drawOffsetX), (targetEnemy.y + targetEnemy.drawOffsetY) - (this.y + this.drawOffsetY)) <= this.range) {
                this.state = 1; this.facingLeft = targetEnemy.x < this.x;
                if (this.cooldown <= 0) {
                    targetEnemy.hp -= this.damage; this.cooldown = this.fireRate; this.frame = 0;
                    ctx.strokeStyle = this.unitData.color; ctx.lineWidth = this.unitData.isGeneral ? 4 : 2;
                    ctx.beginPath(); ctx.moveTo(this.x + this.drawOffsetX, this.y + this.drawOffsetY); ctx.lineTo(targetEnemy.x + targetEnemy.drawOffsetX, targetEnemy.y + targetEnemy.drawOffsetY); ctx.stroke();
                }
            } else {
                if (!targetNode) return true;
                const tx = targetNode.x * TILE_SIZE + TILE_SIZE / 2, ty = targetNode.y * TILE_SIZE + TILE_SIZE / 2;
                const dx = tx - this.x, dy = ty - this.y;

                const isLaneBlocked = (testLane) => {
                    return playerUnits.some(p => {
                        if (p === this || p.lane !== testLane) return false;
                        // 【核心修改】：進入敵陣準備包抄時，取消我方單位的碰撞判定
                        if (this.pathIndex < 0 && p.pathIndex < 0) return false;

                        if (Math.hypot(p.x - this.x, p.y - this.y) < 24) { 
                            if (p.pathIndex < this.pathIndex) return true; 
                            if (p.pathIndex === this.pathIndex) {
                                let myDist = Math.hypot(tx - this.x, ty - this.y);
                                let pDist = Math.hypot(tx - p.x, ty - p.y);
                                if (pDist < myDist - 0.1) return true;
                                if (Math.abs(pDist - myDist) <= 0.1) return playerUnits.indexOf(p) < playerUnits.indexOf(this);
                            }
                        }
                        return false;
                    });
                };
                
                if (isLaneBlocked(this.lane)) {
                    let possibleLanes = this.lane === 0 ? [-1, 1] : [0];
                    possibleLanes.sort(() => Math.random() - 0.5);
                    let switched = false;
                    for (let l of possibleLanes) {
                        if (!isLaneBlocked(l)) { this.lane = l; this.laneOffset = this.lane * 12; switched = true; break; }
                    }
                    if (!switched) { this.state = 4; return false; }
                }

                this.state = 0; const dist = Math.hypot(dx, dy);
                if (dist < this.speed) { this.x = tx; this.y = ty; if(this.pathIndex >= 0) this.pathIndex--; } 
                else { this.x += (dx / dist) * this.speed; this.y += (dy / dist) * this.speed; }
            }
            return false;
        }
        
        draw() {
            if (this.state === 0) this.frame = Math.floor(globalAnimTick / 10) % 5; 
            else if (this.state === 4) this.frame = Math.floor(globalAnimTick / 15) % 4; 
            else if (this.state === 1) { let attackProgress = 1 - (this.cooldown / this.fireRate); this.frame = Math.min(4, Math.floor(attackProgress * 5)); }

            let cx = this.x + this.drawOffsetX, cy = this.y + this.drawOffsetY;

            if (this.unitData.img && this.unitData.img.complete && !this.unitData.img.isFailed && this.unitData.img.naturalWidth > 0) {
                let frameWidth = this.unitData.img.naturalWidth / 5; let frameHeight = this.unitData.img.naturalHeight / 5;
                let sx = this.frame * frameWidth; let sy = this.state * frameHeight; 
                
                // 【新增】：計算真實的長寬比，自動調整高度，避免長方形圖片被擠壓變形
                let drawWidth = TILE_SIZE * (this.unitData.drawScale || 1.5);
                let aspectRatio = frameHeight / frameWidth;
                let drawHeight = drawWidth * aspectRatio;
                
                // 【新增】：讀取垂直偏移量，預設為 0
                let yOffset = this.unitData.yOffset || 0; 
                
                // 【修改】：將 yOffset 加進 translate 中，並使用新的 drawWidth 和 drawHeight
                ctx.save(); ctx.translate(cx, cy - 5 + yOffset);
                if (this.facingLeft) { ctx.scale(-1, 1); }
                ctx.drawImage(this.unitData.img, sx, sy, frameWidth, frameHeight, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight); 
                ctx.restore();
            } else {
                ctx.fillStyle = this.unitData.isGeneral ? '#fcf3cf' : 'white'; ctx.fillRect(cx - TILE_SIZE/2 + 2, cy - TILE_SIZE/2 + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                if(this.unitData.isGeneral) { ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.strokeRect(cx - TILE_SIZE/2 + 2, cy - TILE_SIZE/2 + 2, TILE_SIZE - 4, TILE_SIZE - 4); }
                ctx.fillStyle = this.unitData.color; ctx.font = '22px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.unitData.symbol, cx, cy);
            }
            ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.fillText('Lv'+this.level, cx, cy + TILE_SIZE/2);
            ctx.fillStyle = 'red'; ctx.fillRect(cx - 10, cy - TILE_SIZE/2 - 10, 20, 3);
            ctx.fillStyle = '#3498db'; ctx.fillRect(cx - 10, cy - TILE_SIZE/2 - 10, 20 * (this.hp / this.maxHp), 3);
        }
    }

    // 【修改】：環境特效類別 (嚴格綁定地形)
    class AmbientEffect {
        constructor() {
            let keys = Object.keys(AMBIENT_TYPES);
            this.typeKey = keys[Math.floor(Math.random() * keys.length)];
            this.data = AMBIENT_TYPES[this.typeKey];
            
            this.alive = true;
            this.life = Math.random() * 500 + 300; 
            this.vx = 0; this.vy = 0;
            this.facingLeft = Math.random() < 0.5; 

            if (this.data.type === 'wind') {
                // 落葉 (Wind)：可以從畫面外任何地方吹進來，吹過所有地形
                this.x = Math.random() < 0.5 ? -20 : Math.random() * 800;
                this.y = this.x === -20 ? Math.random() * 800 : -20;
                this.vx = this.data.speed + Math.random();
                this.vy = this.data.speed * 0.8 + Math.random() * 0.5;
            } else {
                // 蝴蝶 (Wander) 與 小鳥 (Peck)：【強制只在草地上生成】
                let foundGrass = false;
                while (!foundGrass) {
                    let c = Math.floor(Math.random() * 20);
                    let r = Math.floor(Math.random() * 20);
                    
                    // 草地判定條件：不是道路 (isPath為false)，且不是山地 (r >= 6)
                    if (!isPath(c, r) && r >= 6) {
                        this.x = c * TILE_SIZE + Math.random() * TILE_SIZE;
                        this.y = r * TILE_SIZE + Math.random() * TILE_SIZE;
                        foundGrass = true;
                    }
                }

                if (this.data.type === 'wander') {
                    this.vx = (Math.random() - 0.5) * this.data.speed;
                    this.vy = (Math.random() - 0.5) * this.data.speed;
                }
            }
        }

        update() {
            this.life--;
            if (this.life <= 0 || this.x > 850 || this.y > 850) {
                this.alive = false; return;
            }

            if (this.data.type === 'wander' && globalAnimTick % 40 === 0) {
                this.vx = (Math.random() - 0.5) * this.data.speed * 3;
                this.vy = (Math.random() - 0.5) * this.data.speed * 3;
            }
            
            if (this.data.type === 'peck') {
                if (Math.random() < 0.02) { 
                    this.vx = (Math.random() - 0.5) * 3; 
                    this.vy = (Math.random() - 0.5) * 3; 
                } else if (globalAnimTick % 10 === 0) { 
                    this.vx = 0; this.vy = 0; 
                }
            }

            if (this.vx < -0.1) this.facingLeft = true;
            else if (this.vx > 0.1) this.facingLeft = false;

            this.x += this.vx; this.y += this.vy;
        }

        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            
            if (this.data.type === 'wander') ctx.translate(0, Math.sin(globalAnimTick / 10) * 4);
            else if (this.data.type === 'wind') { ctx.translate(0, Math.sin(globalAnimTick / 20) * 5); ctx.rotate(globalAnimTick / 30); }
            else if (this.data.type === 'peck') { if (globalAnimTick % 60 < 10) ctx.translate(0, 2); }

            if (this.facingLeft && this.data.type !== 'wind') { 
                ctx.scale(-1, 1); 
            }

            if (this.data.img && this.data.img.complete && !this.data.img.isFailed && this.data.img.naturalWidth > 0) {
                let fw = this.data.img.naturalWidth / 4; let fh = this.data.img.naturalHeight;
                let frame = Math.floor(globalAnimTick / 15) % 4;
                ctx.drawImage(this.data.img, frame * fw, 0, fw, fh, -this.data.size/2, -this.data.size/2, this.data.size, this.data.size);
            } else {
                ctx.font = `${this.data.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.data.symbol, 0, 0);
            }
            ctx.restore();
        }
    }

// --- 遊戲主迴圈 ---
    function gameLoop() {
        // 【移除原本會直接卡死整個迴圈的 return】
        
        ctx.clearRect(0, 0, 800, 800);
        globalAnimTick++;

        // 判斷遊戲是否還在進行中
        let isPlaying = !gameOver && !gameWon;

        // ============================================
        // 1. 只有在進行中 (isPlaying) 才會執行的「戰鬥與資源邏輯」
        // ============================================
        if (isPlaying) {
            if (globalAnimTick % 30 === 0 && deployQueue.length > 0) {
                let spawnCount = Math.min(2, deployQueue.length);
                for(let i=0; i<spawnCount; i++) {
                    let u = deployQueue.shift();
                    let newU = new PlayerUnit(u.id, u.level); 
                    newU.pathIndex = u.spawnIndex;
                    newU.x = pathCoords[u.spawnIndex].x * TILE_SIZE + TILE_SIZE / 2; 
                    newU.y = pathCoords[u.spawnIndex].y * TILE_SIZE + TILE_SIZE / 2;
                    playerUnits.push(newU); 
                }
            }

            if (globalAnimTick % 60 === 0) {
                towers.forEach(t => {
                    let bData = BUILDINGS[t.id];
                    if (bData.type === 'resource') {
                        let amount = bData.resAmount * t.level;
                        if (bData.resType === 'meat') gameMeat += amount;
                        if (bData.resType === 'wood') gameWood += amount;
                        if (bData.resType === 'gold') gameGold += amount;
                        if (bData.resType === 'stone') gameStone += amount;
                    }
                });
                updateResourcesUI();
            }

            frameCount++;
            if (frameCount % 600 === 0 && difficultyLevel < 15) {
                difficultyLevel += 0.5;
                let newLevel = Math.floor(difficultyLevel);
                document.getElementById('wave-display').innerText = `強度: Lv.${newLevel}`;
                if (newLevel > enemyBase.level) {
                    enemyBase.level = newLevel;
                    enemyBase.maxHp = 2000 + (enemyBase.level - 1) * 1000;
                    enemyBase.hp = Math.min(enemyBase.maxHp, enemyBase.hp + 1000); 
                    enemyBase.damage = 20 + (enemyBase.level - 1) * 10;
                }
            }

            spawnTimer--;
            if (spawnTimer <= 0) {
                let type = 'normal'; let rand = Math.random();
                if (difficultyLevel >= 2 && rand < 0.3) type = 'fast';
                if (difficultyLevel >= 3 && rand >= 0.3 && rand < 0.6) type = 'tank';
                if (difficultyLevel >= 4 && rand >= 0.8) type = 'boss';
                enemies.push(new Enemy(difficultyLevel, type));
                spawnTimer = Math.max(150, 360 - difficultyLevel * 15); 
            }

            [playerBase, enemyBase].forEach((base, idx) => {
                let isPlayer = idx === 0;
                if (globalAnimTick % 60 === 0 && base.hp < base.maxHp) {
                    base.hp = Math.min(base.maxHp, base.hp + base.healRate);
                }
                if (base.cooldown > 0) base.cooldown--;
                else {
                    let bx = base.x * TILE_SIZE + TILE_SIZE / 2; let by = base.y * TILE_SIZE + TILE_SIZE / 2;
                    let targetArr = isPlayer ? enemies : playerUnits;
                    let target = targetArr.find(u => Math.hypot((u.x + u.drawOffsetX) - bx, (u.y + u.drawOffsetY) - by) <= base.range);
                    if (target) {
                        target.hp -= base.damage; base.cooldown = base.fireRate;
                        ctx.strokeStyle = isPlayer ? '#f1c40f' : '#e74c3c'; ctx.lineWidth = 4;
                        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(target.x + target.drawOffsetX, target.y + target.drawOffsetY); ctx.stroke();
                    }
                }
            });

            if (globalAnimTick % 30 === 0) updateGeneralsUI();
        }

        // ============================================
        // 2. 「不管遊戲結束與否」都要繼續運行的動畫與畫圖邏輯
        // ============================================
        
        let terrainFrame = Math.floor(globalAnimTick / 15) % 4;
        const drawAnimatedTerrain = (img, dx, dy) => {
            let frameWidth = img.naturalWidth / 4; let frameHeight = img.naturalHeight;
            let sx = terrainFrame * frameWidth;
            ctx.drawImage(img, sx, 0, frameWidth, frameHeight, dx, dy, TILE_SIZE, TILE_SIZE);
        };

        for (let r = 0; r < 20; r++) {
            for (let c = 0; c < 20; c++) {
                let dx = c * TILE_SIZE, dy = r * TILE_SIZE;
                if (isPath(c, r)) { 
                    if (TERRAIN_IMGS.path && TERRAIN_IMGS.path.complete && !TERRAIN_IMGS.path.isFailed && TERRAIN_IMGS.path.naturalWidth > 0) { 
                        drawAnimatedTerrain(TERRAIN_IMGS.path, dx, dy); 
                    } else { ctx.fillStyle = '#c49f81'; ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE); }
                } else if (r < 6) {
                    let validMntImgs = TERRAIN_IMGS.mountain.filter(img => img && img.complete && !img.isFailed && img.naturalWidth > 0);
                    if (validMntImgs.length > 0) { 
                        let hash = Math.sin(r * 12.9898 + c * 78.233) * 43758.5453; let randVal = hash - Math.floor(hash); 
                        let tileIndex = 0; 
                        if (validMntImgs.length >= 4) {
                            if (randVal > 0.90) tileIndex = 1; else if (randVal > 0.80) tileIndex = 2; else if (randVal > 0.70) tileIndex = 3; 
                        } else { tileIndex = Math.floor(randVal * validMntImgs.length); }
                        drawAnimatedTerrain(validMntImgs[tileIndex], dx, dy); 
                    } else { 
                        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE); ctx.strokeStyle = '#95a5a6'; ctx.strokeRect(dx, dy, TILE_SIZE, TILE_SIZE); 
                    }
                } else { 
                    let validGrassImgs = TERRAIN_IMGS.grass.filter(img => img && img.complete && !img.isFailed && img.naturalWidth > 0);
                    if (validGrassImgs.length > 0) { 
                        let hash = Math.sin(r * 12.9898 + c * 78.233) * 43758.5453; let randVal = hash - Math.floor(hash); 
                        let tileIndex = 0; 
                        if (validGrassImgs.length >= 4) {
                            if (randVal > 0.90) tileIndex = 1; else if (randVal > 0.80) tileIndex = 2; else if (randVal > 0.70) tileIndex = 3; 
                        } else { tileIndex = Math.floor(randVal * validGrassImgs.length); }
                        drawAnimatedTerrain(validGrassImgs[tileIndex], dx, dy); 
                    } else {
                        ctx.fillStyle = '#8fbc8f'; ctx.fillRect(dx, dy, TILE_SIZE, TILE_SIZE); ctx.strokeStyle = '#7da27d'; ctx.strokeRect(dx, dy, TILE_SIZE, TILE_SIZE); 
                    }
                }
            }
        }

        mapDecorations.forEach(dec => {
            let dData = DECORATION_TYPES[dec.type];
            if (dData.img && dData.img.complete && !dData.img.isFailed && dData.img.naturalWidth > 0) {
                let fw = dData.img.naturalWidth / 4; let fh = dData.img.naturalHeight;
                let frame = Math.floor((globalAnimTick + dec.animOffset) / 20) % 4; 
                ctx.drawImage(dData.img, frame * fw, 0, fw, fh, dec.x - dData.size/2, dec.y - dData.size/2, dData.size, dData.size);
            } else {
                ctx.font = `${dData.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillText(dData.symbol, dec.x, dec.y + 4); ctx.fillText(dData.symbol, dec.x, dec.y);
            }
        });

        // 動態產生與更新環境特效 (蝴蝶、落葉等繼續運作)
        if (Math.random() < 0.03 && ambientEffects.length < 20) ambientEffects.push(new AmbientEffect());
        for (let i = ambientEffects.length - 1; i >= 0; i--) {
            let effect = ambientEffects[i];
            // 讓環境特效不受輸贏影響，繼續飄動
            effect.update(); 
            if (!effect.alive) ambientEffects.splice(i, 1); else effect.draw();
        }

        // ============================================
        // 3. 處理部隊 (如果是遊戲結束，強制切換到 idle 狀態)
        // ============================================

        // 敵人行動與繪製
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (isPlaying) {
                let closestPlayer = playerUnits.find(p => Math.hypot((p.x + p.drawOffsetX) - (e.x + e.drawOffsetX), (p.y + p.drawOffsetY) - (e.y + e.drawOffsetY)) <= e.range);
                e.update(closestPlayer);
                
                // 【修改】：原本直接 alert 的觸發點，改成顯示新 UI
                if (playerBase.hp <= 0 && !gameOver) { 
                    gameOver = true;
                    document.getElementById('game-over-title').innerText = "💥 戰敗！";
                    document.getElementById('game-over-title').style.color = "#e74c3c";
                    document.getElementById('game-over-msg').innerText = "我方城池被敵軍攻破了...";
                    document.getElementById('game-over-modal').style.display = 'flex';
                }
            } else {
                // 【核心機制】：遊戲結束時，停止行動並強制回到待機(0)動畫
                e.state = 0; 
                e.cooldown = 0;
            }

            if (e.hp > 0) e.draw(); else enemies.splice(i, 1);
        }

        // 我方部隊行動與繪製
        playerUnits.sort((a, b) => a.y - b.y);
        for (let i = playerUnits.length - 1; i >= 0; i--) {
            let pUnit = playerUnits[i];
            if (isPlaying) {
                let targetEnemy = enemies.find(e => Math.hypot((e.x + e.drawOffsetX) - (pUnit.x + pUnit.drawOffsetX), (e.y + e.drawOffsetY) - (pUnit.y + pUnit.drawOffsetY)) <= pUnit.range);
                pUnit.update(targetEnemy);
                
                // 【修改】：原本直接 alert 的觸發點，改成顯示新 UI
                if (enemyBase.hp <= 0 && !gameWon) {
                    gameWon = true; playerGold += 200; localStorage.setItem('tdGameGold_v2', playerGold);
                    document.getElementById('game-over-title').innerText = "🎉 勝利！";
                    document.getElementById('game-over-title').style.color = "#f1c40f";
                    document.getElementById('game-over-msg').innerText = "成功推平敵軍主堡！獲得 200 金幣！";
                    document.getElementById('game-over-modal').style.display = 'flex';
                }
            } else {
                // 【核心機制】：遊戲結束時，停止行動並強制回到待機(0)動畫
                pUnit.state = 0; 
                pUnit.cooldown = 0;
            }

            if (pUnit.hp <= 0) playerUnits.splice(i, 1); else pUnit.draw(); 
        }

        // 防禦塔繪製 (只保留畫圖，拔掉射擊邏輯的迴圈)
        towers.sort((a, b) => a.y - b.y).forEach(tower => {
            const cx = tower.x * TILE_SIZE, cy = tower.y * TILE_SIZE;
            let bData = BUILDINGS[tower.id];
            
            if (isPlaying && bData.type === 'attack') {
                const range = 60 + (bData.range * 30) + (tower.level * 10);
                const damage = 10 * bData.dmg * tower.level;
                const fireRate = Math.max(10, 60 / bData.spd - (tower.level * 2)); 
                if (tower.cooldown > 0) tower.cooldown--;
                else {
                    const target = enemies.find(e => Math.hypot(e.x - (cx + TILE_SIZE/2), e.y - (cy + TILE_SIZE/2)) < range);
                    if (target) {
                        target.hp -= damage; tower.cooldown = fireRate;
                        ctx.strokeStyle = bData.color; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(cx + TILE_SIZE / 2, cy + TILE_SIZE / 2); ctx.lineTo(target.x, target.y); ctx.stroke();
                    }
                }
            }

            ctx.fillStyle = bData.color; ctx.fillRect(cx + 2, cy + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            ctx.fillStyle = 'white'; ctx.font = '22px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(bData.symbol, cx + TILE_SIZE / 2, cy + TILE_SIZE / 2);
            ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.fillText('Lv'+tower.level, cx + TILE_SIZE/2, cy + TILE_SIZE - 5);
            
            if (tower.id === 'gate') {
                ctx.fillStyle = 'red'; ctx.fillRect(cx, cy - 8, TILE_SIZE, 4); ctx.fillStyle = '#2ecc71'; ctx.fillRect(cx, cy - 8, TILE_SIZE * (tower.hp / tower.maxHp), 4);
            }
        });

        // ============================================
        // 4. 畫雲層與 UI (永遠執行)
        // ============================================
        if (TERRAIN_IMGS.clouds && TERRAIN_IMGS.clouds.complete && !TERRAIN_IMGS.clouds.isFailed && TERRAIN_IMGS.clouds.naturalWidth > 0) {
            let scaleSize = 1.2; let cw = TERRAIN_IMGS.clouds.naturalWidth || 100; let ch = TERRAIN_IMGS.clouds.naturalHeight || 100;
            cloudOffsetX = (cloudOffsetX - 0.8) % (cw * scaleSize); cloudOffsetY = (cloudOffsetY - 0.4) % (ch * scaleSize); 
            ctx.save(); 
            // 【效能優化】：手機上移除耗能的 multiply 混色，改用預設模式並把透明度調低到 0.35
            ctx.globalAlpha = 0.35; 
            ctx.globalCompositeOperation = 'source-over'; 
            let pattern = ctx.createPattern(TERRAIN_IMGS.clouds, 'repeat'); ctx.fillStyle = pattern;
            ctx.translate(cloudOffsetX, cloudOffsetY); ctx.scale(scaleSize, scaleSize); 
            let startX = -cloudOffsetX / scaleSize; let startY = -cloudOffsetY / scaleSize; let drawW = 800 / scaleSize; let drawH = 800 / scaleSize;
            ctx.fillRect(startX, startY, drawW, drawH); ctx.restore();
        }

        const drawBase = (baseObj, imgArray, fallbackColor, symbol, isPlayer) => {
            let cx = baseObj.x * TILE_SIZE; let cy = baseObj.y * TILE_SIZE; let hpRatio = baseObj.hp / baseObj.maxHp;
            let stateIndex = hpRatio > 0.5 ? 0 : (hpRatio > 0 ? 1 : 2);
            let img = imgArray ? imgArray[stateIndex] : null; 
            let drawSize = TILE_SIZE * 2.8; 
            let drawX = cx + (TILE_SIZE / 2) - (drawSize / 2); let drawY = cy + (TILE_SIZE / 2) - (drawSize / 2) - 15; 

            if (img && img.complete && !img.isFailed && img.naturalWidth > 0) {
                let fw = img.naturalWidth / 4; let fh = img.naturalHeight; let frame = Math.floor(globalAnimTick / 15) % 4;
                ctx.drawImage(img, frame * fw, 0, fw, fh, drawX, drawY, drawSize, drawSize);
            } else {
                ctx.fillStyle = fallbackColor; ctx.fillRect(cx, cy, TILE_SIZE, TILE_SIZE);
                ctx.fillStyle = 'white'; ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(symbol, cx + TILE_SIZE/2, cy + TILE_SIZE/2 - 5);
            }

            if (stateIndex !== 2) {
                let barWidth = TILE_SIZE * 1.5; let barX = cx + (TILE_SIZE / 2) - (barWidth / 2); let barY = drawY - 8; 
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.fillText('Lv'+baseObj.level, cx + TILE_SIZE/2, barY - 8);
                ctx.fillStyle = 'red'; ctx.fillRect(barX, barY, barWidth, 4); ctx.fillStyle = '#2ecc71'; ctx.fillRect(barX, barY, barWidth * Math.max(0, Math.min(1, hpRatio)), 4);
            }
        };

        drawBase(playerBase, typeof BASE_IMGS !== 'undefined' ? BASE_IMGS.player : null, '#2980b9', '👑', true);
        drawBase(enemyBase, typeof BASE_IMGS !== 'undefined' ? BASE_IMGS.enemy : null, '#8e44ad', '👿', false);

        document.getElementById('hp-display').innerText = Math.max(0, Math.floor(playerBase.hp));
        document.getElementById('enemy-hp-display').innerText = Math.max(0, Math.floor(enemyBase.hp));

        // 【修改】：強制綁定在 window 全域物件上，確保重置時絕對抓得到！
        window.animFrameId = requestAnimationFrame(gameLoop);
    }

    updateLobbyUI();
</script>
