<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 【新增】：強制瀏覽器每次連網都必須重新下載最新檔案，禁止使用本機快取 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>城池守衛戰 - 世紀帝國 RTS 版</title>
    <style>
        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            background-color: #2c3e50; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 20px;
            /* 【核心修正】：強制頂部最少留白 35px，並自動避開手機瀏海 (Safe Area) */
            padding-top: max(35px, env(safe-area-inset-top)); 
        }
        
        /* 【新增】：讓頂部狀態列永遠吸附在畫面上方 */
        #sticky-top-bar {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 999;
            background-color: #f4e8d3; 
            padding: 10px 0; 
            margin-bottom: 5px;
            border-bottom: 2px dashed #d35400;
        }

        
        /* 擴大外框以容納兩倍大的地圖 */
        #game-wrapper { max-width: 850px; width: 100%; background: #f4e8d3; border: 4px solid #d35400; border-radius: 15px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #333; }
        
        #setup-screen { display: block; }
        .title { text-align: center; color: #c0392b; text-shadow: 1px 1px 0px #fff; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
        .gold-display { font-size: 20px; font-weight: bold; color: #d35400; text-align: right; margin-bottom: 10px; }
        .section-title { font-size: 18px; font-weight: bold; color: #2980b9; margin: 10px 0 5px 0; border-bottom: 2px dashed #bdc3c7; padding-bottom: 5px; }
        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        
        .char-card { background: #fff; border: 3px solid #bdc3c7; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .char-card.basic { border-color: #7f8c8d; background: #ecf0f1; cursor: default; }
        .char-card.unlocked:hover { transform: translateY(-3px); border-color: #f39c12; }
        .char-card.selected { border-color: #e74c3c; background: #fadbd8; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
        .char-card.locked { filter: grayscale(100%); opacity: 0.6; }
        
        .char-symbol { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .char-price { font-size: 12px; color: #e74c3c; font-weight: bold; }
        .char-desc { font-size: 11px; color: #7f8c8d; margin-top: 5px; font-weight: bold; }
        
        .btn-start { width: 100%; background: #d35400; color: #fff; padding: 12px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .btn-start:disabled { background: #95a5a6; cursor: not-allowed; }

        #play-screen { display: none; }
        #header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        canvas { background-color: #dcb88e; border: 2px solid #333; cursor: pointer; width: 100%; max-width: 800px; border-radius: 5px; image-rendering: pixelated; margin: 0 auto; display: block; }
        
        /* 雙兵營介面樣式 */
        #camps-container { background: #ecf0f1; padding: 10px; border-radius: 8px; border: 2px dashed #bdc3c7; margin: 15px 0; width: 100%; box-sizing: border-box;}
        .camp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .camp-label { font-weight: bold; color: #2c3e50; width: 85px; font-size: 15px;}
        .camp-slots { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
        .slot { width: 45px; height: 45px; background-color: #fff; border: 2px solid #7f8c8d; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; position: relative; border-radius: 5px; overflow: hidden; }
        .slot.selected { border-color: #e74c3c; box-shadow: 0 0 8px red; background-color: #ffe6e6; }
        .slot.general { border-color: #f1c40f; background-color: #fcf3cf; }
        .slot-level { position: absolute; top: 2px; right: 2px; font-size: 10px; color: #000; font-weight:bold; text-shadow: 1px 1px 0 #fff; z-index: 10; }
        
        #btn-deploy { background: #c0392b; color: white; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; margin-left: 5px;}
        #btn-delete { background: #7f8c8d; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s;}
        #btn-delete.active { background: #e74c3c; box-shadow: 0 0 10px red;}

        #quiz-section { background: #34495e; padding: 15px; border-radius: 8px; text-align: center; color: #fff; }
        #question { font-size: 24px; font-weight: bold; margin: 0 0 15px 0; color: #f1c40f; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { background: #2980b9; color: white; border: none; padding: 12px; font-size: 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .option-btn:hover { background: #3498db; }
        #feedback { margin-top: 10px; font-weight: bold; height: 20px; }
        /* 【新增】：UI 專用 5 幀行走動畫 */
        .sprite-walk {
            animation: spriteWalkAnim 0.8s infinite;
        }
        @keyframes spriteWalkAnim {
            0%, 19.9% { background-position: 0% 0; }
            20%, 39.9% { background-position: 25% 0; }
            40%, 59.9% { background-position: 50% 0; }
            60%, 79.9% { background-position: 75% 0; }
            80%, 99.9% { background-position: 100% 0; }
            100% { background-position: 0% 0; }
        }
    </style>
</head>
<body>
<!-- 【修改】：結算彈出視窗 UI (縮小並置底) -->
<div id="game-over-modal" style="display:none; position:fixed; bottom:30px; left:50%; transform: translateX(-50%); z-index:1000; width: 90%; max-width: 350px;">
    <div style="background:rgba(44, 62, 80, 0.95); padding:15px; border-radius:10px; text-align:center; border:3px solid #f1c40f; box-shadow: 0 10px 20px rgba(0,0,0,0.8); backdrop-filter: blur(5px);">
        <h2 id="game-over-title" style="margin:0 0 5px 0; font-size: 22px; color:white;">結果</h2>
        <p id="game-over-msg" style="font-size:14px; font-weight: bold; margin: 0 0 15px 0; color:white;">訊息</p>
        <button onclick="returnToMenu()" style="background:#e74c3c; color:white; border:none; padding:8px 20px; font-size:16px; border-radius:5px; cursor:pointer; font-weight:bold; transition: 0.2s;">返回主選單</button>
    </div>
</div>
<div id="game-wrapper">
    <div id="setup-screen">
        <div class="title">城池守衛戰</div>
        <div class="gold-display">💰 金幣: <span id="gold-count">0</span></div>
        <div class="section-title">🛡️ 基本兵種 (預設出戰)</div>
        <div id="basic-grid" class="char-grid"></div>
        <div class="section-title">🔥 傳奇武將 (最多選擇 <span id="select-count">0</span>/3)</div>
        <div id="general-grid" class="char-grid"></div>
        <button id="btn-start-game" class="btn-start" onclick="startGame()">發兵出戰！</button>
    </div>

    <div id="play-screen">
        <!-- 【核心修改】：用 sticky-top-bar 包住血量與資源區塊 -->
        <div id="sticky-top-bar">
            <div id="header">
                <span style="color: #8e44ad;">👿 敵軍: <span id="enemy-hp-display">1000</span></span>
                <span id="wave-display" style="color: #2980b9; margin: 0 10px;">強度: Lv.1</span>
                <span style="color: #e74c3c;">❤️ 我方: <span id="hp-display">1000</span></span>
            </div>
            
            <div style="display:flex; justify-content:space-around; background:#ecf0f1; padding:8px; border-radius:8px; border:2px dashed #bdc3c7; font-weight:bold; margin-bottom:0;">
                <span style="color:#f39c12;">💰 <span id="game-gold">50</span></span>
                <span style="color:#e67e22;">🪵 <span id="game-wood">1000</span></span>
                <span style="color:#c0392b;">🍖 <span id="game-meat">1000</span></span>
                <span style="color:#7f8c8d;">🪨 <span id="game-stone">0</span></span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="800"></canvas>
        
        <div id="camps-container">
            <!-- 【新增】：加回拆除按鈕 -->
            <button id="btn-delete" onclick="toggleDeleteMode()" style="margin-bottom: 8px; width: 100%; background: #7f8c8d; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;">🛠️ 拆除模式: 關閉</button>
            
            <!-- 【新增】：獨立的建築資訊與升級介面 -->
            <div class="camp-row" id="upgrade-ui-row" style="display: none; background: #dff9fb; padding: 8px; border-radius: 5px; border: 2px solid #3498db; margin-bottom: 8px;">
                <span class="camp-label" id="selected-building-name" style="color: #2980b9; width: auto; margin-right: 10px;">🏠 建築</span>
                <span style="flex:1; font-size:14px; color:#2c3e50; font-weight:bold;" id="selected-building-info">Lv.1</span>
                <button id="btn-upgrade-building" onclick="upgradeSelectedTarget()" style="background:#f39c12; color:white; border:none; padding:6px 12px; border-radius:5px; font-weight:bold; cursor:pointer; font-size:14px;">升級 (50金)</button>
            </div>

            <div class="camp-row">
                <span class="camp-label">🏗️ 建築</span>

                    <div id="build-menu" class="camp-slots">
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-farm" onclick="selectBuilding('farm')">🌾農田<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-lumber" onclick="selectBuilding('lumber')">🪓伐木<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-market" onclick="selectBuilding('market')">⚖️市場<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-quarry" onclick="selectBuilding('quarry')">⛏️石礦<br>50金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-barracks" onclick="selectBuilding('barracks')">⛺軍營<br>100木</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-tower" onclick="selectBuilding('tower')">🏹箭塔<br>100木</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-gate" onclick="selectBuilding('gate')">⛩️城門<br>100石</button>
                    <!-- 【新增】：大帳建築 -->
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-tent" onclick="selectBuilding('tent')">🎪大帳<br>200木</button>
                </div>
            </div>
<!-- 【修改】：加入 id="barracks-ui-row" 及預設隱藏 -->
            <div class="camp-row" id="barracks-ui-row" style="display: none;">
                <span class="camp-label">⚔️ 兵營</span>
                <button id="btn-buy-soldier" style="font-size:12px; background:#2ecc71; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;" onclick="buySoldier()">招募<br>50肉</button>
                <div id="offense-camp" class="camp-slots" style="margin-left:5px;">
                    <div class="slot" onclick="selectOffenseSlot(0)"></div><div class="slot" onclick="selectOffenseSlot(1)"></div>
                    <div class="slot" onclick="selectOffenseSlot(2)"></div><div class="slot" onclick="selectOffenseSlot(3)"></div>
                    <div class="slot" onclick="selectOffenseSlot(4)"></div><div class="slot" onclick="selectOffenseSlot(5)"></div>
                    <div class="slot" onclick="selectOffenseSlot(6)"></div><div class="slot" onclick="selectOffenseSlot(7)"></div>
                    <div class="slot" onclick="selectOffenseSlot(8)"></div><div class="slot" onclick="selectOffenseSlot(9)"></div>
                </div>
                <!-- 【修改】：改為出擊選定按鈕 -->
                <button id="btn-deploy" onclick="deployOffense()">出擊<br>選定</button>
            </div>
            
            <!-- 【修改】：加入預設隱藏 style="display: none;" -->
            <div class="camp-row" id="generals-deploy-container" style="display: none;">
                <span class="camp-label">🔥 將領</span>
                <div id="generals-camp" class="camp-slots">
                    <!-- 將領按鈕將在此動態生成 -->
                </div>
            </div>

        <div id="quiz-section">
            <div id="question">題目加載中...</div>
            <div class="options-grid" id="options-container"></div>
            <div id="feedback">答對即可賺取金幣！</div>
        </div>
    </div>
</div>

<script>
    // --- 圖片載入器 ---
    function loadSprite(src) {
        if (!src) return null;
        let img = new Image();
        img.src = src;
        img.onerror = () => { img.isFailed = true; }; 
        return img;
    }

// --- 建築物與兵種資料庫 ---
    const BUILDINGS = {
        "farm": { id: "farm", name: "農田", symbol: "🌾", color: "#f1c40f", type: "resource", resType: "meat", resAmount: 10, costType: "gold", cost: 50, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Farm.png" },
        "lumber": { id: "lumber", name: "伐木廠", symbol: "🪓", color: "#e67e22", type: "resource", resType: "wood", resAmount: 10, costType: "gold", cost: 50, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/伐木廠.png" },
        "market": { id: "market", name: "市場", symbol: "⚖️", color: "#f39c12", type: "buff", costType: "gold", cost: 50, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/市場.png" },
        "quarry": { id: "quarry", name: "石礦場", symbol: "⛏️", color: "#7f8c8d", type: "resource", resType: "stone", resAmount: 10, costType: "gold", cost: 50, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/石礦場.png" },
        "barracks": { id: "barracks", name: "軍營", symbol: "⛺", color: "#d35400", type: "military", costType: "wood", cost: 100, size: 2, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/軍營.png" },
        "tower": { id: "tower", name: "箭塔", symbol: "🏹", color: "#bdc3c7", type: "attack", dmg: 1.5, range: 2.5, spd: 1.2, costType: "wood", cost: 100, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/箭塔.png" }, // 箭塔 4x2 (行0:等待, 行1:攻擊)
        "gate": { id: "gate", name: "城門", symbol: "⛩️", color: "#2c3e50", type: "wall", costType: "stone", cost: 100, hp: 1000, imgSrc: "城門4x4網址.png" }, // 城門 4x4 (4方向, 4開關幀)
        "tent": { id: "tent", name: "大帳", symbol: "🎪", color: "#8e44ad", type: "military", costType: "wood", cost: 200, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/大帳.png" }
    };

// 【修改】：敵方也全面採用我方的參數架構 (攻速、走速、射程、大小設定與精靈圖)
    const ENEMY_TYPES = {
        'normal': { id: 'normal', name: "喪屍", symbol: "屍", color: '#555', dmg: 1.0, range: 0.5, moveSpd: 0.8, atkSpd: 1.0, hpMult: 1, drawScale: 1.3, ultChance: 0.05, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/normal(Z)5x5.png" },
        'fast':   { id: 'fast', name: "快屍", symbol: "快", color: '#f39c12', dmg: 0.8, range: 0.5, moveSpd: 1.6, atkSpd: 1.5, hpMult: 0.5, drawScale: 1.3, ultChance: 0.05, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/fast(Z)5X5.png" },
        'tank':   { id: 'tank', name: "巨屍", symbol: "巨", color: '#2c3e50', dmg: 2.0, range: 0.5, moveSpd: 0.5, atkSpd: 0.6, hpMult: 2.5, drawScale: 1.8, ultChance: 0.05, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/tank(Z)5x5.png" },
        'boss':   { id: 'boss', name: "屍王", symbol: "王", color: '#c0392b', dmg: 4.0, range: 1.0, moveSpd: 0.7, atkSpd: 0.8, hpMult: 6.0, drawScale: 2.2, ultChance: 0.15, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/King(Z)5x5.png" },
        // 【新增】：終極隱藏 Boss - 黑天龍 (極慢、極硬、極高傷)
        'black_dragon': { id: 'black_dragon', name: "天", symbol: "龍", color: '#000000', dmg: 15.0, range: 1.5, moveSpd: 0.25, atkSpd: 0.5, hpMult: 60.0, drawScale: 2.2, ultChance: 0.35, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/黑龍.png" }
    };

    // 【新增 drawScale】：1.5 是預設大小，將領與騎兵可以設大一點
    const BASIC_UNITS = {
        "b4": { id: "b4", name: "刀兵", symbol: "刀", color: "#c0392b", dmg: 1.2, range: 0.5, moveSpd: 0.8, atkSpd: 1.0, hpMult: 1, drawScale: 1.3, yOffset: 0, ultChance: 0.05, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/刀兵5x5.png" },
        "b5": { id: "b5", name: "盾兵", symbol: "盾", color: "#f39c12", dmg: 0.5, range: 0.5, moveSpd: 0.5, atkSpd: 0.8, hpMult: 3, drawScale: 1.3, yOffset: 0, ultChance: 0.05, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/盾兵5x5.png" },
        "b6": { id: "b6", name: "騎兵", symbol: "騎", color: "#d35400", dmg: 1.5, range: 0.5, moveSpd: 2.0, atkSpd: 1.2, hpMult: 1.2, drawScale: 1.8, yOffset: 0, ultChance: 0.05, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/騎兵5x5.png" },
        "b7": { id: "b7", name: "弓兵", symbol: "弓", color: "#27ae60", dmg: 0.8, range: 2.5, moveSpd: 0.8, atkSpd: 1.5, hpMult: 0.8, drawScale: 1.3, yOffset: 0, ultChance: 0.05, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/弓兵5x5.png" } 
    };

    const GENERALS = {
        "g1": { id: "g1", name: "關羽", symbol: "關", color: "#c0392b", price: 100, isGeneral: true, dmg: 3, range: 1, moveSpd: 1.2, atkSpd: 1.2, hpMult: 2, drawScale: 1.8, ultChance: 0.20, desc: "進攻：高額傷害", imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/關羽5x5.png" },
        "g2": { id: "g2", name: "趙雲", symbol: "趙", color: "#2980b9", price: 100, isGeneral: true, dmg: 1.5, range: 1, moveSpd: 2.5, atkSpd: 2.0, hpMult: 1.5, drawScale: 1.8, ultChance: 0.20, desc: "進攻：極快衝陣", imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/趙雲5x5.png" },
        "g3": { 
            id: "g3", name: "如來", symbol: "佛", color: "#f1c40f", price: 0, isGeneral: true, 
            dmg: 2.5, range: 1.2, moveSpd: 1.0, atkSpd: 1.0, hpMult: 3, drawScale: 1.8, 
            desc: "進攻：範圍傷害，瀕死化身大佛", 
            ultChance: 0.20,
            imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/如來5x5.png", 
            imgSrc2: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/如來(大佛)5x5.png", // 【新增】：專屬第二型態圖片
            hasAoE: true,          // 【新增】：開啟範圍攻擊
            isTransformable: true  // 【新增】：開啟瀕死變身機制
        },
        "g4": { id: "g4", name: "呂布", symbol: "呂", color: "#000000", price: 200, isGeneral: true, dmg: 4, range: 1.2, moveSpd: 1.5, atkSpd: 1.0, hpMult: 2.5, drawScale: 1.8, desc: "進攻：戰神降臨", ultChance: 0.30, imgSrc: "https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/呂布5x5.png" }
    };

    function generateDecorations() {
        mapDecorations = [];
        
        for (let r = 0; r < 20; r++) {
            for (let c = 0; c < 20; c++) {
                
                // 1. 先判斷這格是什麼地形
                let terrain = 'grass';
                if (isPath(c, r)) terrain = 'path';
                else if (r < 6) terrain = 'mountain';

                // 2. 決定是否要長出裝飾物 (15% 機率)
                if (Math.random() < 0.15) {
                    let allowedTypes = [];
                    
                    // 【嚴格綁定】：不同地形給予不同的物件清單
                    if (terrain === 'grass') {
                        // 草地專屬：樹木、蘑菇、小石頭
                        allowedTypes = ['tree1', 'tree2', 'rock', 'mushroom'];
                    } else if (terrain === 'mountain') {
                        // 山地專屬：骸骨、石頭 (如果您不想放石頭，可以改成 ['bones'])
                        allowedTypes = ['bones', 'rock']; 
                    } else if (terrain === 'path') {
                        // 道路：保持淨空，不長任何東西
                        allowedTypes = [];
                    }

                    // 3. 如果這個地形有允許的物件，就隨機抽一個種下去
                    if (allowedTypes.length > 0) {
                        let type = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];
                        let offsetX = (Math.random() - 0.5) * 15;
                        let offsetY = (Math.random() - 0.5) * 15;
                        
                        mapDecorations.push({
                            type: type,
                            x: c * TILE_SIZE + TILE_SIZE / 2 + offsetX,
                            y: r * TILE_SIZE + TILE_SIZE / 2 + offsetY,

    // --- 答題與資源邏輯 ---
    let currentAnswer = 0;
    function generateQuestion() {
        const isAdd = Math.random() > 0.5; 
        let a = Math.floor(Math.random() * 15) + 1, b = Math.floor(Math.random() * 15) + 1;
        let cAnswer = isAdd ? a + b : (a + b) - a; 
        let qText = isAdd ? `${a} + ${b} = ?` : `${a + b} - ${a} = ?`;
        let options = new Set([cAnswer]); 
        while (options.size < 4) { 
            let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1); 
            if (cAnswer + offset >= 0) options.add(cAnswer + offset); 
        }
        return { questionText: qText, correctAnswer: cAnswer, options: Array.from(options).sort(() => Math.random() - 0.5) };
    }

    function loadNextQuestion() {
        if (gameOver || gameWon) return; 
        const qData = generateQuestion(); 
        currentAnswer = qData.correctAnswer;
        document.getElementById('question').innerText = qData.questionText; 
        let optionsHtml = '';
        qData.options.forEach(opt => { optionsHtml += `<button class="option-btn" onclick="checkAnswer(${opt})">${opt}</button>`; });
        document.getElementById('options-container').innerHTML = optionsHtml;
    }

function checkAnswer(selected) {
        if (gameOver || gameWon) return; 
        const feedback = document.getElementById('feedback');
        if (selected === currentAnswer) {
            let marketBonus = towers.filter(t => t.id === 'market').reduce((sum, t) => sum + (t.level * 50), 0);
            let earnedGold = 50 + marketBonus;
            
            gameGold += earnedGold; 
            
            // 1. 主城回血特效
            let healAmount = playerBase.maxHp * 0.15;
            playerBase.hp = Math.min(playerBase.maxHp, playerBase.hp + healAmount);
            floatingTexts.push({ x: playerBase.x * TILE_SIZE + TILE_SIZE/2, y: playerBase.y * TILE_SIZE - 20, text: "💖 +15% HP", color: "#2ecc71", timer: 60, vy: -0.8 });

            // 2. 士兵讚賞 (隨機抽最多 3 隻士兵講嘢，防止重疊)
            const praises = ["好叻呀！", "勁呀！", "太聰明啦！", "答得好！", "滿分！"];
            let aliveUnits = playerUnits.filter(p => !p.isDying);
            aliveUnits.sort(() => 0.5 - Math.random()).slice(0, 3).forEach(p => {
                let praise = praises[Math.floor(Math.random() * praises.length)];
                floatingTexts.push({ x: p.x + p.drawOffsetX, y: p.y + p.drawOffsetY - 30, text: praise, color: "#fff", timer: 60, vx: (Math.random()-0.5)*0.5, vy: -0.5 - Math.random()*0.5 });
            });

            // 3. 市場賺錢噴泉特效 (根據等級動態顯示金額)
            towers.forEach(t => {
                if (t.id === 'market') {
                    let bonusAmount = t.level * 50; // 動態計算該市場的實際加成
                    floatingTexts.push({ 
                        x: t.x * TILE_SIZE + TILE_SIZE/2 + (Math.random() * 10 - 5), 
                        y: t.y * TILE_SIZE - 10 + (Math.random() * 10 - 5), 
                        text: `💰+${bonusAmount}`, 
                        color: "#f1c40f", 
                        timer: 50 + Math.random() * 20, 
                        vx: (Math.random() - 0.5) * 1.5, 
                        vy: -0.8 - Math.random(),        
                        font: 'bold 14px Arial'
                    });
                }
            });
            
            updateResourcesUI(); 
            let bonusText = marketBonus > 0 ? ` (包含市場加成 +${marketBonus})` : "";
            feedback.innerText = `✔️ 答對了！獲得 ${earnedGold} 金幣！${bonusText}`; 
            feedback.style.color = "#2ecc71"; 
            loadNextQuestion();
        } else { 
            feedback.innerText = "❌ 答錯囉！請再試一次！"; feedback.style.color = "#e74c3c"; 
        }
    }

// 【修改】：一鍵徵兵邏輯 (按一下自動計算肉量並填滿兵營空位)
    window.buySoldier = function() {
        const feedback = document.getElementById('feedback');
        
        // 1. 檢查是否有軍營
        if (!towers.some(t => t.id === 'barracks')) { 
            feedback.innerText = "⚠️ 必須先建造【軍營】才能生產士兵！"; 
            feedback.style.color = "#e74c3c";
            return; 
        }

        // 2. 找出兵營 (offenseCamp) 裡面所有的空位 (null)
        let emptyIndices = [];
        for (let i = 0; i < offenseCamp.length; i++) {
            if (offenseCamp[i] === null) emptyIndices.push(i);
        }

        if (emptyIndices.length === 0) { 
            feedback.innerText = "⚠️ 兵營已滿！請先全軍出擊！"; 
            feedback.style.color = "#e74c3c";
            return;
        }

        // 3. 計算目前的肉量最多可以買幾隻兵 (每隻 50 肉)
        let affordableCount = Math.floor(gameMeat / 50);
        
        if (affordableCount <= 0) { 
            feedback.innerText = "⚠️ 食物(肉)不足 50！請多建農田。"; 
            feedback.style.color = "#e74c3c";
            return; 
        }

        // 4. 實際招募數量 = 「空位數量」與「買得起數量」的最小值
        let recruitCount = Math.min(emptyIndices.length, affordableCount);

        // 5. 一次過扣除總消耗資源
        gameMeat -= (50 * recruitCount); 
        updateResourcesUI();

        // 6. 批次將隨機士兵加入剛剛找到的兵營空位中
        let pool = Object.keys(BASIC_UNITS); 
        for (let i = 0; i < recruitCount; i++) {
            let targetIndex = emptyIndices[i];
            let randomUnitId = pool[Math.floor(Math.random() * pool.length)];
            offenseCamp[targetIndex] = { id: randomUnitId, level: 1 };
        }

        // 7. 更新介面與提示訊息
        feedback.innerText = `✔️ 花費 ${50 * recruitCount} 肉，一鍵招募了 ${recruitCount} 支部隊！`; 
        feedback.style.color = "#2ecc71";
        updateCampsUI();
    };

    function updateCampsUI() {
        const offSlots = document.querySelectorAll('#offense-camp .slot');
        offSlots.forEach((s, i) => {
            s.innerHTML = ''; s.className = 'slot';
            if (offenseCamp[i]) {
                let u = BASIC_UNITS[offenseCamp[i].id] || GENERALS[offenseCamp[i].id];
                if (u) {

                }
            }
        });
    }

// 【修改】：將將領介面改為純顯示狀態，移除點擊出戰功能

    // 【新增】：獨立將領出戰邏輯
    window.deployGeneral = function(gId) {
        if (gameOver || gameWon || isDeleteMode) return;
        const feedback = document.getElementById('feedback');

        let tents = towers.filter(t => t.id === 'tent');
        if (tents.length === 0) {
            feedback.innerText = "⚠️ 必須先建造【大帳】才能派出將領！";
            feedback.style.color = "#e74c3c"; return;
        }

        let isDeployed = playerUnits.some(p => p.id === gId) || deployQueue.some(u => u.id === gId);
        if (isDeployed) return; // 雙重防呆

        let tentLvl = Math.max(...tents.map(t => t.level));
        
        // 從大帳位置出發
        let spawnIndex = pathCoords.length - 1; 
        let validIndices = [];
        tents.forEach(b => {
            pathCoords.forEach((p, idx) => { if (Math.abs(p.x - b.x) <= 1 && Math.abs(p.y - b.y) <= 1) validIndices.push(idx); });
        });
        if (validIndices.length > 0) spawnIndex = Math.max(...validIndices);

        deployQueue.push({ id: gId, level: tentLvl, spawnIndex: spawnIndex });
        feedback.innerText = `🔥 傳奇將領【${GENERALS[gId].name}】準備出陣！`;

    window.selectOffenseSlot = function(index) {

            let targetId = offenseCamp[index].id;
            let newState = !offenseCamp[index].selected; // 決定是要全選還是全取消
            let count = 0;
            
            // 掃描整個兵營，把同兵種的狀態全部同步
            for (let i = 0; i < offenseCamp.length; i++) {
                if (offenseCamp[i] && offenseCamp[i].id === targetId) {
                    offenseCamp[i].selected = newState;
                    count++;
                }
            }
            
            let unitData = BASIC_UNITS[targetId] || GENERALS[targetId];

    window.deployOffense = function() {
        if (isDeleteMode || gameOver || gameWon) return; 
        const feedback = document.getElementById('feedback');

        let selectedIndices = offenseCamp.map((u, i) => (u && u.selected) ? i : -1).filter(i => i !== -1);

            });
            if (validIndices.length > 0) spawnIndex = Math.max(...validIndices);
            
            u.spawnIndex = spawnIndex;
            readyUnits.push(u);
            offenseCamp[i] = null; 
        });
        
        if (readyUnits.length > 0) { 
            readyUnits.sort((a, b) => BASIC_UNITS[b.id].moveSpd - BASIC_UNITS[a.id].moveSpd);
            readyUnits.forEach(u => deployQueue.push(u));

    // ============================================

    let currentSelectedTarget = null;
    let currentSelectedType = null;

    window.upgradeSelectedTarget = function() {

                gameGold -= cost; currentSelectedTarget.level++;

                showUpgradeUI(bData.name, currentSelectedTarget.level, 50 * currentSelectedTarget.level);
            } else {

            }
        }

    // --- Canvas 與地圖建造邏輯 ---
    const canvas = document.getElementById('gameCanvas'); 
    const ctx = canvas.getContext('2d');
    // 【效能優化】：限制手機最高只用 1.5 倍渲染，畫質依然清晰，但能大幅減輕 GPU 負擔與發熱！
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5); 
    
    // 【擴大地圖兩倍】：邏輯大小改為 800x800
    canvas.width = 800 * dpr; canvas.height = 800 * dpr; 
    canvas.style.width = "100%"; canvas.style.maxWidth = "800px"; 
    ctx.scale(dpr, dpr); ctx.imageSmoothingEnabled = true; 
    const TILE_SIZE = 40;
    
    // 【修改】：設置主堡八格環狀陣地與連接道路
    const enemyRing = [], playerRing = [];
    for(let dx=-1; dx<=1; dx++) {
        for(let dy=-1; dy<=1; dy++) {
            if(dx===0 && dy===0) continue;
            enemyRing.push({x: 2+dx, y: 2+dy});
            playerRing.push({x: 17+dx, y: 17+dy});
        }
    }

    const pathCoords = [];
    for(let x=4; x<=16; x++) pathCoords.push({x:x, y:2});
    for(let y=3; y<=8; y++) pathCoords.push({x:16, y:y});
    for(let x=15; x>=4; x--) pathCoords.push({x:x, y:8});
    for(let y=9; y<=15; y++) pathCoords.push({x:4, y:y});
    for(let x=5; x<=16; x++) pathCoords.push({x:x, y:15});
    
    function isPath(gx, gy) { 
        return pathCoords.some(p => p.x === gx && p.y === gy) || 
               enemyRing.some(p => p.x === gx && p.y === gy) || 
               playerRing.some(p => p.x === gx && p.y === gy); 
    }
    // 【新增】：尋找距離建築物絕對最近的道路坐標 (解決建築遠離道路無法出兵的 Bug)
    window.getNearestPathIndex = function(buildX, buildY) {
        let minDist = Infinity; 
        let bestIdx = pathCoords.length - 1; // 預設為主堡
        pathCoords.forEach((p, i) => {
            let d = Math.hypot(p.x - buildX, p.y - buildY);
            if(d < minDist) { minDist = d; bestIdx = i; }
        });
        return bestIdx;
    };
    
    // 【修改】：讓系統知道 2x2 建築佔用多格，點擊範圍內任何一格都能正確選中或判定障礙
    function getTowerAt(gx, gy) { 
        return towers.find(t => {
            let s = BUILDINGS[t.id].size || 1;
            // 檢查點擊的坐標 (gx, gy) 是否落在建築的 (x 到 x+s, y 到 y+s) 範圍內
            return gx >= t.x && gx < t.x + s && gy >= t.y && gy < t.y + s;
        }); 
    }

    // 【核心點擊建造邏輯】
    // 【核心點擊邏輯】：分離建造、拆除與選取升級
    canvas.addEventListener('click', (e) => {
        if (gameOver || gameWon) return;
        const rect = canvas.getBoundingClientRect(); if (rect.width === 0) return; 
        const scaleX = 800 / rect.width, scaleY = 800 / rect.height; 
        const gx = Math.floor(((e.clientX - rect.left) * scaleX) / TILE_SIZE);
        const gy = Math.floor(((e.clientY - rect.top) * scaleY) / TILE_SIZE);
        if (gx < 0 || gx >= 20 || gy < 0 || gy >= 20) return; 

        const feedback = document.getElementById('feedback');
        const existingTower = getTowerAt(gx, gy);

        // 預設先隱藏所有額外介面
        const upgradeUI = document.getElementById('upgrade-ui-row');
        const barracksUI = document.getElementById('barracks-ui-row');
        const generalsUI = document.getElementById('generals-deploy-container');
        if (upgradeUI) upgradeUI.style.display = 'none';
        if (barracksUI) barracksUI.style.display = 'none';
        if (generalsUI) generalsUI.style.display = 'none';
        currentSelectedTarget = null;
        currentSelectedType = null;

        // 1. 拆除模式
        if (isDeleteMode) {
            if (gx === 17 && gy === 17) { feedback.innerText = "⚠️ 城鎮中心無法拆除！"; feedback.style.color = "#e74c3c"; return; }
            if (existingTower) { 
                towers = towers.filter(t => t !== existingTower); 
                feedback.innerText = "🗑️ 成功拆除建築物！"; 
                feedback.style.color = "#e74c3c";
            } 
            return;
        }

// 2. 建造模式 (優先判定)
        if (selectedBuilding) {
            // 【新增】：如果在建造模式點擊了現有建築或主堡，自動取消建造模式！
            if (existingTower || (gx === 17 && gy === 17) || (gx === 2 && gy === 2)) {
                selectedBuilding = null;
                document.querySelectorAll('#build-menu .slot').forEach(btn => btn.style.borderColor = '#7f8c8d');
                // 這裡不 return，讓程式繼續往下跑進入「選取與升級模式」打開選單
            } else {
                // 正常的起樓邏輯
                let bData = BUILDINGS[selectedBuilding];
                let bSize = bData.size || 1;

                if (gx + bSize > 20 || gy + bSize > 20) { feedback.innerText = "⚠️ 建築範圍超出地圖邊界！"; feedback.style.color = "#e74c3c"; return; }
                if (gy < 6) { feedback.innerText = "⚠️ 敵軍前線山地 (前 6 行) 無法進行建築！"; feedback.style.color = "#e74c3c"; return; }

                if (bData.id === 'gate') {
                    let existingGates = towers.filter(t => t.id === 'gate');
                    if (existingGates.length >= 3) { feedback.innerText = "⚠️ 整個地圖最多只能建造 3 座城門！"; feedback.style.color = "#e74c3c"; return; }
                    let tooClose = existingGates.some(g => Math.abs(g.x - gx) <= 2 && Math.abs(g.y - gy) <= 2);
                    if (tooClose) { feedback.innerText = "⚠️ 城門不能蓋在另一座城門的 2 格範圍內！"; feedback.style.color = "#e74c3c"; return; }
                    let inRing = enemyRing.some(p => p.x === gx && p.y === gy) || playerRing.some(p => p.x === gx && p.y === gy);
                    if (inRing) { feedback.innerText = "⚠️ 城門不能蓋在主堡陣地上！"; feedback.style.color = "#e74c3c"; return; }
                }
                if (bData.id === 'barracks' && towers.some(t => t.id === 'barracks')) { feedback.innerText = "⚠️ 軍營只可以起一個！"; feedback.style.color = "#e74c3c"; return; }
                if (bData.id === 'tent' && towers.some(t => t.id === 'tent')) { feedback.innerText = "⚠️ 大帳只可以起一個！"; feedback.style.color = "#e74c3c"; return; }

                let overlapPath = false; let overlapBuilding = false;
                for (let dx = 0; dx < bSize; dx++) {
                    for (let dy = 0; dy < bSize; dy++) {
                        if (isPath(gx + dx, gy + dy)) overlapPath = true;
                        if (getTowerAt(gx + dx, gy + dy)) overlapBuilding = true;
                        if ((gx + dx === 17 && gy + dy === 17) || (gx + dx === 2 && gy + dy === 2)) overlapBuilding = true;
                    }
                }

                if (bData.id === 'gate') { if (!isPath(gx, gy)) { feedback.innerText = "⚠️ 城門必須蓋在一般道路上！"; feedback.style.color = "#e74c3c"; return; } } 
                else { if (overlapPath) { feedback.innerText = "⚠️ 建築的任何一角都不能蓋在道路上！"; feedback.style.color = "#e74c3c"; return; } }
                if (overlapBuilding) { feedback.innerText = "⚠️ 這裡空間不足，已經有建築或主堡了！"; feedback.style.color = "#e74c3c"; return; }

// 【修改】：精準領地判定 (主堡 3格範圍，普通建築 1格範圍)
                let inRange = false;
                for (let dx = 0; dx < bSize; dx++) {
                    for (let dy = 0; dy < bSize; dy++) {
                        let cx = gx + dx, cy = gy + dy;
                        
                        // 1. 檢查是否在主堡 3 格勢力範圍內 (以主堡 17,17 為絕對中心)
                        if (Math.abs(playerBase.x - cx) <= 3 && Math.abs(playerBase.y - cy) <= 3) {
                            inRange = true; break;
                        }
                        
                        // 2. 檢查是否在現有建築 1 格範圍內
                        if (towers.some(t => {
                            let s = BUILDINGS[t.id].size || 1;
                            return cx >= t.x - 1 && cx <= t.x + s && cy >= t.y - 1 && cy <= t.y + s;
                        })) { 
                            inRange = true; break; 
                        }
                    }
                    if (inRange) break;
                }
                if (!inRange) { feedback.innerText = "⚠️ 只能在我方主堡(大範圍)或現有建築(1格)周圍建造！"; feedback.style.color = "#e74c3c"; return; }

                if (bData.costType === 'gold' && gameGold >= bData.cost) { gameGold -= bData.cost; } 
                else if (bData.costType === 'wood' && gameWood >= bData.cost) { gameWood -= bData.cost; } 
                else if (bData.costType === 'stone' && gameStone >= bData.cost) { gameStone -= bData.cost; } 
                else { 
                    const resName = bData.costType === 'gold' ? '金幣' : (bData.costType === 'wood' ? '木材' : '石頭');
                    feedback.innerText = `⚠️ 資源不足！需要 ${bData.cost} ${resName}！`; feedback.style.color = "#e74c3c"; return; 
                }
                
                updateResourcesUI(); 
                towers.push({ x: gx, y: gy, id: selectedBuilding, level: 1, cooldown: 0, hp: bData.hp||0, maxHp: bData.hp||0, state: 0, frame: 0, dir: 0 });
                feedback.innerText = `🏗️ 成功建造 ${bData.name}！可繼續點擊空地建造。`; feedback.style.color = "#2ecc71";
                return; 
            }
        }

        // 3. 點擊選取與升級模式 (非建造、非拆除)
        if (gx === 2 && gy === 2) { feedback.innerText = "⚠️ 這是敵方城鎮中心！"; feedback.style.color = "#e74c3c"; return; }

        if (gx === 17 && gy === 17) {
            currentSelectedTarget = playerBase;
            currentSelectedType = 'base';
            showUpgradeUI('城鎮中心', playerBase.level, 300 * playerBase.level);
            return;
        }

        if (existingTower) {
            currentSelectedTarget = existingTower;
            currentSelectedType = 'tower';
            let bData = BUILDINGS[existingTower.id];
            showUpgradeUI(bData.name, existingTower.level, 50 * existingTower.level);

            if (existingTower.id === 'barracks' && barracksUI) barracksUI.style.display = 'flex';
            if (existingTower.id === 'tent' && generalsUI) generalsUI.style.display = 'flex';
        }
    });


class Enemy {
        constructor(wave, eTypeKey) {
            this.unitData = ENEMY_TYPES[eTypeKey];
            this.id = eTypeKey; this.level = wave;
            this.pathIndex = 0;
            this.x = pathCoords[0].x * TILE_SIZE + TILE_SIZE / 2; 
            this.y = pathCoords[0].y * TILE_SIZE + TILE_SIZE / 2;
            
            this.maxHp = (25 + wave * 15) * this.unitData.hpMult; this.hp = this.maxHp;
            this.speed = this.unitData.moveSpd * 1.5 + (wave * 0.05); 
            this.range = 30 + (this.unitData.range * 20);
            this.damage = 10 * this.unitData.dmg * (1 + wave * 0.2); 
            this.fireRate = Math.max(10, 60 / this.unitData.atkSpd - wave);
            
            this.cooldown = 0; this.state = 0; this.frame = 0; this.facingLeft = true; 
            this.lane = Math.floor(Math.random() * 3) - 1;
            this.laneOffset = this.lane * 12; this.drawOffsetX = 0; this.drawOffsetY = 0;

class PlayerUnit {
