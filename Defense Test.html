<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 【新增】：強制瀏覽器每次連網都必須重新下載最新檔案，禁止使用本機快取 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>城池守衛戰 - 世紀帝國 RTS 版</title>
    <style>
        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            background-color: #2c3e50; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 20px;
            /* 【核心修正】：強制頂部最少留白 35px，並自動避開手機瀏海 (Safe Area) */
            padding-top: max(35px, env(safe-area-inset-top)); 
        }
        
        /* 【新增】：讓頂部狀態列永遠吸附在畫面上方 */
        #sticky-top-bar {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 999;
            background-color: #f4e8d3; 
            padding: 10px 0; 
            margin-bottom: 5px;
            border-bottom: 2px dashed #d35400;
        }

        
        /* 擴大外框以容納兩倍大的地圖 */
        #game-wrapper { max-width: 850px; width: 100%; background: #f4e8d3; border: 4px solid #d35400; border-radius: 15px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #333; }
        
        #setup-screen { display: block; }
        .title { text-align: center; color: #c0392b; text-shadow: 1px 1px 0px #fff; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
        .gold-display { font-size: 20px; font-weight: bold; color: #d35400; text-align: right; margin-bottom: 10px; }
        .section-title { font-size: 18px; font-weight: bold; color: #2980b9; margin: 10px 0 5px 0; border-bottom: 2px dashed #bdc3c7; padding-bottom: 5px; }
        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        
        .char-card { background: #fff; border: 3px solid #bdc3c7; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .char-card.basic { border-color: #7f8c8d; background: #ecf0f1; cursor: default; }
        .char-card.unlocked:hover { transform: translateY(-3px); border-color: #f39c12; }
        .char-card.selected { border-color: #e74c3c; background: #fadbd8; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }
        .char-card.locked { filter: grayscale(100%); opacity: 0.6; }
        
        .char-symbol { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .char-price { font-size: 12px; color: #e74c3c; font-weight: bold; }
        .char-desc { font-size: 11px; color: #7f8c8d; margin-top: 5px; font-weight: bold; }
        
        .btn-start { width: 100%; background: #d35400; color: #fff; padding: 12px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .btn-start:disabled { background: #95a5a6; cursor: not-allowed; }

        #play-screen { display: none; }
        #header { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        canvas { background-color: #dcb88e; border: 2px solid #333; cursor: pointer; width: 100%; max-width: 800px; border-radius: 5px; image-rendering: pixelated; margin: 0 auto; display: block; }
        
        /* 雙兵營介面樣式 */
        #camps-container { background: #ecf0f1; padding: 10px; border-radius: 8px; border: 2px dashed #bdc3c7; margin: 15px 0; width: 100%; box-sizing: border-box;}
        .camp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .camp-label { font-weight: bold; color: #2c3e50; width: 85px; font-size: 15px;}
        .camp-slots { display: flex; gap: 5px; flex: 1; flex-wrap: wrap; }
        .slot { width: 45px; height: 45px; background-color: #fff; border: 2px solid #7f8c8d; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; position: relative; border-radius: 5px; overflow: hidden; }
        .slot.selected { border-color: #e74c3c; box-shadow: 0 0 8px red; background-color: #ffe6e6; }
        .slot.general { border-color: #f1c40f; background-color: #fcf3cf; }
        .slot-level { position: absolute; top: 2px; right: 2px; font-size: 10px; color: #000; font-weight:bold; text-shadow: 1px 1px 0 #fff; z-index: 10; }
        
        #btn-deploy { background: #c0392b; color: white; border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; margin-left: 5px;}
        #btn-delete { background: #7f8c8d; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s;}
        #btn-delete.active { background: #e74c3c; box-shadow: 0 0 10px red;}

        #quiz-section { background: #34495e; padding: 15px; border-radius: 8px; text-align: center; color: #fff; }
        #question { font-size: 24px; font-weight: bold; margin: 0 0 15px 0; color: #f1c40f; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn { background: #2980b9; color: white; border: none; padding: 12px; font-size: 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .option-btn:hover { background: #3498db; }
        #feedback { margin-top: 10px; font-weight: bold; height: 20px; }
        /* 【新增】：UI 專用 5 幀行走動畫 */
        .sprite-walk {
            animation: spriteWalkAnim 0.8s infinite;
        }
        @keyframes spriteWalkAnim {
            0%, 19.9% { background-position: 0% 0; }
            20%, 39.9% { background-position: 25% 0; }
            40%, 59.9% { background-position: 50% 0; }
            60%, 79.9% { background-position: 75% 0; }
            80%, 99.9% { background-position: 100% 0; }
            100% { background-position: 0% 0; }
        }
    </style>
</head>
<body>
<!-- 【修改】：結算彈出視窗 UI (縮小並置底) -->
<div id="game-over-modal" style="display:none; position:fixed; bottom:30px; left:50%; transform: translateX(-50%); z-index:1000; width: 90%; max-width: 350px;">
    <div style="background:rgba(44, 62, 80, 0.95); padding:15px; border-radius:10px; text-align:center; border:3px solid #f1c40f; box-shadow: 0 10px 20px rgba(0,0,0,0.8); backdrop-filter: blur(5px);">
        <h2 id="game-over-title" style="margin:0 0 5px 0; font-size: 22px; color:white;">結果</h2>
        <p id="game-over-msg" style="font-size:14px; font-weight: bold; margin: 0 0 15px 0; color:white;">訊息</p>
        <button onclick="returnToMenu()" style="background:#e74c3c; color:white; border:none; padding:8px 20px; font-size:16px; border-radius:5px; cursor:pointer; font-weight:bold; transition: 0.2s;">返回主選單</button>
    </div>
</div>
<div id="game-wrapper">
    <div id="setup-screen">
        <div class="title">城池守衛戰</div>
        <div class="gold-display">💰 金幣: <span id="gold-count">0</span></div>
        <div class="section-title">🌟 選擇難度 (決定敵軍最高強度與等級差)</div>
        <div style="display:flex; justify-content:center; gap:15px; margin-bottom:15px; font-weight:bold; font-size:14px;">
            <label><input type="radio" name="difficulty" value="15" data-offset="1" checked> 🟢 簡單 (上限Lv.15, 敵方-2級)</label>
            <label><input type="radio" name="difficulty" value="30" data-offset="1"> 🟡 普通 (上限Lv.30, 敵方-1級)</label>
            <label><input type="radio" name="difficulty" value="50" data-offset="0"> 🔴 困難 (上限Lv.50, 同等級)</label>
        </div>
        <div class="section-title">🛡️ 基本兵種 (預設出戰)</div>
        <div id="basic-grid" class="char-grid"></div>
        <div class="section-title">🔥 傳奇武將 (最多選擇 <span id="select-count">0</span>/3)</div>
        <div id="general-grid" class="char-grid"></div>
        <button id="btn-start-game" class="btn-start" onclick="startGame()">發兵出戰！</button>
    </div>

    <div id="play-screen">
        <!-- 【核心修改】：用 sticky-top-bar 包住血量與資源區塊 -->
        <div id="sticky-top-bar">
            <div id="header">
                <span style="color: #8e44ad;">👿 敵軍: <span id="enemy-hp-display">1000</span></span>
                <span id="wave-display" style="color: #2980b9; margin: 0 10px;">強度: Lv.1</span>
                <!-- 【新增】：遊戲時間計時器 -->
                <span id="timer-display" style="color: #34495e; font-family: monospace; font-size: 18px;">⏱️ 00:00</span>
                <span style="color: #e74c3c;">❤️ 我方: <span id="hp-display">1000</span></span>
            </div>

            
            <div style="display:flex; justify-content:space-around; background:#ecf0f1; padding:8px; border-radius:8px; border:2px dashed #bdc3c7; font-weight:bold; margin-bottom:0;">
                <span style="color:#f39c12;">💰 <span id="game-gold">300</span></span>
                <span style="color:#e67e22;">🪵 <span id="game-wood">100</span></span>
                <span style="color:#c0392b;">🍖 <span id="game-meat">100</span></span>
                <span style="color:#7f8c8d;">🪨 <span id="game-stone">100</span></span>
            </div>
        </div>

        <!-- 【新增】：畫布與動態答題遮罩 -->
        <div id="canvas-container" style="position: relative; width: 100%; max-width: 800px; margin: 0 auto; display: block;">
            <canvas id="gameCanvas" width="800" height="800"></canvas>
            
            <div id="quiz-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; border-radius: 5px;">
                <div id="quiz-section" style="background: #34495e; padding: 30px; border-radius: 15px; text-align: center; color: #fff; width: 85%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 4px solid #f1c40f;">
                    <h3 style="margin-top:0; color:#2ecc71; font-size: 22px;">✏️ 答題賺錢期 (進度: <span id="quiz-progress">0</span>/5)</h3>
                    
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #3498db;">🔥 答對題數 (資源倍數): x<span id="combo-display">0</span></div>
                    
                    <div id="question" style="font-size: 36px; font-weight: bold; margin-bottom: 25px; color: #f1c40f;">題目加載中...</div>
                    <div class="options-grid" id="options-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;"></div>
                    
                    <!-- 【修改】：改名為 quiz-feedback，專門俾答題用 -->
                    <div id="quiz-feedback" style="font-size: 18px; margin-top: 20px; font-weight: bold; height: 25px;">請選擇正確答案！</div>
                </div>
            </div>
        </div>
        <!-- 【新增】：主遊戲專用提示訊息區，確保起樓同戰鬥時一定睇到！ -->
        <div id="feedback" style="font-size: 16px; font-weight: bold; text-align: center; margin: 10px 0; height: 20px; color: #f1c40f;">請先完成答題賺取資源！</div>

        <div id="camps-container">
            <!-- 【新增】：移動建築按鈕 -->
            <button id="btn-move" onclick="toggleMoveMode()" style="margin-bottom: 8px; width: 100%; background: #3498db; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;">🔄 移動模式: 關閉</button>
            <!-- 【新增】：加回拆除按鈕 -->
            <button id="btn-delete" onclick="toggleDeleteMode()" style="margin-bottom: 8px; width: 100%; background: #7f8c8d; color: white; border: none; padding: 6px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;">🛠️ 拆除模式: 關閉</button>
            
            <!-- 【新增】：獨立的建築資訊與升級介面 -->
            <div class="camp-row" id="upgrade-ui-row" style="display: none; background: #dff9fb; padding: 8px; border-radius: 5px; border: 2px solid #3498db; margin-bottom: 8px;">
                <span class="camp-label" id="selected-building-name" style="color: #2980b9; width: auto; margin-right: 10px;">🏠 建築</span>
                <span style="flex:1; font-size:14px; color:#2c3e50; font-weight:bold;" id="selected-building-info">Lv.1</span>
                <button id="btn-upgrade-building" onclick="upgradeSelectedTarget()" style="background:#f39c12; color:white; border:none; padding:6px 12px; border-radius:5px; font-weight:bold; cursor:pointer; font-size:14px;">升級 (50金)</button>
            </div>

            <div class="camp-row" id="build-menu-row">
                    <div id="build-menu" class="camp-slots">
                    <!-- 資源建築：用木 -->
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-farm" onclick="selectBuilding('farm')">🌾農田<br>50木</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-lumber" onclick="selectBuilding('lumber')">🪓伐木<br>50木</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-market" onclick="selectBuilding('market')">⚖️市場<br>50木</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-quarry" onclick="selectBuilding('quarry')">⛏️石礦<br>50木</button>
                    
                    <!-- 核心軍事：用金 -->
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-barracks" onclick="selectBuilding('barracks')">⛺軍營<br>100金</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-tent" onclick="selectBuilding('tent')">🎪大帳<br>200金</button>
                    
                    <!-- 防禦建築：用石 -->
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-tower" onclick="selectBuilding('tower')">🏹箭塔<br>100石</button>
                    <button class="slot" style="font-size:11px; width:55px; background:#fff;" id="btn-b-gate" onclick="selectBuilding('gate')">⛩️城門<br>100石</button>
                </div>
            </div>
<!-- 【修改】：加入 id="barracks-ui-row" 及預設隱藏 -->
            <div class="camp-row" id="barracks-ui-row" style="display: none;">
                <span class="camp-label">⚔️ 兵營</span>
                <button id="btn-buy-soldier" style="font-size:12px; background:#2ecc71; color:white; border:none; padding:5px; border-radius:5px; cursor:pointer;" onclick="buySoldier()">招募<br>50肉</button>
                <div id="offense-camp" class="camp-slots" style="margin-left:5px;">
                    <div class="slot" onclick="selectOffenseSlot(0)"></div><div class="slot" onclick="selectOffenseSlot(1)"></div>
                    <div class="slot" onclick="selectOffenseSlot(2)"></div><div class="slot" onclick="selectOffenseSlot(3)"></div>
                    <div class="slot" onclick="selectOffenseSlot(4)"></div><div class="slot" onclick="selectOffenseSlot(5)"></div>
                    <div class="slot" onclick="selectOffenseSlot(6)"></div><div class="slot" onclick="selectOffenseSlot(7)"></div>
                    <div class="slot" onclick="selectOffenseSlot(8)"></div><div class="slot" onclick="selectOffenseSlot(9)"></div>
                </div>
                <!-- 【修改】：改為出擊選定按鈕 -->
                <button id="btn-deploy" onclick="deployOffense()">出擊<br>選定</button>
            </div>
            
            <div class="camp-row" id="generals-deploy-container" style="display: none;">
                <span class="camp-label">🔥 將領</span>
                <div id="generals-camp" class="camp-slots"></div>
            </div>
        </div> <!-- camps-container 結束 -->
        
        <!-- 【新增】：全軍出擊按鈕 -->
        <button id="btn-start-battle" onclick="startBattlePhase()" style="display:none; width: 100%; background: #e74c3c; color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">🔥 佈陣完成，全軍出擊！</button>
        
        <!-- (請將原本最底的 <div id="quiz-section">...</div> 整個刪除，因為已經搬了上去！) -->
    </div>
</div>
    </div>
</div>

<script>

    // --- 圖片載入器 ---
    function loadSprite(src) {
        if (!src) return null;
        let img = new Image();
        img.src = src;
        img.onerror = () => { img.isFailed = true; }; 
        return img;
    }

// ==========================================
    // 【新增】：遊戲音效庫與播放管理器
    // ==========================================
    const SOUNDS = {
        bgm_lobby: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Track-07.mp3"), // 【新增】：大廳與選擇難度 BGM
        bgm_battle: [
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Track-08.mp3"),
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Track-05.mp3"),
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Track-04.mp3"),
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Track-02.mp3")
        ],
        click: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/click.mp3"), // 按鈕點擊
        build: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Build.mp3"), // 建築成功/升級
        error: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/error.mp3"), // 錯誤/資源不足
        correct: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/correct.mp3"), // 答對
        wrong: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/wrong.mp3"), // 答錯
        melee: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Melee.mp3"), // 普攻揮砍
        shoot: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Shoot.mp3"), // 射箭/主堡雷射
        slash: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Slash.mp3"), // 狂王刀氣
        explosion: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/explosion.mp3"), // 飛彈/大絕爆炸
        
        // 【修改】：將死亡音效改為陣列，支援隨機播放多種聲音
        death: [
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/death.mp3"),
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Death2.mp3"), // <--- 請替換為你的第二個死亡音效網址
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Death3.mp3"), // <--- 請替換為你的第二個死亡音效網址
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Death4.mp3"), // <--- 請替換為你的第二個死亡音效網址
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Death5.mp3"), // <--- 請替換為你的第二個死亡音效網址
            new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/Death6.mp3")  // <--- 請替換為你的第三個死亡音效網址
        ],
        
        win: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/win.mp3"), // 勝利
        lose: new Audio("https://raw.githubusercontent.com/yatyat87-creator/PNG-file/main/lose.mp3") // 戰敗
    };
    // 【新增】：記錄當前這場戰鬥抽到的 BGM
    let currentBattleBgm = null;

    // 設定大廳音樂無限循環
    SOUNDS.bgm_lobby.loop = true;
    SOUNDS.bgm_lobby.volume = 0.4;
    
    // 【修改】：用迴圈將所有戰鬥 BGM 都設定為無限循環與音量 0.4
    SOUNDS.bgm_battle.forEach(bgm => {
        bgm.loop = true;
        bgm.volume = 0.4;
    });

    function playSound(key) {
        if (SOUNDS[key]) {
            let targetSound = SOUNDS[key];
            
            // 【新增】：如果這個音效是陣列（設定了多個聲音），就隨機抽一個出來播
            if (Array.isArray(targetSound)) {
                targetSound = targetSound[Math.floor(Math.random() * targetSound.length)];
            }
            
            let soundClone = targetSound.cloneNode();
            soundClone.volume = 0.6; 
            soundClone.play().catch(e => console.log("瀏覽器擋住了自動播放:", e));
        }
    }
    document.body.addEventListener('click', function startLobbyBgm() {
        if (document.getElementById('setup-screen').style.display !== 'none') {
            SOUNDS.bgm_lobby.play().catch(e => console.log(e));
        }
        document.body.removeEventListener('click', startLobbyBgm); 
    }, { once: true });

// --- 建築物與兵種資料庫 ---

// 【新增】：初始化地圖時，根據不同「地形 (Biome)」生成對應裝飾物
    function generateDecorations() {
        mapDecorations = [];
        
        for (let r = 0; r < 20; r++) {
            for (let c = 0; c < 20; c++) {
                
                // 1. 先判斷這格是什麼地形
                let terrain = 'grass';
                if (isPath(c, r)) terrain = 'path';
                else if (r < 6) terrain = 'mountain';

                // 2. 決定是否要長出裝飾物 (15% 機率)
                if (Math.random() < 0.15) {
                    let allowedTypes = [];
                    
                    // 【嚴格綁定】：不同地形給予不同的物件清單
                    if (terrain === 'grass') {
                        // 草地專屬：樹木、蘑菇、小石頭
                        allowedTypes = ['tree1', 'tree2', 'rock', 'mushroom'];
                    } else if (terrain === 'mountain') {
                        // 山地專屬：骸骨、石頭 (如果您不想放石頭，可以改成 ['bones'])
                        allowedTypes = ['bones', 'rock']; 
                    } else if (terrain === 'path') {
                        // 道路：保持淨空，不長任何東西
                        allowedTypes = [];
                    }

                    // 3. 如果這個地形有允許的物件，就隨機抽一個種下去
                    if (allowedTypes.length > 0) {
                        let type = allowedTypes[Math.floor(Math.random() * allowedTypes.length)];
                        let offsetX = (Math.random() - 0.5) * 15;
                        let offsetY = (Math.random() - 0.5) * 15;
                        
                        mapDecorations.push({
                            type: type,
                            x: c * TILE_SIZE + TILE_SIZE / 2 + offsetX,
                            y: r * TILE_SIZE + TILE_SIZE / 2 + offsetY,
                            animOffset: Math.floor(Math.random() * 60) 
                        });
                    }
                }
            }
        }
    }

    function handleGeneralClick(key, g, isUnlocked) {
        if (!isUnlocked) {
            if (playerGold >= g.price && confirm(`花費 ${g.price} 金幣解鎖【${g.name}】？`)) {
                playerGold -= g.price; 
                unlockedGenerals.push(key); 
                localStorage.setItem('tdGameGold_v2', playerGold); 
                localStorage.setItem('tdGameUnlocked_v2', JSON.stringify(unlockedGenerals)); 
                updateLobbyUI();
            } else if (playerGold < g.price) alert("金幣不足！");
            return;
        }
        if (selectedGenerals.includes(key)) selectedGenerals = selectedGenerals.filter(c => c !== key);
        else if (selectedGenerals.length < 3) selectedGenerals.push(key);
        else alert("最多攜帶 3 名武將出戰！");
        updateLobbyUI();
    }

// --- 答題與資源邏輯 ---
    let currentAnswer = 0;
    let lastQuestionText = ""; 

    function generateQuestion() {
        let qData;
        do {
            const isAdd = Math.random() > 0.5; 
            let a = Math.floor(Math.random() * 15) + 1, b = Math.floor(Math.random() * 15) + 1;
            
            // 確保減數不會出現負數
            if (!isAdd && a < b) { let temp = a; a = b; b = temp; } 
            
            // 修正減數永遠等於 b 的 Bug
            let cAnswer = isAdd ? a + b : a - b; 
            let qText = isAdd ? `${a} + ${b} = ?` : `${a} - ${b} = ?`;
            
            let options = new Set([cAnswer]); 
            while (options.size < 4) { 
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1); 
                if (cAnswer + offset >= 0) options.add(cAnswer + offset); 
            }
            qData = { questionText: qText, correctAnswer: cAnswer, options: Array.from(options).sort(() => Math.random() - 0.5) };
        } while (qData.questionText === lastQuestionText); 
        
        lastQuestionText = qData.questionText;
        return qData;
    }

    function loadNextQuestion() {
        if (gameOver || gameWon) return; 
        const qData = generateQuestion(); 
        currentAnswer = qData.correctAnswer;
        document.getElementById('question').innerText = qData.questionText; 
        let optionsHtml = '';
        qData.options.forEach(opt => { optionsHtml += `<button class="option-btn" onclick="checkAnswer(${opt})">${opt}</button>`; });
        document.getElementById('options-container').innerHTML = optionsHtml;
    }

    function checkAnswer(selected) {
        if (gameOver || gameWon) return; 
        // 【修改】：答題邏輯現在指向專屬的 quiz-feedback
        const feedback = document.getElementById('quiz-feedback');
        
        // 防止連點，暫時鎖定所有選項按鈕
        let options = document.querySelectorAll('.option-btn');
        options.forEach(btn => btn.disabled = true);
        
        questionsAnswered++; // 增加總答題進度
        
        if (selected === currentAnswer) {
            comboMultiplier++; 
            playSound('correct'); // 【新增答對音效】
            feedback.innerText = `✔️ 答對了！目前累積 ${comboMultiplier} 題！`; 
            feedback.style.color = "#2ecc71"; 
        } else { 
            playSound('wrong'); // 【新增答錯音效】
            // 答錯，不加倍數，並顯示正確答案
            feedback.innerText = `❌ 答錯囉！正確答案是 ${currentAnswer}。`; 
            feedback.style.color = "#e74c3c"; 
        }

        // 更新介面進度
        document.getElementById('quiz-progress').innerText = questionsAnswered;
        document.getElementById('combo-display').innerText = comboMultiplier;

        // 檢查是否已經答滿 5 題
        if (questionsAnswered >= 5) {
            document.getElementById('options-container').innerHTML = ''; // 清空按鈕
            
            if (comboMultiplier > 0) {
                feedback.innerText += ` 🎉 結算：共答對 ${comboMultiplier} 題，資源大豐收！`;
                
                // 1. 派發保底基礎資源 (50 * 倍數)
                let baseGain = 50 * comboMultiplier;
                gameGold += baseGain; gameWood += baseGain; gameMeat += baseGain; gameStone += baseGain;
                
                let bx = playerBase.x * TILE_SIZE + TILE_SIZE / 2;
                let by = playerBase.y * TILE_SIZE - 10;
                floatingTexts.push({ x: bx - 20, y: by - 15, text: `💰+${baseGain}`, color: "#f1c40f", timer: 90, vx: -1, vy: -1.5, font: 'bold 16px Arial' });
                floatingTexts.push({ x: bx + 20, y: by - 15, text: `🪵+${baseGain}`, color: "#e67e22", timer: 90, vx: 1, vy: -1.5, font: 'bold 16px Arial' });
                floatingTexts.push({ x: bx - 20, y: by + 15, text: `🍖+${baseGain}`, color: "#e74c3c", timer: 90, vx: -1, vy: -0.5, font: 'bold 16px Arial' });
                floatingTexts.push({ x: bx + 20, y: by + 15, text: `🪨+${baseGain}`, color: "#95a5a6", timer: 90, vx: 1, vy: -0.5, font: 'bold 16px Arial' });

                // 主城回血特效 (每答對1題回5%，答對5題就回滿25%)
                let healPct = 5 * comboMultiplier;
                let healAmount = playerBase.maxHp * (healPct / 100);
                playerBase.hp = Math.min(playerBase.maxHp, playerBase.hp + healAmount);
                floatingTexts.push({ x: bx, y: by - 35, text: `💖 +${healPct}% HP`, color: "#2ecc71", timer: 60, vy: -1 });

// 2. 根據場上建築派發額外加成 (加入連鎖加成)
                towers.forEach(t => {
                    let bData = BUILDINGS[t.id];
                    
                    // 【新增】：判斷同類建築是否相鄰 (放寬為九宮格，包含斜角)
                    let adjacentCount = 0;
                    if (bData.type === 'resource' || bData.id === 'market') {
                        towers.forEach(other => {
                            if (other !== t && other.id === t.id) {
                                // X 與 Y 的絕對距離都在 1 以內，代表在周圍 8 格之內
                                let dx = Math.abs(t.x - other.x);
                                let dy = Math.abs(t.y - other.y);
                                if (dx <= 1 && dy <= 1) {
                                    adjacentCount++;
                                }
                            }
                        });
                    }
                    
                    // 每個相連的同類建築，產量額外加成 50%
                    let bonusMult = 1 + (adjacentCount * 0.5);
                    let amount = Math.floor(10 * t.level * comboMultiplier * bonusMult);
                    
                    let resSymbol = ''; let resColor = '#fff';
                    let valid = false;
                    
                    if (bData.id === 'market') { gameGold += amount; resSymbol = '💰'; resColor = '#f1c40f'; valid = true; }
                    else if (bData.id === 'farm') { gameMeat += amount; resSymbol = '🍖'; resColor = '#e74c3c'; valid = true; }
                    else if (bData.id === 'lumber') { gameWood += amount; resSymbol = '🪵'; resColor = '#e67e22'; valid = true; }
                    else if (bData.id === 'quarry') { gameStone += amount; resSymbol = '🪨'; resColor = '#95a5a6'; valid = true; }
                    
                    if (valid) {
                        let sizeMult = bData.size || 1;
                        // 【修改】：使用更明顯的文字與閃亮符號，並放大字體
                        let extraText = adjacentCount > 0 ? " ✨連鎖" : ""; 
                        
                        floatingTexts.push({ 
                            x: t.x * TILE_SIZE + (TILE_SIZE * sizeMult)/2 + (Math.random()*20-10), 
                            y: t.y * TILE_SIZE - 10 + (Math.random()*20-10), 
                            text: `${resSymbol}+${amount}${extraText}`, 
                            color: resColor, 
                            timer: 90, 
                            vx: (Math.random()-0.5)*2, 
                            vy: -1-Math.random(), 
                            font: adjacentCount > 0 ? 'bold 20px Arial' : 'bold 16px Arial' // 連鎖時字體放大
                        });
                    }
                });
                
                updateResourcesUI(); 
            } else {
                feedback.innerText += ` 😢 結算：全部答錯，未獲得資源，下次努力！`;
            }
            
            // 停頓 2 秒讓玩家看清楚資源爆發，再進入建築期
            setTimeout(startBuildPhase, 2000); 
            
        } else {
            // 還未答滿 5 題，給予 0.8 秒時間讓玩家看清楚「答對/答錯」的回饋，然後再出下一題
            setTimeout(() => {
                loadNextQuestion();
            }, 800);
        }
    }

    function updateResourcesUI() {
        document.getElementById('game-gold').innerText = gameGold; 
        document.getElementById('game-wood').innerText = gameWood; 
        document.getElementById('game-meat').innerText = gameMeat;

    // 【修改】：一鍵徵兵邏輯 (按一下自動計算肉量並填滿兵營空位)
    window.buySoldier = function() {
        const feedback = document.getElementById('feedback');
        
        // 【新增】：限制只能在戰鬥階段徵兵
        if (gamePhase !== 2) {
            feedback.innerText = "⚠️ 只能在【戰鬥階段】進行徵兵與招募！"; 
            feedback.style.color = "#e74c3c";
            return;
        }        
        // 1. 檢查是否有軍營
        if (!towers.some(t => t.id === 'barracks')) { 
            feedback.innerText = "⚠️ 必須先建造【軍營】才能生產士兵！"; 
            feedback.style.color = "#e74c3c";
            return; 
        }

        // 2. 找出兵營 (offenseCamp) 裡面所有的空位 (null)
        let emptyIndices = [];
        for (let i = 0; i < offenseCamp.length; i++) {
            if (offenseCamp[i] === null) emptyIndices.push(i);
        }

        if (emptyIndices.length === 0) { 
            feedback.innerText = "⚠️ 兵營已滿！請先全軍出擊！"; 
            feedback.style.color = "#e74c3c";
            return;
        }

        // 3. 計算目前的肉量最多可以買幾隻兵 (每隻 50 肉)
        let affordableCount = Math.floor(gameMeat / 50);
        
        if (affordableCount <= 0) { 
            feedback.innerText = "⚠️ 食物(肉)不足 50！請多建農田。"; 
            feedback.style.color = "#e74c3c";
            return; 
        }

        // 4. 實際招募數量 = 「空位數量」與「買得起數量」的最小值
        let recruitCount = Math.min(emptyIndices.length, affordableCount);

        // 5. 一次過扣除總消耗資源
        gameMeat -= (50 * recruitCount); 
        updateResourcesUI();

        // 6. 批次將隨機士兵加入剛剛找到的兵營空位中
        let pool = Object.keys(BASIC_UNITS); 
        for (let i = 0; i < recruitCount; i++) {
            let targetIndex = emptyIndices[i];
            let randomUnitId = pool[Math.floor(Math.random() * pool.length)];
            offenseCamp[targetIndex] = { id: randomUnitId, level: 1 };
        }

        // 7. 更新介面與提示訊息
        feedback.innerText = `✔️ 花費 ${50 * recruitCount} 肉，一鍵招募了 ${recruitCount} 支部隊！`; 
        feedback.style.color = "#2ecc71";
        updateCampsUI();
    };

    window.getTowerUpgradeCost = function(tower) {
        let bData = BUILDINGS[tower.id];
        // 資源類與市場：首1-10等50木，11-20等75木，每10等增加25木
        if (bData.type === 'resource' || bData.id === 'market') {
            let tier = Math.floor((tower.level - 1) / 10);
            return 50 + (tier * 25);
        }
        // 其他軍事/防禦建築：維持原本的 等級 * 50
        return 50 * tower.level;
    };

    // --- Canvas 與地圖建造邏輯 ---
    const canvas = document.getElementById('gameCanvas'); 
    const ctx = canvas.getContext('2d');
    // 【效能優化】：限制手機最高只用 1.5 倍渲染，畫質依然清晰，但能大幅減輕 GPU 負擔與發熱！
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5); 
    
    // 【擴大地圖兩倍】：邏輯大小改為 800x800
    canvas.width = 800 * dpr; canvas.height = 800 * dpr; 
    canvas.style.width = "100%"; canvas.style.maxWidth = "800px"; 
    ctx.scale(dpr, dpr); ctx.imageSmoothingEnabled = true; 
    const TILE_SIZE = 40;
    
    // 【修改】：設置主堡八格環狀陣地與連接道路
    const enemyRing = [], playerRing = [];
    for(let dx=-1; dx<=1; dx++) {
        for(let dy=-1; dy<=1; dy++) {
            if(dx===0 && dy===0) continue;
            enemyRing.push({x: 2+dx, y: 2+dy});
            playerRing.push({x: 17+dx, y: 17+dy});
        }
    }

    const pathCoords = [];
    for(let x=4; x<=16; x++) pathCoords.push({x:x, y:2});
    for(let y=3; y<=8; y++) pathCoords.push({x:16, y:y});
    for(let x=15; x>=4; x--) pathCoords.push({x:x, y:8});
    for(let y=9; y<=15; y++) pathCoords.push({x:4, y:y});
    for(let x=5; x<=16; x++) pathCoords.push({x:x, y:15});
    
    function isPath(gx, gy) { 
        return pathCoords.some(p => p.x === gx && p.y === gy) || 
               enemyRing.some(p => p.x === gx && p.y === gy) || 
               playerRing.some(p => p.x === gx && p.y === gy); 
    }
    // 【新增】：尋找距離建築物絕對最近的道路坐標 (解決建築遠離道路無法出兵的 Bug)
    window.getNearestPathIndex = function(buildX, buildY) {
        let minDist = Infinity; 
        let bestIdx = pathCoords.length - 1; // 預設為主堡
        pathCoords.forEach((p, i) => {
            let d = Math.hypot(p.x - buildX, p.y - buildY);
            if(d < minDist) { minDist = d; bestIdx = i; }
        });
        return bestIdx;
    };
    
    // 【修改】：讓系統知道 2x2 建築佔用多格，點擊範圍內任何一格都能正確選中或判定障礙
    function getTowerAt(gx, gy) { 
        return towers.find(t => {
            let s = BUILDINGS[t.id].size || 1;
            // 檢查點擊的坐標 (gx, gy) 是否落在建築的 (x 到 x+s, y 到 y+s) 範圍內
            return gx >= t.x && gx < t.x + s && gy >= t.y && gy < t.y + s;
        }); 
    }
    
    // 【新增】：智能判定城門方向 (根據周圍四格道路形狀)
    function calculateGateDir(gx, gy) {
        let hasTop = isPath(gx, gy - 1);
        let hasBottom = isPath(gx, gy + 1);
        let hasLeft = isPath(gx - 1, gy);
        let hasRight = isPath(gx + 1, gy);

        // 3) 彎路 (左上 或 右下) -> 第三橫行 (dir: 2)
        if ((hasLeft && hasTop) || (hasRight && hasBottom)) return 2; 
        // 4) 彎路 (右上 或 左下) -> 第四橫行 (dir: 3)
        if ((hasRight && hasTop) || (hasLeft && hasBottom)) return 3; 
        // 2) 橫路 (右至左) -> 第二橫行 (dir: 1)
        if (hasLeft && hasRight) return 1; 
        // 1) 預設為直路 (上至下) -> 第一橫行 (dir: 0)
        return 0; 
    }

    // 【核心點擊邏輯】：分離建造、拆除與選取升級
    // 【新增】：智能判定建造是否合法的統一函數
    // 【新增】：智能判定建造是否合法的統一函數
    function validatePlacement(tx, ty, bData, towerToIgnore) {
        let bSize = bData.size || 1;
        if (tx < 0 || ty < 0 || tx + bSize > 20 || ty + bSize > 20) return "⚠️ 建築範圍超出邊界！";
        if (ty < 6) return "⚠️ 敵軍前線無法進行建築！";

        if (bData.id === 'gate') {

                if (this.pathIndex >= pathCoords.length) {

class PlayerUnit {

                        let aoeRadius = this.isUlt ? 120 : 80;
                        enemies.forEach(e => {
                            if (Math.hypot(e.x - impactX, e.y - impactY) <= aoeRadius) {
                                let dmgDealt = (e.defDebuffTimer > 0) ? finalDamage * 1.5 : finalDamage;
                                e.hp -= dmgDealt;
                                if (this.isUlt) { e.rootTimer = 600; } 
                                else { e.defDebuffTimer = 240; e.speedDebuffTimer = 240; } 
                            }
                        });
                        combatEffects.push({ x: impactX, y: impactY, radius: aoeRadius, timer: 30, maxTimer: 30, frames: 4, customImg: this.unitData.aoeImg });
                    } else if (this.id === 'g8') {
                        playSound('melee');
                        if (this.isUlt) {
                            slashWaves.push(new SlashWave(this.damage * 2.5, this.x, this.y, impactX, impactY, 'slash', true, true, this.unitData.slashImg));
                        } else {
                            let targets = enemies.filter(e => !e.isDying && Math.hypot(e.x - this.x, e.y - this.y) <= this.range).slice(0, 5);
                            targets.forEach(t => {
                                let dmgDealt = (t.defDebuffTimer > 0) ? this.damage * 1.5 : this.damage;
                                t.hp -= dmgDealt;
                                ctx.strokeStyle = this.unitData.color; ctx.lineWidth = 2;
                                ctx.beginPath(); ctx.moveTo(this.x + this.drawOffsetX, this.y + this.drawOffsetY); 
                                ctx.lineTo(t.x, t.y); ctx.stroke();
                            });
                        }
                    } else {
                        enemyBase.hp -= finalDamage; 
                        if (this.unitData.hasAoE) {
                            let aoeRadius = this.isTransformed ? 120 : 60; 
                            enemies.forEach(e => {
                                if (Math.hypot(e.x - impactX, e.y - impactY) <= aoeRadius) e.hp -= finalDamage;
                            });
                            let customAoeImg = (this.isTransformed && this.unitData.aoeImg2) ? this.unitData.aoeImg2 : this.unitData.aoeImg;
                            combatEffects.push({ x: impactX, y: impactY, radius: aoeRadius, timer: 20, maxTimer: 20, frames: 4, isTransformed: this.isTransformed, customImg: customAoeImg });
                        } else {
                            ctx.strokeStyle = this.unitData.color; ctx.lineWidth = this.unitData.isGeneral ? 4 : 2;
                            ctx.beginPath(); ctx.moveTo(this.x + this.drawOffsetX, this.y + this.drawOffsetY); 
                            ctx.lineTo(impactX, impactY); ctx.stroke();
                        }
                    }
                }
                return false;
            }

            // 3. 移動與透明穿透
            if (!hasValidTarget) { this.state = 0; return true; }
            const dx = tx - this.x, dy = ty - this.y;
            const dist = Math.hypot(dx, dy);

            const isLaneBlocked = (testLane) => {
                return playerUnits.some(p => {
                    if (p === this || p.lane !== testLane || p.isDying || p.range > this.range + 10) return false;
                    if (this.pathIndex < 0 && p.pathIndex < 0) return false;
                    
                    // 【新增】：如果前方的隊友中了減速或定身，直接當作透明穿過去！(預留給未來敵人控場技能)
                    if (p.speedDebuffTimer > 0 || p.rootTimer > 0) return false;
                    
                    if (this.speed > p.speed) return false;

                    if (Math.hypot(p.x - this.x, p.y - this.y) < 24) { 
                        if (p.pathIndex < this.pathIndex) return true; 
                        if (p.pathIndex === this.pathIndex) {
                            let myDist = Math.hypot(tx - this.x, ty - this.y), pDist = Math.hypot(tx - p.x, ty - p.y);
                            if (pDist < myDist - 0.1) return true;
                            if (Math.abs(pDist - myDist) <= 0.1) return playerUnits.indexOf(p) < playerUnits.indexOf(this);
                        }
                    }
                    return false;
                });
            };
            
            // 【修改】：讓 isBuffer (荀彧) 也不受一般士兵阻擋機制影響，自由穿梭
            if (!isDefender && !isBuffer && isLaneBlocked(this.lane)) {
                let possibleLanes = this.lane === 0 ? [-1, 1] : [0];
                possibleLanes.sort(() => Math.random() - 0.5);
                let switched = false;
                for (let l of possibleLanes) { if (!isLaneBlocked(l)) { this.lane = l; this.laneOffset = this.lane * 12; switched = true; break; } }
                if (!switched) { this.state = 4; return false; }
            }

            this.state = 0; 
            if (dist < this.speed) { 
                this.x = tx; this.y = ty; 
                if (targetNode) {
                    if (!isDefender && this.pathIndex >= 0) this.pathIndex--;
                    else if (isDefender) {
                        let threat = enemies.find(e => !e.isDying && (
                            towers.some(t => { let s = BUILDINGS[t.id].size || 1; return Math.hypot(e.x - (t.x*TILE_SIZE+(TILE_SIZE*s)/2), e.y - (t.y*TILE_SIZE+(TILE_SIZE*s)/2)) < 180; }) ||
                            Math.hypot(e.x - (playerBase.x*TILE_SIZE+TILE_SIZE/2), e.y - (playerBase.y*TILE_SIZE+TILE_SIZE/2)) < 250
                        ));
                        if (threat) {
                            let thIdx = threat.pathIndex >= 0 ? threat.pathIndex : pathCoords.length - 1;
                            if (this.pathIndex > thIdx) this.pathIndex--; else if (this.pathIndex < thIdx) this.pathIndex++;
                        } else {
                            let tents = towers.filter(t => t.id === 'tent');
                            if (tents.length > 0) {
                                let tentIdx = getNearestPathIndex(tents[0].x, tents[0].y);
                                if (this.pathIndex > tentIdx) this.pathIndex--; else if (this.pathIndex < tentIdx) this.pathIndex++;
                            }
                        }
                    }
                }
            } else { 
                this.x += (dx / dist) * this.speed; 
                this.y += (dy / dist) * this.speed; 
            }
            return false;
        }
        
        draw() {
            // 【核心修正】：如果是安全撤退，強制覆蓋為「行走狀態(0)」，不播「死亡狀態(3)」
            if (this.isRetreating) this.state = 0; 

            if (this.state === 0) this.frame = Math.floor(globalAnimTick / 10) % 5; 
            else if (this.state === 4) this.frame = Math.floor(globalAnimTick / 15) % 4; 
            else if (this.state === 1 || this.state === 2) { 
                let attackProgress = 1 - (this.cooldown / this.fireRate); 
                this.frame = Math.min(4, Math.floor(attackProgress * 5)); 
            } else if (this.state === 3) {
                let deathProgress = 1 - (this.deathTimer / 45); 
                this.frame = Math.min(4, Math.floor(deathProgress * 5));
            }

            let cx = this.x + this.drawOffsetX, cy = this.y + this.drawOffsetY;

            ctx.save();

            if (this.isDying) {
                let deathProgress = 1 - (this.deathTimer / 45);
                // 【核心修正】：只有真正的「戰死」才會閃爍和飄走
                if (!this.isRetreating) {
                    if (this.deathTimer % 6 < 3) ctx.globalAlpha = 0.3; 
                    else ctx.globalAlpha = 0.9;
                    cy -= deathProgress * 15; 
                }
            }

            if (this.currentImg && this.currentImg.complete && !this.currentImg.isFailed && this.currentImg.naturalWidth > 0) {
                let frameWidth = this.currentImg.naturalWidth / 5; let frameHeight = this.currentImg.naturalHeight / 5;
                let sx = this.frame * frameWidth; let sy = this.state * frameHeight; 
                
                let drawWidth = TILE_SIZE * this.currentScale;
                let aspectRatio = frameHeight / frameWidth;
                let drawHeight = drawWidth * aspectRatio;
                let yOffset = this.unitData.yOffset || 0; 
                
                ctx.translate(cx, cy - 5 + yOffset);
                if (this.facingLeft) { ctx.scale(-1, 1); }
                
                // ============================================
                // 【新增】：百頁簾由下至上消失特效 (安全撤退專用)
                // ============================================
                if (this.isDying && this.isRetreating) {
                    let deathProgress = 1 - (this.deathTimer / 45);
                    ctx.beginPath();
                    let numBlinds = 8; // 將角色橫向切成 8 條百頁簾
                    let blindH = drawHeight / numBlinds;
                    for (let i = 0; i < numBlinds; i++) {
                        // 讓底部的百頁簾優先開始消失 (delay 較小)
                        let delay = (numBlinds - 1 - i) * 0.08; 
                        let localProgress = Math.max(0, Math.min(1, (deathProgress - delay) * 2));
                        // 畫出正在縮小的矩形遮罩
                        ctx.rect(-drawWidth / 2, -drawHeight / 2 + i * blindH, drawWidth, blindH * (1 - localProgress));
                    }
                    ctx.clip(); // 啟動遮罩！範圍外的圖片會直接隱藏
                }

                if (this.isTransforming) {
                    let whiteIntensity = 0;
                    if (this.transformTimer > 45) {
                        whiteIntensity = 1 - ((this.transformTimer - 45) / 45);
                    } else {
                        whiteIntensity = this.transformTimer / 45;
                    }
                    ctx.filter = `brightness(${1 + whiteIntensity * 50})`;
                } else {
                    ctx.filter = 'none';
                }

                ctx.drawImage(this.currentImg, sx, sy, frameWidth, frameHeight, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight); 
                
                ctx.filter = 'none'; 
                
            } else {
                ctx.fillStyle = this.unitData.isGeneral ? '#fcf3cf' : 'white'; ctx.fillRect(cx - TILE_SIZE/2 + 2, cy - TILE_SIZE/2 + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                if(this.unitData.isGeneral) { ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.strokeRect(cx - TILE_SIZE/2 + 2, cy - TILE_SIZE/2 + 2, TILE_SIZE - 4, TILE_SIZE - 4); }
                ctx.fillStyle = this.unitData.color; ctx.font = '22px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.unitData.symbol, cx, cy);
            }
            
            ctx.restore();

            if (!this.isDying && !this.isTransforming) {
                let hpOffset = this.currentScale * 15; 
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.fillText('Lv'+this.level, cx, cy + TILE_SIZE/2);
                ctx.fillStyle = 'red'; ctx.fillRect(cx - 10, cy - hpOffset - 10, 20, 3);
                ctx.fillStyle = '#3498db'; ctx.fillRect(cx - 10, cy - hpOffset - 10, 20 * (this.hp / this.maxHp), 3);
            }
            if (!this.isDying && !this.isTransforming) {
                let hpOffset = this.currentScale * 15; 
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.fillText('Lv'+this.level, cx, cy + TILE_SIZE/2);
                ctx.fillStyle = 'red'; ctx.fillRect(cx - 10, cy - hpOffset - 10, 20, 3);
                ctx.fillStyle = '#3498db'; ctx.fillRect(cx - 10, cy - hpOffset - 10, 20 * (this.hp / this.maxHp), 3);

                // 將 Buff 特效邏輯正確加回我方單位
                if (this.atkBuffTimer > 0) {
                    ctx.font = '16px Arial'; ctx.fillText('⚔️', cx + 15, cy - hpOffset - 25);
                    ctx.fillStyle = 'rgba(241, 196, 15, 0.4)'; // 黃金聖光環
                    ctx.beginPath(); ctx.ellipse(cx, cy + 10, 25, 12, 0, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
    }

    // 【修改】：環境特效類別 (嚴格綁定地形)
    class AmbientEffect {
        constructor() {
            let keys = Object.keys(AMBIENT_TYPES);
            this.typeKey = keys[Math.floor(Math.random() * keys.length)];
            this.data = AMBIENT_TYPES[this.typeKey];
            
            this.alive = true;
            this.life = Math.random() * 500 + 300; 
            this.vx = 0; this.vy = 0;
            this.facingLeft = Math.random() < 0.5; 

            if (this.data.type === 'wind') {
                // 落葉 (Wind)：可以從畫面外任何地方吹進來，吹過所有地形
                this.x = Math.random() < 0.5 ? -20 : Math.random() * 800;
                this.y = this.x === -20 ? Math.random() * 800 : -20;
                this.vx = this.data.speed + Math.random();
                this.vy = this.data.speed * 0.8 + Math.random() * 0.5;
            } else {
                // 蝴蝶 (Wander) 與 小鳥 (Peck)：【強制只在草地上生成】
                let foundGrass = false;
                while (!foundGrass) {
                    let c = Math.floor(Math.random() * 20);
                    let r = Math.floor(Math.random() * 20);
                    
                    // 草地判定條件：不是道路 (isPath為false)，且不是山地 (r >= 6)
                    if (!isPath(c, r) && r >= 6) {
                        this.x = c * TILE_SIZE + Math.random() * TILE_SIZE;
                        this.y = r * TILE_SIZE + Math.random() * TILE_SIZE;
                        foundGrass = true;
                    }
                }

                if (this.data.type === 'wander') {
                    this.vx = (Math.random() - 0.5) * this.data.speed;
                    this.vy = (Math.random() - 0.5) * this.data.speed;
                }
            }
        }

        update() {
            this.life--;
            if (this.life <= 0 || this.x > 850 || this.y > 850) {
                this.alive = false; return;
            }

            if (this.data.type === 'wander' && globalAnimTick % 40 === 0) {
                this.vx = (Math.random() - 0.5) * this.data.speed * 3;
                this.vy = (Math.random() - 0.5) * this.data.speed * 3;
            }
            
            if (this.data.type === 'peck') {
                if (Math.random() < 0.02) { 
                    this.vx = (Math.random() - 0.5) * 3; 
                    this.vy = (Math.random() - 0.5) * 3; 
                } else if (globalAnimTick % 10 === 0) { 
                    this.vx = 0; this.vy = 0; 
                }
            }

            if (this.vx < -0.1) this.facingLeft = true;
            else if (this.vx > 0.1) this.facingLeft = false;

            this.x += this.vx; this.y += this.vy;
        }

        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            
            if (this.data.type === 'wander') ctx.translate(0, Math.sin(globalAnimTick / 10) * 4);
            else if (this.data.type === 'wind') { ctx.translate(0, Math.sin(globalAnimTick / 20) * 5); ctx.rotate(globalAnimTick / 30); }
            else if (this.data.type === 'peck') { if (globalAnimTick % 60 < 10) ctx.translate(0, 2); }

            if (this.facingLeft && this.data.type !== 'wind') { 
                ctx.scale(-1, 1); 
            }

            if (this.data.img && this.data.img.complete && !this.data.img.isFailed && this.data.img.naturalWidth > 0) {
                let fw = this.data.img.naturalWidth / 4; let fh = this.data.img.naturalHeight;
                let frame = Math.floor(globalAnimTick / 15) % 4;
                ctx.drawImage(this.data.img, frame * fw, 0, fw, fh, -this.data.size/2, -this.data.size/2, this.data.size, this.data.size);
            } else {
                ctx.font = `${this.data.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.data.symbol, 0, 0);
            }
            ctx.restore();
        }
    }

    // ==========================================
    // 【新增】：狂王羅侯專屬穿透性刀氣類別 (SlashWave)
    // 功能：飛行時對路徑上所有玩家實體造成穿透性傷害
    // ==========================================

    class SlashWave {
        // 【修改】：加入 customImg 參數，讓每個人都能傳入自己的專屬圖片
        constructor(dmg, x, y, tx, ty, type, isUlt, isPlayer = false, customImg = null) {
            this.x = x; this.y = y; 
            this.dmg = dmg; this.speed = 12; this.type = type; 
            this.frame = 0; this.animOffset = Math.floor(Math.random() * 60); 
            
            let angle = Math.atan2(ty - y, tx - x);
            this.vx = Math.cos(angle) * this.speed;
            this.vy = Math.sin(angle) * this.speed;
            this.facingLeft = this.vx < 0;
            
            this.width = type === 'arrow' ? 60 : 120; 
            this.isUlt = isUlt; 
            this.isPlayer = isPlayer; 
            // 【修改】：優先使用傳入的專屬圖，如果沒有才退回使用羅侯的預設刀氣
            this.img = customImg || EFFECT_IMGS.aoe_slash; 
            this.hitTargets = new Set();
        }

        update() {
            if (this.x < -200 || this.x > 1000 || this.y < -200 || this.y > 1000) return true;
            this.x += this.vx; this.y += this.vy;
            
            let checkCollision = (targetArr) => {
                for (let i = targetArr.length - 1; i >= 0; i--) {
                    let target = targetArr[i];
                    if (target.isDying) continue;
                    if (Math.hypot((target.x + (target.drawOffsetX||0)) - this.x, (target.y + (target.drawOffsetY||0)) - this.y) <= (this.width / 2 + TILE_SIZE / 2)) {
                        if (!this.hitTargets.has(target)) {
                            // 【新增】：判定敵軍降防 DEBUFF，受到的傷害增加 50%
                            let finalDmg = (target.defDebuffTimer && target.defDebuffTimer > 0) ? this.dmg * 1.5 : this.dmg;
                            target.hp -= finalDmg;
                            this.hitTargets.add(target);
                            playSound('melee');
                        }
                    }
                }
            };
            
            // 【修改】：根據發射者決定要判定砍誰
            if (this.isPlayer) {
                checkCollision(enemies);
                let baseHitDist = Math.hypot((enemyBase.x*TILE_SIZE+TILE_SIZE/2) - this.x, (enemyBase.y*TILE_SIZE+TILE_SIZE/2) - this.y);
                if (baseHitDist <= (this.width / 2 + TILE_SIZE) && !this.hitTargets.has(enemyBase)) {
                    enemyBase.hp -= this.dmg; this.hitTargets.add(enemyBase);
                }
            } else {
                checkCollision(playerUnits);
                checkCollision(towers);
                let baseHitDist = Math.hypot((playerBase.x*TILE_SIZE+TILE_SIZE/2) - this.x, (playerBase.y*TILE_SIZE+TILE_SIZE/2) - this.y);
                if (baseHitDist <= (this.width / 2 + TILE_SIZE) && !this.hitTargets.has(playerBase)) {
                    playerBase.hp -= this.dmg; this.hitTargets.add(playerBase);
                }
            }
            return false;
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            // 【核心修正】：根據 X/Y 向量動態旋轉圖片角度，確保刀尖永遠朝前
            ctx.rotate(Math.atan2(this.vy, this.vx)); 
            
            if (this.img && this.img.complete && !this.img.isFailed && this.img.naturalWidth > 0) {
                let frameWidth = this.img.naturalWidth / 5;
                let frameHeight = this.img.naturalHeight;
                let frame = Math.floor((globalAnimTick + this.animOffset) / 10) % 5;
                
                let drawW = this.width;
                let drawH = drawW * (frameHeight / frameWidth);
                
                if (this.isRahuUlting) {
                    ctx.globalCompositeOperation = 'screen';
                    ctx.filter = `brightness(${1.5 + Math.sin(globalAnimTick / 10) * 0.5})`;
                }

                ctx.drawImage(this.img, frame * frameWidth, 0, frameWidth, frameHeight, -drawW / 2, -drawH / 2, drawW, drawH);
            } else {
                ctx.fillStyle = 'purple';
                ctx.beginPath(); ctx.arc(0, 0, this.width / 2, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }
    }

    // --- 遊戲主迴圈 ---
    function gameLoop(timestamp) {
        // 1. 強制註冊下一幀
        window.animFrameId = requestAnimationFrame(gameLoop);
        
        // 2. 【物理鎖幀 3.0】：改用絕對真實時間 Date.now()，無視手機系統的刷新率作弊！
        let now = Date.now();
        if (!window._realLastTime) window._realLastTime = now;
        let elapsed = now - window._realLastTime;
        
        // 3. 容錯閘門：真實世界只要過得少於 15 毫秒 (即高於 60 FPS)，直接腰斬，唔准運算！
        if (elapsed < 15) return; 
        
        // 4. 嚴格重置時間
        window._realLastTime = now; 

        // --- 遊戲邏輯開始 ---
        ctx.clearRect(0, 0, 800, 800);
        globalAnimTick++;

        let isPlaying = !gameOver && !gameWon;
        let isCombatActive = !gameOver && !gameWon && gamePhase === 2; // 只有戰鬥期才算 Active
        let isGameRunning = !gameOver && !gameWon;

// ============================================
        // 1. 戰鬥與資源大腦邏輯
        // ============================================
        // (原有的自動生產資源邏輯已被徹底移除！)

        if (isCombatActive) {
            // 【新增】：戰鬥階段 3 分鐘倒數計時器
            if (globalAnimTick % 60 === 0) {
                window.battleTimeRemaining--;
                let m = String(Math.floor(Math.max(0, window.battleTimeRemaining) / 60)).padStart(2, '0');
                let s = String(Math.max(0, window.battleTimeRemaining) % 60).padStart(2, '0');
                document.getElementById('timer-display').innerText = `⏱️ 剩餘 ${m}:${s}`;
                
                // 時間到！強制清空敵軍，結束戰鬥回合
                if (window.battleTimeRemaining <= 0) {
                    enemies = []; // 觸發下方的波數清理完畢邏輯
                    waveEnemiesToSpawn = 0;
                }
            }

            // 武將自動大腦
        }

        if (isCombatActive) {
            // 武將自動大腦
            if (globalAnimTick % 30 === 0) {
                let tents = towers.filter(t => t.id === 'tent');
                selectedGenerals.forEach(gId => {
                    let g = GENERALS[gId];
                    if (!g) return; 
                    g.deathCooldown = g.deathCooldown || 0; 
                    if (g.deathCooldown > 0) g.deathCooldown -= 30; 
                    
                    if (tents.length > 0 && !g.isDeployed && g.deathCooldown <= 0) {
                        let shouldDeploy = false;
                        if (gId === 'g1' || gId === 'g3' || gId === 'g7') { // 【新增】：諸葛亮與關羽條件相同
                            shouldDeploy = enemies.some(e => {
                                let nearTower = towers.some(t => { let s = BUILDINGS[t.id].size || 1; return Math.hypot(e.x - (t.x*TILE_SIZE+(TILE_SIZE*s)/2), e.y - (t.y*TILE_SIZE+(TILE_SIZE*s)/2)) < 180; });
                                let nearBase = Math.hypot(e.x - (playerBase.x*TILE_SIZE+TILE_SIZE/2), e.y - (playerBase.y*TILE_SIZE+TILE_SIZE/2)) < 250;
                                return nearTower || nearBase;
                            });
                        } 
                        else if (gId === 'g2' || gId === 'g8') { // 【新增】：燎原火與趙雲一樣，看騎兵數量
                            shouldDeploy = (playerUnits.filter(p => p.id === 'b6' && !p.isDying).length >= 4); 
                        } 
                        else if (gId === 'g4') { shouldDeploy = enemies.some(e => (e.id === 'boss' || e.id === 'black_dragon') && !e.isDying); }

            } else {
                if (isPlaying) {
                    // 【核心修復】：將變數名稱統一為 targetTarget，徹底解決全域變數污染導致的「痛擊我的隊友」Bug！
                    let targetTarget = null;
                    let minDist = Infinity;
                    
                    // =====================================
                    // 荀彧的目標是「找隊友」，其他武將是「找敵人」
                    // =====================================
                    if (pUnit.id === 'g9') {
                        let validAllies = playerUnits.filter(p => !p.isDying && p !== pUnit);
                        let alliesNoBuff = validAllies.filter(p => !p.atkBuffTimer || p.atkBuffTimer <= 0);
                        
                        // 優先將施法目標鎖定在「沒有 Buff」的隊友身上，若大家都有就單純刷新前線 Buff
                        let targetGroup = alliesNoBuff.length > 0 ? alliesNoBuff : validAllies;
                        
                        targetGroup.forEach(p => {
                            let d = Math.hypot((p.x + p.drawOffsetX) - (pUnit.x + pUnit.drawOffsetX), (p.y + p.drawOffsetY) - (pUnit.y + pUnit.drawOffsetY));
                            if (d <= pUnit.range && d < minDist) { minDist = d; targetTarget = p; }
                        });
                    } else {
                        enemies.forEach(e => {
                            if (!e.isDying) {
                                let d = Math.hypot((e.x + e.drawOffsetX) - (pUnit.x + pUnit.drawOffsetX), (e.y + e.drawOffsetY) - (pUnit.y + pUnit.drawOffsetY));
                                if (d <= pUnit.range && d < minDist) { minDist = d; targetTarget = e; }
                            }
                        });
                    }
                    
                    pUnit.update(targetTarget);
                    if (enemyBase.hp <= 0 && !gameWon) {
                        gameWon = true; 
                        playerGold += 200; localStorage.setItem('tdGameGold_v2', playerGold);
                        playSound('win'); 
                        if (currentBattleBgm) currentBattleBgm.pause(); // 【修改】：停止當前戰鬥 BGM
                        document.getElementById('game-over-title').innerText = "🎉 勝利！";
                        document.getElementById('game-over-title').style.color = "#f1c40f";
                        document.getElementById('game-over-msg').innerText = "成功推平敵軍主堡！獲得 200 金幣！";
                        document.getElementById('game-over-modal').style.display = 'flex';
                    }
                } else { pUnit.state = 0; pUnit.cooldown = 0; }
            }
        }

        // 防禦塔與城門更新 (包含損毀邏輯)
        towers.forEach(tower => {
            const cx = tower.x * TILE_SIZE, cy = tower.y * TILE_SIZE;
            let bData = BUILDINGS[tower.id];

            // 檢查損毀狀態
            if (tower.maxHp > 0 && tower.hp <= 0 && !tower.isDestroyed) {
                tower.isDestroyed = true;
                combatEffects.push({ x: cx + TILE_SIZE/2, y: cy + TILE_SIZE/2, radius: 40, timer: 30 }); 
                let feedback = document.getElementById('feedback');
                feedback.innerText = `⚠️ 我方【${bData.name}】被毀！戰後將自動修復！`; feedback.style.color = "#e74c3c";
            }

            if (!tower.isDestroyed) {
                // 【新增】：防禦塔 Buff 結算
                if (tower.atkBuffTimer > 0) { tower.atkBuffTimer--; if (tower.atkBuffTimer <= 0) tower.atkBuffMult = 1.0; }
                if (isPlaying && bData.type === 'attack') {
                    const range = 60 + (bData.range * 30) + (tower.level * 10);
                    // 【修改】：套用 Buff
                    const damage = 10 * bData.dmg * tower.level * (tower.atkBuffMult || 1.0);                    const fireRate = Math.max(10, 60 / bData.spd - (tower.level * 2)); 
                    if (tower.cooldown > 0) { tower.cooldown--; tower.state = (tower.cooldown > fireRate - 15) ? 1 : 0; } 
                    else {
                        const target = enemies.find(e => !e.isDying && Math.hypot(e.x - (cx + TILE_SIZE/2), e.y - (cy + TILE_SIZE/2)) < range);
                        if (target) {
                            target.hp -= damage; tower.cooldown = fireRate; tower.state = 1; tower.facingLeft = target.x < cx + TILE_SIZE / 2;
                            ctx.strokeStyle = bData.color; ctx.lineWidth = 3;
                            ctx.beginPath(); ctx.moveTo(cx + TILE_SIZE / 2, cy + TILE_SIZE / 2); ctx.lineTo(target.x, target.y); ctx.stroke();
                        } else { tower.state = 0; }
                    }
                }
                if (tower.id === 'gate' && isPlaying) {
                    let sizeMult = bData.size || 1;
                    let centerX = cx + (TILE_SIZE * sizeMult)/2; let centerY = cy + (TILE_SIZE * sizeMult)/2;
                    let allyNear = playerUnits.some(p => !p.isDying && Math.hypot(p.x - centerX, p.y - centerY) < 60);
                    if (globalAnimTick % 5 === 0) { tower.frame = allyNear ? Math.min(3, tower.frame + 1) : Math.max(0, tower.frame - 1); }
                }
            }
        });

        // 畫圖排列
        let renderList = [];
        enemies.forEach(e => renderList.push({ y: e.y + e.drawOffsetY, draw: () => e.draw() }));
        playerUnits.forEach(p => renderList.push({ y: p.y + p.drawOffsetY, draw: () => p.draw() }));
        
        const drawBase = (baseObj, imgArray, fallbackColor, symbol, isPlayer) => {
            let cx = baseObj.x * TILE_SIZE; let cy = baseObj.y * TILE_SIZE; let hpRatio = baseObj.hp / baseObj.maxHp;
            let stateIndex = hpRatio > 0.5 ? 0 : (hpRatio > 0 ? 1 : 2);
            let img = imgArray ? imgArray[stateIndex] : null; 
            let drawSize = TILE_SIZE * 2.8; 
            let drawX = cx + (TILE_SIZE / 2) - (drawSize / 2); let drawY = cy + (TILE_SIZE / 2) - (drawSize / 2) - 15; 
            if (img && img.complete && !img.isFailed && img.naturalWidth > 0) {
                let fw = img.naturalWidth / 4; let fh = img.naturalHeight; let frame = Math.floor(globalAnimTick / 15) % 4;
                ctx.drawImage(img, frame * fw, 0, fw, fh, drawX, drawY, drawSize, drawSize);
            } else {
                ctx.fillStyle = fallbackColor; ctx.fillRect(cx, cy, TILE_SIZE, TILE_SIZE);
                ctx.fillStyle = 'white'; ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(symbol, cx + TILE_SIZE/2, cy + TILE_SIZE/2 - 5);
            }
            if (stateIndex !== 2) {
                let barWidth = TILE_SIZE * 1.5; let barX = cx + (TILE_SIZE / 2) - (barWidth / 2); let barY = drawY - 8; 
                ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.fillText('Lv'+baseObj.level, cx + TILE_SIZE/2, barY - 8);
                ctx.fillStyle = 'red'; ctx.fillRect(barX, barY, barWidth, 4); ctx.fillStyle = '#2ecc71'; ctx.fillRect(barX, barY, barWidth * Math.max(0, Math.min(1, hpRatio)), 4);
            }
        };

        renderList.push({ y: (playerBase.y + 2) * TILE_SIZE, draw: () => drawBase(playerBase, typeof BASE_IMGS !== 'undefined' ? BASE_IMGS.player : null, '#2980b9', '👑', true) });
        renderList.push({ y: (enemyBase.y + 2) * TILE_SIZE, draw: () => drawBase(enemyBase, typeof BASE_IMGS !== 'undefined' ? BASE_IMGS.enemy : null, '#8e44ad', '👿', false) });

        towers.forEach(tower => {
            let bData = BUILDINGS[tower.id];
            let sizeMult = bData.size || 1;
            let drawY = (tower.y + sizeMult) * TILE_SIZE; 
            
            renderList.push({ y: drawY, draw: () => {
                const cx = tower.x * TILE_SIZE, cy = tower.y * TILE_SIZE;
                ctx.save();
                
                // 損毀狀態變灰
                if (tower.isDestroyed) ctx.filter = 'grayscale(100%) brightness(0.5)';

                if (bData.img && bData.img.complete && !bData.img.isFailed && bData.img.naturalWidth > 0) {
                    let cols = 4, rows = 1, sx = 0, sy = 0;
                    if (tower.id === 'gate') { cols = 4; rows = 4; sx = tower.frame * (bData.img.naturalWidth / cols); sy = tower.dir * (bData.img.naturalHeight / rows); } 
                    else if (tower.id === 'tower') { cols = 4; rows = 2; sx = (Math.floor(globalAnimTick / 15) % cols) * (bData.img.naturalWidth / cols); sy = tower.state * (bData.img.naturalHeight / rows); } 
                    else { sx = (Math.floor(globalAnimTick / 15) % cols) * (bData.img.naturalWidth / cols); }

                    let fw = bData.img.naturalWidth / cols, fh = bData.img.naturalHeight / rows;
                    let drawScale = 1.3, drawWidth = TILE_SIZE * drawScale * sizeMult, aspectRatio = fh / fw, drawHeight = drawWidth * aspectRatio;
                    
                    let centerX = cx + (TILE_SIZE * sizeMult) / 2, centerY = cy + TILE_SIZE * sizeMult - drawHeight / 2 - 5;
                    ctx.translate(centerX, centerY);
                    if (tower.id === 'tower' && tower.facingLeft) ctx.scale(-1, 1);
                    ctx.drawImage(bData.img, sx, sy, fw, fh, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                } else {
                    ctx.fillStyle = bData.color; ctx.fillRect(cx + 2, cy + 2, (TILE_SIZE * sizeMult) - 4, (TILE_SIZE * sizeMult) - 4);
                    ctx.fillStyle = 'white'; ctx.font = '22px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(bData.symbol, cx + (TILE_SIZE * sizeMult) / 2, cy + (TILE_SIZE * sizeMult) / 2);
                }
                ctx.restore();

                // 畫血條與狀態
                if (tower.maxHp > 0) {
                    if (!tower.isDestroyed) {
                        ctx.fillStyle = 'red'; ctx.fillRect(cx, cy - 8, TILE_SIZE * sizeMult, 4); 
                        ctx.fillStyle = '#2ecc71'; ctx.fillRect(cx, cy - 8, (TILE_SIZE * sizeMult) * (tower.hp / tower.maxHp), 4);
                    } else {
                        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                        ctx.fillText('❌ 損毀', cx + (TILE_SIZE * sizeMult)/2, cy + (TILE_SIZE * sizeMult)/2);
                    }
                }
                
                // 畫移動選取框
                if (typeof buildingToMove !== 'undefined' && tower === buildingToMove) {
                    ctx.strokeStyle = '#3498db'; ctx.lineWidth = 4;
                    ctx.strokeRect(cx, cy, TILE_SIZE * sizeMult, TILE_SIZE * sizeMult);
                }
                
                if (!tower.isDestroyed) {
                    ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; 
                    ctx.fillText('Lv'+tower.level, cx + (TILE_SIZE * sizeMult)/2, cy + (TILE_SIZE * sizeMult) - 5);
                }
            }});
        });


        // 執行深度排序畫圖
        renderList.sort((a, b) => a.y - b.y).forEach(item => item.draw());
        
        // ============================================
        // 【新增】：處理飛行中的飛彈 (Projectiles)
        // ============================================
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let dx = p.tx - p.x;
            let dy = p.ty - p.y;
            let dist = Math.hypot(dx, dy);

            if (dist < p.speed) {
                // 命中目標！造成範圍傷害
                playSound('explosion'); // 【新增爆炸音效】
                // 1. 命中目標！造成範圍傷害
                enemies.forEach(e => {
                    if (Math.hypot((e.x + e.drawOffsetX) - p.tx, (e.y + e.drawOffsetY) - p.ty) <= p.aoeRadius) {
                        e.hp -= p.damage;
                    }
                });
                // 順便判定有沒有炸到敵方主堡
                if (Math.hypot((enemyBase.x*TILE_SIZE+TILE_SIZE/2) - p.tx, (enemyBase.y*TILE_SIZE+TILE_SIZE/2) - p.ty) <= p.aoeRadius) {
                    enemyBase.hp -= p.damage;
                }
                
                // 2. 產生爆炸特效 (此處會觸發你在第 4 步改好的飛彈爆炸圖)
                combatEffects.push({ x: p.tx, y: p.ty, radius: p.aoeRadius, timer: 30, type: p.type });
                projectiles.splice(i, 1);
            } else {
                // 3. 飛彈尚未抵達，繼續移動
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
                
                // 4. 畫出飛彈圖片 (自動旋轉朝向目標)
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(Math.atan2(dy, dx));
                
                let mImg = EFFECT_IMGS.missile_body;
                if (mImg && mImg.complete && !mImg.isFailed && mImg.naturalWidth > 0) {
                    // 根據你的圖片比例調整顯示大小，這裡預設為 30x15
                    let drawW = 30;
                    let drawH = 15; 
                    // 將圖片中心點對齊
                    ctx.drawImage(mImg, -drawW/2, -drawH/2, drawW, drawH);
                } else {
                    // 如果圖片未載入，顯示一個簡單的預設白點
                    ctx.fillStyle = 'white';
                    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        // ============================================
        // 【新增】：處理飛行中的穿透性刀氣 (SlashWaves)
        // 功能：飛行時造成路徑傷害，命中目標消失
        // ============================================
        for (let i = slashWaves.length - 1; i >= 0; i--) {
            let sw = slashWaves[i];
            if (sw.update()) {
                slashWaves.splice(i, 1); // 消失
            } else {
                sw.draw(); // 繪製
            }
        }        
        
        // ============================================
        // 5. 畫戰鬥特效 (無色界神力 / AoE 爆炸)
        // ============================================
        for (let i = combatEffects.length - 1; i >= 0; i--) {
            let eff = combatEffects[i];
            eff.timer--;
            if (eff.timer <= 0) { combatEffects.splice(i, 1); continue; }
            
            // 黑天龍無色界神力 (移除白邊)
            if (eff.isBlackDragon) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                
                ctx.fillStyle = 'black';
                ctx.globalCompositeOperation = 'saturation';
                ctx.fill();
                
                ctx.globalCompositeOperation = 'source-over';
                let alpha = eff.timer > 60 ? 0.6 : (eff.timer / 60) * 0.6;
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.fill();
                
                ctx.restore();
                continue; 
            }
            
// 一般 AoE 爆炸、飛彈爆炸與客製化法術特效
            let effType = eff.type || 'normal';
            // 【核心修改】：優先使用傳入的 customImg，如果沒有再套用飛彈等預設圖片
            let img = eff.customImg || null;
            if (!img) {
                if (effType === 'missile') img = EFFECT_IMGS.aoe_missile;
                else if (effType === 'transformed') img = EFFECT_IMGS.aoe_transformed;
                else img = EFFECT_IMGS.aoe_normal;
            }
                      
            if (img && img.complete && !img.isFailed && img.naturalWidth > 0) {
                // 【全動態運算】：根據傳入的總幀數與存活時間，自動計算動畫播放進度
                let totalFrames = eff.frames || (effType === 'missile' ? 5 : 4);
                let maxTimer = eff.maxTimer || (effType === 'missile' ? 30 : 20);
                
                let fw = img.naturalWidth / totalFrames; 
                let fh = img.naturalHeight;
                
                let frame = Math.floor((maxTimer - eff.timer) / (maxTimer / totalFrames));
                if (frame >= totalFrames) frame = totalFrames - 1; // 防溢出
                
                let sx = frame * fw; 
                let sy = 0; 
                
                let drawSize = eff.radius * 2.5; 
                ctx.save();
                ctx.globalCompositeOperation = 'screen'; 
                ctx.drawImage(img, sx, sy, fw, fh, eff.x - drawSize/2, eff.y - drawSize/2, drawSize, drawSize);
                ctx.restore();
            } else {
                ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                let fallbackColor = 'rgba(231, 76, 60, 0.3)';
                if (eff.isTransformed) fallbackColor = 'rgba(241, 196, 15, 0.3)';
                else if (effType === 'missile') fallbackColor = 'rgba(255, 165, 0, 0.4)';
                else if (eff.customImg) fallbackColor = 'rgba(52, 152, 219, 0.4)'; // 有自訂圖但未讀完，顯示藍光
                ctx.fillStyle = fallbackColor;
                ctx.fill();
            }
        }
        
        // ============================================
        // 6. 雲層覆蓋
        // ============================================
        if (TERRAIN_IMGS.clouds && TERRAIN_IMGS.clouds.complete && !TERRAIN_IMGS.clouds.isFailed && TERRAIN_IMGS.clouds.naturalWidth > 0) {
            let scaleSize = 1.2; let cw = TERRAIN_IMGS.clouds.naturalWidth || 100; let ch = TERRAIN_IMGS.clouds.naturalHeight || 100;
            cloudOffsetX = (cloudOffsetX - 0.8) % (cw * scaleSize); cloudOffsetY = (cloudOffsetY - 0.4) % (ch * scaleSize); 
            ctx.save(); 
            ctx.globalAlpha = 0.55; 
            ctx.globalCompositeOperation = 'multiply'; 
            let pattern = ctx.createPattern(TERRAIN_IMGS.clouds, 'repeat'); ctx.fillStyle = pattern;
            ctx.translate(cloudOffsetX, cloudOffsetY); ctx.scale(scaleSize, scaleSize); 
            let startX = -cloudOffsetX / scaleSize; let startY = -cloudOffsetY / scaleSize; let drawW = 800 / scaleSize; let drawH = 800 / scaleSize;
            ctx.fillRect(startX, startY, drawW, drawH); ctx.restore();
        }

        // ============================================
        // 8. 【修改】：畫出動態對白氣泡 (支援飄動與噴泉物理效果)
        // ============================================
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.timer--;
            
            // 加入 X 同 Y 軸的物理飄動
            ft.x += (ft.vx || 0);
            ft.y += (ft.vy || -0.5); 
            
            if (ft.timer <= 0) {
                floatingTexts.splice(i, 1);
                continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.min(1, ft.timer / 15); // 最後 15 幀慢慢變透明
            ctx.fillStyle = ft.color || 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            // 允許市場使用更小更俐落的字體
            ctx.font = ft.font || 'bold 16px Microsoft JhengHei';
            ctx.textAlign = 'center';
            
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }

        // 7. 更新血量 UI (原有的代碼)
        document.getElementById('hp-display').innerText = Math.max(0, Math.floor(playerBase.hp));
        document.getElementById('enemy-hp-display').innerText = Math.max(0, Math.floor(enemyBase.hp));
    } // gameLoop 結束的括號

    updateLobbyUI();
</script>
</body>
</html>
