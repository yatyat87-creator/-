<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox BGM 播放器 (支援自訂中文歌名)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            background-color: #fff;
            width: 420px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            font-size: 22px;
        }
        #playlist-selector {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f9f9f9;
            cursor: pointer;
            outline: none;
        }
        #playlist-selector:focus {
            border-color: #007bff;
        }
        audio {
            width: 100%;
            margin-bottom: 15px;
            outline: none;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 6px;
        }
        .controls button {
            background-color: #f1f3f5;
            border: none;
            padding: 8px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #495057;
            transition: all 0.2s ease;
            flex: 1;
        }
        .controls button:hover {
            background-color: #e2e6ea;
        }
        .controls button.active-btn {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        #search-box {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        #search-box:focus {
            border-color: #007bff;
        }
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .playlist li {
            padding: 12px 15px;
            margin-bottom: 5px;
            background-color: #f9f9f9;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
        }
        .playlist li:hover {
            background-color: #e9ecef;
        }
        .playlist li.active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h2>🎵 BGM 播放器</h2>

    <select id="playlist-selector"></select>
    
    <audio id="audio-player" controls></audio>

    <div class="controls">
        <button id="btn-prev" title="上一首">⏮</button>
        <button id="btn-shuffle" class="active-btn">🔀 隨機: 開</button>
        <button id="btn-loop" class="active-btn">🔁 列表循環</button>
        <button id="btn-next" title="下一首">⏭</button>
    </div>

    <input type="text" id="search-box" placeholder="🔍 搜尋歌名...">
    
    <ul class="playlist" id="playlist"></ul>
</div>

<script>
    // ==========================================
    // 🎵 你的多個歌曲庫 
    // 若要自訂中文名稱，請使用 { name: "歌名", url: "網址" } 的格式
    // 若不寫 name，一樣可以直接貼網址 (程式會嘗試自動抓英文檔名)
    // ==========================================
    const playlistsData = {
        "媽媽": [
            // ⬇️ 這裡我幫你改成了新格式，請把「林子祥 歌曲 1」等文字換成真正的歌名
            { name: "林子祥 George Lam -《男兒當自強》Official MV (電影《黃飛鴻之二》主題曲)", url: "https://www.dropbox.com/scl/fi/ceebdwt9hbafocnkdm0uc/George-Lam-Official-MV.mp3?rlkey=71wglptwcpzespxzhw82yynwp&st=6objgm4v&dl=0" },
            { name: "葉蒨文 Sally Yeh -《諾言》Official MV (電影《祝福》主題曲)", url: "https://www.dropbox.com/scl/fi/tenc3hyp6fvpw5idpx3xu/Sally-Yeh-Official-MV.mp3?rlkey=mdsayuitxcmfnw2sskwx9btr9&st=fzi222hc&dl=0" },
            { name: "勝利雙手創丨葉振棠丨1997亞洲電視劇「我來自潮州」主題曲丨葉振棠Karaoke DVD", url: "https://www.dropbox.com/scl/fi/h97z0hyalnkmjowt8ixz5/1997-Karaoke-DVD.mp3?rlkey=mp0nl0crmm0l46mqiuknge26n&st=r9f0rfzm&dl=0" },
            { name: "葉麗儀⧸葉振棠【願你待我真的好 1981】(歌詞MV)(1080p)(作曲：鍾肇峰)(填詞：鄭國江)", url: "https://www.dropbox.com/scl/fi/bvynrjx25ektp9o3ug2uc/1981-MV-1080p.mp3?rlkey=ynqk8bepg04g4sx4p1litzu6c&st=gkii0ex0&dl=0" },
            { name: "葉麗儀⧸葉振棠【願你待我真的好 1981】(歌詞MV)(1080p)(作曲：鍾肇峰)(填詞：鄭國江)", url: "https://www.dropbox.com/scl/fi/bvynrjx25ektp9o3ug2uc/1981-MV-1080p.mp3?rlkey=ynqk8bepg04g4sx4p1litzu6c&st=457rvgxd&dl=0" },
            { name: "郭富城Aaron Kwok -《愛的呼喚》Official MV", url: "https://www.dropbox.com/scl/fi/n6r91iijtcwgpd1t5axmr/Aaron-Kwok-Official-MV.mp3?rlkey=2ctkrceqnna31i34bxja5v5hc&st=j5pdxx8g&dl=0" },
            { name: "周華健 Wakin Chau【花心 The flowery heart】Official Music Video", url: "https://www.dropbox.com/scl/fi/d2ydsmycmpp9vhgy0n9v6/Wakin-Chau-The-flowery-heart-Official-Music-Video.mp3?rlkey=adf2jwf8fs0an547n77vz48sf&st=nnq0ju75&dl=0" },
            { name: "呂珊丨星光背後丨超級呂聲呂珊演唱會", url: "https://www.dropbox.com/scl/fi/ynl5e7x8byzhjje8ehm3h/.mp3?rlkey=dpu8lwk8myfmhm1jp2rqzx4g3&st=slzzjxam&dl=0" },
            { name: "李炳文【昨夜的渡輪上 1981】(歌詞MV)(HD)(作曲：林功信)(填詞：馮德基)原曲：劉藍溪－－微風細雨", url: "https://www.dropbox.com/scl/fi/6mznwfjkorrenctu9po0r/1981-MV-HD.mp3?rlkey=89g5m7y86wdy5a6oj1qgjmufd&st=9wtqqptd&dl=0" },
            { name: "徐小鳳 風的季節 MV", url: "https://www.dropbox.com/scl/fi/quy4dbiri5oaiuukcxlhg/MV.mp3?rlkey=xloyjuybyt186mjdu4ci3nlgk&st=cs0q3f6a&dl=0" },            { name: "抱緊眼前人 (Official Music Video)  - 梅艷芳 Anita Mui", url: "https://www.dropbox.com/scl/fi/jdzdqaym3z9mk7mfv79c8/Official-Music-Video-Anita-Mui.mp3?rlkey=nc75baycovfkbi53gtfstyz6t&dl=0" },
            { name: "梅艷芳 Anita Mui - 心債 - 電視劇《香城浪子》主題曲 (Official Audio)", url: "https://www.dropbox.com/scl/fi/xja3ua4sp1q8xw48lh74f/Anita-Mui-Official-Audio.mp3?rlkey=2m8fsnp4ejv1rvdqwoca38gjx&dl=0" },
            { name: "梅艷芳【心肝寶貝 1988】(歌詞MV)(1080p)(作曲：黎小田)(填詞：黎彼得)電影「黑心鬼」主題曲", url: "https://www.dropbox.com/scl/fi/tjygq6j3175dfvtzrtypz/1988-MV-1080p.mp3?rlkey=ywm939fgg1duejnqwj77nrwbq&dl=0" },
            { name: "陳百強 Danny Chan -《偏偏喜歡你》 Official MV", url: "https://www.dropbox.com/scl/fi/tmemy3o6kimampwcmwz2y/Danny-Chan-Official-MV.mp3?rlkey=qqkqcyw9fiveszzfgd8anz52e&dl=0" },
            { name: "陳百強 Danny Chan -《幾分鐘的約會》Official MV", url: "https://www.dropbox.com/scl/fi/9ajvu899ng5ql62rhjcab/Danny-Chan-Official-MV.mp3?rlkey=cdoj6hwfitm48rc6e6ldvp5q9&dl=0" }
        ]
    };
    // ==========================================

    const audioPlayer = document.getElementById('audio-player');
    const playlistElement = document.getElementById('playlist');
    const searchBox = document.getElementById('search-box');
    const playlistSelector = document.getElementById('playlist-selector');
    
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnLoop = document.getElementById('btn-loop'); 

    let currentTrackIndex = 0;
    let isShuffle = true;
    let loopMode = 'list'; 
    let tracksData = []; 

    for (const playlistName in playlistsData) {
        let option = document.createElement('option');
        option.value = playlistName;
        option.textContent = playlistName;
        playlistSelector.appendChild(option);
    }

    playlistSelector.addEventListener('change', function() {
        loadPlaylist(this.value);
    });

    function loadPlaylist(playlistName) {
        playlistElement.innerHTML = ''; 
        tracksData = []; 
        searchBox.value = ''; 
        
        const currentLinks = playlistsData[playlistName];

        currentLinks.forEach((item, index) => {
            // 判斷是單純的網址字串，還是帶有自訂名稱的物件
            let rawUrl = typeof item === 'string' ? item : item.url;
            let customName = typeof item === 'object' ? item.name : null;

            let url = rawUrl.trim();
            if (url.includes('dl=0')) {
                url = url.replace('dl=0', 'raw=1');
            } else if (!url.includes('raw=1')) {
                url += (url.includes('?') ? '&raw=1' : '?raw=1');
            }
            
            let cleanName = customName;
            // 如果沒有自訂名稱，才用舊方法從網址抓英文檔名
            if (!cleanName) {
                let urlObj = new URL(url);
                let pathname = urlObj.pathname;
                let fileName = pathname.substring(pathname.lastIndexOf('/') + 1);
                cleanName = decodeURIComponent(fileName).replace(/\.mp3/i, '').replace(/-/g, ' ');
            }
            
            let li = document.createElement('li');
            li.textContent = (index + 1) + '. ' + cleanName;
            
            li.addEventListener('click', function() {
                playTrack(index);
            });

            playlistElement.appendChild(li);
            
            tracksData.push({
                url: url,
                name: cleanName.toLowerCase(), // 轉小寫方便搜尋
                element: li
            });
        });

        if (tracksData.length > 0) {
            currentTrackIndex = 0;
            tracksData[0].element.classList.add('active');
            audioPlayer.src = tracksData[0].url;
        }
    }

    function playTrack(index) {
        tracksData.forEach(track => track.element.classList.remove('active'));
        tracksData[index].element.classList.add('active');
        
        audioPlayer.src = tracksData[index].url;
        audioPlayer.play();
        currentTrackIndex = index;
    }

    function playNext() {
        if (tracksData.length === 0) return;
        
        if (isShuffle && tracksData.length > 1) {
            let nextIndex = currentTrackIndex;
            while (nextIndex === currentTrackIndex) {
                nextIndex = Math.floor(Math.random() * tracksData.length);
            }
            playTrack(nextIndex);
        } else {
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= tracksData.length) nextIndex = 0; 
            playTrack(nextIndex);
        }
    }

    function playPrev() {
        if (tracksData.length === 0) return;
        let prevIndex = currentTrackIndex - 1;
        if (prevIndex < 0) prevIndex = tracksData.length - 1;
        playTrack(prevIndex);
    }

    btnNext.addEventListener('click', playNext);
    btnPrev.addEventListener('click', playPrev);
    
    btnShuffle.addEventListener('click', function() {
        isShuffle = !isShuffle;
        if (isShuffle) {
            btnShuffle.textContent = '🔀 隨機: 開';
            btnShuffle.classList.add('active-btn');
        } else {
            btnShuffle.textContent = '🔀 隨機: 關';
            btnShuffle.classList.remove('active-btn');
        }
    });

    btnLoop.addEventListener('click', function() {
        if (loopMode === 'list') {
            loopMode = 'single';
            btnLoop.textContent = '🔂 單曲循環';
            btnLoop.classList.add('active-btn');
        } else {
            loopMode = 'list';
            btnLoop.textContent = '🔁 列表循環';
            btnLoop.classList.remove('active-btn');
        }
    });

    audioPlayer.addEventListener('ended', function() {
        if (loopMode === 'single') {
            playTrack(currentTrackIndex);
        } else {
            playNext();
        }
    });

    searchBox.addEventListener('input', function() {
        const filterText = searchBox.value.toLowerCase();
        tracksData.forEach(track => {
            if (track.name.includes(filterText)) {
                track.element.style.display = 'flex';
            } else {
                track.element.style.display = 'none';
            }
        });
    });

    const initialPlaylistName = playlistSelector.options[0].value;
    loadPlaylist(initialPlaylistName);

</script>

</body>
</html>
